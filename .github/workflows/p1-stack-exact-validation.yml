name: P1 stack exact validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: P1 stage validated on this exact ref
        required: true
        default: bootstrap
        type: string

permissions:
  contents: read

concurrency:
  group: p1-stack-exact-${{ github.ref }}-${{ inputs.stage || 'pr' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCATLAS_OFFLINE: "1"

jobs:
  core:
    name: p1-stack-core (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/ -m "not advanced and not live and not live_network" -q

  platform:
    name: p1-stack-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: |
          python -m compileall -q docmancer eval scripts
          doc-atlas --version
          python scripts/docs_mcp_stdio_smoke.py

  advanced:
    name: p1-stack-advanced-security
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run production-path contracts
        run: |
          pytest tests/ -m advanced -q
          python eval/project_context_quality_protocol.py
          python scripts/run_recovery_contract_gate.py
          python scripts/run_recovery_mutation_gate.py
          python scripts/run_project_docs_self_host_gate.py
          python scripts/run_question_surface_gate.py
          python scripts/run_agent_developer_gate.py
          python scripts/run_agent_developer_adversarial_gate.py
          python scripts/run_critical_mutation_gate.py
          python scripts/run_agent_developer_adversarial_mutation_gate.py
      - name: Run every P1 evidence contract present on this ref
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            run_agent_developer_first_divergence_gate.py \
            first_divergence_contract_self_test.py \
            run_agent_contract_v2_ablation_gate.py \
            agent_contract_v2_ablation_self_test.py \
            run_paraphrase_proofability_gate.py \
            paraphrase_proofability_self_test.py \
            run_mixed_evidence_provenance_gate.py \
            mixed_evidence_provenance_self_test.py \
            run_evidence_is_data_gate.py \
            evidence_is_data_self_test.py \
            run_p1_agent_truth_closure_gate.py \
            p1_agent_truth_closure_self_test.py
          do
            if [ -f "scripts/$script" ]; then
              python "scripts/$script"
            fi
          done
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'temp-p1*' -print -quit)"
          python -m compileall -q docmancer eval scripts tests
          python scripts/check_python_module_size.py
          git diff --check

  build:
    name: p1-stack-release-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install build "hatchling<1.27"
      - run: |
          rm -rf dist
          python -m build
          python scripts/release_gate.py --manifest dist/release-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p1-stack-release-dist
          path: dist/
          if-no-files-found: error

  wheel:
    name: p1-stack-release-wheel (${{ matrix.python }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: p1-stack-release-dist
          path: dist
      - run: |
          python scripts/release_gate.py
          python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          doc-atlas --version
          python "$GITHUB_WORKSPACE/scripts/docs_mcp_stdio_smoke.py"

  sdist:
    name: p1-stack-release-sdist-installer
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: p1-stack-release-dist
          path: dist
      - run: |
          mkdir sdist-wheel
          cp dist/*.tar.gz sdist-wheel/
          python -m pip wheel --no-deps --wheel-dir sdist-wheel dist/*.tar.gz
          python scripts/release_gate.py --dist sdist-wheel
          python -m pip install --force-reinstall sdist-wheel/*.whl
          cd "$(mktemp -d)"
          python "$GITHUB_WORKSPACE/scripts/docs_mcp_stdio_smoke.py"
      - name: Verify installer against the exact built wheel
        shell: bash
        run: |
          EXPECTED_VERSION="$(python -c 'from docmancer._version import __version__; print(__version__)')"
          DOCATLAS_INSTALL_SOURCE="$(find "$GITHUB_WORKSPACE/dist" -name '*.whl' -print -quit)" \
          DOCATLAS_EXPECT_VERSION="$EXPECTED_VERSION" \
          DOCATLAS_AGENT=none sh "$GITHUB_WORKSPACE/scripts/install.sh"

  p1-stack-exact:
    name: p1-stack-exact
    if: always()
    needs: [core, platform, advanced, build, wheel, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every exact-head lane
        env:
          CORE: ${{ needs.core.result }}
          PLATFORM: ${{ needs.platform.result }}
          ADVANCED: ${{ needs.advanced.result }}
          BUILD: ${{ needs.build.result }}
          WHEEL: ${{ needs.wheel.result }}
          SDIST: ${{ needs.sdist.result }}
        run: |
          test "$CORE" = success
          test "$PLATFORM" = success
          test "$ADVANCED" = success
          test "$BUILD" = success
          test "$WHEEL" = success
          test "$SDIST" = success
