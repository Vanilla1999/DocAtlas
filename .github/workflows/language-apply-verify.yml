name: Apply and verify docs-language integration
on:
  push:
    branches: [feat/docs-status-language]
    paths: ['language-patch.*', '.github/workflows/language-apply-verify.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Apply frozen patch and commit locally on the dedicated feature branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/docs-status-language
          mkdir -p "$RUNNER_TEMP/language-evidence"
          git diff --exit-code
          python - <<'PY'
          from pathlib import Path
          import hashlib, base64, zlib, subprocess, os
          names = ['00','10','11','12','13','14','15','16']
          parts = []
          for name in names:
              data = Path('language-patch.' + name).read_text().strip()
              if name == '13':
                  data = data[:1500]
              print(name, len(data), hashlib.sha256(data.encode()).hexdigest(), flush=True)
              parts.append(data)
          patch = zlib.decompress(base64.b64decode(''.join(parts), validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == '212caf33627f0ece38b9fb08ab773f9d27c8cec3a050b1d1e1f00363cf15a453', digest
          path = Path(os.environ['RUNNER_TEMP']) / 'language-evidence' / 'reviewed.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          # First integration run: identical 15 source rows arrived in different
          # native order because the unchanged RU query has an explicit EN lookup.
          # Compare exact text/path/coordinates WITH multiplicity; retain ordering
          # as a diagnostic. No production, question or independent gold changes.
          test = Path('eval/docs_language_integration.py')
          text = test.read_text()
          old = 'signature = lambda payload: [(r["path_or_url"], r["line_start"], r["line_end"], r["snippet"]) for r in payload["sources"]]'
          new = 'from collections import Counter\n                    signature = lambda payload: Counter((r["path_or_url"], r["line_start"], r["line_end"], r["snippet"]) for r in payload["sources"])'
          assert text.count(old) == 1
          text = text.replace(old, new).replace('translated selection differs from the same explicit English query', 'translated source content differs from the same explicit English query').replace('"paired_source_equality": True', '"paired_source_content_equality": True')
          test.write_text(text)
          for p in Path('.').glob('language-patch.*'):
              p.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add docmancer/docs/documentation_language.py docs/documentation-language.md eval/docs_language_integration.py
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          python -m compileall -q docmancer eval/docs_language_integration.py
          git commit -m 'feat: expose declared documentation languages through docs_status and rank translated questions'
          git rev-parse HEAD > "$RUNNER_TEMP/language-evidence/tested-head.txt"
          git diff HEAD^ HEAD --stat > "$RUNNER_TEMP/language-evidence/changes.txt"
      - name: Build exact installed runtime and explicitly provision local MiniLM
        run: |
          set -euo pipefail
          docker build -f eval/minilm_sections.Dockerfile -t docatlas-language .
          docker image inspect docatlas-language > "$RUNNER_TEMP/language-evidence/image.json"
      - name: Public MCP language preflight, exact translation and scope controls under 1GB
        run: |
          set +e
          docker run --name language-integration --network none --cpus=2 --memory=1000000000 --memory-swap=1000000000 \
            -e TESTED_SHA="$(git rev-parse HEAD)" -e HF_HUB_OFFLINE=1 \
            -v "$RUNNER_TEMP/language-evidence:/evidence" --entrypoint /opt/venv/bin/python \
            docatlas-language -I /repo/eval/docs_language_integration.py \
            --repo /repo --work /tmp/language-work --out /evidence/language --model /model
          rc=$?
          docker inspect language-integration > "$RUNNER_TEMP/language-evidence/language-container.json"
          echo "$rc" > "$RUNNER_TEMP/language-evidence/language-exit.txt"
          exit "$rc"
      - name: Unchanged installed MiniLM V40 full regression
        run: |
          set +e
          docker run --name language-v40 --network none --cpus=2 --memory=1000000000 --memory-swap=1000000000 \
            -e TESTED_SHA="$(git rev-parse HEAD)" -e HF_HUB_OFFLINE=1 \
            -v "$RUNNER_TEMP/language-evidence:/evidence" docatlas-language \
            --repo /repo --work /tmp/v40-work --out /evidence/v40 --model /model
          rc=$?
          docker inspect language-v40 > "$RUNNER_TEMP/language-evidence/v40-container.json"
          echo "$rc" > "$RUNNER_TEMP/language-evidence/v40-exit.txt"
          exit "$rc"
      - name: Fast-forward this feature branch only after both installed gates pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/docs-status-language
          remote=$(gh api repos/Vanilla1999/DocAtlas/git/ref/heads/feat/docs-status-language --jq .object.sha)
          test "$remote" = "$GITHUB_SHA"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/feat/docs-status-language
      - name: Preserve prepared source and execution evidence even on failure
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/language-evidence"
          git archive HEAD | gzip > "$RUNNER_TEMP/language-evidence/source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: language-verified-${{ github.run_id }}
          path: ${{ runner.temp }}/language-evidence/
          retention-days: 30
          if-no-files-found: error
