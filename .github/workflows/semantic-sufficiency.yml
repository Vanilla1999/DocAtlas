name: Semantic sufficiency QA selection study (non-release)
on:
  push:
    branches: [experiment/coverage-aware-selection-20261025]
    paths:
      - 'docmancer/docs/application/semantic_sufficiency.py'
      - 'docmancer/docs/application/section_compression.py'
      - 'docmancer/docs/application/facet_selection.py'
      - 'eval/coverage_selection_integration.py'
      - '.github/workflows/semantic-sufficiency.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: semantic-sufficiency-${{ github.sha }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        suite: [v40, new16, fresh8, semantic12]
        policy: [facet-guarded-v1, semantic-audit-v1, semantic-rescue-v1, semantic-prune-v1]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Preserve previously frozen corpora, gold and tokenizer dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/semantic-evidence"
          git fetch -q origin d249ce3bc9258bb0a667d0373205ca1be4ff4cf2 --depth=1
          git diff --exit-code d249ce3bc9258bb0a667d0373205ca1be4ff4cf2 HEAD -- \
            eval/prepared_model_comparison40 eval/adaptive_gap_holdout \
            eval/fresh_dialogues/fixtures eval/fresh_dialogues/oracle \
            pyproject.toml uv.lock
          python -m compileall -q docmancer eval/coverage_selection_integration.py
          git rev-parse HEAD > "$RUNNER_TEMP/semantic-evidence/head.txt"
          git archive HEAD docmancer eval/coverage_selection_integration.py .github/workflows/semantic-sufficiency.yml \
            | gzip > "$RUNNER_TEMP/semantic-evidence/tested-source.tar.gz"
      - name: Install immutable wheel, pinned CPU MiniLM and existing pinned RoBERTa QA model
        run: docker build -f eval/answerability.Dockerfile -t docatlas-sufficiency .
      - name: Real public stdio MCP, native SQLite and both local models, offline 1.5 GB
        env:
          SUITE: ${{ matrix.suite }}
          POLICY: ${{ matrix.policy }}
        run: |
          set +e
          docker run --name semantic-check --network none --cpus=2 \
            --memory=1500000000 --memory-swap=1500000000 \
            -e TESTED_SHA="$(git rev-parse HEAD)" -e HF_HUB_OFFLINE=1 \
            -v "$RUNNER_TEMP/semantic-evidence:/evidence" \
            --entrypoint /opt/venv/bin/python docatlas-sufficiency \
            -I /repo/eval/coverage_selection_integration.py \
            --repo /repo --work /tmp/semantic-study --out /evidence/run \
            --model /model --qa-model /qa-model --suite "$SUITE" --policy "$POLICY"
          rc=$?
          docker inspect semantic-check > "$RUNNER_TEMP/semantic-evidence/container.json"
          echo "$rc" > "$RUNNER_TEMP/semantic-evidence/exit-code.txt"
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: semantic-${{ matrix.suite }}-${{ matrix.policy }}-${{ github.run_id }}
          path: ${{ runner.temp }}/semantic-evidence/
          retention-days: 30
          if-no-files-found: error
  compare:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download exact current-run artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/arms" "$RUNNER_TEMP/paired"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'semantic-*' --dir "$RUNNER_TEMP/arms"
      - name: Compare independent witness coverage before tokens, keep all failures
        run: |
          python - <<'PY'
          import os, json, pathlib
          base=pathlib.Path(os.environ['RUNNER_TEMP'])
          root=base/'arms'; output=base/'paired'
          policies=('facet-guarded-v1','semantic-audit-v1','semantic-rescue-v1','semantic-prune-v1')
          suites=('v40','new16','fresh8','semantic12')
          results={}; missing=[]; regressions={}
          for suite in suites:
              for p in policies:
                  target=root/f"semantic-{suite}-{p}-{os.environ['GITHUB_RUN_ID']}"/'run'
                  if not (target/'ASSESSMENTS.json').exists():
                      missing.append(f"{suite}/{p}"); continue
                  cases=json.loads((target/'ASSESSMENTS.json').read_text())
                  summary=json.loads((target/'SUMMARY.json').read_text())
                  results[(suite,p)]=(cases,summary)
          comparisons=[]
          for p in policies[1:]:
              losses=[]; new_facts=0; negatives=0; tokens=0; qa_seconds=0
              for suite in suites:
                  if (suite,'facet-guarded-v1') not in results or (suite,p) not in results: continue
                  base_cases={x['case_id']:x for x in results[(suite,'facet-guarded-v1')][0]}
                  candidates={x['case_id']:x for x in results[(suite,p)][0]}
                  assert base_cases.keys()==candidates.keys()
                  for cid,b in base_cases.items():
                      c=candidates[cid]
                      assert b['candidate_fingerprint']==c['candidate_fingerprint']
                      assert b['question']==c['question'] and b['search_question']==c['search_question']
                      missing_ids=[x['id'] for x in b['claims'] if x['covered']
                                   and not next(y['covered'] for y in c['claims'] if y['id']==x['id'])]
                      if missing_ids: losses.append({'suite':suite,'case':cid,'facts':missing_ids})
                      new_facts+=sum(x['covered'] and not next(y['covered'] for y in b['claims'] if y['id']==x['id'])
                                     for x in c['claims'])
                      negatives+=bool(c['passed'] and c['answerability']=='unanswerable')
                  tokens+=results[(suite,p)][1]['model_visible_tokens']
                  qa_seconds+=results[(suite,p)][1]['qa_seconds']
              comparisons.append({'policy':p,'lost_control_facts':losses,
                  'new_facts':new_facts,'tokens':tokens,'qa_seconds':qa_seconds,'strict_negative_passes':negatives})
              regressions[p]=losses
          baseline_tokens=sum(results[(suite,'facet-guarded-v1')][1]['model_visible_tokens']
                              for suite in suites if (suite,'facet-guarded-v1') in results)
          record={'head':os.environ['GITHUB_SHA'],'arms':len(results),'missing_arms':missing,
                  'baseline_tokens':baseline_tokens,'comparisons':comparisons,
                  'provider_usage':None,'answer_model_calls':0,'semantic_certificate':False,
                  'acceptance':'no source-fact regressions before token savings; no blind/final-answer claim'}
          (output/'PAIRED.json').write_text(json.dumps(record,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(record,indent=2,ensure_ascii=False))
          assert not missing,'incomplete experiment'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: semantic-comparison-${{ github.run_id }}
          path: ${{ runner.temp }}/paired/
          retention-days: 30
