name: P1.4 paraphrase and proofability

on:
  pull_request:
    branches: [main, p1/p1.3-agent-contract-ablation]
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  p1-4-proofability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install DocAtlas evaluator dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify P1.4 candidate discovery and support precision
        run: |
          python scripts/run_paraphrase_proofability_gate.py
          python scripts/paraphrase_proofability_self_test.py
          python -m compileall -q \
            eval/agent_developer_v1/paraphrase_robustness.py \
            scripts/run_paraphrase_proofability_gate.py \
            scripts/paraphrase_proofability_self_test.py
          git diff --check
