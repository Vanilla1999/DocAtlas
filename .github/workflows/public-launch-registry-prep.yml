name: Public launch registry prep

on:
  push:
    branches:
      - docs/public-launch-readme-registry

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: docs/public-launch-readme-registry
          fetch-depth: 0

      - name: Prepare 1.3.2 launch and MCP Registry metadata
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path('.')
          VERSION = '1.3.2'
          SERVER_NAME = 'io.github.Vanilla1999/docatlas'

          def replace_once(path: str, old: str, new: str) -> None:
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match for {old!r}, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Registry ownership proof must ship inside the PyPI README.
          replace_once(
              'README.md',
              '<!-- mcp-name: io.github.vanilla1999/docatlas -->',
              f'<!-- mcp-name: {SERVER_NAME} -->',
          )

          replace_once(
              'docmancer/_version.py',
              '__version__ = "1.3.1"',
              f'__version__ = "{VERSION}"',
          )

          # Move the accumulated Unreleased notes under the narrow launch patch release.
          replace_once(
              'CHANGELOG.md',
              '## [Unreleased]\n\n### Changed\n',
              '''## [Unreleased]\n\n## [1.3.2] - 2026-09-08\n\n### Added\n\n- Added Official MCP Registry metadata for the local Docs MCP server (`io.github.Vanilla1999/docatlas`) and a GitHub-OIDC publication step that runs only after the exact public PyPI package passes Linux, macOS, and Windows smoke.\n- Added the PyPI ownership marker required by the Official MCP Registry while keeping it hidden from the rendered README.\n\n### Changed\n\n- Reworked the README first screen around the user problem: small, source-attributed project and version-aware dependency context for coding agents, with a one-line install and a compact architecture summary.\n''',
          )

          server = {
              '$schema': 'https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json',
              'name': SERVER_NAME,
              'title': 'DocAtlas',
              'description': 'Local-first, version-aware documentation context for coding agents, with bounded source-attributed project and dependency evidence.',
              'websiteUrl': 'https://github.com/Vanilla1999/DocAtlas',
              'repository': {
                  'url': 'https://github.com/Vanilla1999/DocAtlas',
                  'source': 'github',
              },
              'version': VERSION,
              'packages': [
                  {
                      'registryType': 'pypi',
                      'registryBaseUrl': 'https://pypi.org',
                      'identifier': 'doc-atlas',
                      'version': VERSION,
                      'runtimeHint': 'uvx',
                      'transport': {'type': 'stdio'},
                      'packageArguments': [
                          {'type': 'positional', 'value': 'mcp'},
                          {'type': 'positional', 'value': 'docs-serve'},
                      ],
                  }
              ],
          }
          (ROOT / 'server.json').write_text(
              json.dumps(server, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          publish = ROOT / '.github/workflows/publish.yml'
          text = publish.read_text(encoding='utf-8')
          text = text.replace('for example v1.3.1', 'for example v1.3.2', 1)
          if '\n  mcp-registry:\n' in text:
              raise SystemExit('publish.yml already contains mcp-registry job')
          registry_job = r'''

  mcp-registry:
    name: publish-official-mcp-registry
    if: github.event_name == 'workflow_dispatch'
    needs: [public-platform-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Verify exact MCP Registry metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PYREG'
          import json
          import os
          from pathlib import Path

          expected_version = os.environ['RELEASE_TAG'].removeprefix('v')
          payload = json.loads(Path('server.json').read_text(encoding='utf-8'))
          expected_name = 'io.github.Vanilla1999/docatlas'
          if payload.get('name') != expected_name:
              raise SystemExit(f"server name mismatch: {payload.get('name')!r}")
          if payload.get('version') != expected_version:
              raise SystemExit(
                  f"server version mismatch: expected={expected_version!r} actual={payload.get('version')!r}"
              )
          packages = payload.get('packages') or []
          if len(packages) != 1:
              raise SystemExit(f'expected exactly one Registry package, got {len(packages)}')
          package = packages[0]
          if package.get('identifier') != 'doc-atlas' or package.get('version') != expected_version:
              raise SystemExit('PyPI package identity/version does not match release')
          marker = f'<!-- mcp-name: {expected_name} -->'
          if marker not in Path('README.md').read_text(encoding='utf-8'):
              raise SystemExit('PyPI README ownership marker is missing')
          print('MCP Registry release metadata: PASS')
          PYREG
      - name: Install pinned MCP Registry publisher
        run: |
          curl -fL \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz \
            -o /tmp/mcp-publisher.tar.gz
          echo 'ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac  /tmp/mcp-publisher.tar.gz' | sha256sum -c -
          tar -xzf /tmp/mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --help
      - name: Authenticate to Official MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish to Official MCP Registry
        run: ./mcp-publisher publish server.json
      - name: Verify exact Registry entry
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PYREG'
          import json
          import os
          import urllib.parse
          import urllib.request

          name = 'io.github.Vanilla1999/docatlas'
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          query = urllib.parse.urlencode({'search': name})
          url = f'https://registry.modelcontextprotocol.io/v0.1/servers?{query}'
          request = urllib.request.Request(url, headers={'User-Agent': 'DocAtlas-release-verifier/1'})
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          def exact(value):
              if isinstance(value, dict):
                  if value.get('name') == name and value.get('version') == version:
                      return True
                  return any(exact(child) for child in value.values())
              if isinstance(value, list):
                  return any(exact(child) for child in value)
              return False

          if not exact(payload):
              raise SystemExit(f'published Registry entry not found for {name} {version}')
          print(f'Official MCP Registry verification: PASS ({name} {version})')
          PYREG
'''
          publish.write_text(text.rstrip() + registry_job + '\n', encoding='utf-8')

          # Release truth: 1.3.1 remains immutable failed audit evidence; 1.3.2 is the next candidate.
          identity = ROOT / 'docs/release-identity.md'
          old_identity = identity.read_text(encoding='utf-8')
          historical_marker = '## Current `v1.3.1` publication blocker\n'
          if historical_marker not in old_identity:
              raise SystemExit('release identity v1.3.1 marker not found')
          _, historical = old_identity.split(historical_marker, 1)
          historical = historical.replace(
              '### Safe retry boundary\n\nAfter the existing-project publisher is visibly registered with the exact tuple above, retry only the failed jobs of canonical run `32587903026`. Before another retry, require that:\n\n- public `doc-atlas==1.3.1` is still absent;\n- `v1.3.1` remains an annotated tag targeting `cfa9ab5c365a28d1a4af63afe9f1d53b19532d89`;\n- the original run\'s gated wheel and sdist artifacts remain available;\n- no token fallback is introduced.\n\nDo not move or recreate the tag. Do not start a replacement workflow from a newer `main` commit and present its provenance as the tagged source. If the public version appears before the retry, switch to verify-only handling and never overwrite it.\n',
              '''### Superseded retry boundary\n\nThe two `v1.3.1` failures remain immutable audit evidence. They are no longer the active publication path: the launch and Registry ownership metadata were added after that tag, so the next public candidate is `1.3.2`. Do not move or recreate `v1.3.1`, and do not present a newer tree as that tag.\n\nAfter the existing-project PyPI publisher is visibly corrected, create and approve a reviewed `v1.3.2` release request from the exact merged launch tree. No long-lived token fallback is permitted.\n''',
          )
          historical = historical.replace(
              'For clarity, no public `doc-atlas==1.3.1` release is claimed at this pre-public stage.',
              'For clarity, the failed `1.3.1` attempts remain historical pre-public evidence; no public `doc-atlas==1.3.2` release is claimed until the new exact release is published and verified.',
          )
          new_identity = f'''# Release identity\n\n## Current public candidate\n\nThe current source release candidate is **DocAtlas {VERSION}**. It supersedes the unpublished `1.3.1` candidate because the public-launch README and Official MCP Registry ownership metadata were added after the immutable `v1.3.1` tag.\n\nCanonical intended identity:\n\n```text\nproduct: DocAtlas\ndistribution: doc-atlas\nsource version: {VERSION}\nplanned immutable tag: v{VERSION}\nmaturity: Beta\nMCP Registry name: {SERVER_NAME}\nMCP package: doc-atlas=={VERSION}\nMCP command: uvx doc-atlas=={VERSION} mcp docs-serve\n```\n\nNo `v{VERSION}` tag or public `doc-atlas=={VERSION}` artifact is claimed by this preparation change. The tag must be created only by the reviewed release-request controller after this launch tree is merged and after the external PyPI Trusted Publisher is corrected. `server.json`, the source version, changelog, and hidden PyPI README ownership marker are kept version-aligned so the exact public package can be verified by the Official MCP Registry.\n\nThe Registry publication path uses GitHub OIDC and runs only after the canonical PyPI publish job and exact Linux/macOS/Windows public-package smokes succeed.\n\n## Historical `v1.3.1` publication blocker\n\n'''
          identity.write_text(new_identity + historical, encoding='utf-8')

          scorecard = ROOT / 'docs/public-truth-scorecard.md'
          scorecard.write_text(f'''# P0 public-truth closure scorecard\n\nStatus: **INCOMPLETE** — `{VERSION}` is the next reviewed source candidate, but no immutable `v{VERSION}` tag or exact public PyPI artifact exists yet. The external PyPI Trusted Publisher mismatch proven by the two historical `1.3.1` attempts must be corrected before publication.\n\nThis document distinguishes proven public truth, pending public evidence, and explicitly accepted operational risk. `accepted_risk` never means that the missing control exists.\n\n## Historical publisher evidence\n\nThe immutable annotated `v1.3.1` tag object `77bced8c530c88c57d2e6c5f58cb717bfe837a9f` targets exact reviewed commit `cfa9ab5c365a28d1a4af63afe9f1d53b19532d89`. Canonical workflow run `32587903026` passed build/release gates but PyPI rejected a valid GitHub OIDC token with `invalid-publisher` before upload. A controlled retry produced the same rejection with identical claims.\n\nThe exact records are:\n\n- [`release-evidence/v1.3.1-publish-attempt-1.json`](./release-evidence/v1.3.1-publish-attempt-1.json)\n- [`release-evidence/v1.3.1-publish-attempt-2.json`](./release-evidence/v1.3.1-publish-attempt-2.json)\n\nExpected existing-project publisher tuple:\n\n```text\nowner: Vanilla1999\nrepository: DocAtlas\nworkflow: publish.yml\nenvironment: release-current\n```\n\n| Public-truth row | State | Evidence / closure requirement |\n|---|---|---|\n| Release source identity | `pending` | Source version, changelog, README ownership marker, and `server.json` agree on `{VERSION}`. A reviewed release request must create immutable `v{VERSION}` from the exact merged tree. |\n| Branch protection | `accepted_risk` | Maintainer decision remains unchanged: release flow compensates by requiring the tag commit to be reachable from exact remote `main`. |\n| Namespace / state isolation | `green` | Fresh release smoke uses `DOCATLAS_HOME`, `~/.docatlas`, and the `docatlas` MCP registration identity. |\n| Installed agent contract | `green` | The public Docs MCP inventory remains exactly `get_docs_context`, `prepare_docs`, `docs_status`. |\n| Trusted Publisher identity | `pending` | Historical `1.3.1` attempts proved GitHub claims `Vanilla1999 / DocAtlas / publish.yml / release-current`; PyPI still needs that exact publisher under the existing `doc-atlas` project. |\n| Exact public artifact identity | `pending` | Publish exactly `doc-atlas=={VERSION}` and prove gated SHA-256 = PyPI metadata SHA-256 = independently downloaded bytes for one wheel and one sdist. |\n| Exact public MCP behavior | `pending` | No-cache install of `doc-atlas=={VERSION}` must pass the exact three-tool Docs MCP stdio smoke. |\n| Cross-platform public install | `pending` | The exact public package must pass Linux, macOS, and Windows smoke. |\n| Official MCP Registry | `pending` | After all public-package smokes pass, GitHub OIDC publishes `{SERVER_NAME}` version `{VERSION}` and the Registry API must return that exact name/version. |\n| Product claim boundary | `green` | Public maturity remains **Beta**; no Context7 parity or unmeasured product-value claim is introduced. |\n\n## Closure rule\n\nP0 closes only when every `pending` row is replaced by concrete `green` evidence. The `accepted_risk` branch-protection row remains visible. Historical `v1.3.0`/`v1.3.1` tags must never be moved or reused.\n''', encoding='utf-8')

          roadmap = ROOT / 'roadmap/README.md'
          roadmap_text = roadmap.read_text(encoding='utf-8')
          start = roadmap_text.index('## P0.5 — Publish and verify public `1.3.1`')
          end = roadmap_text.index('## P0.6 — Public-truth closure scorecard', start)
          p05 = f'''## P0.5 — Publish and verify public `{VERSION}`\n\n`v1.3.0` and `v1.3.1` remain immutable pre-public audit identities whose PyPI OIDC uploads failed before publication. `{VERSION}` is the next public candidate because the launch README, PyPI MCP ownership marker, and Official MCP Registry metadata were added after `v1.3.1`.\n\nAcceptance:\n\n- source version, reviewed tag, changelog, wheel, sdist, and `server.json` agree on `{VERSION}`;\n- the PyPI README contains the exact `{SERVER_NAME}` ownership marker;\n- PyPI metadata says Beta and exact public artifact hashes match the gated build;\n- a no-cache install passes the exact three-tool Docs MCP stdio smoke;\n- Linux, macOS, and Windows public-package smokes are green;\n- only then, GitHub OIDC publishes `{SERVER_NAME}` `{VERSION}` to the Official MCP Registry and the exact Registry entry is verified.\n\n'''
          roadmap_text = roadmap_text[:start] + p05 + roadmap_text[end:]
          roadmap_text = roadmap_text.replace(
              'Branch protection is the one explicitly accepted residual risk for `1.3.1`;',
              f'Branch protection is the one explicitly accepted residual risk for `{VERSION}`;',
          )
          roadmap.write_text(roadmap_text, encoding='utf-8')

          checklist = ROOT / 'docs/RELEASE_CHECKLIST.md'
          checklist_text = checklist.read_text(encoding='utf-8')
          checklist_text = checklist_text.replace(
              'Repository `1.2.0` is an unpublished milestone; the next intended public release is `1.3.1` unless a later reviewed release-preparation change supersedes it.',
              f'Repository `1.2.0` is an unpublished milestone; failed `1.3.0`/`1.3.1` tags remain audit history; the next intended public release is `{VERSION}`.',
          )
          checklist_text = checklist_text.replace(
              'The executable release decision is reviewable in `.github/release-requests/v1.3.1.json`; its exact base commit, allowed release delta, tag, publisher identity, and public tool inventory are validated before any tag is created.',
              f'A new executable release decision for `.github/release-requests/v{VERSION}.json` must bind the exact merged launch base/delta, tag, publisher identity, and public tool inventory before any `v{VERSION}` tag is created. The old `v1.3.1` request remains audit history.',
          )
          anchor = '- [ ] Verify the exact public package on Linux, macOS, and Windows for the claimed primary MCP/install surface.\n'
          if anchor not in checklist_text:
              raise SystemExit('release checklist public-platform anchor not found')
          registry_checks = anchor + f'''- [ ] The PyPI package README contains `<!-- mcp-name: {SERVER_NAME} -->`, and `server.json` names the exact same server/package version.\n- [ ] After all three public-platform smokes pass, publish `{SERVER_NAME}` to the Official MCP Registry with GitHub OIDC; no Registry PAT/secret is stored.\n- [ ] Query the Registry API and retain exact `{SERVER_NAME}` + release-version evidence.\n'''
          checklist_text = checklist_text.replace(anchor, registry_checks, 1)
          checklist.write_text(checklist_text, encoding='utf-8')

          # Update release-state regression tests without erasing the immutable 1.3.1 audit checks.
          p = ROOT / 'tests/test_release_state_repair.py'
          t = p.read_text(encoding='utf-8')
          t = t.replace('assert __version__ == "1.3.1"', f'assert __version__ == "{VERSION}"', 1)
          t = t.replace(
              'assert changelog.index("## [1.3.1]") < changelog.index("## [1.3.0]")',
              'assert changelog.index("## [1.3.2]") < changelog.index("## [1.3.1]") < changelog.index("## [1.3.0]")',
              1,
          )
          t = t.replace('assert "for example v1.3.1" in workflow', 'assert "for example v1.3.2" in workflow', 1)
          t = t.replace('assert "current source release candidate is **DocAtlas 1.3.1**" in identity', 'assert "current source release candidate is **DocAtlas 1.3.2**" in identity', 1)
          t = t.replace('assert "v1.3.0" in identity', 'assert "v1.3.1" in identity', 1)
          t = t.replace('assert "no public `doc-atlas==1.3.1` release is claimed" in identity.lower()', 'assert "no public `doc-atlas==1.3.2`" in identity.lower()', 1)
          t = t.replace('assert "doc-atlas==1.3.1" in scorecard', 'assert "doc-atlas==1.3.2" in scorecard', 1)
          t = t.replace('assert "P0.5 — Publish and verify public `1.3.1`" in roadmap', 'assert "P0.5 — Publish and verify public `1.3.2`" in roadmap', 1)
          p.write_text(t, encoding='utf-8')

          p = ROOT / 'tests/test_patch_release_identity.py'
          t = p.read_text(encoding='utf-8')
          t = t.replace('assert __version__ == "1.3.1"', f'assert __version__ == "{VERSION}"', 1)
          t = t.replace(
              'assert changelog.index("## [1.3.1]") < changelog.index("## [1.3.0]")',
              'assert changelog.index("## [1.3.2]") < changelog.index("## [1.3.1]") < changelog.index("## [1.3.0]")',
              1,
          )
          t = t.replace('assert "current source release candidate is **DocAtlas 1.3.1**" in identity', 'assert "current source release candidate is **DocAtlas 1.3.2**" in identity', 1)
          t = t.replace('assert "v1.3.0" in identity', 'assert "v1.3.1" in identity', 1)
          t = t.replace('assert "P0.5 — Publish and verify public `1.3.1`" in roadmap', 'assert "P0.5 — Publish and verify public `1.3.2`" in roadmap', 1)
          t = t.replace('assert "doc-atlas==1.3.1" in scorecard', 'assert "doc-atlas==1.3.2" in scorecard', 1)
          t = t.replace('assert "for example v1.3.1" in workflow', 'assert "for example v1.3.2" in workflow', 1)
          p.write_text(t, encoding='utf-8')

          registry_test = f'''from __future__ import annotations\n\nimport json\nfrom pathlib import Path\n\nfrom docmancer._version import __version__\n\nROOT = Path(__file__).resolve().parents[1]\nSERVER_NAME = {SERVER_NAME!r}\n\n\ndef test_official_mcp_registry_metadata_matches_release_identity() -> None:\n    payload = json.loads((ROOT / "server.json").read_text(encoding="utf-8"))\n    assert payload["$schema"] == "https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json"\n    assert payload["name"] == SERVER_NAME\n    assert payload["version"] == __version__\n    assert payload["repository"] == {{"url": "https://github.com/Vanilla1999/DocAtlas", "source": "github"}}\n    assert len(payload["packages"]) == 1\n    package = payload["packages"][0]\n    assert package["registryType"] == "pypi"\n    assert package["registryBaseUrl"] == "https://pypi.org"\n    assert package["identifier"] == "doc-atlas"\n    assert package["version"] == __version__\n    assert package["runtimeHint"] == "uvx"\n    assert package["transport"] == {{"type": "stdio"}}\n    assert package["packageArguments"] == [\n        {{"type": "positional", "value": "mcp"}},\n        {{"type": "positional", "value": "docs-serve"}},\n    ]\n\n    readme = (ROOT / "README.md").read_text(encoding="utf-8")\n    assert f"<!-- mcp-name: {{SERVER_NAME}} -->" in readme\n\n\ndef test_registry_publish_is_oidc_only_and_after_public_platform_smoke() -> None:\n    workflow = (ROOT / ".github/workflows/publish.yml").read_text(encoding="utf-8")\n    assert "publish-official-mcp-registry" in workflow\n    assert "needs: [public-platform-smoke]" in workflow\n    assert "id-token: write" in workflow\n    assert "./mcp-publisher login github-oidc" in workflow\n    assert "./mcp-publisher publish server.json" in workflow\n    assert "releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz" in workflow\n    assert "ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac" in workflow\n    assert "MCP_GITHUB_TOKEN" not in workflow\n    assert "MCP_PRIVATE_KEY" not in workflow\n'''
          (ROOT / 'tests/test_mcp_registry_metadata.py').write_text(registry_test, encoding='utf-8')
          PY

      - name: Validate launch release preparation
        shell: bash
        run: |
          python -m json.tool server.json >/dev/null
          python -m pip install -q -e . pytest
          pytest -q \
            tests/test_mcp_registry_metadata.py \
            tests/test_release_state_repair.py \
            tests/test_patch_release_identity.py \
            tests/docs/test_user_facing_docs_branding.py
          python -m compileall -q docmancer scripts
          git diff --check

      - name: Publish validated preparation commit
        shell: bash
        run: |
          rm .github/workflows/public-launch-registry-prep.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            CHANGELOG.md \
            docmancer/_version.py \
            server.json \
            .github/workflows/publish.yml \
            docs/release-identity.md \
            docs/public-truth-scorecard.md \
            docs/RELEASE_CHECKLIST.md \
            roadmap/README.md \
            tests/test_release_state_repair.py \
            tests/test_patch_release_identity.py \
            tests/test_mcp_registry_metadata.py \
            .github/workflows/public-launch-registry-prep.yml
          git diff --cached --check
          git commit -m "feat: prepare Official MCP Registry launch"
          git push origin HEAD:docs/public-launch-readme-registry
