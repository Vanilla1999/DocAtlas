name: Public launch registry prep

on:
  push:
    branches:
      - docs/public-launch-readme-registry

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: docs/public-launch-readme-registry
          fetch-depth: 0

      - name: Apply fail-closed launch preparation
        run: |
          python .github/review/public_launch_registry_prep.py
          python .github/review/merge_registry_tests.py

      - name: Validate launch release preparation
        run: |
          python -m json.tool server.json >/dev/null
          python -m pip install -q -e . pytest
          python -c "import yaml; yaml.safe_load(open('.github/workflows/publish.yml', encoding='utf-8'))"
          pytest -q \
            tests/test_release_state_repair.py \
            tests/test_patch_release_identity.py \
            tests/docs/test_user_facing_docs_branding.py
          python -m compileall -q docmancer scripts
          git diff --check

      - name: Validate server.json with pinned Official MCP Registry publisher
        run: |
          curl -fL \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz \
            -o /tmp/mcp-publisher.tar.gz
          echo 'ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac  /tmp/mcp-publisher.tar.gz' | sha256sum -c -
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          /tmp/mcp-publisher validate server.json

      - name: Publish validated preparation commit
        run: |
          rm .github/workflows/public-launch-registry-prep.yml
          rm .github/review/public_launch_registry_prep.py
          rm .github/review/merge_registry_tests.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: prepare Official MCP Registry launch"
          git push origin HEAD:docs/public-launch-readme-registry
