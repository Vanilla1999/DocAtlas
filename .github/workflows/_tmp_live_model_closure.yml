name: TEMP live model closure

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  models: read

jobs:
  live:
    if: github.head_ref == 'eval/live-model-closure' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: eval/live-model-closure
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Install evaluation dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run both trusted live evaluations
        id: live
        env:
          TASK21_GITHUB_TOKEN: ${{ github.token }}
          AGENT_DEVELOPER_GITHUB_TOKEN: ${{ github.token }}
          MODEL: openai/gpt-4o-mini
        run: |
          set +e
          python scripts/run_task21_github_models_live.py \
            --model "$MODEL" \
            --output eval/results/task21_tool_choice_gate.json
          task21_rc=$?

          python scripts/run_agent_developer_model_benchmark.py \
            --model "$MODEL" \
            --min-pass-rate 0.0 \
            --output eval/agent_developer_v1/results/model-benchmark.json
          agent_rc=$?

          python scripts/verify_agent_developer_model_report.py \
            eval/agent_developer_v1/results/model-benchmark.json \
            --seal \
            --expected-model "$MODEL" \
            --min-pass-rate 0.0
          verify_rc=$?
          set -e

          echo "task21_rc=$task21_rc" >> "$GITHUB_OUTPUT"
          echo "agent_rc=$agent_rc" >> "$GITHUB_OUTPUT"
          echo "verify_rc=$verify_rc" >> "$GITHUB_OUTPUT"
      - name: Promote Task 21 committed-report assertion after a passing live run
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("eval/results/task21_tool_choice_gate.json")
          if not report_path.is_file():
              raise SystemExit(0)
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if report.get("passed") is not True:
              raise SystemExit(0)

          path = Path("tests/docs/test_tool_choice_eval.py")
          text = path.read_text(encoding="utf-8")
          marker = "def test_committed_live_report_is_explicit_and_matches_frozen_scenarios():"
          start = text.index(marker)
          next_def = text.find("\n\ndef ", start + len(marker))
          if next_def < 0:
              next_def = len(text)
          replacement = '''def test_committed_live_report_is_explicit_and_matches_frozen_scenarios():
              report_path = Path("eval/results/task21_tool_choice_gate.json")
              report = json.loads(report_path.read_text(encoding="utf-8"))
              assert report["passed"] is True
              assert report["adapter"]["model_version"] != "not-run"
              assert report["scenario_count"] == len(SCENARIOS)
              assert report["repeats"] == REPEATS
              assert len(report["results"]) == len(SCENARIOS) * REPEATS
              assert all(item.get("status") != "not_run" for item in report["results"])
              assert report["tool_schema_version"].startswith("sha256:")
              assert {item["scenario_id"] for item in report["results"]} == {
                  scenario.scenario_id for scenario in SCENARIOS
              }
          '''
          path.write_text(text[:start] + replacement + text[next_def:], encoding="utf-8")
          PY
      - name: Commit sanitized live evidence
        if: always()
        env:
          TASK21_RC: ${{ steps.live.outputs.task21_rc }}
          AGENT_RC: ${{ steps.live.outputs.agent_rc }}
          VERIFY_RC: ${{ steps.live.outputs.verify_rc }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f eval/results/task21_tool_choice_gate.json || true
          git add -f eval/agent_developer_v1/results/model-benchmark.json || true
          git add tests/docs/test_tool_choice_eval.py tests/test_live_evaluation_evidence.py
          if [ "$TASK21_RC" = "0" ] && [ "$AGENT_RC" = "0" ] && [ "$VERIFY_RC" = "0" ]; then
            rm -f .github/workflows/_tmp_live_model_closure.yml
          fi
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record trusted live model evaluation evidence"
          git push origin HEAD:eval/live-model-closure
      - name: Enforce successful live closure
        if: always()
        env:
          TASK21_RC: ${{ steps.live.outputs.task21_rc }}
          AGENT_RC: ${{ steps.live.outputs.agent_rc }}
          VERIFY_RC: ${{ steps.live.outputs.verify_rc }}
        run: |
          test "$TASK21_RC" = "0"
          test "$AGENT_RC" = "0"
          test "$VERIFY_RC" = "0"
