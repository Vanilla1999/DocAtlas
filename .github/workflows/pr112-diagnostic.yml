name: PR112 focused diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCMANCER_OFFLINE: "1"

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]" >/tmp/pip.log 2>&1 || { tail -n 120 /tmp/pip.log; exit 1; }
      - name: Run Python 3.13 core diagnostics
        shell: bash
        run: |
          set +e
          pytest tests/ -m "not advanced and not live and not live_network" -q --tb=short --maxfail=10 > /tmp/pytest.log 2>&1
          status=$?
          tail -n 220 /tmp/pytest.log
          exit $status
