name: P1.5 mixed-evidence provenance

on:
  pull_request:
    branches: [main, p1/p1.4-paraphrase-proofability]
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCATLAS_OFFLINE: "1"

jobs:
  p1-5-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install DocAtlas evaluator dependencies
        id: evaluator_dependencies
        run: python -m pip install -e ".[dev]"
      - name: Measure frozen full facts and explicit source provenance
        run: PYTHONPATH=. python scripts/run_mixed_evidence_provenance_gate.py --output "$RUNNER_TEMP/p1.5-current-provenance.json"
      - name: Verify independent oracle controls and current report integrity
        if: ${{ !cancelled() && steps.evaluator_dependencies.outcome == 'success' }}
        run: PYTHONPATH=. python scripts/mixed_evidence_provenance_self_test.py --report "$RUNNER_TEMP/p1.5-current-provenance.json"
      - name: Verify source syntax and patch formatting
        if: ${{ !cancelled() && steps.evaluator_dependencies.outcome == 'success' }}
        run: |
          python -m compileall -q \
            eval/agent_developer_v1/current_retrieval_runtime.py \
            eval/agent_developer_v1/finite_http_fixture.py \
            eval/agent_developer_v1/mixed_retrieval_runtime.py \
            eval/agent_developer_v1/mixed_provenance.py \
            scripts/run_mixed_evidence_provenance_gate.py \
            scripts/mixed_evidence_provenance_self_test.py
          git diff --check
      - name: Upload complete current P1.5 observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p1.5-current-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p1.5-current-provenance.json
          if-no-files-found: warn
          retention-days: 14
