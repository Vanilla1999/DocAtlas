name: PR191 relation finalizer

on:
  push:
    branches: [fix/query-planning-scope]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCATLAS_OFFLINE: "1"

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/query-planning-scope
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact staging base
        shell: bash
        run: |
          set -euo pipefail
          base="b5ed101496ec8cf61f03dbb9f14ec877d96f8b40"
          git merge-base --is-ancestor "$base" HEAD
          expected="$(printf '%s\n' '.github/pr191_relation_finalize.py' '.github/workflows/pr191-relation-finalize.yml' | sort)"
          actual="$(git diff --name-only "$base"..HEAD | sort)"
          test "$actual" = "$expected"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Apply recovered final patch
        run: python .github/pr191_relation_finalize.py

      - name: Compile changed runtime
        run: |
          python -m compileall -q \
            docmancer/docs/application/context_candidate_ranking.py \
            docmancer/docs/domain/documentation_query_plan.py \
            docmancer/docs/domain/evidence_qualification.py \
            docmancer/docs/domain/project_retrieval_intent.py \
            docmancer/docs/domain/query_terms.py

      - name: Run narrow query-planning regressions
        run: |
          python -m pytest -q \
            tests/docs/test_query_planning_alias_regressions.py \
            tests/docs/test_query_planning_budget_regressions.py \
            tests/docs/test_relation_preserving_projection.py

      - name: Exercise N11 and N14 through public MCP path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import tempfile
          from pathlib import Path

          from docmancer.agent import DocmancerAgent
          from docmancer.core.config import DocmancerConfig
          from docmancer.docs.application.docs_job_service import DocsJobTracker
          from docmancer.docs.registry import LibraryRegistry
          from docmancer.docs.service import LibraryDocsService
          from docmancer.mcp.docs_server import call_docs_tool_payload

          root = Path('.').resolve()
          questions = {
              'N11': 'What happens in offline mode when the documentation needed for a question has not been prefetched or indexed yet?',
              'N14': 'How do project documentation and dependency/library documentation differ in retrieval scope and provenance?',
          }
          with tempfile.TemporaryDirectory() as td:
              os.environ['DOCATLAS_HOME'] = td
              os.environ['DOCATLAS_AUTO_VECTORS'] = '0'
              config = DocmancerConfig()
              config.index.db_path = str(Path(td) / 'docatlas.db')
              config.index.extracted_dir = str(Path(td) / 'extracted')
              service = LibraryDocsService(
                  config=config,
                  config_source='explicit',
                  registry=LibraryRegistry(config.index.db_path),
                  agent=DocmancerAgent(config=config),
                  job_tracker=DocsJobTracker(),
              )
              synced = service.sync_project_docs(str(root), with_vectors=False)
              assert synced.status == 'success', synced

              payloads = {}
              for case_id, question in questions.items():
                  payload = call_docs_tool_payload(
                      'get_docs_context',
                      {'question': question, 'project_path': str(root), 'scope': 'all'},
                      service,
                  )
                  payloads[case_id] = payload
                  sources = payload.get('sources') or []
                  assert 0 < len(sources) <= 3, (case_id, sources)
                  assert int(payload.get('estimated_tokens') or 0) <= 800, (case_id, payload.get('estimated_tokens'))
                  print(case_id, payload.get('kind'), payload.get('context_quality'), payload.get('estimated_tokens'))
                  for source in sources:
                      print(' ', source.get('path_or_url'), repr(source.get('snippet', '')[:500]))

              n11 = '\n'.join(str(row.get('snippet') or '') for row in payloads['N11'].get('sources') or []).casefold()
              assert 'not yet indexed' in n11, n11
              assert 'sync_project_docs' in n11, n11
              assert 'pinned kotlin documentation smoke' not in n11, n11
              assert 'kotlin_live_smoke' not in n11 and 'kotlin-live-smoke' not in n11, n11

              n14 = '\n'.join(str(row.get('snippet') or '') for row in payloads['N14'].get('sources') or []).casefold()
              assert 'prefetch_project_dependency_docs' in n14, n14
              assert any(marker in n14 for marker in (
                  'project-owned docs',
                  'readme/docs/wiki/adr',
                  'not the same as project-owned docs',
                  'sync_project_docs',
              )), n14
          PY

      - name: Verify clean patch and publish
        shell: bash
        run: |
          set -euo pipefail
          base="b5ed101496ec8cf61f03dbb9f14ec877d96f8b40"
          git diff --check
          rm .github/pr191_relation_finalize.py .github/workflows/pr191-relation-finalize.yml
          test ! -e .github/pr191_relation_finalize.py
          test ! -e .github/workflows/pr191-relation-finalize.yml
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: close remaining relation-selection gaps"
          if git diff --name-only "$base"..HEAD | grep -E '^\.github/(pr191_relation_finalize\.py|workflows/pr191-relation-finalize\.yml)$'; then
            echo 'temporary staging files remain in final tree' >&2
            exit 1
          fi
          git push origin HEAD:fix/query-planning-scope
