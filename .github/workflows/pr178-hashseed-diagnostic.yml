name: PR178 semantic admission diagnostic

on:
  push:
    branches: [fix/context-first-project-reads]
    paths: [.github/workflows/pr178-hashseed-diagnostic.yml]

permissions:
  contents: read

env:
  DOCATLAS_OFFLINE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Apply current closure patch and inject trace
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/pr178-final-semantic-closure.yml').read_text()
          blocks = re.findall(r"          python - <<'PY'\n(.*?)\n          PY", workflow, re.S)
          assert len(blocks) >= 2, len(blocks)
          for index, block in enumerate(blocks[:2]):
              exec(compile(textwrap.dedent(block), f'<closure-patch-{index}>', 'exec'), {})

          path = Path('tests/test_docs_service_part03.py')
          text = path.read_text()
          needle = '''    payload = handle_context_tool(\n        "get_docs_context",\n'''
          replacement = '''    import json\n    import docmancer.docs.interfaces.mcp.context_tools as _context_tools\n    from docmancer.docs.application.context_selection import (\n        component_obligations as _component_obligations,\n        component_witnesses as _component_witnesses,\n        qualified_query_ids as _qualified_query_ids,\n    )\n    _original_project_docs_context = _context_tools.project_docs_context\n    def _trace_project_docs_context(**kwargs):\n        retrieval = kwargs["retrieval"]\n        query_plan = retrieval.get("documentation_query_plan") or {}\n        obligations = _component_obligations(query_plan.get("_component_contract") or ())\n        rows = []\n        for row in retrieval.get("context_pack") or ():\n            path_value = str(row.get("path") or "")\n            if path_value == "zz-authoritative-plan.md" or path_value.startswith("docs/note-"):\n                probe = {**row, "_lifecycle_intent": "current"}\n                rows.append({\n                    "path": path_value,\n                    "authority": row.get("authority"),\n                    "qualified": sorted(_qualified_query_ids((row,))),\n                    "components": _component_witnesses(probe, obligations),\n                    "matches": row.get("retrieval_query_matches"),\n                })\n        print("QUERY_PLAN=" + json.dumps({\n            "queries": query_plan.get("queries"),\n            "required_query_ids": query_plan.get("required_query_ids"),\n            "component_scope_complete": query_plan.get("component_scope_complete"),\n            "component_contract": query_plan.get("_component_contract"),\n        }, sort_keys=True, default=str))\n        print("RETRIEVAL_ROWS=" + json.dumps(rows, sort_keys=True, default=str))\n        projection = _original_project_docs_context(**kwargs)\n        print("PROJECTED_SOURCES=" + json.dumps(projection[0].get("sources"), sort_keys=True, default=str))\n        return projection\n    monkeypatch.setattr(_context_tools, "project_docs_context", _trace_project_docs_context)\n\n    payload = handle_context_tool(\n        "get_docs_context",\n'''
          assert text.count(needle) >= 1
          path.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Trace one failing request
        shell: bash
        run: |
          set +e
          PYTHONHASHSEED=0 pytest -q -s --showlocals tests/test_docs_service_part03.py::test_project_query_does_not_return_non_project_docs_with_same_terms
          exit 1
