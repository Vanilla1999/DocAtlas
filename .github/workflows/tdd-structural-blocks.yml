name: TDD structural blocks
on:
  push:
    branches: [experiment/structural-context-blocks-20260927]
permissions:
  contents: read
env:
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"
jobs:
  original-questions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Install locked runtime
        run: |
          mkdir -p "$RUNNER_TEMP/structural-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/structural-evidence/head.txt"
          python -m pip install 'uv==0.9.25'
          uv sync --locked --extra dev --python 3.13
          uv pip freeze --python .venv/bin/python > "$RUNNER_TEMP/structural-evidence/freeze.txt"
      - name: Run original-question assertions
        run: |
          set -o pipefail
          .venv/bin/python -m pytest -q --tb=short tests/docs/test_structural_context_delivery.py --junitxml="$RUNNER_TEMP/structural-evidence/original.xml" 2>&1 | tee "$RUNNER_TEMP/structural-evidence/original.log"
      - name: Preserve neighboring guards
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          .venv/bin/python -m pytest -q --tb=short tests/docs/test_requested_evidence_retention.py tests/docs/test_support_retention_integration.py tests/docs/test_admission_relation_safety.py --junitxml="$RUNNER_TEMP/structural-evidence/neighbors.xml" 2>&1 | tee "$RUNNER_TEMP/structural-evidence/neighbors.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: structural-blocks-${{ github.sha }}
          path: ${{ runner.temp }}/structural-evidence
          retention-days: 14
