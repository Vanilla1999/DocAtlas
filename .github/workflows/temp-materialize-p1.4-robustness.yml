name: TEMP materialize strict P1.4 proofability evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCMANCER_OFFLINE: "1"

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'p1/p1.4-paraphrase-proofability'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: p1/p1.4-paraphrase-proofability
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Materialize the strict reviewed protocol
        shell: bash
        env:
          ARCHIVE_SHA256: 236e187340f3a391789d8be018be106df6f742496ca919f8aecd74488e327070
        run: |
          set -euo pipefail
          cat > /tmp/p14.b64 <<'EOF'

EOF
          base64 --decode /tmp/p14.b64 > /tmp/p14.tgz
          test "$(sha256sum /tmp/p14.tgz | awk '{print $1}')" = "$ARCHIVE_SHA256"

          rm -f \
            eval/agent_developer_v1/paraphrase_robustness.py \
            eval/agent_developer_v1/paraphrase_robustness_cases.json \
            scripts/build_agent_developer_paraphrase_robustness.py \
            tests/test_agent_developer_paraphrase_robustness.py
          tar -xzf /tmp/p14.tgz

          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("tests/diagnostic_labels.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          old = "tests/test_agent_developer_paraphrase_robustness.py"
          manifest["module_labels"].pop(old, None)
          manifest["module_node_hashes"].pop(old, None)
          module = "tests/test_agent_proofability_robustness.py"
          manifest["module_labels"][module] = "behavioral"
          manifest["module_node_hashes"][module] = "367b4b0b3092555c9ee7e2906e1d26652cda3baef644cc5ca331f09aa5c09633"
          path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          rm .github/workflows/temp-materialize-p1.4-robustness.yml
          python -m pip install -e ".[dev]"
          python scripts/build_agent_proofability_robustness.py --check
          pytest -q tests/test_agent_proofability_robustness.py tests/test_diagnostic_labels.py
          python -m compileall -q \
            eval/agent_developer_v1/proofability_robustness.py \
            scripts/build_agent_proofability_robustness.py \
            tests/test_agent_proofability_robustness.py
          git diff --check

      - name: Commit the final reviewable P1.4 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(p1): measure strict proofability robustness"
          git push origin HEAD:p1/p1.4-paraphrase-proofability
