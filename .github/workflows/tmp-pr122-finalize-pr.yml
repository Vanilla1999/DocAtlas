name: TEMP run PR 122 finalizer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'p0/recoverable-docs-failures' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: p0/recoverable-docs-failures
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Execute reviewed finalizer
        run: python scripts/tmp_pr122_finalize_v2.py
