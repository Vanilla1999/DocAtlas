name: TEMP run PR 122 finalizer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'p0/recoverable-docs-failures' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: p0/recoverable-docs-failures
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Execute reviewed finalizer
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          text = Path('.github/workflows/tmp-pr122-finalize.yml').read_text(encoding='utf-8')

          def block(name: str, next_name: str | None) -> str:
              step = f'      - name: {name}\n'
              start = text.index(step) + len(step)
              run_marker = '        run: |\n'
              start = text.index(run_marker, start) + len(run_marker)
              end = text.index(f'      - name: {next_name}\n', start) if next_name else len(text)
              lines = text[start:end].splitlines()
              normalized = [line[10:] if line.startswith('          ') else line for line in lines]
              return '\n'.join(normalized).rstrip() + '\n'

          sequence = (
              ('Apply reviewed integration fixes', 'Focused validation'),
              ('Focused validation', 'Commit semantic fixes'),
              ('Commit semantic fixes', None),
          )
          for name, next_name in sequence:
              print(f'::group::{name}')
              subprocess.run(
                  ['bash', '-euo', 'pipefail', '-c', block(name, next_name)],
                  check=True,
              )
              print('::endgroup::')
          PY
