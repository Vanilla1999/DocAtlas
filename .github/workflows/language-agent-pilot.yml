name: Language real-agent frozen pilot
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/language_aware_context/pilot*'
      - 'tests/docs/test_language_pilot_io.py'
      - '.github/workflows/language-agent-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: language-agent-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  real-agent:
    # Automatic evaluation is bound to the frozen pilot commit, not every docs push.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.sha == '2a927824bcbb9c6e4e124bd9916a37c025e0f866'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      DOCATLAS_OFFLINE: '1'
      DOCATLAS_AUTO_VECTORS: '0'
      DOCATLAS_REGISTRY_API_URL: 'http://127.0.0.1:1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Frozen DocAtlas and isolated CPU agent environment
        run: |
          python -m pip install uv==0.9.25
          uv sync --frozen --extra dev
          python -m venv "$RUNNER_TEMP/agent-venv"
          "$RUNNER_TEMP/agent-venv/bin/pip" install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/agent-venv/bin/pip" install transformers==4.53.3
          mkdir -p "$RUNNER_TEMP/pilot-evidence"
          "$RUNNER_TEMP/agent-venv/bin/pip" freeze > "$RUNNER_TEMP/pilot-evidence/agent-packages.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/pilot-evidence/source-head.txt"
      - name: Boundary tests before any evaluation
        run: .venv/bin/python -m pytest tests/docs/test_language_pilot_io.py -q --junitxml="$RUNNER_TEMP/pilot-evidence/unit.xml"
      - name: Freeze public source bytes then run genuine plans and answers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          .venv/bin/python -m experiments.language_aware_context.pilot_run
          --shard ${{ matrix.shard }}
          --agent-python "$RUNNER_TEMP/agent-venv/bin/python"
          --output "$RUNNER_TEMP/pilot-evidence/run"
      - name: Preserve all results including failures (no model weights)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: language-agent-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/pilot-evidence/
          retention-days: 7
          if-no-files-found: error
