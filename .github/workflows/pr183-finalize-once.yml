name: PR183 final audit patch

on:
  push:
    branches: [fix/direct-question-tdd-ddd-15]

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PATCH_B64: >-
        
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Apply reviewed patch
        shell: bash
        run: |
          echo "$PATCH_B64" | base64 -d | gzip -d > /tmp/pr183.patch
          git apply --check /tmp/pr183.patch
          git apply /tmp/pr183.patch
          rm .github/workflows/pr183-finalize-once.yml
      - name: Run focused regression tests
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/docs/test_direct_question_retrieval_intents.py tests/docs/test_project_query_intent.py tests/docs/test_generic_context_workflows.py tests/docs/test_context7_style_project_chat.py --tb=short
      - name: Commit reviewed changes
        shell: bash
        run: |
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden direct-question audit coverage'
          git push origin HEAD:fix/direct-question-tdd-ddd-15
