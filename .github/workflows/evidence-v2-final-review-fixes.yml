name: Evidence v2 final review fixes
on:
  push:
    branches: [fix/evidence-quality-v2-20260910]
    paths: [.github/workflows/evidence-v2-final-review-fixes.yml]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DOCATLAS_OFFLINE: '1'
      DOCATLAS_AUTO_VECTORS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify and apply reviewed patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          encoded = ''
          patch = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == 'f5e14b3dc2a3bf753374864b3cd74f2deb0d4e6351b35940bb2ecd53b27f5dc2'
          subprocess.run(['git', 'apply', '--check'], input=patch, check=True)
          subprocess.run(['git', 'apply'], input=patch, check=True)
          pathlib.Path('review.patch').write_bytes(patch)
          PY
      - name: Install and run neutral and subprocess regressions
        shell: bash
        run: |
          python -m pip install '.[dev]' build 'tiktoken==0.11.0'
          python -m pytest -q tests/evidence_quality_v2/test_readme_neutral_context.py tests/evidence_quality_v2/test_git_stdio_isolation.py tests/docs/test_docs_impact.py tests/docs/test_docs_impact_task20.py > "$RUNNER_TEMP/targeted.log" 2>&1
          tail -n 8 "$RUNNER_TEMP/targeted.log"
      - name: Full offline core and frozen V2 on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pytest tests/ -q -m 'not advanced and not live and not live_network' > "$RUNNER_TEMP/core.log" 2>&1
          python scripts/run_project_context_quality_v2_gate.py --output "$RUNNER_TEMP/v2.json"
      - name: Real installed-wheel lifecycle smoke
        shell: bash
        run: |
          python -m build --wheel --outdir "$RUNNER_TEMP/review-wheel"
          python -m pip install --force-reinstall --no-deps "$RUNNER_TEMP/review-wheel/"*.whl
          python scripts/docs_mcp_stdio_smoke.py > "$RUNNER_TEMP/lifecycle.log" 2>&1
          tail -n 8 "$RUNNER_TEMP/lifecycle.log"
      - name: Preserve validation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-proof-${{ runner.os }}
          path: |
            review.patch
            ${{ runner.temp }}/targeted.log
            ${{ runner.temp }}/core.log
            ${{ runner.temp }}/v2.json
            ${{ runner.temp }}/lifecycle.log
          retention-days: 14
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: review-proof-Linux
          path: ${{ runner.temp }}/review-proof
      - name: Publish exactly the validated patch and remove consumed carriers
        shell: bash
        run: |
          set -eu
          PATCH=$(find "$RUNNER_TEMP/review-proof" -name review.patch -type f)
          test -n "$PATCH"
          echo "f5e14b3dc2a3bf753374864b3cd74f2deb0d4e6351b35940bb2ecd53b27f5dc2  $PATCH" | sha256sum --check
          git apply --check "$PATCH"
          git apply "$PATCH"
          git diff --check
          git rm .github/workflows/evidence-v2-final-review-fixes.yml .github/workflows/evidence-v2-windows-git-probe.yml
          git add docmancer/docs/_impact_part01.py docmancer/docs/application/docs_context_projection.py docmancer/docs/domain/context_hint_policy.py scripts/docs_mcp_stdio_smoke.py tests/evidence_quality_v2/test_readme_neutral_context.py tests/diagnostic_labels.readme_neutral.json tests/evidence_quality_v2/test_git_stdio_isolation.py tests/diagnostic_labels.git_stdio.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: isolate Git stdin and close fixture handles while preserving context guards'
          test "$(git ls-remote origin refs/heads/fix/evidence-quality-v2-20260910 | cut -f1)" = '${{ github.sha }}'
          git push origin HEAD:refs/heads/fix/evidence-quality-v2-20260910
          git log -1 --format=fuller
