name: Apply verified Task 5-6 patch

on:
  push:
    branches: [feat/adaptive-docs-query-planner]
    paths:
      - '.github/workflows/task5-6-apply.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install locked environment
        run: uv sync --frozen
      - name: Apply reviewed patch
        run: patch -p1 < .task5-6.patch
      - name: Focused TDD gate
        run: |
          uv run --frozen python -m pytest -q \
            tests/docs/test_source_recovery_targeting.py \
            tests/docs/test_self_host_agent_contract_surface.py \
            tests/docs/test_context_capture_integrity.py \
            tests/docs/test_gap_directed_candidate_ranking.py \
            tests/docs/test_agent_question_planning_contract.py \
            tests/docs/test_context_loss_boundaries.py \
            tests/docs/test_relation_preserving_projection.py \
            tests/docs/test_evidence_admission_sufficiency.py \
            tests/docs/test_context_quality.py \
            tests/docs/test_docs_context_read_next.py
          uv run --frozen python -m compileall -q docmancer
          git diff --check
      - name: Publish only verified tree
        env:
          BRANCH: feat/adaptive-docs-query-planner
        run: |
          rm .task5-6.patch .github/workflows/task5-6-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: target gap evidence without automatic rereads'
          git push origin "HEAD:${BRANCH}"
