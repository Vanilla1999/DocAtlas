name: PR179 final P1 evidence refresh

on:
  push:
    branches: [fix/context-first-project-reads-finalization]
    paths: [.github/workflows/pr179-refresh-final-p1-evidence.yml]

permissions:
  contents: write

env:
  DOCATLAS_OFFLINE: '1'
  DOCATLAS_AUTO_VECTORS: '0'
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  PYTHONHASHSEED: '0'
  PYTHONPATH: '.'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  refresh-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads-finalization
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install evaluator dependencies
        run: python -m pip install -e '.[dev]'

      - name: Snapshot committed evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p1-before"
          cp eval/agent_developer_v1/results/paraphrase-proofability.json "$RUNNER_TEMP/p1-before/"
          cp eval/agent_developer_v1/results/mixed-evidence-provenance.json "$RUNNER_TEMP/p1-before/"
          cp eval/agent_developer_v1/results/evidence-is-data.json "$RUNNER_TEMP/p1-before/"
          cp eval/agent_developer_v1/results/p1-agent-truth-closure.json "$RUNNER_TEMP/p1-before/"

      - name: Regenerate P1 evidence
        run: |
          set -euo pipefail
          python scripts/run_paraphrase_proofability_gate.py --write
          python scripts/run_mixed_evidence_provenance_gate.py --write
          python scripts/run_evidence_is_data_gate.py --write
          python scripts/run_p1_agent_truth_closure_gate.py --write

      - name: Prove refresh is identity-only
        shell: python
        run: |
          from __future__ import annotations

          from copy import deepcopy
          import json
          import os
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          before_dir = Path(os.environ['RUNNER_TEMP']) / 'p1-before'
          results = root / 'eval/agent_developer_v1/results'
          runtime_path = 'docmancer/docs/application/evidence_requirements.py'
          slices = (
              'paraphrase-proofability.json',
              'mixed-evidence-provenance.json',
              'evidence-is-data.json',
          )

          expected_runtime_blob = subprocess.check_output(
              ['git', 'hash-object', runtime_path], text=True
          ).strip()

          def load(path: Path):
              return json.loads(path.read_text(encoding='utf-8'))

          for name in slices:
              before = load(before_dir / name)
              after = load(results / name)
              b = deepcopy(before)
              a = deepcopy(after)

              b_runtime = b['source_identities']['proof_runtime']
              a_runtime = a['source_identities']['proof_runtime']
              assert b_runtime['algorithm'] == a_runtime['algorithm'] == 'ordered-git-blob-sha1-manifest-v1'

              b_files = {item['path']: item['git_blob_sha1'] for item in b_runtime['files']}
              a_files = {item['path']: item['git_blob_sha1'] for item in a_runtime['files']}
              assert b_files.keys() == a_files.keys(), (name, b_files.keys() ^ a_files.keys())
              changed = {path for path in b_files if b_files[path] != a_files[path]}
              assert changed == {runtime_path}, (name, changed)
              assert a_files[runtime_path] == expected_runtime_blob, (
                  name, a_files[runtime_path], expected_runtime_blob
              )
              assert b_runtime['sha256'] != a_runtime['sha256'], name

              for document in (b, a):
                  runtime = document['source_identities']['proof_runtime']
                  for item in runtime['files']:
                      if item['path'] == runtime_path:
                          item['git_blob_sha1'] = '<runtime-identity>'
                  runtime['sha256'] = '<runtime-manifest-identity>'

              assert b == a, f'{name}: semantic report content changed outside permitted identities'

          closure_name = 'p1-agent-truth-closure.json'
          before = load(before_dir / closure_name)
          after = load(results / closure_name)
          b = deepcopy(before)
          a = deepcopy(after)
          allowed = {'p1_4', 'p1_5', 'p1_6'}
          changed = {
              key for key in before['source_identities']
              if before['source_identities'][key] != after['source_identities'][key]
          }
          assert changed == allowed, changed

          expected_slice_paths = {
              'p1_4': 'paraphrase-proofability.json',
              'p1_5': 'mixed-evidence-provenance.json',
              'p1_6': 'evidence-is-data.json',
          }
          for key, filename in expected_slice_paths.items():
              expected = subprocess.check_output(
                  ['git', 'hash-object', str(results / filename)], text=True
              ).strip()
              assert after['source_identities'][key]['git_blob_sha1'] == expected, (
                  key, after['source_identities'][key]['git_blob_sha1'], expected
              )
              b['source_identities'][key]['git_blob_sha1'] = '<slice-identity>'
              a['source_identities'][key]['git_blob_sha1'] = '<slice-identity>'

          assert b == a, 'P1 closure changed outside refreshed evidence identities'

          expected_files = sorted(str(results / name).removeprefix(str(root) + '/') for name in (*slices, closure_name))
          actual_files = sorted(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', '--', 'eval/agent_developer_v1/results'], text=True
              ).splitlines()
          )
          assert actual_files == expected_files, (actual_files, expected_files)
          print('P1 refresh semantic diff: PASS; only evidence_requirements runtime identity and closure slice identities changed')

      - name: Verify refreshed evidence gates and self-tests
        run: |
          set -euo pipefail
          python scripts/run_paraphrase_proofability_gate.py
          python scripts/paraphrase_proofability_self_test.py
          python scripts/run_mixed_evidence_provenance_gate.py
          python scripts/mixed_evidence_provenance_self_test.py
          python scripts/run_evidence_is_data_gate.py
          python scripts/evidence_is_data_self_test.py
          python scripts/run_p1_agent_truth_closure_gate.py
          python scripts/p1_agent_truth_closure_self_test.py
          git diff --check

      - name: Publish exactly the validated evidence refresh
        run: |
          set -euo pipefail
          git rm .github/workflows/pr179-refresh-final-p1-evidence.yml
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/pr179-refresh-final-p1-evidence.yml',
              'eval/agent_developer_v1/results/paraphrase-proofability.json',
              'eval/agent_developer_v1/results/mixed-evidence-provenance.json',
              'eval/agent_developer_v1/results/evidence-is-data.json',
              'eval/agent_developer_v1/results/p1-agent-truth-closure.json',
          }
          changed = set(subprocess.check_output(['git', 'diff', 'HEAD', '--name-only'], text=True).splitlines())
          assert changed == expected, (changed, expected)
          PY
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: refresh final PR179 P1 evidence identities'
          git push origin HEAD:fix/context-first-project-reads-finalization
