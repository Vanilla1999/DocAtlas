name: Query planning completion

on:
  push:
    branches:
      - fix/query-planning-scope
    paths:
      - .github/workflows/query-planning-completion.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply tested delta
        shell: bash
        run: |
          set -euo pipefail
          cat .github/query-planning-completion/part-0[1-7].patch > /tmp/query-planning-completion.patch
          echo '2f5b7087017b5e2b97dead2f561dfbb6795fa134c3de4eae04134b738d712702  /tmp/query-planning-completion.patch' | sha256sum -c -
          manifest_excludes=(
            --exclude=tests/diagnostic_labels.direct_questions.json
            --exclude=tests/diagnostic_labels.query_planning_p5.json
            --exclude=tests/diagnostic_labels.v2_acceptance_gaps.json
          )
          git apply --check "${manifest_excludes[@]}" /tmp/query-planning-completion.patch
          git apply "${manifest_excludes[@]}" /tmp/query-planning-completion.patch
          echo '5e7b8fb31640c143a8e1b6294ca2390b9c1251a125ee052c23ccd7746e5b9ab9  .github/query-planning-completion/part-08.patch' | sha256sum -c -
          git apply --check .github/query-planning-completion/part-08.patch
          git apply .github/query-planning-completion/part-08.patch
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          pairs = {
              Path('tests/diagnostic_labels.direct_questions.json'): Path('tests/docs/test_direct_question_retrieval_intents.py'),
              Path('tests/diagnostic_labels.query_planning_p5.json'): Path('tests/docs/test_relation_preserving_projection.py'),
              Path('tests/diagnostic_labels.v2_acceptance_gaps.json'): Path('tests/docs/test_v2_acceptance_gaps.py'),
          }
          for manifest, module in pairs.items():
              data = json.loads(manifest.read_text())
              data['module_node_hashes'][str(module)] = hashlib.sha256(module.read_bytes()).hexdigest()
              manifest.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
          python -m compileall -q \
            docmancer/docs/application/_docs_context_projection_core.py \
            docmancer/docs/application/_project_docs_service_part03.py \
            docmancer/docs/application/context_candidate_ranking.py \
            docmancer/docs/domain/context_windows.py \
            docmancer/docs/domain/documentation_query_plan.py \
            docmancer/docs/domain/project_retrieval_intent.py
          git diff --check
      - name: Commit final tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/query-planning-completion
          rm -f .github/workflows/query-planning-completion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: finish query-planning acceptance gaps'
          git push origin HEAD:fix/query-planning-scope
