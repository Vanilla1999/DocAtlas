name: Language strong GPT planner pilot
on:
  push:
    branches: [experiment/language-aware-context]
permissions:
  contents: read
env:
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"
  DOCATLAS_REGISTRY_API_URL: "http://127.0.0.1:1"
jobs:
  strong-planner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Frozen environment
        run: |
          python -m pip install uv==0.9.25
          uv sync --frozen --extra dev
      - name: Strong planner retrieval probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .venv/bin/python -m experiments.language_aware_context.strong_pilot_run --output "$RUNNER_TEMP/strong-pilot"
      - name: Preserve source and results
        if: always()
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/strong-pilot/source-head.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/strong-pilot/source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: strong-gpt-planner-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/strong-pilot/
          retention-days: 7
