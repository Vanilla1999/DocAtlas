name: Temporary PR192 hygiene apply
on:
  push:
    branches: [fix/pr192-ci-hygiene]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    env:
      DOCATLAS_OFFLINE: '1'
      DOCATLAS_AUTO_VECTORS: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/pr192-ci-hygiene
          fetch-depth: 30
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Apply exact locally verified cleanup
        run: python .tmp_pr192_apply_cleanup.py
      - name: Install test dependencies
        run: |
          python - <<'PY'
          import subprocess, sys, tomllib
          data = tomllib.load(open('pyproject.toml','rb'))
          deps = [x for x in data['project']['dependencies'] if not x.startswith(('tiktoken','fastembed'))]
          deps += data['project']['optional-dependencies']['dev']
          subprocess.run([sys.executable, '-m', 'pip', 'install', '-q', *deps], check=True)
          PY
      - name: Verify PR-specific regressions
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/docs/test_action_packet.py::test_bounded_direct_is_one_existing_tool_call_and_returns_only_action_packet \
            tests/docs/test_mcp_token_footprint.py::test_default_public_catalog_meets_task35_hard_and_target_budgets \
            tests/docs/test_agent_question_planning_contract.py \
            tests/docs/test_mcp_docs_tools_registration.py \
            tests/docs/test_evidence_admission_sufficiency.py
          python - <<'PY'
          from pathlib import Path
          from scripts.check_python_module_size import DEFAULT_MAX_LINES, oversized_modules
          offenders = {path.split('/')[-1]: lines for lines, path in oversized_modules(Path.cwd(), DEFAULT_MAX_LINES)}
          assert '_docs_context_projection_core.py' not in offenders, offenders
          assert 'model_visible_projection.py' not in offenders, offenders
          print('remaining base line-budget offenders:', offenders)
          from docmancer.docs.mcp_footprint import build_footprint_report, representative_response_fixtures
          from docmancer.mcp.docs_server import current_tools
          report = build_footprint_report(current_tools({}), representative_response_fixtures())
          print('mcp_tools_list_bytes=', report['mcp_tools_list_bytes'])
          print('get_docs_context_output_schema_bytes=', next(x for x in report['tools'] if x['name']=='get_docs_context')['output_schema_bytes'])
          PY
          python -m compileall -q docmancer
          git diff --check
      - name: Commit clean hygiene delta
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .tmp_pr192_apply_cleanup.py \
                .github/workflows/tmp-pr192-final-hygiene-validation.yml \
                .github/workflows/tmp-pr192-hygiene-export.yml \
                .github/workflows/tmp-pr192-pr-specific-cleanup.yml
          git add docmancer/templates/agent_contract.md \
                  docmancer/mcp/_docs_server_tool_data.py \
                  docmancer/mcp/_docs_server_shared.py \
                  docmancer/docs/application/context_candidate_ranking.py \
                  docmancer/docs/application/_docs_context_projection_core.py \
                  docmancer/docs/application/model_visible_projection.py \
                  .tmp_pr192_apply_cleanup.py \
                  .github/workflows/tmp-pr192-final-hygiene-validation.yml \
                  .github/workflows/tmp-pr192-hygiene-export.yml \
                  .github/workflows/tmp-pr192-pr-specific-cleanup.yml
          git commit -m 'fix: keep PR192 within repository budgets'
          git push origin HEAD:fix/pr192-ci-hygiene
