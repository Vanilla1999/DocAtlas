name: Evidence v2 Windows Git diagnostic
on:
  push:
    branches: [fix/evidence-quality-v2-20260910]
    paths: [.github/workflows/evidence-v2-windows-git-probe.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      DOCATLAS_OFFLINE: '1'
      DOCATLAS_AUTO_VECTORS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install reviewed source as wheel
        run: python -m pip install .
      - name: Compare inherited and closed Git stdin without publishing any fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys, os, json
          out = Path(os.environ['RUNNER_TEMP']) / 'git-diagnostic'
          out.mkdir()
          source = Path('scripts/docs_mcp_stdio_smoke.py').read_text()
          parent = "\n    from docmancer.docs.impact import git_worktree_state\n    print('PARENT_GIT_STATE', git_worktree_state(project), flush=True)\n"
          source = source.replace('\n\nasync def lifecycle_smoke', parent + '\n\nasync def lifecycle_smoke')
          summary = []
          for mode in ('inherited', 'devnull'):
              bootstrap = '''import sys, time, json, subprocess
          from docmancer.docs import impact
          original = impact._run_process_bounded
          popen = subprocess.Popen
          def process(*args, **kwargs):
              if CLOSE_STDIN and args and args[0][0] == 'git':
                  kwargs['stdin'] = subprocess.DEVNULL
              return popen(*args, **kwargs)
          subprocess.Popen = process
          def observed(command, **kwargs):
              start = time.monotonic()
              result = original(command, **kwargs)
              print('GIT_PROBE ' + json.dumps({'command': command, 'seconds': time.monotonic()-start, 'stdout': result[0].decode(errors='replace'), 'stderr': result[1].decode(errors='replace'), 'returncode': result[2], 'truncated': result[3], 'timed_out': result[4]}), file=sys.stderr, flush=True)
              return result
          impact._run_process_bounded = observed
          from docmancer.cli.__main__ import cli
          sys.argv = ['doc-atlas', 'mcp', 'docs-serve']
          cli()
          '''.replace('CLOSE_STDIN', repr(mode == 'devnull'))
              edited = source.replace('command="doc-atlas", args=["mcp", "docs-serve"]', 'command=sys.executable, args=["-c", ' + repr(bootstrap) + ']')
              target = out / (mode + '.py')
              target.write_text(edited, encoding='utf-8')
              with (out / (mode + '.log')).open('w', encoding='utf-8') as log:
                  result = subprocess.run([sys.executable, str(target)], stdout=log, stderr=subprocess.STDOUT, timeout=180)
              summary.append({'mode': mode, 'exit_code': result.returncode})
              for line in (out / (mode + '.log')).read_text(errors='replace').splitlines():
                  if 'GIT_PROBE' in line or 'PARENT_GIT_STATE' in line or 'AssertionError' in line or 'PASS' in line:
                      print(line)
          (out / 'summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-git-diagnostic
          path: ${{ runner.temp }}/git-diagnostic/
          retention-days: 14
