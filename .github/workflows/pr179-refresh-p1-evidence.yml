name: PR179 refresh P1 evidence

on:
  push:
    branches:
      - fix/context-first-project-reads-finalization
    paths:
      - .github/workflows/pr179-refresh-p1-evidence.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads-finalization
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install evaluator dependencies
        run: python -m pip install -e ".[dev]"
      - name: Regenerate and verify P1 evidence
        run: |
          set -euo pipefail
          python scripts/run_paraphrase_proofability_gate.py --write
          python scripts/run_mixed_evidence_provenance_gate.py --write
          python scripts/run_evidence_is_data_gate.py --write
          python scripts/run_p1_agent_truth_closure_gate.py --write

          expected=$(printf '%s\n' \
            eval/agent_developer_v1/results/evidence-is-data.json \
            eval/agent_developer_v1/results/mixed-evidence-provenance.json \
            eval/agent_developer_v1/results/p1-agent-truth-closure.json \
            eval/agent_developer_v1/results/paraphrase-proofability.json | sort)
          actual=$(git diff --name-only -- eval/agent_developer_v1/results | sort)
          test "$actual" = "$expected"

          python scripts/run_paraphrase_proofability_gate.py
          python scripts/paraphrase_proofability_self_test.py
          python scripts/run_mixed_evidence_provenance_gate.py
          python scripts/mixed_evidence_provenance_self_test.py
          python scripts/run_evidence_is_data_gate.py
          python scripts/evidence_is_data_self_test.py
          python scripts/run_p1_agent_truth_closure_gate.py
          python scripts/p1_agent_truth_closure_self_test.py
          git diff --check
      - name: Publish reviewed evidence refresh
        run: |
          set -euo pipefail
          rm .github/workflows/pr179-refresh-p1-evidence.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: refresh P1 evidence after ownership fix"
          git push origin HEAD:fix/context-first-project-reads-finalization
