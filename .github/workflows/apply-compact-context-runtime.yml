name: Apply compact-context runtime patch

on:
  push:
    branches:
      - fix/compact-context-quality
    paths:
      - .github/docatlas-runtime.patch.gz
      - .github/workflows/apply-compact-context-runtime.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0
      - name: Decode and verify patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip, hashlib
          source = Path('.github/docatlas-runtime.patch.gz').read_bytes()
          patch = gzip.decompress(source)
          expected = 'dee1364d56bc761ecfbcbc56aa6344316bfe0306b9d6e59a14f6fb70d80ea758'
          actual = hashlib.sha256(patch).hexdigest()
          if actual != expected:
              raise SystemExit(f'patch sha mismatch: {actual}')
          Path('/tmp/docatlas-runtime.patch').write_bytes(patch)
          PY
          git apply --check /tmp/docatlas-runtime.patch
      - name: Apply verified runtime patch
        shell: bash
        run: |
          git apply /tmp/docatlas-runtime.patch
          rm -f .github/docatlas-runtime.patch.gz
          rm -f .github/workflows/apply-compact-context-runtime.yml
          python -m compileall -q docmancer eval
          git diff --check
      - name: Commit applied patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve compact context evidence under budget'
          git push origin HEAD:fix/compact-context-quality
