name: PR191 N16 first-loss diagnostic

on:
  push:
    branches: [fix/query-planning-scope]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/query-planning-scope
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install dependencies except tiktoken
        run: |
          python - <<'PY'
          import subprocess,sys,tomllib
          d=tomllib.loads(open('pyproject.toml','rb').read().decode())
          deps=[x for x in d['project']['dependencies'] if not x.lower().startswith('tiktoken')]+d['project']['optional-dependencies']['dev']
          subprocess.check_call([sys.executable,'-m','pip','install','-q',*deps])
          PY
      - name: Apply chain candidate fix in diagnostic workspace
        run: python .github/pr191_chain_tdd.py fix
      - name: Trace project-docs result, context pack, and public output
        run: |
          python - <<'PY'
          import os,tempfile
          from pathlib import Path
          from docmancer.agent import DocmancerAgent
          from docmancer.core.config import DocmancerConfig
          from docmancer.docs.application.docs_job_service import DocsJobTracker
          from docmancer.docs.application.evidence_requirements import build_requirements
          from docmancer.docs.application._project_context_service_shared import project_context_pack
          from docmancer.docs.registry import LibraryRegistry
          from docmancer.docs.service import LibraryDocsService
          from docmancer.mcp.docs_server import call_docs_tool_payload

          q='Что должен сделать агент, если get_docs_context вернул недостаточно доказательств для ответа по документации проекта?'
          root=Path('.').resolve()
          with tempfile.TemporaryDirectory() as td:
              os.environ['DOCATLAS_HOME']=td
              c=DocmancerConfig(); c.index.db_path=str(Path(td)/'db.sqlite'); c.index.extracted_dir=str(Path(td)/'extracted')
              svc=LibraryDocsService(config=c,config_source='explicit',registry=LibraryRegistry(c.index.db_path),agent=DocmancerAgent(config=c),job_tracker=DocsJobTracker())
              assert svc.sync_project_docs(str(root),with_vectors=False).status=='success'
              req=build_requirements(q,profile='project_docs_answer')
              result=svc.get_project_docs(str(root),q,tokens=800,limit=3,scope='project',requirements=req)
              print('PROJECT_DOCS_STATUS',result.status,'COUNT',len(result.results))
              for i,item in enumerate(result.results):
                  m=item.metadata or {}
                  print('RESULT',i,'path=',item.path,'len=',len(item.content),'tail=',repr(item.content[-180:]))
                  print(' META span=',m.get('char_span'),'atom=',m.get('atom_id'),'stable=',m.get('stable_chunk_id'),'reassembled=',m.get('reassembled_from_stable_chunk_ids'),'qids=',m.get('retrieval_query_ids'))
              pack=project_context_pack(question=q,project_docs=result,dependency_docs=None)
              print('PACK_COUNT',len(pack))
              for i,item in enumerate(pack):
                  print('PACK',i,'path=',item.get('path'),'content_len=',len(str(item.get('content') or '')),'snippet_len=',len(str(item.get('snippet') or '')),'surround_len=',len(str(item.get('surrounding_context') or '')))
                  print(' CONTENT_TAIL',repr(str(item.get('content') or '')[-180:]))
                  print(' SNIPPET',repr(item.get('snippet')))
              p=call_docs_tool_payload('get_docs_context',{'question':q,'project_path':str(root),'scope':'all'},svc)
              print('PUBLIC tokens=',p.get('estimated_tokens'),'quality=',p.get('context_quality'))
              for i,s in enumerate(p.get('sources') or []):
                  print('PUBLIC',i,s.get('path_or_url'),'len=',len(str(s.get('snippet') or '')),'tail=',repr(str(s.get('snippet') or '')[-180:]))
          PY
