name: PR191 N16 first-loss diagnostic

on:
  push:
    branches: [fix/query-planning-scope]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/query-planning-scope
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install dependencies except tiktoken
        run: |
          python - <<'PY'
          import subprocess,sys,tomllib
          d=tomllib.loads(open('pyproject.toml','rb').read().decode())
          deps=[x for x in d['project']['dependencies'] if not x.lower().startswith('tiktoken')]+d['project']['optional-dependencies']['dev']
          subprocess.check_call([sys.executable,'-m','pip','install','-q',*deps])
          PY
      - name: Trace canonical retrieval lane
        run: |
          python - <<'PY'
          import os,tempfile
          from pathlib import Path
          from docmancer.agent import DocmancerAgent
          from docmancer.core.config import DocmancerConfig
          from docmancer.docs.application.docs_job_service import DocsJobTracker
          from docmancer.docs.domain.lifecycle_policy import lifecycle_filters_for_intent
          from docmancer.docs.registry import LibraryRegistry
          from docmancer.docs.service import LibraryDocsService

          q='insufficient_evidence documentation support workflow'
          root=Path('.').resolve()
          with tempfile.TemporaryDirectory() as td:
              os.environ['DOCATLAS_HOME']=td
              c=DocmancerConfig(); c.index.db_path=str(Path(td)/'db.sqlite'); c.index.extracted_dir=str(Path(td)/'extracted')
              agent=DocmancerAgent(config=c)
              svc=LibraryDocsService(config=c,config_source='explicit',registry=LibraryRegistry(c.index.db_path),agent=agent,job_tracker=DocsJobTracker())
              assert svc.sync_project_docs(str(root),with_vectors=False).status=='success'
              identity=svc.project_docs._repository_identity(root)
              filters={'project_path':str(root),'project_identity':identity,'source_class':'project_file',**lifecycle_filters_for_intent('current')}
              print('IDENTITY',identity)
              for expand in ('none','adjacent','page'):
                  rows=agent.query(q,limit=4,budget=800,expand=expand,filters=filters)
                  print('\nEXPAND',expand,'COUNT',len(rows))
                  for i,row in enumerate(rows):
                      m=row.metadata or {}
                      print('ROW',i,'src=',row.source,'idx=',row.chunk_index,'score=',row.score,'len=',len(row.text),'span=',m.get('char_span'),'atom=',m.get('atom_id'),'stable=',m.get('stable_chunk_id'))
                      if 'AGENT_DOCS_WORKFLOW' in str(m.get('project_doc_path') or row.source):
                          print(' AGENT_TEXT',repr(row.text))
              # Show all indexed sections for this source directly, without a new semantic query.
              stored=agent.store.search_sections(filters={'project_identity':identity,'project_doc_path':'docs/AGENT_DOCS_WORKFLOW.md'},limit=100)
              print('\nSTORED',len(stored))
              for i,row in enumerate(stored):
                  m=row.metadata or {}
                  if m.get('atom_id')=='atom-20d714bdb28eff58e1957d8e919b3956' or (m.get('char_span') and 900 <= m['char_span'][0] <= 2600):
                      print('STORED_ROW',i,'idx=',row.chunk_index,'len=',len(row.text),'span=',m.get('char_span'),'atom=',m.get('atom_id'),'stable=',m.get('stable_chunk_id'),'text=',repr(row.text))
          PY
