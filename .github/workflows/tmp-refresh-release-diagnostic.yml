name: TEMP refresh release diagnostic hash

on:
  push:
    branches: ["p0/release-1.3.0"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Refresh reviewed node inventory hash and remove materializer
        run: |
          python - <<'PY'
          import ast
          import hashlib
          import json
          from pathlib import Path

          module = "tests/test_release_gate.py"
          source = Path(module).read_text(encoding="utf-8")
          tree = ast.parse(source, filename=module)
          nodeids = sorted(
              f"{module}::{node.name}"
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and node.name.startswith("test_")
          )
          if not nodeids:
              raise SystemExit("no release-gate tests found")
          digest = hashlib.sha256("\n".join(nodeids).encode()).hexdigest()
          expected = "dce84035996d7a074bea07f6def387cdc2081e8fcc2b94ed7b0e0c72f5ed8d19"
          if digest != expected:
              raise SystemExit(f"unexpected reviewed release-gate inventory digest: {digest}")

          manifest_path = Path("tests/diagnostic_labels.json")
          text = manifest_path.read_text(encoding="utf-8")
          manifest = json.loads(text)
          if manifest["module_labels"].get(module) != "behavioral":
              raise SystemExit("release-gate module diagnostic classification changed")
          old_digest = manifest["module_node_hashes"].get(module)
          if not isinstance(old_digest, str) or len(old_digest) != 64:
              raise SystemExit(f"invalid prior diagnostic hash: {old_digest!r}")
          old_line = f'    "{module}": "{old_digest}"'
          new_line = f'    "{module}": "{digest}"'
          if text.count(old_line) != 1:
              raise SystemExit("could not identify exactly one manifest hash line")
          manifest_path.write_text(text.replace(old_line, new_line, 1), encoding="utf-8")

          Path(".github/workflows/tmp-refresh-release-diagnostic.yml").unlink()
          print(f"{module}: {old_digest} -> {digest}")
          print("\n".join(nodeids))
          PY
          git diff --check
          git diff -- tests/diagnostic_labels.json
      - name: Commit only the reviewed manifest refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/diagnostic_labels.json .github/workflows/tmp-refresh-release-diagnostic.yml
          git commit -m "Refresh release gate diagnostic inventory"
          git push origin HEAD:p0/release-1.3.0
