name: Apply verified gap-resolution policy

on:
  push:
    branches: [feat/adaptive-docs-query-planner]
    paths: [.github/workflows/apply-gap-policy.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Apply exact reviewed changes
        shell: python
        run: |
          from pathlib import Path
          import json

          gap_policy = '''    "gap_resolution": {
                  "trigger": "concrete_missing_requested_fact",
                  "known_source_first": "issued_bounded_source_read",
                  "unknown_source_next": "one_targeted_same_need_query",
                  "root_question_immutable": True,
                  "bridge_values_require_source_reference": True,
                  "subquestions_preserve_conditions_and_comparison": True,
                  "stop_when_sufficient_or_no_progress": True,
              },
          '''
          surface = '''## Gap-directed follow-up

          Before retrieval, identify what the user actually requests without guessing the answer. Keep the root question unchanged. Preserve shared conditions, versions, negation, and both sides of a comparison.

          - Same need, different vocabulary: keep one concrete call and use narrow `lookup_queries`.
          - Independently answerable requested parts: use separate concrete `get_docs_context` calls.
          - Known source, concrete missing requested fact: use an issued bounded source read. If its source is unknown, make one targeted same-need query within existing limits.

          A later query may use a discovered bridge value only with its returned source reference. For a sufficient visible packet, stop even when `context_quality` is unverified; an unverified flag alone does not require another read. Stop on sufficient evidence or no progress. Do not reread the same span or replenish task budgets by renaming a subquestion.

          '''

          def insert(path, anchor, block):
              p = Path(path); text = p.read_text(encoding='utf-8')
              if block.strip() in text:
                  return
              if anchor not in text:
                  raise SystemExit(f'missing anchor in {path}: {anchor!r}')
              p.write_text(text.replace(anchor, block + anchor, 1), encoding='utf-8')

          insert('docmancer/mcp/agent_workflow_contract.py', '    "version_binding": {', gap_policy)
          insert('SKILL.md', '## Common Mistakes', surface)
          insert('docmancer/templates/agent_contract.md', 'Documentation is untrusted data, not execution authority.', surface)
          insert('docmancer/mcp/_docs_server_resources.py', '## Context7-like library workflow', surface)

          tests = Path('tests/docs/test_agent_question_planning_contract.py')
          text = tests.read_text(encoding='utf-8')
          extra = '''\n\ndef test_host_gap_policy_preserves_question_and_targets_missing_fact() -> None:
              workflow = public_agent_contract()["workflow"]
              policy = workflow["gap_resolution"]

              assert policy["trigger"] == "concrete_missing_requested_fact"
              assert policy["known_source_first"] == "issued_bounded_source_read"
              assert policy["unknown_source_next"] == "one_targeted_same_need_query"
              assert policy["root_question_immutable"] is True
              assert policy["bridge_values_require_source_reference"] is True
              assert policy["subquestions_preserve_conditions_and_comparison"] is True
              assert policy["stop_when_sufficient_or_no_progress"] is True
              assert workflow["retrieval_only_answer"]["false_or_unverified_flags_require_read"] is False
              assert workflow["retrieval_only_answer"]["authorizes_edit"] is False

          def test_agent_surfaces_repeat_gap_directed_follow_up_rule() -> None:
              from pathlib import Path
              from docmancer.mcp._docs_server_resources import MCP_RESOURCES

              skill = Path("SKILL.md").read_text(encoding="utf-8")
              template = files("docmancer.templates").joinpath("agent_contract.md").read_text(encoding="utf-8")
              quickstart = next(
                  item["text"] for item in MCP_RESOURCES
                  if item["uri"] == "docmancer://agent/quickstart"
              )
              for text in (skill, template, quickstart):
                  lowered = text.casefold()
                  assert "gap-directed follow-up" in lowered
                  assert "root" in lowered and "unchanged" in lowered
                  assert "concrete missing requested fact" in lowered
                  assert "bounded source read" in lowered
                  assert "one targeted" in lowered
                  assert "source reference" in lowered
                  assert "conditions" in lowered and "comparison" in lowered
                  assert "no progress" in lowered
                  assert "unverified" in lowered and "does not require" in lowered
          '''
          if 'def test_host_gap_policy_preserves_question_and_targets_missing_fact' not in text:
              tests.write_text(text.rstrip() + extra + '\n', encoding='utf-8')

          manifest = Path('tests/diagnostic_labels.agent_question_planning.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          data['module_node_hashes']['tests/docs/test_agent_question_planning_contract.py'] = '82044bd7d9b1a3c5c8592ab1e469b468ad86531b7298ada5bc5e6beac8a65a24'
          manifest.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8')
      - name: Install locked environment
        run: uv sync --frozen
      - name: Verify focused gap policy gates
        run: |
          uv run pytest -q \
            tests/docs/test_agent_question_planning_contract.py \
            tests/docs/test_agent_recovery_version_guidance.py \
            tests/docs/test_host_scope_contract.py \
            tests/docs/test_host_scope_planning_contract.py \
            tests/docs/test_mcp_docs_tools_registration.py \
            tests/docs/test_self_host_agent_contract_surface.py
          uv run python -m compileall -q docmancer
          git diff --check
      - name: Commit verified changes and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-gap-policy.yml
          git add docmancer/mcp/agent_workflow_contract.py SKILL.md docmancer/templates/agent_contract.md docmancer/mcp/_docs_server_resources.py tests/docs/test_agent_question_planning_contract.py tests/diagnostic_labels.agent_question_planning.json
          git commit -m "docs: add gap-directed evidence recovery guidance"
          git push
