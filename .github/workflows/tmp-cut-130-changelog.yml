name: TEMP cut 1.3.0 changelog

on:
  push:
    branches: ["p0/release-1.3.0"]

permissions:
  contents: write

jobs:
  cut-changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Cut 1.3.0 release notes and remove materializer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          marker = "## [Unreleased]\n\n### Added\n"
          if text.count(marker) != 1:
              raise SystemExit("unexpected Unreleased changelog shape")

          release = """## [Unreleased]\n\n## [1.3.0] - 2026-08-21\n\n### Added\n\n- **DocAtlas-owned state and integrations:** fresh installs use `DOCATLAS_HOME` / `~/.docatlas`, `docatlas.yaml`, the `docatlas` MCP registration and skill identity; legacy `docmancer` state is compatibility-only, ownership-checked, and never implicitly overwritten.\n- **Preview-first home migration:** `doc-atlas migrate-home` previews a hash-bound copy plan, requires the reviewed digest to apply, preserves source state, and fails closed on foreign, ambiguous, symlinked, stale, or tampered state.\n- **Runtime-derived agent workflow contract:** the installed three-tool Docs MCP contract (`get_docs_context`, `prepare_docs`, `docs_status`) is fingerprinted from the advertised runtime ToolSpecs so guidance/schema drift is detectable.\n"""
          text = text.replace(marker, release, 1)

          changed_marker = "### Changed\n\n"
          changed_index = text.find(changed_marker, text.index("## [1.3.0]"))
          if changed_index < 0:
              raise SystemExit("missing 1.3.0 Changed section")
          insert_at = changed_index + len(changed_marker)
          release_truth = (
              "- **Public release truth:** keep the distribution at Beta, publish only through the OIDC/Trusted Publishing release environment, verify exact public wheel/sdist SHA-256 identity, and rerun the exact public three-tool MCP smoke on Linux, macOS, and Windows.\n"
          )
          text = text[:insert_at] + release_truth + text[insert_at:]

          old_mcp = "- **MCP SDK floor:** require `mcp>=1.27.2`, matching the structured tool output and output-schema transport used by bounded delivery."
          new_mcp = "- **MCP SDK maintenance line:** require `mcp>=1.28,<2` for the maintained v1 SDK line used by the public Docs MCP transport."
          if old_mcp not in text:
              raise SystemExit("expected pre-release MCP SDK changelog line not found")
          text = text.replace(old_mcp, new_mcp, 1)

          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/tmp-cut-130-changelog.yml").unlink()
          PY
          git diff --check
          git diff -- CHANGELOG.md
      - name: Commit semantic release cut only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .github/workflows/tmp-cut-130-changelog.yml
          git commit -m "Cut DocAtlas 1.3.0 changelog"
          git push origin HEAD:p0/release-1.3.0
