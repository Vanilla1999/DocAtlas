name: TEMP reflect measured P1 outcomes in closure

on:
  push:
    branches: [p1/p1-agent-truth-closure]
    paths:
      - .github/workflows/temp-p1-closure-reflect-measured-outcomes.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: p1/p1-agent-truth-closure
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Bind closure rows to measured P1.4/P1.5 decisions
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("eval/agent_developer_v1/p1_closure.py")
          text = path.read_text(encoding="utf-8")
          old_p14 = '''            "evidence_status": "green_provider_free",
                      "facts": p14["summary"],
                      "decision": "Candidate discovery is measured separately from support; negative false support remains zero.",
          '''
          new_p14 = '''            "evidence_status": (
                          "provider_free_measured_"
                          + str(p14["decision"]["core_exact_proofability"])
                      ),
                      "facts": p14["summary"],
                      "decision": (
                          "Candidate discovery is measured separately from support; "
                          "core_exact_proofability="
                          + str(p14["decision"]["core_exact_proofability"])
                          + "; negative false support remains zero."
                      ),
          '''
          if old_p14 in text:
              text = text.replace(old_p14, new_p14, 1)
          elif "core_exact_proofability=" not in text:
              raise SystemExit("P1.4 closure row anchor missing")

          old_p15 = '''            "evidence_status": "green_provider_free",
                      "facts": p15["summary"],
                      "decision": "Protected claims are assigned only to allowed source roles under conflict.",
          '''
          new_p15 = '''            "evidence_status": (
                          "provider_free_measured_"
                          + str(p15["decision"]["claim_local_provenance"])
                      ),
                      "facts": p15["summary"],
                      "decision": (
                          "claim_local_provenance="
                          + str(p15["decision"]["claim_local_provenance"])
                          + "; all mismatches/advisory assignments remain visible."
                      ),
          '''
          if old_p15 in text:
              text = text.replace(old_p15, new_p15, 1)
          elif "claim_local_provenance=" not in text:
              raise SystemExit("P1.5 closure row anchor missing")
          path.write_text(text, encoding="utf-8")

          docs = Path("docs/p1-agent-truth-scorecard.md")
          docs_text = docs.read_text(encoding="utf-8")
          docs_text = docs_text.replace(
              "| P1.4 Paraphrase/proofability | closed | candidate discovery and final support measured separately; negative false support zero | provider-free robustness evidence accepted |",
              "| P1.4 Paraphrase/proofability | closed | candidate discovery and final support measured separately; gaps retained explicitly; negative false support zero | measured accepted/rejected result is authoritative |",
          )
          docs_text = docs_text.replace(
              "| P1.5 Mixed provenance | closed | protected claims assigned only to allowed roles under conflict | claim-local provenance accepted |",
              "| P1.5 Mixed provenance | closed | support/assignment mismatches and advisory assignments retained explicitly | measured accepted/rejected provenance result is authoritative |",
          )
          docs.write_text(docs_text, encoding="utf-8")
          PY
          rm .github/workflows/temp-p1-closure-reflect-measured-outcomes.yml
          python -m compileall -q eval/agent_developer_v1/p1_closure.py
          git diff --check
      - name: Commit ordinary closure sources only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(p1): carry measured robustness outcomes into closure"
          git push origin HEAD:p1/p1-agent-truth-closure
