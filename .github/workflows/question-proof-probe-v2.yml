name: Question Proof Probe V2

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/question_proof_probe_v2.py
      - .github/workflows/question-proof-probe-v2.yml

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCMANCER_OFFLINE: "1"

jobs:
  proof-probe-v2:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install DocAtlas
        run: pip install -e .
      - name: Run corrected semantic local-proof probes
        run: python scripts/question_proof_probe_v2.py
      - name: Upload proof probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: question-proof-probe-v2-results
          path: question-proof-probe-v2-results.json
          if-no-files-found: warn
