name: TEMP fix command-driver schema repair

on:
  push:
    branches: [p1/installed-mcp-live-harness]
    paths:
      - .github/workflows/temp-fix-command-driver-schema-repair.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: p1/installed-mcp-live-harness
          fetch-depth: 0

      - name: Make the repair control unambiguously schema-invalid
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("eval/installed_mcp_agent_v1/provider_free_command_driver.py")
          text = path.read_text(encoding="utf-8")
          old = '''        # Deliberately omit project_path so the real installed schema rejects
        # the call and the harness proves one bounded repair.
        response = {
            **metadata,
            "type": "tool_call",
            "name": "get_docs_context",
            "arguments": {"question": case["question"], "mode": case["mode"]},
        }
'''
          new = '''        # Deliberately omit the required question so the real installed schema
        # rejects the call and the harness proves one bounded repair.
        response = {
            **metadata,
            "type": "tool_call",
            "name": "get_docs_context",
            "arguments": {"project_path": project_path, "mode": case["mode"]},
        }
'''
          if text.count(old) != 1:
              raise SystemExit("expected command-driver repair block not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/temp-fix-command-driver-schema-repair.yml
          python -m py_compile eval/installed_mcp_agent_v1/provider_free_command_driver.py
          git diff --check

      - name: Commit the deterministic schema-repair control
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          changed="$(git diff --cached --name-only)"
          test "$changed" = "eval/installed_mcp_agent_v1/provider_free_command_driver.py"
          git commit -m "test(p1): make the command repair schema-invalid"
          git push origin HEAD:p1/installed-mcp-live-harness
