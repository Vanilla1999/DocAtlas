name: PR192 apply verified TDD fix

on:
  push:
    branches:
      - fix/version-evidence-skill-validation

permissions:
  contents: write

env:
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python - <<'PY'
          import subprocess, sys, tomllib
          data = tomllib.load(open('pyproject.toml','rb'))
          deps = [x for x in data['project']['dependencies'] if not x.startswith(('tiktoken','fastembed'))]
          deps += data['project']['optional-dependencies']['dev']
          subprocess.run([sys.executable, '-m', 'pip', 'install', '-q', *deps], check=True)
          PY
      - name: Apply exact reviewed patch
        run: |
          cat .github/pr192_patch_part1.diff .github/pr192_patch_part2.diff > /tmp/pr192.diff
          git apply --check /tmp/pr192.diff
          git apply /tmp/pr192.diff
      - name: Verify targeted TDD gates
        run: |
          python -m pytest -q tests/docs/test_evidence_admission_sufficiency.py
          python -m pytest -q \
            tests/docs/test_dependency_version_transition.py \
            tests/docs/test_agent_recovery_version_guidance.py \
            tests/docs/test_agent_question_planning_contract.py \
            tests/docs/test_mcp_token_footprint.py
          python -m compileall -q docmancer eval scripts tests
      - name: Commit verified result and self-cleanup
        run: |
          git rm .github/pr192_patch_part1.diff .github/pr192_patch_part2.diff .github/workflows/pr192-apply-verified-fix.yml
          git add \
            docmancer/docs/application/_docs_context_projection_core.py \
            docmancer/docs/application/context_candidate_ranking.py \
            docmancer/docs/application/docs_context_projection.py \
            docmancer/docs/domain/evidence_qualification.py \
            tests/docs/test_evidence_admission_sufficiency.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: close PR192 review regressions'
          git push origin HEAD:fix/version-evidence-skill-validation
