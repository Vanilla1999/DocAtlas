name: Scientific validation40 reader view
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths:
      - .github/workflows/scientific-validation40-reader.yml

permissions:
  contents: read
  actions: read

jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      OLLAMA_NUM_PARALLEL: '4'
    steps:
      - name: Checkout frozen validation definitions and reader-view code
        uses: actions/checkout@v4
      - name: Checkout frozen structural candidate runtime
        uses: actions/checkout@v4
        with:
          ref: e5e1bec980caa1b66758f655940d519f0ba2fa04
          path: candidate-runtime
      - name: Download frozen validation sources
        uses: actions/download-artifact@v4
        with:
          name: scientific-validation40-frozen-sources
          path: ${{ runner.temp }}/validation-sources
          run-id: 35442584246
          github-token: ${{ github.token }}
      - uses: astral-sh/setup-uv@v6
      - name: Verify protocol and sync runtimes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object eval/scientific_validation40/questions.json)" = "6802f6d56bafad51475787320d574ada218560c8"
          test "$(git hash-object eval/scientific_validation40/gold_spans.json)" = "a34c451430f2390201b9dfd3845074c0c6b45619"
          test "$(sha256sum "$RUNNER_TEMP/validation-sources/manifest.json" | awk '{print $1}')" = "f92d5fcea6cfcb4a8e95f8711b8ccfb40d7cd521b85e14e61d8747e5829d5f3f"
          uv sync --frozen --extra dev
          (cd candidate-runtime && uv sync --frozen --extra dev)
      - name: Capture candidate packets once
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/capture_validation40.py" <<'PY'
          from __future__ import annotations
          import argparse, hashlib, json
          from pathlib import Path
          ap=argparse.ArgumentParser(); ap.add_argument('--questions',type=Path,required=True); ap.add_argument('--source-artifact',type=Path,required=True); ap.add_argument('--workspace',type=Path,required=True); ap.add_argument('--out',type=Path,required=True); a=ap.parse_args()
          from eval.evidence_quality_v2.runtime import write_project, isolated_service, index_project
          from eval.project_context_quality.capture_public_context import capture_public_call
          questions=json.loads(a.questions.read_text())['cases']; manifest=json.loads((a.source_artifact/'manifest.json').read_text()); groups={}
          for row in manifest['sources']: groups.setdefault(row['family'],[]).append(row)
          rows=[]
          for family in sorted(groups):
              docs={}
              for row in groups[family]:
                  p=a.source_artifact/'sources'/family/row['path']; data=p.read_bytes(); assert hashlib.sha256(data).hexdigest()==row['sha256']; docs[row['path']]=data.decode()
              project=a.workspace/'corpus'/family; write_project(project,docs)
              with isolated_service(a.workspace/'state'/family) as (service,config):
                  ingest=index_project(service,config,project); assert not ingest['excluded_or_failed_paths']
                  for c in [x for x in questions if x['project_group']==family]:
                      payload=capture_public_call(service,{'project_path':str(project),'scope':'all','question':c['question']})['public_payload']
                      rows.append({'id':c['id'],'project_group':family,'answerability':c['answerability'],'question':c['question'],'public_payload':payload})
          a.out.write_text(json.dumps({'cases':rows},indent=2,ensure_ascii=False))
          PY
          cd candidate-runtime
          PYTHONPATH="$PWD" uv run --frozen --extra dev python "$RUNNER_TEMP/capture_validation40.py" \
            --questions "$GITHUB_WORKSPACE/eval/scientific_validation40/questions.json" \
            --source-artifact "$RUNNER_TEMP/validation-sources" \
            --workspace "$RUNNER_TEMP/candidate-reader" \
            --out "$RUNNER_TEMP/validation40-packets.json"
      - name: Install exact stress reader
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull qwen2.5:1.5b
      - name: Verify model identity and run frozen A vs selected C
        shell: bash
        run: |
          PYTHONPATH="$PWD" uv run --frozen --extra dev python - <<'PY'
          import concurrent.futures, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          from eval.evidence_quality_v2.reader_experiment import make_reader_record
          from eval.evidence_quality_v2.reader_views import render_reader_view

          root=Path.cwd(); tmp=Path(os.environ['RUNNER_TEMP'])
          packets=json.loads((tmp/'validation40-packets.json').read_text())['cases']
          system='Answer the QUESTION using only the CONTEXT. If the CONTEXT does not support the answer, reply exactly INSUFFICIENT_CONTEXT. Be concise and do not use prior knowledge.'
          def post(path,body):
              req=urllib.request.Request('http://127.0.0.1:11434'+path,data=json.dumps(body).encode(),headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=180) as r:return json.loads(r.read())
          with urllib.request.urlopen('http://127.0.0.1:11434/api/tags',timeout=120) as r:tags=json.loads(r.read())
          model=next(x for x in tags['models'] if x['name'].startswith('qwen2.5:1.5b')); show=post('/api/show',{'model':'qwen2.5:1.5b'})
          identity={'model':'qwen2.5:1.5b','model_digest':model['digest'],'runtime_version':subprocess.run(['ollama','--version'],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,check=True).stdout.strip(),'chat_template_digest':'sha256:'+hashlib.sha256(str(show.get('template') or '').encode()).hexdigest(),'quantization_level':(show.get('details') or {}).get('quantization_level'),'family':(show.get('details') or {}).get('family')}
          assert identity['model_digest']=='65ec06548149b04c096a120e4a6da9d4017ea809c91734ea5631e89f96ddc57b', identity
          assert identity['quantization_level']=='Q4_K_M', identity
          arms=('raw_json','view_text'); jobs=[]
          for case_index,row in enumerate(packets):
              for draw in range(3):
                  order=arms if (case_index+draw)%2==0 else tuple(reversed(arms))
                  for arm_order,arm in enumerate(order): jobs.append((case_index,draw,arm_order,row,arm))
          def invoke(job):
              case_index,draw,arm_order,row,arm=job
              rendered=render_reader_view(row['public_payload'],mode=arm)
              user='QUESTION:\n'+row['question']+'\n\nCONTEXT:\n'+rendered
              body={'model':'qwen2.5:1.5b','stream':False,'messages':[{'role':'system','content':system},{'role':'user','content':user}],'options':{'temperature':0,'seed':0,'num_predict':160}}
              provider=post('/api/chat',body)
              rec=make_reader_record(case_id=row['id'],arm=arm,draw=draw,system_prompt=system,question=row['question'],rendered_context=rendered,model_identity=identity,provider_response=provider)
              rec.update({'case_index':case_index,'arm_order_index':arm_order,'project_group':row['project_group'],'answerability':row['answerability'],'question':row['question'],'packet_sha256':hashlib.sha256(json.dumps(row['public_payload'],ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()})
              return rec
          records=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
              for rec in ex.map(invoke,jobs): records.append(rec); print(rec['case_id'],rec['arm'],rec['draw'],repr(rec['provider_response']['message']['content'][:100]),flush=True)
          records.sort(key=lambda x:(x['case_index'],x['draw'],arms.index(x['arm'])))
          assert len(records)==40*3*2 and all('reused_from' not in r for r in records)
          (tmp/'validation40-reader.json').write_text(json.dumps({'schema_version':1,'model_identity':identity,'arms':list(arms),'draws_per_arm_case':3,'records':records},indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientific-validation40-reader
          path: |
            ${{ runner.temp }}/validation40-packets.json
            ${{ runner.temp }}/validation40-reader.json
            ${{ runner.temp }}/ollama.log
