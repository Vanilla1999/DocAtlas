name: PR194 final question gate
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths: [.github/workflows/pr194-final-question-gate.yml]

permissions:
  contents: read

jobs:
  questions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout current candidate
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout pre-review structural candidate
        uses: actions/checkout@v4
        with:
          ref: f111304579299ca1d9e7811c4e46dac8a17ec005
          path: structural-reference
      - name: Checkout Generic30 accepted reference
        uses: actions/checkout@v4
        with:
          ref: 8cecc0e1355376699bd18d8eb7a720cff6868be0
          path: generic-reference
      - name: Checkout frozen Generic30 corpus
        uses: actions/checkout@v4
        with:
          ref: 95e61265656283d609bc1328c46c52b2bf1a069e
          path: frozen-corpus
      - uses: astral-sh/setup-uv@v6

      - name: Sync runtimes
        shell: bash
        run: |
          set -euo pipefail
          (cd candidate && uv sync --frozen --extra dev)
          (cd structural-reference && uv sync --frozen --extra dev)
          (cd generic-reference && uv sync --frozen --extra dev)

      - name: Deterministic plan gate
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          uv run --frozen --extra dev pytest \
            tests/evidence_quality_v2 \
            tests/docs/test_structural_item_integrity.py \
            tests/docs/test_structural_behavior_matrix.py \
            tests/docs/test_compact_context_blocks.py \
            tests/docs/test_list_item_continuation_bridge.py \
            tests/docs/test_context_span_growth.py \
            tests/docs/test_source_continuation.py \
            tests/docs/test_context_capture_integrity.py -q \
            | tee "$RUNNER_TEMP/deterministic.log"
          uv run --frozen --extra dev python -m compileall -q docmancer eval/evidence_quality_v2

      - name: Targeted V13/V15 30 — reference capture
        shell: bash
        run: |
          set -euo pipefail
          cd structural-reference
          PYTHONPATH="$PWD" uv run --frozen --extra dev python scripts/run_v13_v15_diagnostic30.py \
            --project-root "$GITHUB_WORKSPACE/structural-reference" \
            --questions "$GITHUB_WORKSPACE/candidate/eval/project_context_quality/v13_v15_questions.json" \
            --output "$RUNNER_TEMP/target30-reference.json"

      - name: Targeted V13/V15 30 — current capture
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          PYTHONPATH="$PWD" uv run --frozen --extra dev python scripts/run_v13_v15_diagnostic30.py \
            --project-root "$GITHUB_WORKSPACE/structural-reference" \
            --questions "$GITHUB_WORKSPACE/candidate/eval/project_context_quality/v13_v15_questions.json" \
            --output "$RUNNER_TEMP/target30-current.json"

      - name: Create Generic30 runner
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/run_generic30.py" <<'PY'
          from __future__ import annotations
          import argparse, json, os
          from pathlib import Path

          p=argparse.ArgumentParser()
          p.add_argument("--project-root",type=Path,required=True)
          p.add_argument("--questions",type=Path,required=True)
          p.add_argument("--output",type=Path,required=True)
          a=p.parse_args()

          os.environ["DOCATLAS_OFFLINE"]="1"
          os.environ["DOCATLAS_AUTO_VECTORS"]="0"
          os.environ["DOCATLAS_HOME"]=str(a.output.parent/(a.output.stem+"-home"))

          from docmancer.agent import DocmancerAgent
          from docmancer.core.config import DocmancerConfig
          from docmancer.docs.registry import LibraryRegistry
          from docmancer.docs.service import DocsJobTracker, LibraryDocsService
          from eval.project_context_quality.capture_public_context import capture_public_call

          cfg=DocmancerConfig()
          cfg.index.db_path=str(a.output.parent/(a.output.stem+".sqlite"))
          cfg.index.extracted_dir=str(a.output.parent/(a.output.stem+"-extracted"))
          service=LibraryDocsService(
              config=cfg,config_source="explicit",registry=LibraryRegistry(cfg.index.db_path),
              agent=DocmancerAgent(config=cfg),job_tracker=DocsJobTracker(),
          )
          sync=service.sync_project_docs(str(a.project_root.resolve()),with_vectors=False)
          if sync.status!="success":
              raise RuntimeError(f"sync failed: {sync.status}")
          cases=json.loads(a.questions.read_text())["cases"]
          rows=[]
          for case in cases:
              for lane in ("root_only","with_lookups"):
                  req={"project_path":str(a.project_root.resolve()),"scope":"project","question":case["question"]}
                  if lane=="with_lookups":
                      req["lookup_queries"]=list(case.get("lookup_queries") or ())
                  cap=capture_public_call(service,req)
                  rows.append({"id":case["id"],"lane":lane,"request":req,"payload":cap["public_payload"]})
                  print(case["id"],lane,cap["public_payload"].get("status"),cap["public_payload"].get("estimated_tokens"),flush=True)
          a.output.write_text(json.dumps({"rows":rows},ensure_ascii=False,indent=2)+"\n")
          PY

      - name: Generic30 — accepted reference and current
        shell: bash
        run: |
          set -euo pipefail
          (cd generic-reference && PYTHONPATH="$PWD" uv run --frozen --extra dev python "$RUNNER_TEMP/run_generic30.py" \
            --project-root "$GITHUB_WORKSPACE/frozen-corpus" \
            --questions "$GITHUB_WORKSPACE/candidate/eval/project_context_quality/generic_blind_lookup_pair30_questions.json" \
            --output "$RUNNER_TEMP/generic30-reference.json")
          (cd candidate && PYTHONPATH="$PWD" uv run --frozen --extra dev python "$RUNNER_TEMP/run_generic30.py" \
            --project-root "$GITHUB_WORKSPACE/frozen-corpus" \
            --questions "$GITHUB_WORKSPACE/candidate/eval/project_context_quality/generic_blind_lookup_pair30_questions.json" \
            --output "$RUNNER_TEMP/generic30-current.json")

      - name: Compare visible question packets
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          t=Path(os.environ["RUNNER_TEMP"])

          def signature(payload):
              keys=("status","kind","context_status","context_available","context_quality",
                    "answer_supported","answer_available","support_status","edit_ready",
                    "missing","omitted_counts","limitations","recommended_next_action",
                    "covered_query_ids","missing_query_ids")
              src_keys=("path_or_url","path","section","symbol_or_section","snippet",
                        "version_binding","authority","instruction_trust","scope","line_start","line_end")
              return {
                  **{k:payload.get(k) for k in keys if k in payload},
                  "sources":[{k:s.get(k) for k in src_keys if k in s} for s in payload.get("sources") or ()],
              }

          def target_rows(path):
              data=json.loads(path.read_text())
              return {r["id"]:r["capture"]["public_payload"] for r in data["cases"]}
          ta=target_rows(t/"target30-reference.json"); tb=target_rows(t/"target30-current.json")
          target_changed=[i for i in ta if signature(ta[i])!=signature(tb[i])]

          def generic_rows(path):
              data=json.loads(path.read_text())
              return {(r["id"],r["lane"]):r["payload"] for r in data["rows"]}
          ga=generic_rows(t/"generic30-reference.json"); gb=generic_rows(t/"generic30-current.json")
          assert set(ga)==set(gb)
          generic_changed=[{"id":i,"lane":lane} for (i,lane) in ga if signature(ga[(i,lane)])!=signature(gb[(i,lane)])]

          out={
              "target30":{"reference":"f111304579299ca1d9e7811c4e46dac8a17ec005","changed_visible_packet_ids":target_changed,"current_cases":len(tb)},
              "generic30":{"reference":"8cecc0e1355376699bd18d8eb7a720cff6868be0","changed_visible_packets":generic_changed,"current_calls":len(gb)},
          }
          (t/"question-packet-compare.json").write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY

      - name: External80 — structural reference fixture
        shell: bash
        run: |
          set -euo pipefail
          cd structural-reference
          PYTHONPATH="$PWD" uv run --frozen --extra dev python - <<'PY'
          from pathlib import Path
          from eval.evidence_quality_v2.run import run
          import os
          run(Path(os.environ["RUNNER_TEMP"])/"external-reference")
          PY

      - name: External80 — current on exact reference fixture
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          PYTHONPATH="$PWD" uv run --frozen --extra dev python - <<'PY'
          from pathlib import Path
          from eval.evidence_quality_v2.run import run
          import os
          t=Path(os.environ["RUNNER_TEMP"])
          run(t/"external-current",fixture_output=t/"external-reference")
          PY

      - name: Compare External80
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          t=Path(os.environ["RUNNER_TEMP"])
          A=json.loads((t/"external-reference/rows.json").read_text())
          B=json.loads((t/"external-current/rows.json").read_text())
          a={r["id"]:r for r in A if r.get("variant")=="A-current"}
          b={r["id"]:r for r in B if r.get("variant")=="A-current"}
          assert set(a)==set(b)
          def ok(r):
              return r.get("assessment",{}).get("context_sufficiency")=="sufficient" and not r.get("safety_errors")
          wins=[i for i in a if ok(b[i]) and not ok(a[i])]
          losses=[i for i in a if ok(a[i]) and not ok(b[i])]
          changed=[i for i in a if a[i].get("payload")!=b[i].get("payload")]
          out={
              "reference_sufficient":sum(ok(x) for x in a.values()),
              "current_sufficient":sum(ok(x) for x in b.values()),
              "wins":wins,"losses":losses,"payload_changed_ids":changed,
              "reference_safety":sum(bool(x.get("safety_errors")) for x in a.values()),
              "current_safety":sum(bool(x.get("safety_errors")) for x in b.values()),
          }
          (t/"external80-compare.json").write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          if losses or out["current_safety"]>out["reference_safety"]:
              raise SystemExit("external80 regression")
          PY

      - name: Final machine-readable summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          t=Path(os.environ["RUNNER_TEMP"])
          def load(name):
              p=t/name
              return json.loads(p.read_text()) if p.exists() else {"missing":name}
          summary={
              "candidate_sha":os.environ.get("GITHUB_SHA"),
              "question_packet_compare":load("question-packet-compare.json"),
              "external80":load("external80-compare.json"),
          }
          (t/"final-question-summary.json").write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr194-final-question-gate
          path: |
            ${{ runner.temp }}/deterministic.log
            ${{ runner.temp }}/target30-reference.json
            ${{ runner.temp }}/target30-current.json
            ${{ runner.temp }}/generic30-reference.json
            ${{ runner.temp }}/generic30-current.json
            ${{ runner.temp }}/question-packet-compare.json
            ${{ runner.temp }}/external-reference/summary.json
            ${{ runner.temp }}/external-current/summary.json
            ${{ runner.temp }}/external80-compare.json
            ${{ runner.temp }}/final-question-summary.json
