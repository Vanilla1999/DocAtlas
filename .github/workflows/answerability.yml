name: Answerability observation safety (not semantic acceptance)
on:
  push:
    branches: [fix/answerability-observation-only]
  pull_request:
    paths: ['docmancer/**', 'eval/answerability*', 'uv.lock', '.github/workflows/answerability.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: answerability-safety-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  installed-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Freeze exact source and verify syntax
        run: |
          mkdir -p "$RUNNER_TEMP/answerability-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/answerability-evidence/head.txt"
          git diff --exit-code
          python -m compileall -q docmancer/docs/application/answerability.py eval/answerability_safety.py
      - name: Build installed CPU runtime; provision diagnostic model before offline execution
        run: |
          docker build -f eval/answerability.Dockerfile -t docatlas-answerability .
          docker image inspect docatlas-answerability > "$RUNNER_TEMP/answerability-evidence/image.json"
      - name: Real stdio V40 observation equality and independent safety controls under 1.5GB
        run: |
          set +e
          docker run --name answerability-safety --network none --cpus=2 --memory=1500000000 --memory-swap=1500000000 \
            -e TESTED_SHA="$(git rev-parse HEAD)" -e HF_HUB_OFFLINE=1 \
            -v "$RUNNER_TEMP/answerability-evidence:/evidence" --entrypoint /opt/venv/bin/python \
            docatlas-answerability -I /repo/eval/answerability_safety.py \
            --repo /repo --work /tmp/safety-work --out /evidence/run --model /model --qa-model /qa-model
          rc=$?
          docker inspect answerability-safety > "$RUNNER_TEMP/answerability-evidence/container.json"
          echo "$rc" > "$RUNNER_TEMP/answerability-evidence/exit-code.txt"
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: answerability-safety-${{ github.run_id }}
          path: ${{ runner.temp }}/answerability-evidence/
          retention-days: 30
          if-no-files-found: error
  portable-controls:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-15
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Build installed package and explicitly provision observer
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/qa-runtime
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tokenizer-cache
        run: |
          python -m pip install uv==0.9.25
          uv sync --frozen --no-dev --no-install-project --python "$(command -v python)"
          uv build --wheel --out-dir "$RUNNER_TEMP/wheels"
          uv pip install --python "$RUNNER_TEMP/qa-runtime/bin/python" --no-deps "$RUNNER_TEMP/wheels/"*.whl
          "$RUNNER_TEMP/qa-runtime/bin/python" -I -c 'import tiktoken; tiktoken.get_encoding("o200k_base")'
          "$RUNNER_TEMP/qa-runtime/bin/python" -I -m docmancer.docs.application.answerability_model "$RUNNER_TEMP/qa-model"
      - name: Independent installed stdio safety controls (no hard native-memory claim)
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tokenizer-cache
          HF_HUB_OFFLINE: '1'
        run: |
          set -euo pipefail
          private_tmp=$(mktemp -d "$RUNNER_TEMP/qa-private.XXXXXX")
          chmod 700 "$private_tmp"
          export TMPDIR=$(cd "$private_tmp" && pwd -P)
          TESTED_SHA="$(git rev-parse HEAD)" "$RUNNER_TEMP/qa-runtime/bin/python" -I eval/answerability_safety.py \
            --suite controls --repo "$PWD" --work "$RUNNER_TEMP/safety-work" --out "$RUNNER_TEMP/control-results" \
            --qa-model "$RUNNER_TEMP/qa-model" --model "$RUNNER_TEMP/unused-minilm"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: answerability-safety-${{ matrix.os }}-${{ matrix.python }}-${{ github.run_id }}
          path: ${{ runner.temp }}/control-results/
          retention-days: 30
          if-no-files-found: warn
