name: Evidence v2 pinned public inputs
on:
  push:
    branches: [fix/evidence-quality-v2-20260910]
    paths: ['.github/workflows/evidence-v2-public-inputs.yml']
permissions:
  contents: read
jobs:
  public-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned public Markdown without benchmark questions
        env:
          OUT: ${{ runner.temp }}/evidence-inputs
        run: |
          mkdir -p "$OUT"
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['OUT'])
          specs = [
              ('fastapi','fastapi/fastapi','0.115.0','docs/en/docs/tutorial'),
              ('starlette','encode/starlette','0.39.2','docs'),
              ('typer','fastapi/typer','0.12.5','docs/tutorial'),
              ('pydantic','pydantic/pydantic','v2.9.2','docs/concepts'),
              ('httpx','encode/httpx','0.28.1','docs'),
              ('mkdocs','mkdocs/mkdocs','1.6.1','docs/user-guide'),
              ('ruff','astral-sh/ruff','0.6.8','docs'),
              ('uv','astral-sh/uv','0.4.20','docs'),
          ]
          manifest = []
          for name, repo, tag, folder in specs:
              source = out.parent / ('source-' + name)
              subprocess.run(['git','clone','--quiet','--depth','1','--branch',tag,'https://github.com/'+repo+'.git',str(source)], check=True)
              sha = subprocess.check_output(['git','-C',str(source),'rev-parse','HEAD'],text=True).strip()
              paths = sorted((source/folder).rglob('*.md')) + sorted(source.glob('LICENSE*'))
              if not paths: raise RuntimeError('No input documents: '+name)
              for path in paths:
                  if not path.is_file(): continue
                  relative = path.relative_to(source)
                  destination = out/'corpus'/name/relative
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  data = path.read_bytes()
                  destination.write_bytes(data)
                  manifest.append({'project':name,'repository':repo,'ref':tag,'commit':sha,'path':str(relative),'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)})
              print(name, sha, len(paths), flush=True)
          (out/'source-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Pin Grounded lexical runtime
        env:
          OUT: ${{ runner.temp }}/evidence-inputs
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          DO_NOT_TRACK: '1'
        run: |
          mkdir -p "$OUT/grounded"
          cd "$OUT/grounded"
          npm init -y >/dev/null
          npm install --save-exact @arabold/docs-mcp-server@3.1.0 > "$OUT/grounded-install.log" 2>&1
          npm ls --json > "$OUT/grounded-dependencies.json"
          node --version > "$OUT/node-version.txt"
          tar -czf "$OUT/grounded-runtime.tar.gz" node_modules
          rm -rf node_modules
      - name: Save public fixture material and locked runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-v2-public-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/evidence-inputs/
          retention-days: 7
