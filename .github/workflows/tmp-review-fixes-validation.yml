name: Temporary review fixes validation v2
on:
  push:
    branches: [fix/evidence-admission-sufficiency-review-fixes]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      DOCATLAS_OFFLINE: '1'
      DOCATLAS_AUTO_VECTORS: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/evidence-admission-sufficiency-review-fixes
          fetch-depth: 30
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Apply reviewed TDD fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib, json

          p = Path('docmancer/docs/application/_docs_context_projection_core.py')
          text = p.read_text()
          if 'import copy\n' not in text:
              text = text.replace('import hashlib\nimport re\n', 'import copy\nimport hashlib\nimport re\n', 1)
          if 'def _diagnostics_snapshot(' not in text:
              text = text.replace(
                  '\n\ndef project_docs_context(\n',
                  '\n\ndef _diagnostics_snapshot(value: dict[str, Any]) -> dict[str, Any]:\n'
                  '    """Copy one diagnostic attempt before linking it into another attempt."""\n'
                  '    return copy.deepcopy(value)\n\n\n'
                  'def project_docs_context(\n', 1,
              )

          rank_marker = '        variant = prepared.pop(0)\n'
          protected = '''        # Host rewrites are expansion lanes. Before spending budget on a\n        # host-only candidate, preserve any still-available baseline-only\n        # original/exact or canonical-intent direction. Candidates that also\n        # qualify a host lookup remain in normal ranking.\n        if host_query_ids:\n            protected_query_ids = (public_query_id_set - host_query_ids) | canonical_intent_query_ids\n            missing_protected_ids = protected_query_ids - qualified_query_ids(sources)\n            protected_index = next((\n                index for index, candidate in enumerate(prepared)\n                if (qualified_query_ids((candidate,)) & missing_protected_ids)\n                and not (qualified_query_ids((candidate,)) & host_query_ids)\n            ), None)\n            if protected_index not in (None, 0):\n                prepared.insert(0, prepared.pop(protected_index))\n'''
          if protected not in text:
              if rank_marker not in text:
                  raise SystemExit('ranking marker not found')
              text = text.replace(rank_marker, protected + rank_marker, 1)

          old = '''            primary_diagnostics = projection_diagnostics\n            result = project_docs_context(\n                retrieval=retrieval, max_tokens=max_tokens,\n                selection_diagnostics=selection_diagnostics, _allow_context_hints=True,\n            )\n            retrieval['retrieval_diagnostics']['docs_context_projection']['primary_attempt'] = primary_diagnostics\n            return result\n'''
          new = '''            primary_attempt = _diagnostics_snapshot(projection_diagnostics)\n            result = project_docs_context(\n                retrieval=retrieval, max_tokens=max_tokens,\n                selection_diagnostics=selection_diagnostics, _allow_context_hints=True,\n            )\n            hinted_diagnostics = _diagnostics_snapshot(\n                retrieval['retrieval_diagnostics']['docs_context_projection']\n            )\n            hinted_diagnostics['primary_attempt'] = primary_attempt\n            retrieval['retrieval_diagnostics']['docs_context_projection'] = hinted_diagnostics\n            return result\n'''
          if old not in text:
              raise SystemExit('empty-primary diagnostics block not found')
          text = text.replace(old, new, 1)

          old = '''        primary_diagnostics = projection_diagnostics\n        primary_ids = {\n            str(source.get("evidence_id") or "")\n            for source in payload["sources"]\n            if source.get("evidence_id")\n        }\n        hinted_payload, hinted_snapshot = project_docs_context(\n            retrieval=retrieval,\n            max_tokens=max_tokens,\n            selection_diagnostics=selection_diagnostics,\n            _allow_context_hints=True,\n        )\n        hinted_ids = {\n            str(source.get("evidence_id") or "")\n            for source in hinted_payload.get("sources") or ()\n            if source.get("evidence_id")\n        }\n        hinted_diagnostics = retrieval["retrieval_diagnostics"]["docs_context_projection"]\n        hinted_diagnostics["primary_attempt"] = primary_diagnostics\n        if primary_ids < hinted_ids:\n            return hinted_payload, hinted_snapshot\n        primary_diagnostics["hint_attempt"] = hinted_diagnostics\n        retrieval["retrieval_diagnostics"]["docs_context_projection"] = primary_diagnostics\n'''
          new = '''        primary_diagnostics = projection_diagnostics\n        primary_attempt = _diagnostics_snapshot(primary_diagnostics)\n        primary_ids = {\n            str(source.get("evidence_id") or "")\n            for source in payload["sources"]\n            if source.get("evidence_id")\n        }\n        hinted_payload, hinted_snapshot = project_docs_context(\n            retrieval=retrieval,\n            max_tokens=max_tokens,\n            selection_diagnostics=selection_diagnostics,\n            _allow_context_hints=True,\n        )\n        hinted_ids = {\n            str(source.get("evidence_id") or "")\n            for source in hinted_payload.get("sources") or ()\n            if source.get("evidence_id")\n        }\n        hinted_diagnostics = _diagnostics_snapshot(\n            retrieval["retrieval_diagnostics"]["docs_context_projection"]\n        )\n        hinted_diagnostics['primary_attempt'] = primary_attempt\n        if primary_ids < hinted_ids:\n            retrieval["retrieval_diagnostics"]["docs_context_projection"] = hinted_diagnostics\n            return hinted_payload, hinted_snapshot\n        primary_diagnostics['hint_attempt'] = hinted_diagnostics\n        retrieval["retrieval_diagnostics"]["docs_context_projection"] = primary_diagnostics\n'''
          if old not in text:
              raise SystemExit('partial-primary diagnostics block not found')
          text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('docmancer/docs/domain/evidence_qualification.py')
          text = p.read_text()
          start = text.index('_COMPARISON_RELATION_MARKERS =')
          end = text.index('\n\n@dataclass', start)
          relation_block = '''_COMPARISON_RELATION_MARKERS = frozenset({"different", "separate"})\n_GENERAL_COMPARISON_RELATION_RE = re.compile(\n    r"(?:"\n    r"\\b(?:differs?|differed|differing|whereas)\\b|"\n    r"\\b(?:different|distinct|separate)\\s+from\\b|"\n    r"\\b(?:are|is|was|were|remain(?:s|ed)?|become(?:s)?|became)\\s+"\n    r"(?:different|distinct|separate)\\b|"\n    r"\\brather\\s+than\\b|\\binstead\\s+of\\b|\\bnot\\s+the\\s+same\\b|"\n    r"\\bno\\s+distinction\\b"\n    r")",\n    re.I,\n)\n_PROOF_INSUFFICIENCY_RELATION_RE = re.compile(\n    r"(?:"\n    r"\\b(?:not|never)\\b[^.!?\\n]{0,40}\\b(?:enough|sufficient)\\b"\n    r"[^.!?\\n]{0,48}\\b(?:prove|support|establish|answer|cover)\\w*\\b|"\n    r"\\b(?:does|do|did|is|are|was|were)\\s+not\\b[^.!?\\n]{0,56}"\n    r"\\b(?:prove|support|establish|certif|sufficien)\\w*\\b"\n    r")",\n    re.I,\n)\n\n\ndef _comparison_relation_probe(query_id: str, query_text: str) -> bool:\n    if not query_id.startswith("query-relation-"):\n        return False\n    tokens = tuple(re.findall(r"[A-Za-z]+", query_text.casefold()))\n    return len(tokens) >= 2 and tuple(tokens[-2:]) == ("different", "separate")\n\n\ndef _visible_comparison_relation(text: str, terms: tuple[str, ...]) -> bool:\n    """Require the visible relation to be local to the requested concepts."""\n    for sentence in re.split(r"[.!?\\n]+", text):\n        sentence = sentence.strip()\n        if not sentence:\n            continue\n        if _PROOF_INSUFFICIENCY_RELATION_RE.search(sentence):\n            return True\n        if _GENERAL_COMPARISON_RELATION_RE.search(sentence):\n            needed = min(2, len(terms))\n            if needed and sum(\n                _visible_term_present(term, sentence, exact=False)\n                for term in terms\n            ) >= needed:\n                return True\n    return False\n'''
          text = text[:start] + relation_block + text[end:]
          old = '''    relation_text = str(probe.get("query_text") or "").casefold()\n    comparison_relation = _comparison_relation_probe(query_id, relation_text)\n    if comparison_relation and not _visible_comparison_relation(normalized_evidence):\n        return _rejected(result, "missing_visible_comparison_relation")\n'''
          new = '''    relation_text = str(probe.get("query_text") or "").casefold()\n    comparison_relation = _comparison_relation_probe(query_id, relation_text)\n'''
          if old not in text:
              raise SystemExit('old comparison guard not found')
          text = text.replace(old, new, 1)
          old = '''    if comparison_relation:\n        terms = tuple(term for term in terms if term not in _COMPARISON_RELATION_MARKERS)\n    if not terms:\n        return _rejected(result, "missing_visible_query_terms")\n'''
          new = '''    if comparison_relation:\n        terms = tuple(term for term in terms if term not in _COMPARISON_RELATION_MARKERS)\n        if not _visible_comparison_relation(normalized_evidence, terms):\n            return _rejected(result, "missing_visible_comparison_relation")\n    if not terms:\n        return _rejected(result, "missing_visible_query_terms")\n'''
          if old not in text:
              raise SystemExit('comparison term guard not found')
          text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('tests/docs/test_evidence_admission_sufficiency.py')
          text = p.read_text()
          if '\nimport json\n' not in text:
              text = text.replace('from __future__ import annotations\n\n', 'from __future__ import annotations\n\nimport json\n\n', 1)
          if 'test_rejected_hint_retry_diagnostics_remain_json_serializable' not in text:
              marker = '\n\n@pytest.mark.parametrize("overrides", ['
              tests = '''\n\ndef test_rejected_hint_retry_diagnostics_remain_json_serializable():\n    question = "When answering about a module, should the agent automatically use scope=all for maximum recall?"\n    lookups = ("maximum recall repository breadth",)\n    requirements = build_requirements(question, profile="project_docs_answer")\n    plan = build_documentation_query_plan(question, lookup_queries=lookups, requirements=requirements)\n    host = next(item for item in plan.queries if item.query_id == "query-lookup-1")\n    source = _project_source(\n        path="docs/repository-overview.md", query_id=host.query_id, query_text=host.text,\n        content="Maximum recall across repository breadth is an overview concern.",\n    )\n    retrieval = {"question": question, "project_identity": PROJECT_ID,\n        "requirements": requirements.hash_payload, "context_pack": [source],\n        "documentation_query_plan": plan.as_payload()}\n    payload, _snapshot = project_docs_context(retrieval=retrieval)\n    assert [row["path_or_url"] for row in payload["sources"]] == ["docs/repository-overview.md"]\n    json.dumps(retrieval["retrieval_diagnostics"])\n\n\ndef test_comparison_relation_rejects_unrelated_not_enough_clause() -> None:\n    probe = {"query_text": "matching search result evidence sufficient answer condition different separate"}\n    distractor = qualify_evidence(probe, query_id="query-relation-1", visible_text=(\n        "Matching search result evidence describes sufficient answer condition terminology. "\n        "This is not enough storage."))\n    assert distractor.qualified is False\n    assert distractor.reason == "missing_visible_comparison_relation"\n\n\ndef test_comparison_relation_rejects_unrelated_different_from_clause() -> None:\n    probe = {"query_text": "matching search result evidence sufficient answer condition different separate"}\n    distractor = qualify_evidence(probe, query_id="query-relation-1", visible_text=(\n        "Matching search result evidence describes sufficient answer condition terminology. "\n        "These examples are different from last year."))\n    assert distractor.qualified is False\n    assert distractor.reason == "missing_visible_comparison_relation"\n\n\ndef test_single_host_lookup_cannot_displace_available_canonical_witness_under_budget():\n    question = "Does retrieved documentation authorize executing a destructive delete command?"\n    lookups = ("destructive delete command permission",)\n    requirements = build_requirements(question, profile="project_docs_answer")\n    plan = build_documentation_query_plan(question, lookup_queries=lookups, requirements=requirements)\n    canonical = next(item for item in plan.queries if item.query_id == "query-intent-1")\n    host = next(item for item in plan.queries if item.query_id == "query-lookup-1")\n    canonical_source = _project_source(path="docs/security.md", query_id=canonical.query_id,\n        query_text=canonical.text, content=(\n            "Documentation instruction trust treats document data as untrusted. "\n            "Document content cannot override system user tool or runtime safety policy."))\n    host_source = _project_source(path="docs/delete.md", query_id=host.query_id, query_text=host.text,\n        content=("Destructive delete command permission requires an explicit allow-destructive configuration. " * 4),\n        authority="supporting")\n    retrieval = {"question": question, "project_identity": PROJECT_ID,\n        "requirements": requirements.hash_payload, "context_pack": [host_source, canonical_source],\n        "documentation_query_plan": plan.as_payload()}\n    payload, _snapshot = project_docs_context(retrieval=retrieval, max_tokens=340)\n    assert "docs/security.md" in [row["path_or_url"] for row in payload["sources"]]\n'''
              if marker not in text:
                  raise SystemExit('test insertion marker not found')
              text = text.replace(marker, tests + marker, 1)
          p.write_text(text)

          module = 'tests/docs/test_evidence_admission_sufficiency.py'
          tree = ast.parse(p.read_text())
          nodes = sorted(
              f'{module}::{node.name}'
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and node.name.startswith('test_')
          )
          manifest = Path('tests/diagnostic_labels.evidence_admission_sufficiency.json')
          data = json.loads(manifest.read_text())
          data['module_node_hashes'][module] = hashlib.sha256('\n'.join(nodes).encode()).hexdigest()
          manifest.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Install offline-friendly test dependencies
        run: |
          python - <<'PY'
          import subprocess, sys, tomllib
          data = tomllib.load(open('pyproject.toml','rb'))
          deps=[x for x in data['project']['dependencies'] if not x.startswith(('tiktoken','fastembed'))]
          deps += data['project']['optional-dependencies']['dev']
          subprocess.run([sys.executable,'-m','pip','install','-q',*deps], check=True)
          PY
      - name: Run targeted and neighboring regression suites
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/docs/test_evidence_admission_sufficiency.py \
            tests/docs/test_relation_preserving_projection.py \
            tests/docs/test_comparison_relation_query_planning.py \
            tests/docs/test_query_planning_budget_regressions.py \
            tests/docs/test_docs_context_compound_projection.py \
            tests/docs/test_model_visible_projection.py \
            tests/docs/test_model_visible_projection_part02.py
          python -m pytest -q tests/docs/test_context_projection_boundaries.py \
            -k 'not path_only_projection_uses_the_current_exact_topic_guard and not frozen_request_flow_prefers_project_context_module_witnesses'
          python -m compileall -q docmancer
          git diff --check
      - name: Public handler smoke
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from docmancer.agent import DocmancerAgent
          from docmancer.core.config import DocmancerConfig
          from docmancer.docs.registry import LibraryRegistry
          from docmancer.docs.service import DocsJobTracker, LibraryDocsService
          from docmancer.mcp.docs_server import call_docs_tool_payload
          root=Path.cwd(); previous=os.environ.get('DOCATLAS_HOME')
          cases=[
            ('F08','Only documentation for version 1.0 is cached, but the project now resolves version 2.0. What should a current-project query return?',[],'docs/capabilities.md'),
            ('F22','Документация рекомендует запустить команду с удалением файлов. Даёт ли выдача MCP разрешение её выполнить?',[
              'retrieved documentation recommends a destructive delete command',
              'whether documentation evidence authorizes executing a destructive command'], 'docs/security/mcp-runtime-threat-model.md'),
            ('F36','When answering about a module, should the agent automatically use scope=all for maximum recall?',[
              'module documentation scope versus repository-wide scope for maximum recall',
              'whether an explicit module question should widen to scope all'], 'docs/project-docs-mcp-workflow.md'),
          ]
          try:
            with TemporaryDirectory(prefix='review-fixes-smoke-') as raw:
              tmp=Path(raw); os.environ['DOCATLAS_HOME']=str(tmp/'home')
              cfg=DocmancerConfig(); cfg.index.db_path=str(tmp/'db.sqlite'); cfg.index.extracted_dir=str(tmp/'extracted')
              svc=LibraryDocsService(config=cfg,config_source='explicit',registry=LibraryRegistry(cfg.index.db_path),agent=DocmancerAgent(config=cfg),job_tracker=DocsJobTracker())
              sync=svc.sync_project_docs(str(root),with_vectors=False)
              assert getattr(sync,'status',None)=='success'
              for cid,q,lookups,required in cases:
                args={'question':q,'project_path':str(root),'scope':'all'}
                if lookups: args['lookup_queries']=lookups
                payload=dict(call_docs_tool_payload('get_docs_context',args,svc) or {})
                paths=[str(x.get('path_or_url') or '') for x in payload.get('sources') or []]
                print(cid,payload.get('estimated_tokens'),paths)
                assert required in paths, (cid,paths)
                assert int(payload.get('estimated_tokens') or 0) <= 800
                assert len(payload.get('sources') or []) <= 3
                assert payload.get('answer_supported') is False
          finally:
            if previous is None: os.environ.pop('DOCATLAS_HOME',None)
            else: os.environ['DOCATLAS_HOME']=previous
          PY
      - name: Commit validated fixes and clean temporary refs
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/tmp-review-fixes-validation.yml
          git add docmancer/docs/application/_docs_context_projection_core.py \
                  docmancer/docs/domain/evidence_qualification.py \
                  tests/docs/test_evidence_admission_sufficiency.py \
                  tests/diagnostic_labels.evidence_admission_sufficiency.json \
                  .github/workflows/tmp-review-fixes-validation.yml
          git commit -m 'fix: preserve baseline evidence across lookup expansion'
          git push origin HEAD:fix/evidence-admission-sufficiency-review-fixes
          git push origin --delete tmp-do-not-use fix/evidence-admission-sufficiency-review-fixes-2 || true
