name: TEMP bind P1.5 to the existing production evidence model

on:
  push:
    branches: [p1/p1.5-mixed-evidence-provenance]
    paths:
      - .github/workflows/temp-p1.5-bind-production-model.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: p1/p1.5-mixed-evidence-provenance
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Add a bounded fail-closed evidence-model resolver
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("scripts/run_mixed_evidence_provenance_gate.py"),
              Path("scripts/mixed_evidence_provenance_self_test.py"),
          ]
          old = 'model_path=REPO_ROOT / "docmancer" / "docs" / "domain" / "evidence_models.py",'
          helper = '''

          def _production_evidence_model_path() -> Path:
              candidates = (
                  REPO_ROOT / "docmancer" / "docs" / "domain" / "evidence_models.py",
                  REPO_ROOT / "docmancer" / "docs" / "domain" / "evidence.py",
                  REPO_ROOT / "docmancer" / "docs" / "domain" / "models.py",
                  REPO_ROOT / "docmancer" / "docs" / "domain" / "answer_completeness.py",
              )
              existing = [path for path in candidates if path.is_file()]
              if not existing:
                  raise RuntimeError("no reviewed production evidence-model module exists")
              return existing[0]
          '''
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if "def _production_evidence_model_path()" not in text:
                  marker = '\n\nREPO_ROOT = Path(__file__).resolve().parents[1]\n'
                  if marker not in text:
                      raise SystemExit(f"model resolver insertion anchor missing: {path}")
                  text = text.replace(marker, marker + helper, 1)
              if old in text:
                  text = text.replace(old, "model_path=_production_evidence_model_path(),", 1)
              elif "model_path=_production_evidence_model_path()," not in text:
                  raise SystemExit(f"model path call anchor missing: {path}")
              path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/temp-p1.5-bind-production-model.yml
          python -m compileall -q \
            scripts/run_mixed_evidence_provenance_gate.py \
            scripts/mixed_evidence_provenance_self_test.py
          git diff --check
      - name: Commit ordinary source only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(p1): bind P1.5 to a reviewed evidence model"
          git push origin HEAD:p1/p1.5-mixed-evidence-provenance
