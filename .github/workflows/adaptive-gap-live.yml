name: Guarded facet selection installed MCP acceptance
on:
  push:
    branches: [experiment/facet-selection-20261025]
    paths: ['.github/workflows/adaptive-gap-live.yml', 'docmancer/docs/application/section_compression.py', 'docmancer/docs/application/facet_selection.py', 'eval/facet_selection_integration.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: facet-live-${{ github.sha }}
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [v40, holdout, fresh]
        policy: [facet-guarded-v1]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Freeze exact source and unchanged regression inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/facet-evidence"
          git fetch -q origin d6fc18256ffe91a1d26e03783642e521b056ce12 --depth=1
          git fetch -q origin 2376217843bb2ac236195f9ccb05f7bba257c256 --depth=1
          git fetch -q origin ed61b4d31a3f2d1e8ca72f950fe1ba9d3fba65f0 --depth=1
          git diff --exit-code d6fc18256ffe91a1d26e03783642e521b056ce12 HEAD -- eval/prepared_model_comparison40 eval/adaptive_gap_holdout pyproject.toml uv.lock
          git diff --exit-code 2376217843bb2ac236195f9ccb05f7bba257c256 HEAD -- eval/fresh_dialogues
          git diff --exit-code ed61b4d31a3f2d1e8ca72f950fe1ba9d3fba65f0 HEAD -- docmancer ':!docmancer/docs/application/facet_selection.py'
          git rev-parse HEAD > "$RUNNER_TEMP/facet-evidence/head.txt"
          python -m compileall -q docmancer eval/facet_selection_integration.py
          git archive HEAD docmancer eval .github/workflows/adaptive-gap-live.yml | gzip > "$RUNNER_TEMP/facet-evidence/tested-source.tar.gz"
      - name: Build exact installed wheel and provision frozen MiniLM and tokenizers
        run: |
          docker build -f eval/minilm_sections.Dockerfile -t docatlas-facet-base .
          docker build -t docatlas-facet-live - <<'DOCKER'
          FROM docatlas-facet-base
          RUN /opt/venv/bin/python -c 'import tiktoken; tiktoken.get_encoding("cl100k_base")'
          DOCKER
      - name: Real SQLite and CPU ONNX through public stdio under hard 1GB
        env:
          SUITE: ${{ matrix.suite }}
          POLICY: ${{ matrix.policy }}
        run: |
          set +e
          docker run --name facet-run --network none --cpus=2 \
            --memory=1000000000 --memory-swap=1000000000 \
            -e TESTED_SHA="$(git rev-parse HEAD)" -e HF_HUB_OFFLINE=1 \
            -v "$RUNNER_TEMP/facet-evidence:/evidence" --entrypoint /opt/venv/bin/python \
            docatlas-facet-live -I /repo/eval/facet_selection_integration.py \
            --repo /repo --work /tmp/facet-study --out /evidence/run --model /model \
            --suite "$SUITE" --policy "$POLICY"
          rc=$?
          docker inspect facet-run > "$RUNNER_TEMP/facet-evidence/container.json"
          echo "$rc" > "$RUNNER_TEMP/facet-evidence/exit-code.txt"
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: facet-live-${{ matrix.suite }}-${{ matrix.policy }}-${{ github.run_id }}
          path: ${{ runner.temp }}/facet-evidence/
          retention-days: 30
          if-no-files-found: error
  compare:
    needs: live
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve exact current candidate and previously executed fixed controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/arms" "$RUNNER_TEMP/baselines" "$RUNNER_TEMP/paired"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'facet-live-*' --dir "$RUNNER_TEMP/arms"
          for suite in v40 holdout; do
            gh run download 40215652617 --repo "$GITHUB_REPOSITORY" --name "facet-live-$suite-fixed-40215652617" --dir "$RUNNER_TEMP/baselines/$suite"
          done
          gh run download 40216114357 --repo "$GITHUB_REPOSITORY" --name facet-live-fresh-fixed-40216114357 --dir "$RUNNER_TEMP/baselines/fresh"
      - name: Require complete documented coverage and lower total visible tokens
        run: |
          python - <<'PY'
          import json, pathlib, os
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          summaries={}; rows=[]; missing=[]
          for suite in ('v40','holdout','fresh'):
              candidate=temp/'arms'/f'facet-live-{suite}-facet-guarded-v1-{os.environ["GITHUB_RUN_ID"]}'/'run'
              baseline=temp/'baselines'/suite/'run'
              if not (candidate/'SUMMARY.json').exists():
                  missing.append(suite); continue
              a=json.loads((baseline/'SUMMARY.json').read_text())
              b=json.loads((candidate/'SUMMARY.json').read_text())
              expected='ed61b4d31a3f2d1e8ca72f950fe1ba9d3fba65f0' if suite=='fresh' else '828bace5d111890dbb8830cc0c478d352f7564ca'
              assert a['head']==expected and b['head']==os.environ['GITHUB_SHA']
              assert json.loads((baseline/'FREEZE.json').read_text())['inputs']==json.loads((candidate/'FREEZE.json').read_text())['inputs']
              summaries[suite]={'fixed':a,'guarded':b}
              aa={r['case_id']:r for r in json.loads((baseline/'ASSESSMENTS.json').read_text())}
              bb={r['case_id']:r for r in json.loads((candidate/'ASSESSMENTS.json').read_text())}
              assert aa.keys()==bb.keys()
              for cid in aa:
                  a,b=aa[cid],bb[cid]
                  assert a['question']==b['question'] and a['search_question']==b['search_question']
                  rows.append({'suite':suite,'case_id':cid,'answerability':a['answerability'],
                    'fixed_pass':a['passed'],'guarded_pass':b['passed'],'fixed_tokens':a['tokens'],
                    'guarded_tokens':b['tokens'],'fixed_groups':a['selected_groups'],'guarded_groups':b['selected_groups'],
                    'new_loss':a['answerability']!='unanswerable' and a['passed'] and not b['passed']})
          totals={p:{'tokens':sum(r[p+'_tokens'] for r in rows),
                     'documented_pass':sum(r[p+'_pass'] for r in rows if r['answerability']!='unanswerable'),
                     'documented_total':sum(r['answerability']!='unanswerable' for r in rows)} for p in ('fixed','guarded')}
          passed=(not missing and len(rows)==64 and not any(r['new_loss'] for r in rows)
                  and totals['guarded']['documented_pass']==totals['guarded']['documented_total']
                  and totals['guarded']['tokens']<totals['fixed']['tokens'])
          result={'head':os.environ['GITHUB_SHA'],'summaries':summaries,'cases':rows,'totals':totals,
                  'missing_arms':missing,'regression_gate_passed':passed,
                  'answer_model_calls':0,'provider_usage':None,'default_rollout':False,
                  'boundary':'Development-selected margin; 64 known regression questions, not unseen generalization. First retrieval evidence, not final answers or total dialogue cost.'}
          (temp/'paired/PAIRED.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({k:v for k,v in result.items() if k!='cases'},ensure_ascii=False,indent=2))
          assert passed, 'documented coverage, source execution or visible-token acceptance failed'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: facet-paired-${{ github.run_id }}
          path: ${{ runner.temp }}/paired/
          retention-days: 30
          if-no-files-found: error
