name: Fresh V13 V15 question run
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths:
      - .github/workflows/v13-v15-fresh30.yml
      - eval/project_context_quality/v13_v15_fresh30_questions.json
      - scripts/run_v13_v15_diagnostic30.py

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - name: Verify public capture recorder
        run: uv run --frozen --extra dev pytest tests/docs/test_context_capture_integrity.py -q
      - name: Run fresh 30 root-only questions
        run: |
          PYTHONPATH="$PWD" uv run --frozen --extra dev python \
            scripts/run_v13_v15_diagnostic30.py \
            --project-root "$PWD" \
            --questions eval/project_context_quality/v13_v15_fresh30_questions.json \
            --output "$RUNNER_TEMP/v13-v15-fresh30.json"
      - uses: actions/upload-artifact@v4
        with:
          name: v13-v15-fresh30
          path: ${{ runner.temp }}/v13-v15-fresh30.json
