name: TEMP audit DocAtlas 1.3.1 live release state

on:
  push:
    branches: [audit/release-1.3.1-live-state]
    paths:
      - .github/workflows/temp-audit-release-1.3.1-live-state.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: temp-audit-release-1.3.1-live-state
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: audit/release-1.3.1-live-state
          fetch-depth: 0

      - name: Capture GitHub and PyPI facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release-request.yml/runs?per_page=30" > /tmp/release-request-runs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yml/runs?per_page=30" > /tmp/publish-runs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?per_page=30" > /tmp/ci-runs.json
          gh api "repos/${GITHUB_REPOSITORY}/branches/main" > /tmp/main.json

          tag_status=200
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.3.1" > /tmp/tag-ref.json 2>/tmp/tag-ref.err; then
            tag_status=404
            printf '{}\n' > /tmp/tag-ref.json
          fi
          printf '%s\n' "$tag_status" > /tmp/tag-status.txt

          tag_object_sha="$(python - <<'PY'
          import json
          row=json.load(open('/tmp/tag-ref.json', encoding='utf-8'))
          obj=row.get('object') if isinstance(row, dict) else None
          print((obj or {}).get('sha') or '')
          PY
          )"
          tag_object_type="$(python - <<'PY'
          import json
          row=json.load(open('/tmp/tag-ref.json', encoding='utf-8'))
          obj=row.get('object') if isinstance(row, dict) else None
          print((obj or {}).get('type') or '')
          PY
          )"
          if [ "$tag_object_type" = tag ] && [ -n "$tag_object_sha" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" > /tmp/tag-object.json
          else
            printf '{}\n' > /tmp/tag-object.json
          fi

          pypi_all_status="$(curl -sS -L -o /tmp/pypi-all.json -w '%{http_code}' -H 'Cache-Control: no-cache' -H 'User-Agent: DocAtlas-live-audit/1' https://pypi.org/pypi/doc-atlas/json || true)"
          pypi_131_status="$(curl -sS -L -o /tmp/pypi-131.json -w '%{http_code}' -H 'Cache-Control: no-cache' -H 'User-Agent: DocAtlas-live-audit/1' https://pypi.org/pypi/doc-atlas/1.3.1/json || true)"
          printf '%s\n' "$pypi_all_status" > /tmp/pypi-all-status.txt
          printf '%s\n' "$pypi_131_status" > /tmp/pypi-131-status.txt
          test -s /tmp/pypi-all.json || printf '{}\n' > /tmp/pypi-all.json
          test -s /tmp/pypi-131.json || printf '{}\n' > /tmp/pypi-131.json

      - name: Build bounded audit record
        run: |
          set -euo pipefail
          mkdir -p docs/analysis
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path
          from typing import Any

          def load(path: str) -> Any:
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def text(path: str) -> str:
              return Path(path).read_text(encoding='utf-8').strip()

          def select_runs(payload: dict[str, Any]) -> list[dict[str, Any]]:
              rows = payload.get('workflow_runs') if isinstance(payload, dict) else []
              result = []
              for row in (rows if isinstance(rows, list) else [])[:15]:
                  result.append({
                      'id': row.get('id'),
                      'name': row.get('name'),
                      'event': row.get('event'),
                      'status': row.get('status'),
                      'conclusion': row.get('conclusion'),
                      'head_sha': row.get('head_sha'),
                      'head_branch': row.get('head_branch'),
                      'created_at': row.get('created_at'),
                      'updated_at': row.get('updated_at'),
                      'html_url': row.get('html_url'),
                      'run_number': row.get('run_number'),
                      'run_attempt': row.get('run_attempt'),
                  })
              return result

          main = load('/tmp/main.json')
          tag_ref = load('/tmp/tag-ref.json')
          tag_object = load('/tmp/tag-object.json')
          pypi_all = load('/tmp/pypi-all.json')
          pypi_131 = load('/tmp/pypi-131.json')

          tag_ref_object = tag_ref.get('object') if isinstance(tag_ref, dict) else {}
          tag_target = tag_object.get('object') if isinstance(tag_object, dict) else {}

          releases = pypi_all.get('releases') if isinstance(pypi_all, dict) else {}
          release_rows = releases.get('1.3.1') if isinstance(releases, dict) else []
          version_urls = pypi_131.get('urls') if isinstance(pypi_131, dict) else []
          artifacts = []
          for row in (version_urls if isinstance(version_urls, list) else []):
              artifacts.append({
                  'filename': row.get('filename'),
                  'packagetype': row.get('packagetype'),
                  'sha256': (row.get('digests') or {}).get('sha256'),
                  'upload_time_iso_8601': row.get('upload_time_iso_8601'),
                  'size': row.get('size'),
                  'url': row.get('url'),
                  'provenance': row.get('provenance'),
              })

          payload = {
              'schema_version': 1,
              'captured_by': 'temporary branch-only audit workflow',
              'repository': 'Vanilla1999/DocAtlas',
              'main': {
                  'sha': ((main.get('commit') or {}).get('sha') if isinstance(main, dict) else None),
                  'protected': main.get('protected') if isinstance(main, dict) else None,
              },
              'tag': {
                  'http_status': int(text('/tmp/tag-status.txt') or '0'),
                  'ref_type': (tag_ref_object or {}).get('type'),
                  'tag_object_sha': (tag_ref_object or {}).get('sha'),
                  'target_type': (tag_target or {}).get('type'),
                  'target_sha': (tag_target or {}).get('sha'),
                  'tagger_date': ((tag_object.get('tagger') or {}).get('date') if isinstance(tag_object, dict) else None),
                  'message': tag_object.get('message') if isinstance(tag_object, dict) else None,
              },
              'pypi': {
                  'all_status': int(text('/tmp/pypi-all-status.txt') or '0'),
                  'version_status': int(text('/tmp/pypi-131-status.txt') or '0'),
                  'latest_version': ((pypi_all.get('info') or {}).get('version') if isinstance(pypi_all, dict) else None),
                  'has_1_3_1': bool(release_rows),
                  'release_file_count': len(release_rows) if isinstance(release_rows, list) else 0,
                  'artifacts': artifacts,
              },
              'workflow_runs': {
                  'release_request': select_runs(load('/tmp/release-request-runs.json')),
                  'publish': select_runs(load('/tmp/publish-runs.json')),
                  'ci': select_runs(load('/tmp/ci-runs.json')),
              },
          }
          rendered = json.dumps(payload, indent=2, sort_keys=True) + '\n'
          Path('docs/analysis/release-1.3.1-live-audit.json').write_text(rendered, encoding='utf-8')
          Path('docs/analysis/release-1.3.1-live-audit.sha256').write_text(
              hashlib.sha256(rendered.encode('utf-8')).hexdigest() + '\n', encoding='utf-8'
          )
          print(rendered)
          PY

      - name: Remove temporary carrier and commit audit-only result
        run: |
          set -euo pipefail
          rm .github/workflows/temp-audit-release-1.3.1-live-state.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          changed="$(git diff --cached --name-only)"
          expected="$(printf '%s\n' \
            .github/workflows/temp-audit-release-1.3.1-live-state.yml \
            docs/analysis/release-1.3.1-live-audit.json \
            docs/analysis/release-1.3.1-live-audit.sha256)"
          test "$changed" = "$expected"
          git commit -m 'docs: capture live DocAtlas 1.3.1 release state'
          git push origin HEAD:audit/release-1.3.1-live-state
