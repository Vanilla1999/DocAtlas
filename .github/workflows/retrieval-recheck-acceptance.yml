name: Retrieval recheck acceptance through 4.4
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths:
      - .github/workflows/retrieval-recheck-acceptance.yml
      - eval/retrieval_recheck/**

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout acceptance definitions
        uses: actions/checkout@v4
      - name: Checkout baseline runtime
        uses: actions/checkout@v4
        with:
          ref: 7b92cc5e8a99ee7394fde93b46797c5bd0b162a8
          path: baseline-runtime
      - name: Checkout candidate runtime
        uses: actions/checkout@v4
        with:
          ref: 8cecc0e1355376699bd18d8eb7a720cff6868be0
          path: candidate-runtime
      - name: Checkout frozen corpus
        uses: actions/checkout@v4
        with:
          ref: 95e61265656283d609bc1328c46c52b2bf1a069e
          path: frozen-corpus
      - uses: astral-sh/setup-uv@v6
      - name: Sync runtimes
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline-runtime && uv sync --frozen --extra dev)
          (cd candidate-runtime && uv sync --frozen --extra dev)
      - name: Verify frozen external corpus identity
        shell: bash
        run: |
          set -euo pipefail
          for rt in baseline-runtime candidate-runtime; do
            cmp "$rt/eval/evidence_quality_v2/cases.json" frozen-corpus/eval/evidence_quality_v2/cases.json
            cmp "$rt/eval/evidence_quality_v2/source-manifest.json" frozen-corpus/eval/evidence_quality_v2/source-manifest.json
            cmp "$rt/eval/evidence_quality_v2/protocol.json" frozen-corpus/eval/evidence_quality_v2/protocol.json
            diff -qr "$rt/eval/evidence_quality_v2/sources" frozen-corpus/eval/evidence_quality_v2/sources
          done
      - name: Task 4.1 hermetic safety matrix
        shell: bash
        run: |
          set -euo pipefail
          cd candidate-runtime
          uv run --frozen --extra dev pytest -q \
            tests/docs/test_retrieval_alias_subject_binding.py \
            tests/docs/test_query_planning_completion_safety.py \
            tests/docs/test_list_item_continuation_bridge.py \
            tests/docs/test_source_continuation.py \
            tests/docs/test_current_source_authority_docs_parity.py \
            tests/docs/test_context_ranking_regressions.py \
            tests/docs/test_compact_context_blocks.py \
            tests/docs/test_context_span_growth.py \
            tests/docs/test_evidence_selection_part02.py \
            tests/docs/test_evidence_selection.py \
            tests/docs/test_model_visible_projection.py \
            | tee "$RUNNER_TEMP/task41-safety.log"
      - name: Task 4.3 generic30 baseline
        shell: bash
        run: |
          set -euo pipefail
          cd baseline-runtime
          PYTHONPATH="$PWD" uv run --frozen --extra dev python "$GITHUB_WORKSPACE/frozen-corpus/scripts/run_generic_blind_lookup_pair30.py" \
            --project-root "$GITHUB_WORKSPACE/frozen-corpus" \
            --questions "$GITHUB_WORKSPACE/frozen-corpus/eval/project_context_quality/generic_blind_lookup_pair30_questions.json" \
            --output "$RUNNER_TEMP/generic30-baseline.json"
      - name: Task 4.3 generic30 candidate
        shell: bash
        run: |
          set -euo pipefail
          cd candidate-runtime
          PYTHONPATH="$PWD" uv run --frozen --extra dev python "$GITHUB_WORKSPACE/frozen-corpus/scripts/run_generic_blind_lookup_pair30.py" \
            --project-root "$GITHUB_WORKSPACE/frozen-corpus" \
            --questions "$GITHUB_WORKSPACE/frozen-corpus/eval/project_context_quality/generic_blind_lookup_pair30_questions.json" \
            --output "$RUNNER_TEMP/generic30-candidate.json"
      - name: Compare generic30 public packets
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP'])
          a=json.loads((t/'generic30-baseline.json').read_text())
          b=json.loads((t/'generic30-candidate.json').read_text())
          def sig(v):
              p=(v.get('capture') or {}).get('public_payload') or {}
              return {
                  'status':p.get('status'),'kind':p.get('kind'),'estimated_tokens':p.get('estimated_tokens'),
                  'sources':[(s.get('path_or_url'),s.get('line_start'),s.get('line_end'),s.get('snippet')) for s in p.get('sources') or []],
              }
          changes=[]
          for ra,rb in zip(a['cases'],b['cases']):
              assert ra['id']==rb['id']
              for lane in ('root_only','with_lookups'):
                  sa=sig(ra[lane]); sb=sig(rb[lane])
                  if sa!=sb: changes.append({'id':ra['id'],'lane':lane,'baseline':sa,'candidate':sb})
          summary={'baseline_runtime':a['runtime_sha'],'candidate_runtime':b['runtime_sha'],'corpus':a['corpus'],'changes':changes,'changed_ids':sorted({x['id'] for x in changes})}
          (t/'generic30-compare.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False))
          print(json.dumps({'changed_ids':summary['changed_ids'],'changed_lanes':[(x['id'],x['lane']) for x in changes]},indent=2))
          PY
      - name: Task 4.3 external80 baseline
        shell: bash
        run: |
          set -euo pipefail
          cd baseline-runtime
          PYTHONPATH="$PWD" uv run --frozen --extra dev python -m eval.evidence_quality_v2.run --output "$RUNNER_TEMP/external80-baseline"
      - name: Task 4.3 external80 candidate
        shell: bash
        run: |
          set -euo pipefail
          cd candidate-runtime
          PYTHONPATH="$PWD" uv run --frozen --extra dev python -m eval.evidence_quality_v2.run --output "$RUNNER_TEMP/external80-candidate"
      - name: Compare external80 public payloads
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP'])
          a=t/'external80-baseline'; b=t/'external80-candidate'
          variants=['A-current','B-no-canonical','C-lexical-replay','D-no-window-replay','L-duplicate','L-nearby','L-explicit']
          changes=[]
          for v in variants:
              da=a/'payloads'/v; db=b/'payloads'/v
              if not da.exists() or not db.exists(): continue
              for pa in sorted(da.glob('*.json')):
                  pb=db/pa.name
                  xa=json.loads(pa.read_text()); xb=json.loads(pb.read_text())
                  if xa!=xb: changes.append({'variant':v,'id':pa.stem})
          sa=json.loads((a/'summary.json').read_text()); sb=json.loads((b/'summary.json').read_text())
          out={'payload_changes':changes,'changed_ids':sorted({x['id'] for x in changes}),'baseline_A':sa['variants'].get('A-current'),'candidate_A':sb['variants'].get('A-current')}
          (t/'external80-compare.json').write_text(json.dumps(out,indent=2,ensure_ascii=False))
          print(json.dumps({'payload_change_count':len(changes),'changed_ids':out['changed_ids'],'baseline_A':out['baseline_A']['within_budget_sufficient'],'candidate_A':out['candidate_A']['within_budget_sufficient']},indent=2))
          PY
      - name: Write holdout retrieval runner
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/run_holdout.py" <<'PY'
          from __future__ import annotations
          import argparse, hashlib, json, sys, time
          from pathlib import Path

          ap=argparse.ArgumentParser()
          ap.add_argument('--questions',type=Path,required=True)
          ap.add_argument('--frozen',type=Path,required=True)
          ap.add_argument('--output',type=Path,required=True)
          args=ap.parse_args()
          from eval.evidence_quality_v2.runtime import write_project, isolated_service, index_project
          from eval.project_context_quality.capture_public_context import capture_public_call

          questions=json.loads(args.questions.read_text())['cases']
          eq=args.frozen/'eval/evidence_quality_v2'
          manifest=json.loads((eq/'source-manifest.json').read_text())
          def digest(data): return hashlib.sha256(data).hexdigest()
          def documents(project):
              out={}
              for row in manifest['sources']:
                  if row['project']!=project: continue
                  p=eq/'sources'/project/row['path']; data=p.read_bytes()
                  assert digest(data)==row['sha256']
                  out[row['path']]=data.decode('utf-8')
              return out
          root=args.output; root.mkdir(parents=True,exist_ok=True)
          rows=[]
          for project in sorted({c['project_group'] for c in questions}):
              proj=root/'corpus'/project; write_project(proj,documents(project))
              with isolated_service(root/'state'/project) as (service,config):
                  index=index_project(service,config,proj)
                  for case in [c for c in questions if c['project_group']==project]:
                      req={'project_path':str(proj),'scope':'all','question':case['question']}
                      start=time.perf_counter(); cap=capture_public_call(service,req); elapsed=time.perf_counter()-start
                      p=cap['public_payload']
                      assert (p.get('estimated_tokens') or 0)<=800 and len(p.get('sources') or [])<=3
                      if p.get('kind')=='docs_context':
                          assert p.get('answer_supported') is False and p.get('answer_available') is False and p.get('edit_ready') is False
                      rows.append({'id':case['id'],'project_group':project,'question':case['question'],'elapsed_seconds':elapsed,'public_payload':p})
                      print(case['id'],p.get('status'),p.get('kind'),p.get('estimated_tokens'),[s.get('path_or_url') for s in p.get('sources') or []],flush=True)
          args.output.joinpath('holdout-retrieval.json').write_text(json.dumps({'cases':rows},indent=2,ensure_ascii=False))
          PY
      - name: Task 4.4 holdout retrieval baseline
        shell: bash
        run: |
          set -euo pipefail
          cd baseline-runtime
          PYTHONPATH="$PWD" uv run --frozen --extra dev python "$RUNNER_TEMP/run_holdout.py" \
            --questions "$GITHUB_WORKSPACE/eval/retrieval_recheck/holdout20_questions.json" \
            --frozen "$GITHUB_WORKSPACE/frozen-corpus" \
            --output "$RUNNER_TEMP/holdout-baseline"
      - name: Task 4.4 holdout retrieval candidate
        shell: bash
        run: |
          set -euo pipefail
          cd candidate-runtime
          PYTHONPATH="$PWD" uv run --frozen --extra dev python "$RUNNER_TEMP/run_holdout.py" \
            --questions "$GITHUB_WORKSPACE/eval/retrieval_recheck/holdout20_questions.json" \
            --frozen "$GITHUB_WORKSPACE/frozen-corpus" \
            --output "$RUNNER_TEMP/holdout-candidate"
      - name: Install weak reader
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull qwen2.5:1.5b
      - name: Task 4.4 weak-reader baseline and candidate
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP']); root=Path.cwd()
          protocol=json.loads((root/'eval/retrieval_recheck/holdout20_protocol.json').read_text())
          system=protocol['reader']['prompt']
          def ask(question,payload):
              body={'model':protocol['reader']['model'],'stream':False,'messages':[
                  {'role':'system','content':system},
                  {'role':'user','content':'QUESTION:\n'+question+'\n\nCONTEXT (public packet JSON):\n'+json.dumps(payload,ensure_ascii=False,separators=(',',':'))}
              ],'options':{'temperature':protocol['reader']['temperature'],'seed':protocol['reader']['seed'],'num_predict':protocol['reader']['num_predict']}}
              req=urllib.request.Request('http://127.0.0.1:11434/api/chat',data=json.dumps(body).encode(),headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=180) as r: data=json.loads(r.read())
              return data['message']['content']
          outputs={}
          for lane in ('baseline','candidate'):
              src=json.loads((t/f'holdout-{lane}'/'holdout-retrieval.json').read_text())
              rows=[]
              for row in src['cases']:
                  ans=ask(row['question'],row['public_payload'])
                  rows.append({**row,'reader_answer':ans})
                  print(lane,row['id'],repr(ans[:180]),flush=True)
              outputs[lane]=rows
              (t/f'holdout-{lane}-reader.json').write_text(json.dumps({'cases':rows},indent=2,ensure_ascii=False))
          diffs=[]
          for a,b in zip(outputs['baseline'],outputs['candidate']):
              assert a['id']==b['id']
              if a['public_payload']!=b['public_payload'] or a['reader_answer']!=b['reader_answer']:
                  diffs.append(a['id'])
          (t/'holdout-pair-summary.json').write_text(json.dumps({'changed_ids':diffs},indent=2))
          print('holdout changed ids',diffs)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-recheck-acceptance-4-1-to-4-4
          path: |
            ${{ runner.temp }}/task41-safety.log
            ${{ runner.temp }}/generic30-baseline.json
            ${{ runner.temp }}/generic30-candidate.json
            ${{ runner.temp }}/generic30-compare.json
            ${{ runner.temp }}/external80-baseline/summary.json
            ${{ runner.temp }}/external80-baseline/rows.json
            ${{ runner.temp }}/external80-candidate/summary.json
            ${{ runner.temp }}/external80-candidate/rows.json
            ${{ runner.temp }}/external80-compare.json
            ${{ runner.temp }}/holdout-baseline/holdout-retrieval.json
            ${{ runner.temp }}/holdout-candidate/holdout-retrieval.json
            ${{ runner.temp }}/holdout-baseline-reader.json
            ${{ runner.temp }}/holdout-candidate-reader.json
            ${{ runner.temp }}/holdout-pair-summary.json
            ${{ runner.temp }}/ollama.log
