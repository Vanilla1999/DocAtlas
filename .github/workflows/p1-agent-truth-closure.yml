name: P1 Agent Truth closure

on:
  pull_request:
    branches: [main, p1/p1.6-evidence-is-data]
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCMANCER_OFFLINE: "1"

jobs:
  p1-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install DocAtlas evaluator dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify every P1 evidence slice and final claim boundary
        run: |
          python scripts/run_agent_developer_first_divergence_gate.py
          python scripts/first_divergence_contract_self_test.py
          python scripts/run_agent_contract_v2_ablation_gate.py
          python scripts/agent_contract_v2_ablation_self_test.py
          python scripts/run_paraphrase_proofability_gate.py
          python scripts/paraphrase_proofability_self_test.py
          python scripts/run_mixed_evidence_provenance_gate.py
          python scripts/mixed_evidence_provenance_self_test.py
          python scripts/run_evidence_is_data_gate.py
          python scripts/evidence_is_data_self_test.py
          python scripts/run_agent_developer_adversarial_gate.py
          python scripts/run_agent_developer_adversarial_mutation_gate.py
          python scripts/run_p1_agent_truth_closure_gate.py
          python scripts/p1_agent_truth_closure_self_test.py
          python -m compileall -q eval/agent_developer_v1 scripts
          git diff --check
