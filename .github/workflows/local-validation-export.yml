name: Validate version evidence and agent contract
on:
  push:
    branches: [fix/version-evidence-skill-validation]
    paths: [.github/workflows/local-validation-export.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCATLAS_OFFLINE: '1'
      DOCATLAS_AUTO_VECTORS: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/version-evidence-skill-validation
          fetch-depth: 2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Apply the locally validated patch
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          encoded=''
          data=gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(data).hexdigest()=='ee26d54e3ead6260ee8e260e17608d2e96c6bc50b90aec020a00a9519ebec594'
          path=pathlib.Path('/tmp/version-evidence.patch');path.write_bytes(data)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          PY
      - name: Install test dependencies without tokenizers or models
        run: |
          python - <<'PY'
          import subprocess,sys,tomllib
          d=tomllib.load(open('pyproject.toml','rb'))
          deps=[x for x in d['project']['dependencies'] if not x.startswith(('tiktoken','fastembed'))]
          deps+=d['project']['optional-dependencies']['dev']
          subprocess.run([sys.executable,'-m','pip','install','-q',*deps],check=True)
          PY
      - name: Verify unchanged public contracts and new stateful regressions
        run: |
          python -m pytest -q tests/docs/test_dependency_version_transition.py tests/docs/test_agent_recovery_version_guidance.py tests/docs/test_agent_question_planning_contract.py tests/docs/test_host_scope_contract.py tests/docs/test_host_scope_planning_contract.py tests/test_install_cmd.py tests/docs/test_mcp_docs_tools_registration.py
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('tiktoken') is None
          PY
          git diff --check
      - name: Publish validated files and remove temporary exporter
        run: |
          rm .github/workflows/local-validation-export.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve version-bound mixed evidence and clarify agent workflow'
          git push origin HEAD:fix/version-evidence-skill-validation
