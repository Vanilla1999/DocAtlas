name: TEMP materialize P1.3 contract ablation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCMANCER_OFFLINE: "1"

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'p1/p1.3-contract-v2-ablation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: p1/p1.3-contract-v2-ablation
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build and validate exact P1.3 decision evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("tests/diagnostic_labels.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          module = "tests/test_agent_developer_contract_v2_ablation.py"
          manifest["module_labels"][module] = "behavioral"
          manifest["module_node_hashes"][module] = (
              "8307682ee29726f5fbb0c980f0b08c311b2f33316b0d6437bf7c996c359482c2"
          )
          path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          python -m pip install -e ".[dev]"
          python scripts/build_agent_contract_v2_ablation.py
          pytest -q tests/test_agent_developer_contract_v2_ablation.py
          python scripts/build_agent_contract_v2_ablation.py --check
          rm .github/workflows/temp-materialize-p1.3-ablation.yml
          git diff --check

      - name: Commit only generated evidence and carrier deletion
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          changed="$(git diff --cached --name-only)"
          expected="$(printf '%s\n' \
            .github/workflows/temp-materialize-p1.3-ablation.yml \
            docs/analysis/p1.3-agent-contract-v2-ablation.md \
            eval/agent_developer_v1/results/contract-v2-ablation.json \
            tests/diagnostic_labels.json)"
          test "$changed" = "$expected" || {
            printf 'unexpected P1.3 materialized diff\nactual:\n%s\nexpected:\n%s\n' "$changed" "$expected"
            exit 1
          }
          git commit -m "docs(p1): materialize the Agent Contract v2 ablation"
          git push origin HEAD:p1/p1.3-contract-v2-ablation
