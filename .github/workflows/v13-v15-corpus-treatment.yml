name: V13 corpus treatment
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths:
      - .github/workflows/v13-v15-corpus-treatment.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout capture assets
        uses: actions/checkout@v4
        with:
          path: assets
      - name: Checkout treated runtime
        uses: actions/checkout@v4
        with:
          ref: 63062b0375071ff0546bc4cb8936c502f9cc171b
          path: runtime-treated
      - name: Checkout treated corpus
        uses: actions/checkout@v4
        with:
          ref: 63062b0375071ff0546bc4cb8936c502f9cc171b
          path: corpus-treated
      - uses: astral-sh/setup-uv@v6
      - name: Install treated runtime
        working-directory: runtime-treated
        run: uv sync --frozen --extra dev
      - name: Capture treated corpus
        working-directory: runtime-treated
        run: |
          PYTHONPATH="$PWD" uv run --frozen --extra dev python             ../assets/scripts/run_v13_v15_diagnostic30.py             --project-root ../corpus-treated             --questions ../assets/eval/project_context_quality/v13_v15_questions.json             --output ../dr30-treated-corpus.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-v15-corpus-treatment
          path: dr30-treated-corpus.json
