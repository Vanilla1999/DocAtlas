name: V13 post-doc trace
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths:
      - .github/workflows/v13-post-doc-trace.yml

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout treated runtime
        uses: actions/checkout@v4
        with:
          ref: 63062b0375071ff0546bc4cb8936c502f9cc171b
          path: runtime
      - name: Checkout treated corpus
        uses: actions/checkout@v4
        with:
          ref: 63062b0375071ff0546bc4cb8936c502f9cc171b
          path: corpus
      - uses: astral-sh/setup-uv@v6
      - working-directory: runtime
        run: uv sync --frozen --extra dev
      - name: Trace V13 exact and paraphrase
        working-directory: runtime
        run: |
          PYTHONPATH="$PWD" uv run --frozen --extra dev python - <<'PY'
          import json, os
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from docmancer.agent import DocmancerAgent
          from docmancer.core.config import DocmancerConfig
          from docmancer.docs.registry import LibraryRegistry
          from docmancer.docs.service import DocsJobTracker, LibraryDocsService
          from docmancer.docs.application.evidence_selection import build_requirements
          from docmancer.docs.domain.documentation_query_plan import build_documentation_query_plan
          from docmancer.docs.domain.question_plan import compile_question_plan

          ROOT = Path("../corpus").resolve()
          CASES = {
              "V13": "How does DocAtlas report omitted material when a bounded documentation response cannot include everything?",
              "V14": "If a DocAtlas response is too large to include every non-critical detail, how is that omission surfaced to the caller?",
          }
          PATH = "docs/mcp-response-contract.md"
          NEEDLE = "When a bounded Docs MCP response returns"

          def row(c):
              md = dict(c.metadata or {})
              matches = {}
              for qid, trace in (md.get("retrieval_query_matches") or {}).items():
                  if isinstance(trace, dict):
                      matches[str(qid)] = {
                          k: trace.get(k) for k in (
                              "qualified", "qualification_reason", "relation",
                              "match_ratio", "body_matched_terms", "matched_terms",
                              "query_terms", "exact_terms", "missing_exact_terms",
                              "missing_parent_exact_terms", "public_parent_query_id",
                          )
                      }
              span = md.get("line_span") or (None, None)
              return {
                  "path": str(md.get("project_doc_path") or md.get("source_path") or c.source or ""),
                  "line_start": span[0], "line_end": span[1],
                  "score": float(c.score),
                  "retrieval_query_ids": list(md.get("retrieval_query_ids") or ()),
                  "retrieval_query_matches": matches,
                  "text": c.text,
              }

          def hits(rows):
              return [
                  {"index": i, **x} for i, x in enumerate(rows)
                  if x["path"] == PATH and NEEDLE.casefold() in x["text"].casefold()
              ]

          with TemporaryDirectory(prefix="v13-post-doc-") as raw:
              tmp = Path(raw)
              os.environ["DOCATLAS_HOME"] = str(tmp / "home")
              cfg = DocmancerConfig()
              cfg.index.db_path = str(tmp / "db.sqlite")
              cfg.index.extracted_dir = str(tmp / "extracted")
              svc = LibraryDocsService(
                  config=cfg, config_source="explicit",
                  registry=LibraryRegistry(cfg.index.db_path),
                  agent=DocmancerAgent(config=cfg), job_tracker=DocsJobTracker(),
              )
              assert svc.sync_project_docs(str(ROOT), with_vectors=False).status == "success"

              out = {"code_sha": os.environ.get("GITHUB_SHA"), "cases": {}}
              for cid, question in CASES.items():
                  qp = compile_question_plan(question)
                  req = build_requirements(question, profile="project_docs_answer")
                  plan = build_documentation_query_plan(question, lookup_queries=(), requirements=req)
                  case = {
                      "question_plan": {
                          "facets": [
                              {
                                  "kind": x.kind, "subject": x.subject, "relation": x.relation,
                                  "target": x.target, "context": x.context,
                              } for x in qp.facets
                          ],
                          "unresolved_parts": list(qp.unresolved_parts),
                          "parse_trace": list(qp.parse_trace),
                          "component_scope_complete": qp.component_scope_complete,
                      },
                      "documentation_query_plan": plan.as_payload(),
                      "variants": {},
                  }
                  for limit, tokens in ((20, 800), (80, 800), (20, 4000), (80, 4000)):
                      chunks = svc.project_docs.query_project_docs(
                          str(ROOT), question, limit=limit, tokens=tokens, scope="project",
                          requirements=req, lookup_queries=(), documentation_query_plan=plan,
                      )
                      rows = [row(c) for c in chunks]
                      case["variants"][f"limit{limit}_tokens{tokens}"] = {
                          "count": len(rows), "hits": hits(rows),
                          "top_paths": [x["path"] for x in rows[:25]],
                      }
                  out["cases"][cid] = case

              Path("../v13-post-doc.json").write_text(
                  json.dumps(out, ensure_ascii=False, indent=2, default=str) + "\n",
                  encoding="utf-8",
              )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v13-post-doc-trace
          path: v13-post-doc.json
