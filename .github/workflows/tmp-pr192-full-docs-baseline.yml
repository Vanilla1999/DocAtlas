name: Temporary PR192 exact path fix
on:
  push:
    branches: [fix/pr192-ci-hygiene]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      DOCATLAS_OFFLINE: '1'
      DOCATLAS_AUTO_VECTORS: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/pr192-ci-hygiene
          fetch-depth: 20
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Apply minimal exact-path fix and reviewed manifest refresh
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib, json

          path = Path('docmancer/docs/domain/evidence_qualification.py')
          text = path.read_text()
          old = '''    if str(probe.get("mode") or "") == "exact_path":\n        query_text = str(probe.get("query_text") or "").replace("\\\\", "/").casefold()\n        qualified = bool(query_text and query_text in normalized_visible)\n'''
          new = '''    if str(probe.get("mode") or "") == "exact_path":\n        query_text = str(probe.get("query_text") or "").replace("\\\\", "/").casefold()\n        normalized_visible = visible_text.replace("\\\\", "/").casefold()\n        qualified = bool(query_text and query_text in normalized_visible)\n'''
          if old not in text:
              raise SystemExit('exact-path qualification block not found')
          path.write_text(text.replace(old, new, 1))

          reviewed = {
              'tests/diagnostic_labels.direct_questions.json': ['tests/docs/test_direct_question_retrieval_intents.py'],
              'tests/diagnostic_labels.v2_acceptance_gaps.json': ['tests/docs/test_v2_acceptance_gaps.py'],
          }
          for manifest_name, modules in reviewed.items():
              manifest = Path(manifest_name)
              data = json.loads(manifest.read_text())
              for module in modules:
                  assert data['module_labels'][module] == 'behavioral'
                  tree = ast.parse(Path(module).read_text())
                  nodes = sorted(
                      f'{module}::{node.name}' for node in tree.body
                      if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                      and node.name.startswith('test_')
                  )
                  data['module_node_hashes'][module] = hashlib.sha256('\n'.join(nodes).encode()).hexdigest()
              manifest.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Install test dependencies
        run: |
          python - <<'PY'
          import subprocess, sys, tomllib
          data = tomllib.load(open('pyproject.toml','rb'))
          deps = [x for x in data['project']['dependencies'] if not x.startswith(('tiktoken','fastembed'))]
          deps += data['project']['optional-dependencies']['dev']
          subprocess.run([sys.executable, '-m', 'pip', 'install', '-q', *deps], check=True)
          PY
      - name: Exact-path RED suite must be green
        run: |
          set -euo pipefail
          python -m pytest -q tests/docs/test_evidence_qualification.py
          python -m pytest -q tests/docs/test_exact_document_fallback_context.py
          python -m pytest -q tests/docs/test_context_projection_boundaries.py -k path_only_projection_uses_the_current_exact_topic_guard
          python -m compileall -q docmancer
          git diff --check
      - name: Commit validated hygiene fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/tmp-pr192-full-docs-baseline.yml
          git add docmancer/docs/domain/evidence_qualification.py \
                  tests/diagnostic_labels.direct_questions.json \
                  tests/diagnostic_labels.v2_acceptance_gaps.json \
                  .github/workflows/tmp-pr192-full-docs-baseline.yml
          git commit -m 'fix: restore exact path qualification and diagnostic inventory'
          git push origin HEAD:fix/pr192-ci-hygiene
