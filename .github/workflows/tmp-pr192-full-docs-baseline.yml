name: Temporary PR192 full docs baseline
on:
  push:
    branches: [fix/pr192-ci-hygiene]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    env:
      DOCATLAS_OFFLINE: '1'
      DOCATLAS_AUTO_VECTORS: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/pr192-ci-hygiene
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python - <<'PY'
          import subprocess, sys, tomllib
          data = tomllib.load(open('pyproject.toml','rb'))
          deps = [x for x in data['project']['dependencies'] if not x.startswith(('tiktoken','fastembed'))]
          deps += data['project']['optional-dependencies']['dev']
          subprocess.run([sys.executable, '-m', 'pip', 'install', '-q', *deps], check=True)
          PY
      - name: Audit diagnostic manifest hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib, json
          stale=[]
          for manifest in sorted(Path('tests').glob('diagnostic_labels*.json')):
              data=json.loads(manifest.read_text())
              for module, expected in (data.get('module_node_hashes') or {}).items():
                  path=Path(module)
                  if not path.exists():
                      stale.append((str(manifest), module, 'missing-module', expected, None))
                      continue
                  tree=ast.parse(path.read_text())
                  nodes=sorted(
                      f'{module}::{node.name}' for node in tree.body
                      if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name.startswith('test_')
                  )
                  actual=hashlib.sha256('\n'.join(nodes).encode()).hexdigest()
                  if actual != expected:
                      stale.append((str(manifest), module, data.get('module_labels',{}).get(module), expected, actual))
          print('STALE_MANIFESTS', json.dumps(stale, indent=2))
          PY
      - name: Refresh reviewed stale diagnostic hashes in workspace
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib, json
          reviewed = {
              'tests/diagnostic_labels.direct_questions.json': ['tests/docs/test_direct_question_retrieval_intents.py'],
              'tests/diagnostic_labels.v2_acceptance_gaps.json': ['tests/docs/test_v2_acceptance_gaps.py'],
          }
          for manifest_name, modules in reviewed.items():
              path=Path(manifest_name); data=json.loads(path.read_text())
              for module in modules:
                  assert data['module_labels'][module] == 'behavioral'
                  tree=ast.parse(Path(module).read_text())
                  nodes=sorted(
                      f'{module}::{node.name}' for node in tree.body
                      if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name.startswith('test_')
                  )
                  data['module_node_hashes'][module]=hashlib.sha256('\n'.join(nodes).encode()).hexdigest()
                  print('REFRESH', manifest_name, module, data['module_node_hashes'][module], len(nodes))
              path.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Full docs suite after reviewed inventory refresh
        run: python -m pytest -q tests/docs
