name: Temporary PR192 full docs baseline
on:
  push:
    branches: [fix/pr192-ci-hygiene]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    env:
      DOCATLAS_OFFLINE: '1'
      DOCATLAS_AUTO_VECTORS: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/pr192-ci-hygiene
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python - <<'PY'
          import subprocess, sys, tomllib
          data = tomllib.load(open('pyproject.toml','rb'))
          deps = [x for x in data['project']['dependencies'] if not x.startswith(('tiktoken','fastembed'))]
          deps += data['project']['optional-dependencies']['dev']
          subprocess.run([sys.executable, '-m', 'pip', 'install', '-q', *deps], check=True)
          PY
      - name: Refresh reviewed direct-question diagnostic hash in workspace
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib, json
          module = 'tests/docs/test_direct_question_retrieval_intents.py'
          tree = ast.parse(Path(module).read_text())
          nodes = sorted(
              f'{module}::{node.name}'
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and node.name.startswith('test_')
          )
          path = Path('tests/diagnostic_labels.direct_questions.json')
          data = json.loads(path.read_text())
          assert data['module_labels'][module] == 'behavioral'
          data['module_node_hashes'][module] = hashlib.sha256('\n'.join(nodes).encode()).hexdigest()
          path.write_text(json.dumps(data, indent=2) + '\n')
          print(module, data['module_node_hashes'][module], len(nodes))
          PY
      - name: Full docs suite after inventory refresh
        run: python -m pytest -q tests/docs
