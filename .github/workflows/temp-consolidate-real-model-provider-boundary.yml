name: TEMP consolidate real-model provider boundary

on:
  push:
    branches: [p1/installed-mcp-real-model-capture-clean]
    paths:
      - .github/workflows/temp-consolidate-real-model-provider-boundary.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

