''',
                  '''def _provider_safe_value(value: Any, replacements: Mapping[str, str]) -> Any:
    if isinstance(value, dict):
        return {
            str(key): _provider_safe_value(child, replacements)
            for key, child in value.items()
        }
    if isinstance(value, list):
        return [_provider_safe_value(child, replacements) for child in value]
    if isinstance(value, tuple):
        return [_provider_safe_value(child, replacements) for child in value]
    if isinstance(value, str):
        result = value
        for raw, token in sorted(replacements.items(), key=lambda item: len(item[0]), reverse=True):
            if not raw:
                continue
            result = result.replace(raw, token)
            result = result.replace(raw.replace("/", "\\\\"), token)
        return result
    return value


def _restore_provider_tokens(value: Any, replacements: Mapping[str, str]) -> Any:
    inverse = {token: raw for raw, token in replacements.items()}
    if isinstance(value, dict):
        return {
            str(key): _restore_provider_tokens(child, replacements)
            for key, child in value.items()
        }
    if isinstance(value, list):
        return [_restore_provider_tokens(child, replacements) for child in value]
    if isinstance(value, str):
        result = value
        for token, raw in inverse.items():
            result = result.replace(token, raw)
        return result
    return value


def _driver_environment(names: Sequence[str]) -> dict[str, str]:
    allowed = set(BASE_DRIVER_ENV_NAMES)
    for name in names:
        if not re.fullmatch(r"[A-Z][A-Z0-9_]{0,127}", name):
            raise HarnessError(f"invalid --driver-env name: {name!r}")
        allowed.add(name)
    return {name: os.environ[name] for name in sorted(allowed) if name in os.environ}


def _assert_provider_payload_safe(payload: dict[str, Any], *, secret_values: Sequence[str]) -> int:
    rendered = canonical_json(payload)
    encoded = rendered.encode("utf-8")
    if len(encoded) > 64_000:
        raise HarnessError("provider-visible turn exceeds 64 KiB")
    for pattern in ABSOLUTE_PATH_PATTERNS:
        match = pattern.search(rendered)
        if match:
            raise HarnessError(
                f"provider-visible turn contains an absolute path: {match.group(0)[:160]}"
            )
    for value in secret_values:
        if len(value) >= 8 and value in rendered:
            raise HarnessError("provider-visible turn contains a credential value")
    return len(encoded)


