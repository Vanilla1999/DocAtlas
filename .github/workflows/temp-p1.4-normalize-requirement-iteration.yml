name: TEMP normalise P1.4 requirement iteration

on:
  push:
    branches: [p1/p1.4-paraphrase-proofability]
    paths:
      - .github/workflows/temp-p1.4-normalize-requirement-iteration.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: p1/p1.4-paraphrase-proofability
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Make planner requirement iteration shape-tolerant
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("eval/agent_developer_v1/paraphrase_robustness.py")
          text = path.read_text(encoding="utf-8")
          old = '''    for item in requirements:
                  values.extend([
                      str(getattr(item, "value", "") or ""),
                      str(getattr(item, "subject", "") or ""),
                      str(getattr(item, "attribute", "") or ""),
                      str(getattr(item, "relation", "") or ""),
                  ])
                  values.extend(str(value) for value in getattr(item, "subject_aliases", ()))
          '''
          new = '''    items = getattr(requirements, "requirements", None)
              if items is None:
                  try:
                      items = list(requirements)
                  except TypeError:
                      items = []
              for item in items:
                  values.extend([
                      str(getattr(item, "value", "") or ""),
                      str(getattr(item, "subject", "") or ""),
                      str(getattr(item, "attribute", "") or ""),
                      str(getattr(item, "relation", "") or ""),
                  ])
                  values.extend(str(value) for value in getattr(item, "subject_aliases", ()))
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'items = getattr(requirements, "requirements", None)' not in text:
              raise SystemExit("P1.4 requirement iteration anchor missing")
          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/temp-p1.4-normalize-requirement-iteration.yml
          python -m compileall -q eval/agent_developer_v1/paraphrase_robustness.py
          git diff --check
      - name: Commit ordinary source only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(p1): tolerate the concrete requirement container shape"
          git push origin HEAD:p1/p1.4-paraphrase-proofability
