name: PR191 query-planning completion TDD v2

on:
  push:
    branches: [fix/query-planning-scope]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"

jobs:
  tdd:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/query-planning-scope
          fetch-depth: 0
          persist-credentials: true

      - name: Verify staging-only delta
        shell: bash
        run: |
          set -euo pipefail
          base="196da000edf28fcfea9718d5dd3d5f43ad857e39"
          git merge-base --is-ancestor "$base" HEAD
          allowed='^\.github/(pr191_tdd_completion\.py|pr191_tdd_kick\.txt|workflows/pr191-tdd-completion\.yml|workflows/pr191-tdd-completion-v2\.yml)$'
          extras="$(git diff --name-only "$base"..HEAD | grep -Ev "$allowed" || true)"
          test -z "$extras"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies except tiktoken
        shell: bash
        run: |
          python - <<'PY'
          import subprocess, sys, tomllib
          data = tomllib.loads(open('pyproject.toml', 'rb').read().decode())
          deps = [d for d in data['project']['dependencies'] if not d.lower().startswith('tiktoken')]
          deps += data['project']['optional-dependencies']['dev']
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '-q', *deps])
          PY
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('tiktoken') is None
          PY

      - name: Write tests
        run: python .github/pr191_tdd_completion.py tests

      - name: RED - source eligibility
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/docs/test_query_planning_completion_safety.py::test_same_atom_continuation_rechecks_source_eligibility > "$RUNNER_TEMP/red-source.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/red-source.log"
          test "$status" -eq 1
          grep -q '5 failed' "$RUNNER_TEMP/red-source.log"

      - name: RED - condition lineage
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/docs/test_query_planning_completion_safety.py::test_conditional_host_lookup_cannot_drop_an_additional_condition > "$RUNNER_TEMP/red-lineage.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/red-lineage.log"
          test "$status" -eq 1
          grep -q '4 failed' "$RUNNER_TEMP/red-lineage.log"

      - name: Apply minimal fixes
        run: python .github/pr191_tdd_completion.py fix

      - name: Compile
        run: |
          python -m compileall -q \
            docmancer/docs/domain/evidence_qualification.py \
            docmancer/docs/application/_docs_context_projection_core.py \
            docmancer/docs/domain/documentation_query_plan.py

      - name: GREEN - completion and related suites
        run: |
          python -m pytest -q \
            tests/docs/test_query_planning_completion_safety.py \
            tests/docs/test_relation_preserving_projection.py \
            tests/docs/test_v2_acceptance_gaps.py \
            tests/docs/test_query_planning_alias_regressions.py \
            tests/docs/test_query_planning_scope_regressions.py \
            tests/docs/test_query_planning_temporal_regressions.py \
            tests/docs/test_query_planning_budget_regressions.py

      - name: Ask questions through public get_docs_context handler
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, os, tempfile
          from pathlib import Path
          from docmancer.agent import DocmancerAgent
          from docmancer.core.config import DocmancerConfig
          from docmancer.docs.application.docs_job_service import DocsJobTracker
          from docmancer.docs.registry import LibraryRegistry
          from docmancer.docs.service import LibraryDocsService
          from docmancer.mcp.docs_server import call_docs_tool_payload

          questions = [
            ('N01', 'A Flutter project uses go_router. How does DocAtlas decide which documentation version should be used for that dependency?'),
            ('N02', 'I changed a dependency version in the lockfile. What should happen so DocAtlas does not keep serving documentation for the old version?'),
            ('N03', 'Can an agent treat a successful documentation search hit as proof that the requested fact is actually supported? Why or why not?'),
            ('N04', 'A dependency is declared with a version range, but there is no exact lockfile resolution. How should DocAtlas represent the version binding?'),
            ('N05', 'If a project documentation file is deleted from the repository, what happens to its indexed content on the next sync_project_docs run?'),
            ('N06', 'get_docs_context returned insufficient_evidence. Should the agent always call prepare_docs next, or only under specific conditions?'),
            ('N07', 'Which DocAtlas files or databases are derived artifacts that may be rebuilt, and what remains the source of truth?'),
            ('N08', 'I need to change query intent classification and model-visible context projection. Which application/domain modules own those responsibilities?'),
            ('N09', 'What information in a docs_context response lets an agent trace the visible evidence back to its source?'),
            ('N10', 'Does DocAtlas execute shell commands or instructions found inside documentation while retrieving context?'),
            ('N11', 'What happens in offline mode when the documentation needed for a question has not been prefetched or indexed yet?'),
            ('N12', 'prepare_docs returned a job_id. What should the agent do next, and when should it retry the original question?'),
            ('N13', 'Can DocAtlas replace repository code search, the package manager, or the coding agent itself?'),
            ('N14', 'How do project documentation and dependency/library documentation differ in retrieval scope and provenance?'),
            ('N15', 'Based on the project evidence, which product-quality claims should we avoid making because they have not been demonstrated yet?'),
            ('N16', 'Что должен сделать агент, если get_docs_context вернул недостаточно доказательств для ответа по документации проекта?'),
            ('N17', 'Если версия зависимости изменилась в lockfile, как DocAtlas должен защитить агента от документации старой версии?'),
            ('A01-EN', 'The documentation preparation task finished with an error. Should I repeat my original question now, or take another step first?'),
            ('A01-RU', 'Задача подготовки документации завершилась с ошибкой. Нужно ли сейчас повторить исходный вопрос или сначала сделать что-то другое?'),
            ('A02-EN', "My laptop has no network access and this dependency's docs have never been cached. Can a normal documentation query fetch them?"),
            ('A02-RU', 'Ноутбук не подключён к сети, а документация этой зависимости никогда не кэшировалась. Может ли обычный запрос документации загрузить её?'),
            ('A03-EN', "How is searching this repository's own documentation different from searching an external package's documentation?"),
            ('A03-RU', 'Чем поиск по собственной документации этого репозитория отличается от поиска по документации внешнего пакета?'),
            ('A04-EN', 'A document contains a shell command. Is that command automatically authorised to run just because the search returned the document?'),
            ('A04-RU', 'Документ содержит команду оболочки. Разрешено ли автоматически выполнить её только потому, что поиск вернул этот документ?'),
            ('A05-EN', 'After changing a package version in the lockfile, may the agent reuse documentation for the previously resolved version?'),
            ('A05-RU', 'После изменения версии пакета в lockfile может ли агент повторно использовать документацию ранее разрешённой версии?'),
            ('A06-EN', 'The local index was deleted, but repository documentation files still exist. What is lost and how is the index restored?'),
            ('A06-RU', 'Локальный индекс удалён, но файлы документации репозитория остались. Что потеряно и как восстановить индекс?'),
            ('C01', 'Which command starts the Docs MCP server?'),
            ('C02', 'Which three public tools does the Docs MCP server expose?'),
          ]

          class CountingAgent:
              def __init__(self, inner):
                  self.inner = inner
                  self.calls = 0
              def query(self, *args, **kwargs):
                  self.calls += 1
                  return self.inner.query(*args, **kwargs)
              def __getattr__(self, name):
                  return getattr(self.inner, name)

          root = Path('.').resolve()
          rows = []
          with tempfile.TemporaryDirectory() as td:
              os.environ['DOCATLAS_HOME'] = td
              config = DocmancerConfig()
              config.index.db_path = str(Path(td) / 'docatlas.db')
              config.index.extracted_dir = str(Path(td) / 'extracted')
              agent = CountingAgent(DocmancerAgent(config=config))
              service = LibraryDocsService(
                  config=config, config_source='explicit',
                  registry=LibraryRegistry(config.index.db_path), agent=agent,
                  job_tracker=DocsJobTracker(),
              )
              synced = service.sync_project_docs(str(root), with_vectors=False)
              assert synced.status == 'success', synced
              agent.calls = 0
              for case_id, question in questions:
                  before = agent.calls
                  payload = call_docs_tool_payload('get_docs_context', {
                      'question': question, 'project_path': str(root), 'scope': 'all',
                  }, service)
                  sources = payload.get('sources') or []
                  row = {
                      'id': case_id, 'question': question,
                      'lookup_calls': agent.calls - before,
                      'kind': payload.get('kind'),
                      'context_quality': payload.get('context_quality'),
                      'estimated_tokens': payload.get('estimated_tokens'),
                      'covered_query_ids': payload.get('covered_query_ids'),
                      'missing_query_ids': payload.get('missing_query_ids'),
                      'sources': [{
                          'path_or_url': src.get('path_or_url'), 'section': src.get('section'),
                          'line_start': src.get('line_start'), 'line_end': src.get('line_end'),
                          'evidence_id': src.get('evidence_id'), 'snippet': src.get('snippet'),
                      } for src in sources],
                  }
                  assert len(sources) <= 3
                  assert int(row['estimated_tokens'] or 0) <= 800
                  rows.append(row)
                  print(f"QUESTION {case_id}: tokens={row['estimated_tokens']} lookups={row['lookup_calls']} sources={len(sources)} quality={row['context_quality']}")
          by_id = {row['id']: row for row in rows}
          assert (by_id['N16']['context_quality'] or {}).get('status') != 'checked'
          assert (by_id['C01']['context_quality'] or {}).get('status') == 'checked'
          assert (by_id['C02']['context_quality'] or {}).get('status') == 'checked'
          out = Path(os.environ['RUNNER_TEMP']) / 'pr191-postfix-question-results.json'
          out.write_text(json.dumps({'results': rows}, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Upload question results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr191-postfix-question-results
          path: ${{ runner.temp }}/pr191-postfix-question-results.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish tested fix
        shell: bash
        run: |
          set -euo pipefail
          base="196da000edf28fcfea9718d5dd3d5f43ad857e39"
          git diff --check
          rm -f \
            .github/pr191_tdd_completion.py \
            .github/pr191_tdd_kick.txt \
            .github/workflows/pr191-tdd-completion.yml \
            .github/workflows/pr191-tdd-completion-v2.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve source policy and conditional lineage"
          test -z "$(git diff --name-only "$base"..HEAD | grep -E '^\.github/(pr191_tdd_completion\.py|pr191_tdd_kick\.txt|workflows/pr191-tdd-completion.*\.yml)$' || true)"
          git push origin HEAD:fix/query-planning-scope
