name: Align compact-context dependency policy

on:
  push:
    branches:
      - fix/compact-context-quality
    paths:
      - .github/workflows/align-compact-context-dependency-policy.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0
      - name: Align policy with current package metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          path = Path('docmancer/support_surfaces.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          core = data['dependency_policy']['current_core']
          if core.count('regex') != 1 or 'tiktoken' in core:
              raise SystemExit(f'unexpected dependency policy: {core!r}')
          core[core.index('regex')] = 'tiktoken'
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          rm -f .github/workflows/align-compact-context-dependency-policy.yml
          python -m json.tool docmancer/support_surfaces.json >/dev/null
          python -m pytest -q tests/test_support_surface_policy.py
          git diff --check
      - name: Commit aligned policy
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align dependency policy with package metadata'
          git push origin HEAD:fix/compact-context-quality
