name: P1.6 evidence is data

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCATLAS_OFFLINE: "1"

jobs:
  p1-6-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install DocAtlas evaluator dependencies
        run: python -m pip install -e ".[dev]"
      - name: Measure frozen documents through current public delivery
        run: python scripts/run_evidence_is_data_gate.py --output "$RUNNER_TEMP/p1.6-current-delivery.json"
      - name: Verify independent oracle controls and report integrity
        if: always()
        run: python scripts/evidence_is_data_self_test.py --report "$RUNNER_TEMP/p1.6-current-delivery.json"
      - name: Verify existing Agent Developer adversarial contract
        if: always()
        run: python scripts/run_agent_developer_adversarial_gate.py
      - name: Verify existing Agent Developer adversarial mutations
        if: always()
        run: python scripts/run_agent_developer_adversarial_mutation_gate.py
      - name: Verify source syntax and patch formatting
        if: always()
        run: |
          python -m compileall -q \
            eval/agent_developer_v1/evidence_is_data.py \
            eval/agent_developer_v1/evidence_is_data_runtime.py \
            scripts/run_evidence_is_data_gate.py \
            scripts/evidence_is_data_self_test.py
          git diff --check
      - name: Upload current P1.6 observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p1.6-current-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p1.6-current-delivery.json
          if-no-files-found: warn
          retention-days: 14
