name: PR111 focused diagnostic

on:
  push:
    branches: [p0/docatlas-state-identity]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCMANCER_OFFLINE: "1"

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Focused state-identity regression suite
        run: >-
          pytest -q --tb=short --maxfail=10
          tests/test_config.py
          tests/test_config_resolution.py
          tests/test_public_vector_retrieval.py
          tests/docs/test_agent_index_gateway.py
          tests/test_mcp_paths.py
          tests/test_mcp_idempotency.py
          tests/test_mcp_installer.py
          tests/test_mcp_doctor.py
          tests/test_docs_service_part10.py
          tests/test_index_storage_cleanup.py
