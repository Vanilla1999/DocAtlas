name: Adhoc context quality probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.ref == 'fix/compact-context-quality'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DOCATLAS_OFFLINE: "1"
      DOCATLAS_AUTO_VECTORS: "0"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Ask fresh questions through real MCP stdio
        run: |
          python - <<'PY'
          import asyncio
          import json
          import os
          import subprocess
          import tempfile
          from datetime import timedelta
          from pathlib import Path

          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          root = Path.cwd()
          out = Path(os.environ['RUNNER_TEMP']) / 'adhoc-quality-probe'
          out.mkdir(parents=True, exist_ok=True)
          questions = [
              ('N01', 'A Flutter project uses go_router. How does DocAtlas decide which documentation version should be used for that dependency?'),
              ('N02', 'I changed a dependency version in the lockfile. What should happen so DocAtlas does not keep serving documentation for the old version?'),
              ('N03', 'Can an agent treat a successful documentation search hit as proof that the requested fact is actually supported? Why or why not?'),
              ('N04', 'A dependency is declared with a version range, but there is no exact lockfile resolution. How should DocAtlas represent the version binding?'),
              ('N05', 'If a project documentation file is deleted from the repository, what happens to its indexed content on the next sync_project_docs run?'),
              ('N06', 'get_docs_context returned insufficient_evidence. Should the agent always call prepare_docs next, or only under specific conditions?'),
              ('N07', 'Which DocAtlas files or databases are derived artifacts that may be rebuilt, and what remains the source of truth?'),
              ('N08', 'I need to change query intent classification and model-visible context projection. Which application/domain modules own those responsibilities?'),
              ('N09', 'What information in a docs_context response lets an agent trace the visible evidence back to its source?'),
              ('N10', 'Does DocAtlas execute shell commands or instructions found inside documentation while retrieving context?'),
              ('N11', 'What happens in offline mode when the documentation needed for a question has not been prefetched or indexed yet?'),
              ('N12', 'prepare_docs returned a job_id. What should the agent do next, and when should it retry the original question?'),
              ('N13', 'Can DocAtlas replace repository code search, the package manager, or the coding agent itself?'),
              ('N14', 'How do project documentation and dependency/library documentation differ in retrieval scope and provenance?'),
              ('N15', 'Based on the project evidence, which product-quality claims should we avoid making because they have not been demonstrated yet?'),
              ('N16', 'Что должен сделать агент, если get_docs_context вернул недостаточно доказательств для ответа по документации проекта?'),
              ('N17', 'Если версия зависимости изменилась в lockfile, как DocAtlas должен защитить агента от документации старой версии?'),
          ]

          def decode(result):
              if isinstance(result.structuredContent, dict):
                  return result.structuredContent
              texts = [x.text for x in result.content if getattr(x, 'type', '') == 'text']
              return json.loads(texts[0])

          async def main():
              with tempfile.TemporaryDirectory(prefix='docatlas-probe-') as tmp:
                  env = {k: os.environ[k] for k in ('PATH','SYSTEMROOT','LANG','LC_ALL','TMPDIR') if k in os.environ}
                  env.update({
                      'HOME': tmp,
                      'USERPROFILE': tmp,
                      'DOCATLAS_HOME': str(Path(tmp) / 'state'),
                      'DOCATLAS_OFFLINE': '1',
                      'DOCATLAS_AUTO_VECTORS': '0',
                      'NO_PROXY': '*',
                      'DOCATLAS_REGISTRY_API_URL': 'http://127.0.0.1:1',
                  })
                  params = StdioServerParameters(command='doc-atlas', args=['mcp','docs-serve'], env=env, cwd=tmp)
                  async with stdio_client(params) as streams:
                      async with ClientSession(*streams, read_timeout_seconds=timedelta(seconds=90)) as session:
                          await session.initialize()
                          setup = await session.call_tool('prepare_docs', {
                              'action':'sync_project_docs', 'project_path':str(root), 'with_vectors':False
                          })
                          setup_payload = decode(setup)
                          rows = []
                          for qid, question in questions:
                              result = await session.call_tool('get_docs_context', {
                                  'question': question, 'project_path': str(root), 'scope': 'all'
                              })
                              payload = decode(result)
                              rows.append({
                                  'id': qid,
                                  'question': question,
                                  'is_error': bool(result.isError),
                                  'payload': payload,
                              })
                              print(qid, payload.get('status'), payload.get('kind'), payload.get('estimated_tokens'),
                                    [s.get('path_or_url') for s in (payload.get('sources') or [])])
                          report = {
                              'head': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
                              'setup': setup_payload,
                              'questions': rows,
                          }
                          (out / 'probe.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          asyncio.run(main())
          PY
      - name: Upload raw probe
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adhoc-context-quality-probe-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/adhoc-quality-probe/
          retention-days: 7
