name: Adhoc context quality probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.ref == 'fix/compact-context-quality'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DOCATLAS_OFFLINE: "1"
      DOCATLAS_AUTO_VECTORS: "0"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Ask weak-case paraphrases through real MCP stdio
        run: |
          python - <<'PY'
          import asyncio
          import json
          import os
          import subprocess
          import tempfile
          from datetime import timedelta
          from pathlib import Path

          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          root = Path.cwd()
          out = Path(os.environ['RUNNER_TEMP']) / 'adhoc-quality-probe'
          out.mkdir(parents=True, exist_ok=True)
          questions = [
              ('P01', 'How does DocAtlas resolve a Flutter package documentation version from pubspec.lock?'),
              ('P02', 'After pubspec.lock changes from go_router 14.8.1 to 15.0.0, how is the documentation version resolved on the next get_docs_context call?'),
              ('P03', 'Does sync_project_docs prune orphaned indexed sources when a project documentation file was deleted?'),
              ('P04', 'Where is project query intent classification implemented, and where is the model-visible docs context projection implemented?'),
              ('P05', 'Is text retrieved from documentation treated only as data, or can it authorize the agent to run tools and shell commands?'),
              ('P06', 'In offline mode, will get_docs_context fetch missing documentation from the network, or must missing evidence fail closed / require an explicit lifecycle action?'),
              ('P07', 'What is the difference between repository-owned project docs and external dependency docs in DocAtlas?'),
              ('P08', 'Which current claims are explicitly not demonstrated: autonomous live evidence planning, real coding-task improvement, and Context7 parity?'),
              ('P09', 'Если get_docs_context вернул insufficient_evidence, можно ли утверждать, что документация подтверждает ответ, и что делать дальше?'),
              ('P10', 'Если в pubspec.lock версия go_router сменилась с 14.8.1 на 15.0.0, откуда DocAtlas должен взять актуальную версию документации?'),
          ]

          def decode(result):
              if isinstance(result.structuredContent, dict):
                  return result.structuredContent
              texts = [x.text for x in result.content if getattr(x, 'type', '') == 'text']
              return json.loads(texts[0])

          async def main():
              with tempfile.TemporaryDirectory(prefix='docatlas-probe-') as tmp:
                  env = {k: os.environ[k] for k in ('PATH','SYSTEMROOT','LANG','LC_ALL','TMPDIR') if k in os.environ}
                  env.update({
                      'HOME': tmp,
                      'USERPROFILE': tmp,
                      'DOCATLAS_HOME': str(Path(tmp) / 'state'),
                      'DOCATLAS_OFFLINE': '1',
                      'DOCATLAS_AUTO_VECTORS': '0',
                      'NO_PROXY': '*',
                      'DOCATLAS_REGISTRY_API_URL': 'http://127.0.0.1:1',
                  })
                  params = StdioServerParameters(command='doc-atlas', args=['mcp','docs-serve'], env=env, cwd=tmp)
                  async with stdio_client(params) as streams:
                      async with ClientSession(*streams, read_timeout_seconds=timedelta(seconds=90)) as session:
                          await session.initialize()
                          setup = await session.call_tool('prepare_docs', {
                              'action':'sync_project_docs', 'project_path':str(root), 'with_vectors':False
                          })
                          setup_payload = decode(setup)
                          rows = []
                          for qid, question in questions:
                              result = await session.call_tool('get_docs_context', {
                                  'question': question, 'project_path': str(root), 'scope': 'all'
                              })
                              payload = decode(result)
                              rows.append({'id': qid, 'question': question, 'is_error': bool(result.isError), 'payload': payload})
                              print(qid, payload.get('status'), payload.get('kind'), payload.get('estimated_tokens'),
                                    [s.get('path_or_url') for s in (payload.get('sources') or [])])
                          report = {
                              'head': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
                              'setup': setup_payload,
                              'questions': rows,
                          }
                          (out / 'probe.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          asyncio.run(main())
          PY
      - name: Upload raw probe
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adhoc-context-quality-probe-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/adhoc-quality-probe/
          retention-days: 7
