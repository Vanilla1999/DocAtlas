name: DocAtlas vs Grounded sealed holdout\non:\n  push:\n    branches: [fix/v13-v15-evidence-pipeline]\n    paths: [.github/workflows/docatlas-vs-grounded-holdout.yml]\npermissions: {contents: read}\njobs:\n  compare:\n    runs-on: ubuntu-latest\n    timeout-minutes: 55\n    env:\n      DOCS_MCP_APP_TELEMETRY_ENABLED: 'false'\n      DOCS_MCP_SCRAPER_SECURITY_FILE_ACCESS_MODE: unrestricted\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/checkout@v4\n        with: {ref: 95e61265656283d609bc1328c46c52b2bf1a069e, path: frozen-corpus}\n      - uses: actions/setup-node@v4\n        with: {node-version: '22'}\n      - uses: astral-sh/setup-uv@v6\n      - run: uv sync --frozen --extra dev\n      - name: Install Grounded Docs and Ollama\n        shell: bash\n        run: |\n          set -euo pipefail\n          npm install --no-save @arabold/docs-mcp-server@3.1.0\n          curl -fsSL https://ollama.com/install.sh | sh\n          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &\n          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done\n          ollama pull all-minilm\n          ollama pull qwen2.5:1.5b\n      - name: Index exact external corpus in FTS and hybrid stores\n        shell: bash\n        env:\n          OPENAI_API_KEY: ollama\n          OPENAI_API_BASE: http://127.0.0.1:11434/v1\n          DOCS_MCP_EMBEDDING_MODEL: openai:all-minilm\n          DOCS_MCP_EMBEDDINGS_VECTOR_DIMENSION: '384'\n        run: |\n          set -euo pipefail\n          python - <<'PY' > "$RUNNER_TEMP/project-versions.tsv"\n          import json\n          from pathlib import Path\n          m=json.loads(Path('frozen-corpus/eval/evidence_quality_v2/source-manifest.json').read_text())\n          by={}\n          for r in m['sources']: by.setdefault(r['project'],set()).add(r['ref'])\n          for p,refs in sorted(by.items()):\n              assert len(refs)==1,(p,refs)\n              print(p, next(iter(refs)), sep='\t')\n          PY\n          while IFS=$'\t' read -r project version; do\n            src="$GITHUB_WORKSPACE/frozen-corpus/eval/evidence_quality_v2/sources/$project"\n            DOCS_MCP_APP_STORE_PATH="$RUNNER_TEMP/gd-fts" ./node_modules/.bin/docs-mcp-server scrape "$project" "file://$src" --version "$version" --quiet\n            DOCS_MCP_APP_STORE_PATH="$RUNNER_TEMP/gd-hybrid" ./node_modules/.bin/docs-mcp-server scrape "$project" "file://$src" --version "$version" --embedding-model openai:all-minilm --quiet\n          done < "$RUNNER_TEMP/project-versions.tsv"\n      - name: Search and build equal-budget/native packets\n        shell: bash\n        env:\n          OPENAI_API_KEY: ollama\n          OPENAI_API_BASE: http://127.0.0.1:11434/v1\n          DOCS_MCP_EMBEDDING_MODEL: openai:all-minilm\n          DOCS_MCP_EMBEDDINGS_VECTOR_DIMENSION: '384'\n        run: |\n          cat > "$RUNNER_TEMP/search_pack.py" <<'PY'\n          from __future__ import annotations\n          import json, os, subprocess\n          from pathlib import Path\n          from urllib.parse import urlparse, unquote\n          from docmancer.docs.application.model_visible_projection_helpers import docs_context_budget_tokens\n\n          root=Path.cwd(); tmp=Path(os.environ['RUNNER_TEMP']); cli=root/'node_modules/.bin/docs-mcp-server'\n          questions=json.loads((root/'eval/retrieval_recheck/holdout20_questions.json').read_text())['cases']\n          manifest=json.loads((root/'frozen-corpus/eval/evidence_quality_v2/source-manifest.json').read_text())\n          versions={}\n          for row in manifest['sources']:\n              versions.setdefault(row['project'],row['ref']); assert versions[row['project']]==row['ref']\n\n          def base_packet():\n              return {'kind':'docs_context','status':'ok','answer_supported':False,'answer_available':False,'edit_ready':False,'sources':[]}\n\n          def relpath(project,url):\n              p=Path(unquote(urlparse(url).path))\n              base=root/'frozen-corpus/eval/evidence_quality_v2/sources'/project\n              try:return p.relative_to(base).as_posix()\n              except Exception:return p.name\n\n          def src(project,version,row):\n              return {'path_or_url':relpath(project,row.get('url','')),'snippet':row.get('content',''),'version_binding':version}\n\n          def equal_pack(project,version,results):\n              packet=base_packet()\n              for row in results:\n                  if len(packet['sources'])>=3: break\n                  trial=json.loads(json.dumps(packet)); trial['sources'].append(src(project,version,row))\n                  if docs_context_budget_tokens(trial)<=800: packet=trial\n              packet['estimated_tokens']=docs_context_budget_tokens(packet)\n              return packet\n\n          def native_pack(project,version,results):\n              packet=base_packet(); packet['sources']=[src(project,version,r) for r in results[:3]]\n              packet['estimated_tokens']=docs_context_budget_tokens(packet)\n              return packet\n\n          def search(store,mode,project,version,q):\n              env=os.environ.copy(); env['DOCS_MCP_APP_STORE_PATH']=str(store)\n              cmd=[str(cli),'search',project,q,'--version',version,'--exact-match','--limit','5','--output','json','--quiet']\n              p=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,env=env,check=False)\n              if p.returncode: raise RuntimeError(p.stderr[-3000:])\n              return json.loads(p.stdout)\n\n          rows=[]\n          for c in questions:\n              project=c['project_group']; version=versions[project]\n              fts=search(tmp/'gd-fts','fts',project,version,c['question'])\n              hyb=search(tmp/'gd-hybrid','hybrid',project,version,c['question'])\n              rows.append({'id':c['id'],'project_group':project,'question':c['question'],\n                           'fts_results':fts,'hybrid_results':hyb,\n                           'fts_equal':equal_pack(project,version,fts),\n                           'hybrid_equal':equal_pack(project,version,hyb),\n                           'hybrid_native_top3':native_pack(project,version,hyb)})\n              print(c['id'],'fts',len(fts),'hyb',len(hyb),'tokens',rows[-1]['fts_equal']['estimated_tokens'],rows[-1]['hybrid_equal']['estimated_tokens'],rows[-1]['hybrid_native_top3']['estimated_tokens'],flush=True)\n          (tmp/'grounded-holdout20.json').write_text(json.dumps({'competitor':'@arabold/docs-mcp-server','version':'3.1.0','cases':rows},indent=2,ensure_ascii=False))\n          PY\n          PYTHONPATH="$PWD" uv run --frozen --extra dev python "$RUNNER_TEMP/search_pack.py"\n      - name: Run same weak reader on Grounded packets\n        shell: bash\n        run: |\n          python - <<'PY'\n          import json, os, urllib.request\n          from pathlib import Path\n          root=Path.cwd(); tmp=Path(os.environ['RUNNER_TEMP'])\n          data=json.loads((tmp/'grounded-holdout20.json').read_text())\n          proto=json.loads((root/'eval/retrieval_recheck/holdout20_protocol.json').read_text()); system=proto['reader']['prompt']\n          def ask(q,p):\n              body={'model':'qwen2.5:1.5b','stream':False,'messages':[{'role':'system','content':system},{'role':'user','content':'QUESTION:\n'+q+'\n\nCONTEXT (public packet JSON):\n'+json.dumps(p,ensure_ascii=False,separators=(',',':'))}],'options':{'temperature':0,'seed':0,'num_predict':160}}\n              req=urllib.request.Request('http://127.0.0.1:11434/api/chat',data=json.dumps(body).encode(),headers={'Content-Type':'application/json'})\n              with urllib.request.urlopen(req,timeout=180) as r:return json.loads(r.read())['message']['content']\n          for row in data['cases']:\n              for lane in ('fts_equal','hybrid_equal','hybrid_native_top3'):\n                  row[lane+'_reader']=ask(row['question'],row[lane])\n              print(row['id'],repr(row['fts_equal_reader'][:70]),repr(row['hybrid_equal_reader'][:70]),flush=True)\n          (tmp/'grounded-holdout20-reader.json').write_text(json.dumps(data,indent=2,ensure_ascii=False))\n          PY\n      - uses: actions/upload-artifact@v4\n        with:\n          name: docatlas-vs-grounded-holdout20\n          path: |\n            ${{ runner.temp }}/grounded-holdout20.json\n            ${{ runner.temp }}/grounded-holdout20-reader.json\n            ${{ runner.temp }}/project-versions.tsv\n            ${{ runner.temp }}/ollama.log\n