name: DocAtlas vs Grounded sealed holdout
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths: [.github/workflows/docatlas-vs-grounded-holdout.yml]
permissions: {contents: read}
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      DOCS_MCP_APP_TELEMETRY_ENABLED: 'false'
      DOCS_MCP_SCRAPER_SECURITY_FILE_ACCESS_MODE: unrestricted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: 95e61265656283d609bc1328c46c52b2bf1a069e, path: frozen-corpus}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - name: Install Grounded Docs and Ollama
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save @arabold/docs-mcp-server@3.1.0
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull all-minilm
          ollama pull qwen2.5:1.5b
      - name: Index exact external corpus in FTS and hybrid stores
        shell: bash
        env:
          OPENAI_API_KEY: ollama
          OPENAI_API_BASE: http://127.0.0.1:11434/v1
          DOCS_MCP_EMBEDDING_MODEL: openai:all-minilm
          DOCS_MCP_EMBEDDINGS_VECTOR_DIMENSION: '384'
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/project-versions.tsv"
          import json
          from pathlib import Path
          m=json.loads(Path('frozen-corpus/eval/evidence_quality_v2/source-manifest.json').read_text())
          by={}
          for r in m['sources']: by.setdefault(r['project'],set()).add(r['ref'])
          for p,refs in sorted(by.items()):
              assert len(refs)==1,(p,refs)
              print(p, next(iter(refs)), sep='\t')
          PY
          while IFS=$'\t' read -r project version; do
            src="$GITHUB_WORKSPACE/frozen-corpus/eval/evidence_quality_v2/sources/$project"
            DOCS_MCP_APP_STORE_PATH="$RUNNER_TEMP/gd-fts" ./node_modules/.bin/docs-mcp-server scrape "$project" "file://$src" --version "$version" --quiet
            DOCS_MCP_APP_STORE_PATH="$RUNNER_TEMP/gd-hybrid" ./node_modules/.bin/docs-mcp-server scrape "$project" "file://$src" --version "$version" --embedding-model openai:all-minilm --quiet
          done < "$RUNNER_TEMP/project-versions.tsv"
      - name: Search and build equal-budget/native packets
        shell: bash
        env:
          OPENAI_API_KEY: ollama
          OPENAI_API_BASE: http://127.0.0.1:11434/v1
          DOCS_MCP_EMBEDDING_MODEL: openai:all-minilm
          DOCS_MCP_EMBEDDINGS_VECTOR_DIMENSION: '384'
        run: |
          cat > "$RUNNER_TEMP/search_pack.py" <<'PY'
          from __future__ import annotations
          import json, os, subprocess
          from pathlib import Path
          from urllib.parse import urlparse, unquote
          from docmancer.docs.application.model_visible_projection_helpers import docs_context_budget_tokens

          root=Path.cwd(); tmp=Path(os.environ['RUNNER_TEMP']); cli=root/'node_modules/.bin/docs-mcp-server'
          questions=json.loads((root/'eval/retrieval_recheck/holdout20_questions.json').read_text())['cases']
          manifest=json.loads((root/'frozen-corpus/eval/evidence_quality_v2/source-manifest.json').read_text())
          versions={}
          for row in manifest['sources']:
              versions.setdefault(row['project'],row['ref']); assert versions[row['project']]==row['ref']

          def base_packet():
              return {'kind':'docs_context','status':'ok','answer_supported':False,'answer_available':False,'edit_ready':False,'sources':[]}

          def relpath(project,url):
              p=Path(unquote(urlparse(url).path))
              base=root/'frozen-corpus/eval/evidence_quality_v2/sources'/project
              try:return p.relative_to(base).as_posix()
              except Exception:return p.name

          def src(project,version,row):
              return {'path_or_url':relpath(project,row.get('url','')),'snippet':row.get('content',''),'version_binding':version}

          def equal_pack(project,version,results):
              packet=base_packet()
              for row in results:
                  if len(packet['sources'])>=3: break
                  trial=json.loads(json.dumps(packet)); trial['sources'].append(src(project,version,row))
                  if docs_context_budget_tokens(trial)<=800: packet=trial
              packet['estimated_tokens']=docs_context_budget_tokens(packet)
              return packet

          def native_pack(project,version,results):
              packet=base_packet(); packet['sources']=[src(project,version,r) for r in results[:3]]
              packet['estimated_tokens']=docs_context_budget_tokens(packet)
              return packet

          def search(store,project,version,q):
              env=os.environ.copy(); env['DOCS_MCP_APP_STORE_PATH']=str(store)
              cmd=[str(cli),'search',project,q,'--version',version,'--exact-match','--limit','5','--output','json','--quiet']
              p=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,env=env,check=False)
              if p.returncode: raise RuntimeError(p.stderr[-3000:])
              return json.loads(p.stdout)

          rows=[]
          for c in questions:
              project=c['project_group']; version=versions[project]
              fts=search(tmp/'gd-fts',project,version,c['question'])
              hyb=search(tmp/'gd-hybrid',project,version,c['question'])
              rows.append({'id':c['id'],'project_group':project,'question':c['question'],
                           'fts_results':fts,'hybrid_results':hyb,
                           'fts_equal':equal_pack(project,version,fts),
                           'hybrid_equal':equal_pack(project,version,hyb),
                           'hybrid_native_top3':native_pack(project,version,hyb)})
              print(c['id'],'fts',len(fts),'hyb',len(hyb),'tokens',rows[-1]['fts_equal']['estimated_tokens'],rows[-1]['hybrid_equal']['estimated_tokens'],rows[-1]['hybrid_native_top3']['estimated_tokens'],flush=True)
          (tmp/'grounded-holdout20.json').write_text(json.dumps({'competitor':'@arabold/docs-mcp-server','version':'3.1.0','cases':rows},indent=2,ensure_ascii=False))
          PY
          PYTHONPATH="$PWD" uv run --frozen --extra dev python "$RUNNER_TEMP/search_pack.py"
      - name: Run same weak reader on Grounded packets
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          root=Path.cwd(); tmp=Path(os.environ['RUNNER_TEMP'])
          data=json.loads((tmp/'grounded-holdout20.json').read_text())
          proto=json.loads((root/'eval/retrieval_recheck/holdout20_protocol.json').read_text()); system=proto['reader']['prompt']
          def ask(q,p):
              user='QUESTION:\n'+q+'\n\nCONTEXT (public packet JSON):\n'+json.dumps(p,ensure_ascii=False,separators=(',',':'))
              body={'model':'qwen2.5:1.5b','stream':False,'messages':[{'role':'system','content':system},{'role':'user','content':user}],'options':{'temperature':0,'seed':0,'num_predict':160}}
              req=urllib.request.Request('http://127.0.0.1:11434/api/chat',data=json.dumps(body).encode(),headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=180) as r:return json.loads(r.read())['message']['content']
          for row in data['cases']:
              for lane in ('fts_equal','hybrid_equal','hybrid_native_top3'):
                  row[lane+'_reader']=ask(row['question'],row[lane])
              print(row['id'],repr(row['fts_equal_reader'][:70]),repr(row['hybrid_equal_reader'][:70]),flush=True)
          (tmp/'grounded-holdout20-reader.json').write_text(json.dumps(data,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: docatlas-vs-grounded-holdout20
          path: |
            ${{ runner.temp }}/grounded-holdout20.json
            ${{ runner.temp }}/grounded-holdout20-reader.json
            ${{ runner.temp }}/project-versions.tsv
            ${{ runner.temp }}/ollama.log
