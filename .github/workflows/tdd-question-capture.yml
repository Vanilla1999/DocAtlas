name: TDD question capture

on:
  push:
    branches: [fix/tdd-public-contract-20260926]
    paths:
      - eval/tdd_question_inventory.py
      - eval/tdd_questions30/**
      - scripts/run_tdd_questions30.py
      - tests/docs/test_tdd_question_inventory.py
      - tests/diagnostic_labels.tdd_question_inventory.json
      - .github/workflows/tdd-question-capture.yml

permissions:
  contents: read

concurrency:
  group: tdd-question-capture-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  inventory-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        id: install
        run: |
          mkdir -p "$RUNNER_TEMP/inventory"
          git rev-parse HEAD > "$RUNNER_TEMP/inventory/head.txt"
          sha256sum uv.lock > "$RUNNER_TEMP/inventory/lock.sha256"
          python -m pip install 'uv==0.9.25'
          uv sync --locked --extra dev --python 3.12
          uv pip freeze --python .venv/bin/python > "$RUNNER_TEMP/inventory/freeze.txt"
      - name: Run capture contract tests
        run: |
          set -o pipefail
          .venv/bin/python -m pytest -q --tb=short tests/docs/test_tdd_question_inventory.py \
            --junitxml="$RUNNER_TEMP/inventory/tests.xml" 2>&1 | tee "$RUNNER_TEMP/inventory/tests.log"
      - name: Preserve sufficiency report controls
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          .venv/bin/python -m pytest -q --tb=short tests/docs/test_tdd_context_sufficiency.py \
            --junitxml="$RUNNER_TEMP/inventory/neighbors.xml" 2>&1 | tee "$RUNNER_TEMP/inventory/neighbors.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: tdd-inventory-${{ github.sha }}
          path: ${{ runner.temp }}/inventory
          if-no-files-found: error
          retention-days: 14
