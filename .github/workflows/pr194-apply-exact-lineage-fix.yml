name: PR194 apply exact-lineage fix
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths: [.github/workflows/pr194-apply-exact-lineage-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v13-v15-evidence-pipeline
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - name: Apply exact-lineage patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/pr194-exact-lineage-fix.patch.gz.b64 | gzip -dc > "$RUNNER_TEMP/lineage.patch"
          git apply --check "$RUNNER_TEMP/lineage.patch"
          git apply "$RUNNER_TEMP/lineage.patch"
          git diff --check
      - name: Verify six reproduced regressions
        shell: bash
        run: |
          uv run --frozen --extra dev pytest -q \
            'tests/docs/test_context_loss_boundaries.py::test_independent_lookup_cannot_drop_a_required_acronym' \
            'tests/docs/test_review_query_lineage.py::test_host_lookups_cannot_replace_original_alias_exact_terms[lookups0]' \
            'tests/docs/test_review_query_lineage.py::test_host_lookups_cannot_replace_original_alias_exact_terms[lookups1]' \
            'tests/docs/test_review_query_lineage.py::test_host_lookups_cannot_replace_original_alias_exact_terms[lookups2]' \
            'tests/docs/test_review_query_lineage.py::test_host_lookups_cannot_replace_original_alias_exact_terms[lookups3]' \
            'tests/test_docs_service_part02.py::test_tagging_uses_each_probe_own_terms_and_exact_terms'
      - name: Focused global-evidence gate
        shell: bash
        run: |
          uv run --frozen --extra dev pytest -q \
            tests/docs/test_discovery_independent_qualification.py \
            tests/docs/test_context_constraint_roles.py \
            tests/docs/test_substantive_markdown_labels.py \
            tests/docs/test_source_bound_subject_context.py \
            tests/docs/test_requested_need_partition.py \
            tests/docs/test_need_local_admission.py \
            tests/docs/test_requested_evidence_retention.py \
            tests/docs/test_question_only_lookup_arm.py
          uv run --frozen --extra dev python -m compileall -q docmancer
      - name: Commit verified fix and trigger core parity
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/pr194-exact-lineage-fix.patch.gz.b64
          git rm .github/workflows/pr194-apply-exact-lineage-fix.yml
          printf '\n# exact-lineage fix verification trigger\n' >> .github/workflows/pr194-global-evidence-core-parity.yml
          git add \
            docmancer/docs/domain/documentation_query_plan.py \
            docmancer/docs/domain/query_terms.py \
            tests/diagnostic_labels.global_evidence.json \
            tests/docs/test_context_constraint_roles.py \
            .github/workflows/pr194-global-evidence-core-parity.yml
          git config user.name "Vanilla1999"
          git config user.email "41183994+Vanilla1999@users.noreply.github.com"
          git commit -m "fix: preserve exact identity through source-bound retrieval"
          git push origin HEAD:fix/v13-v15-evidence-pipeline
