name: Temporary apply Commit D

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  apply:
    if: github.head_ref == 'tmp/question-surface-build' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: tmp/question-surface-build
      - name: Materialize reviewed Commit D patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .tmp/commit-d.patch.gz.b64.1 \
            .tmp/commit-d.patch.gz.b64.2 \
            .tmp/commit-d.patch.gz.b64.3 \
            .tmp/commit-d.patch.gz.b64.4 \
            | base64 -d > /tmp/commit-d.patch.gz
          gzip -t /tmp/commit-d.patch.gz
          gzip -dc /tmp/commit-d.patch.gz | git apply --index
          git restore --source=HEAD --staged --worktree .github/workflows/ci.yml
          git rm \
            .tmp/commit-d.patch.gz \
            .tmp/commit-d.patch.gz.b64.1 \
            .tmp/commit-d.patch.gz.b64.2 \
            .tmp/commit-d.patch.gz.b64.3 \
            .tmp/commit-d.patch.gz.b64.4 \
            .tmp/trigger-d
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "stage: materialize Commit D without workflow files"
          git push origin HEAD:tmp/question-surface-build
