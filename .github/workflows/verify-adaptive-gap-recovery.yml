name: Verify adaptive gap recovery

on:
  push:
    branches: [feat/adaptive-docs-query-planner]
    paths: [.github/workflows/verify-adaptive-gap-recovery.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Install locked test environment
        run: uv sync --frozen --extra dev
      - name: Run affected and adjacent contracts
        run: |
          uv run pytest -q \
            tests/docs/test_source_recovery_targeting.py \
            tests/docs/test_docs_context_read_next.py \
            tests/docs/test_source_continuation.py \
            tests/docs/test_context_quality.py \
            tests/docs/test_self_host_agent_contract_surface.py \
            tests/docs/test_context_capture_integrity.py \
            tests/docs/test_project_docs_catalog.py \
            tests/docs/test_query_planning_scope_regressions.py \
            tests/docs/test_agent_question_planning_contract.py \
            tests/docs/test_agent_recovery_version_guidance.py \
            tests/docs/test_host_scope_contract.py \
            tests/docs/test_host_scope_planning_contract.py \
            tests/docs/test_mcp_docs_tools_registration.py
      - name: Compile and hygiene gates
        run: |
          uv run python -m compileall -q docmancer eval
          git diff --check origin/main...HEAD
          uv run python - <<'PY'
          from pathlib import Path
          paths = [
              'docmancer/docs/application/source_recovery_ranges.py',
              'docmancer/docs/application/source_continuation.py',
              'docmancer/mcp/agent_workflow_contract.py',
              'eval/project_context_quality/capture_public_context.py',
          ]
          for raw in paths:
              path = Path(raw)
              lines = len(path.read_text(encoding='utf-8').splitlines())
              print(f'{raw}: {lines}')
              assert lines <= 1000, (raw, lines)
          PY
      - name: Remove temporary verification workflow after green
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/verify-adaptive-gap-recovery.yml
          git commit -m "chore: remove temporary adaptive-gap verification workflow"
          git push
