name: Scientific reader-view TDD
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths:
      - .github/workflows/scientific-reader-view-tdd.yml
      - eval/evidence_quality_v2/reader_views.py
      - tests/evidence_quality_v2/test_reader_views.py
      - tests/diagnostic_labels.reader_views.json

permissions:
  contents: read

jobs:
  reader-view:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - name: Reader view RED GREEN
        run: uv run --frozen --extra dev pytest tests/evidence_quality_v2/test_reader_views.py -q
