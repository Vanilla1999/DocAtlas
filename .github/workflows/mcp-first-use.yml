name: MCP fresh project installation
on:
  workflow_dispatch:
  push:
    branches: [fix/mcp-first-use]
permissions:
  contents: read
jobs:
  installed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Build and install candidate wheel
        run: |
          python -m pip install uv==0.9.25
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/venv" uv sync --frozen --no-dev --no-install-project
          uv build --wheel --out-dir "$RUNNER_TEMP/wheels"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" --no-deps "$RUNNER_TEMP"/wheels/*.whl
      - name: First use through installed CLI and real MCP
        run: '"$RUNNER_TEMP/venv/bin/python" -I eval/opencode_compat/installed_stdio.py --first-use --out "$RUNNER_TEMP/evidence"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mcp-first-use
          path: ${{ runner.temp }}/evidence/
