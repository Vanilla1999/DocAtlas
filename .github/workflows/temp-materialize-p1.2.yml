name: TEMP materialize P1.2 first-divergence atlas

on:
  push:
    branches: [p1/p1.2-first-divergence-atlas]
    paths: [.github/workflows/temp-materialize-p1.2.yml]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: p1/p1.2-first-divergence-atlas
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Materialize exact reviewed files
        shell: bash
        env:
          ARCHIVE_SHA256: 4e555ef6cdd3528717189292faae70d7cf262aef4e9f8ea56e037781347e177e
        run: |
          set -euo pipefail
          cat > /tmp/p12.b64 <<'EOF'

EOF
          base64 --decode /tmp/p12.b64 > /tmp/p12.tgz
          test "$(sha256sum /tmp/p12.tgz | awk '{print $1}')" = "$ARCHIVE_SHA256"
          tar -xzf /tmp/p12.tgz
          rm .github/workflows/temp-materialize-p1.2.yml
          python scripts/run_agent_developer_first_divergence_gate.py
          python scripts/first_divergence_contract_self_test.py
          python -m compileall -q eval/agent_developer_v1/first_divergence.py scripts/run_agent_developer_first_divergence_gate.py scripts/first_divergence_contract_self_test.py
          git diff --check
      - name: Commit final reviewable P1.2 slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(p1): add the 0-of-11 first-divergence atlas"
          git push origin HEAD:p1/p1.2-first-divergence-atlas
