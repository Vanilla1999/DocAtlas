name: TEMP harden installed MCP harness

on:
  push:
    branches: [p1/installed-mcp-live-harness]
    paths:
      - .github/workflows/temp-harden-installed-mcp-harness.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: p1/installed-mcp-live-harness
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Apply exact reviewed hardening edits
        env:
          PATCH_SHA256: 6f8914f299f87595b45e46008891a3fd480bbb1d6b2b876ee6ba2ad70cd65401
        run: |
          set -euo pipefail
          patch_b64=''
          printf '%s' "$patch_b64" | base64 --decode > /tmp/patch-installed-mcp.py
          test "$(sha256sum /tmp/patch-installed-mcp.py | awk '{print $1}')" = "$PATCH_SHA256"
          python /tmp/patch-installed-mcp.py
          rm .github/workflows/temp-harden-installed-mcp-harness.yml
          python -m compileall -q eval/agent_developer_v1 scripts/installed_mcp_contract_self_test.py
          python scripts/installed_mcp_contract_self_test.py
          git diff --check

      - name: Commit only final reviewable files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          changed="$(git diff --cached --name-only)"
          expected="$(printf '%s\n' \
            eval/agent_developer_v1/installed_mcp_benchmark.py \
            scripts/installed_mcp_contract_self_test.py)"
          test "$changed" = "$expected" || {
            echo "::error::unexpected hardening diff"
            printf 'actual:\n%s\nexpected:\n%s\n' "$changed" "$expected"
            exit 1
          }
          git commit -m "fix(p1): isolate provider secrets from installed MCP"
          git push origin HEAD:p1/installed-mcp-live-harness
