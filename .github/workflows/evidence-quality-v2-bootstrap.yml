name: Evidence quality v2 isolated bootstrap
on:
  push:
    branches: [fix/evidence-quality-v2-20260910]
    paths: ['.github/workflows/evidence-quality-v2-bootstrap.yml']
permissions:
  contents: read
concurrency:
  group: evidence-quality-v2-bootstrap-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOCATLAS_OFFLINE: '1'
      DOCATLAS_AUTO_VECTORS: '0'
      BASELINE_SHA: e1daf4fa68f16f626068f2c58646e2ebfd4293f7
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Capture public source and build offline wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/evidence-v2-bootstrap"
          mkdir -p "$OUT/wheels" "$OUT/tokenizer-cache"
          git merge-base --is-ancestor "$BASELINE_SHA" HEAD
          git worktree add --detach "$RUNNER_TEMP/evidence-v2-baseline" "$BASELINE_SHA"
          git bundle create "$OUT/source.bundle" HEAD refs/remotes/origin/main
          git bundle verify "$OUT/source.bundle" > "$OUT/bundle-verify.txt" 2>&1
          git rev-parse HEAD > "$OUT/bootstrap-head.txt"
          printf '%s\n' "$BASELINE_SHA" > "$OUT/baseline-head.txt"
          python -m pip wheel "$RUNNER_TEMP/evidence-v2-baseline[dev]" build 'hatchling<1.27' 'tiktoken==0.11.0' --wheel-dir "$OUT/wheels" > "$OUT/wheel-build.log" 2>&1
          python -m pip install --no-index --find-links "$OUT/wheels" 'doc-atlas[dev]' build 'hatchling<1.27' 'tiktoken==0.11.0' > "$OUT/install.log" 2>&1
          python -m pip freeze > "$OUT/pip-freeze.txt"
          TIKTOKEN_CACHE_DIR="$OUT/tokenizer-cache" python -c 'import tiktoken; e=tiktoken.get_encoding("cl100k_base"); assert e.encode("контекст / evidence")'
          python - "$OUT" <<'PY'
          import hashlib, json, platform, sqlite3, sys
          from pathlib import Path
          out = Path(sys.argv[1])
          paths = [p for p in out.rglob('*') if p.is_file()]
          manifest = {'schema_version': 'evidence-quality-v2-bootstrap-1',
                      'baseline_sha': 'e1daf4fa68f16f626068f2c58646e2ebfd4293f7',
                      'python': platform.python_version(), 'platform': platform.platform(),
                      'sqlite_version': sqlite3.sqlite_version,
                      'tokenizer': {'package': 'tiktoken', 'version': '0.11.0', 'encoding': 'cl100k_base',
                                    'role': 'fixed diagnostic tokenizer, not a claim about a host model'},
                      'files': [{'path': str(p.relative_to(out)), 'bytes': p.stat().st_size,
                                 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(paths)]}
          (out/'manifest.json').write_text(json.dumps(manifest, indent=2)+'\n')
          print('Captured files:', len(paths))
          PY
      - name: Preserve isolated public-source bootstrap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-v2-bootstrap-${{ github.sha }}
          path: ${{ runner.temp }}/evidence-v2-bootstrap/
          retention-days: 7
          compression-level: 0
