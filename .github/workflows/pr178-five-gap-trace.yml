name: PR178 five frozen gap trace

on:
  push:
    branches: [fix/context-first-project-reads]
    paths: [.github/workflows/pr178-five-gap-trace.yml]

permissions:
  contents: write

env:
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Trace five nonpassing frozen cases
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from copy import deepcopy
          from pathlib import Path
          from unittest.mock import patch

          from eval.project_context_quality_v2_protocol import load_cases, evaluate_case
          from scripts.run_project_docs_self_host_gate import LiveCase, run
          from docmancer.docs.interfaces.mcp import context_tools

          target_ids = (
              'v2-natural-architecture',
              'v2-natural-request-flow',
              'v2-natural-sync-renames',
              'v2-paraphrase-review-ready',
              'v2-paraphrase-search-trust',
          )
          interesting_paths = {
              'docs/modules/project-context-retrieval.md',
              'docs/project-docs-mcp-workflow.md',
              'CONTRIBUTING.md',
              'docs/modules/evidence-selection.md',
              'docs/mcp-docs-server.md',
              'README.md',
              'docs/PROJECT_MAP.md',
              'docs/modules/question-planning.md',
          }
          all_cases = {case['id']: case for lane in ('natural', 'exposed_paraphrases') for case in load_cases(lane)}
          rows = []
          for case_id in target_ids:
              case = all_cases[case_id]
              captured = []
              project_context = context_tools.project_docs_context
              def observe(**kwargs):
                  captured.append(deepcopy(kwargs.get('retrieval') or {}))
                  return project_context(**kwargs)
              with patch.object(context_tools, 'project_docs_context', observe):
                  result = run(cases=(LiveCase(
                      case_id=case['id'],
                      question=case['question'],
                      relevant_paths=(),
                      lookup_queries=tuple(case['lookup_queries']),
                      scope=case['scope'],
                  ),), negative_cases=())
              payload = result['results'][0]['payload']
              verdict = evaluate_case(case, payload)
              retrieval = captured[-1] if captured else {}
              candidates = []
              for index, candidate in enumerate(retrieval.get('context_pack') or []):
                  path = str(candidate.get('path') or candidate.get('source') or '')
                  if path not in interesting_paths:
                      continue
                  matches = {}
                  for query_id, trace in (candidate.get('retrieval_query_matches') or {}).items():
                      matches[query_id] = {
                          key: trace.get(key)
                          for key in (
                              'query_text', 'query_terms', 'exact_terms', 'matched_terms',
                              'missing_exact_terms', 'matched_term_count', 'match_ratio',
                              'lexical_score', 'qualified', 'qualification_reason',
                              'coverage_kind', 'relation', 'origin',
                          ) if key in trace
                      }
                  content = str(candidate.get('content') or candidate.get('display_text') or candidate.get('snippet') or '')
                  candidates.append({
                      'index': index,
                      'path': path,
                      'title': candidate.get('title'),
                      'section': candidate.get('section') or candidate.get('parent_title'),
                      'line_start': candidate.get('line_start'),
                      'stable_chunk_id': candidate.get('stable_chunk_id'),
                      'parent_logical_id': candidate.get('parent_logical_id'),
                      'authority': candidate.get('authority'),
                      'doc_scope': candidate.get('doc_scope'),
                      'retrieval_query_ids': candidate.get('retrieval_query_ids') or [],
                      'matches': matches,
                      'content': content,
                  })
              rows.append({
                  'id': case_id,
                  'question': case['question'],
                  'scope': case['scope'],
                  'lookup_queries': case['lookup_queries'],
                  'verdict': {
                      'semantic_useful': verdict['semantic_useful'],
                      'false_full_coverage': verdict['false_full_coverage'],
                      'obligations': [{
                          'id': item['id'], 'met': item['met'],
                      } for item in verdict['obligations']],
                  },
                  'query_plan': retrieval.get('documentation_query_plan') or {},
                  'candidate_count': len(retrieval.get('context_pack') or []),
                  'interesting_candidates': candidates,
                  'public': {
                      'status': payload.get('status'),
                      'paths': [source.get('path_or_url') for source in payload.get('sources') or []],
                      'sources': payload.get('sources') or [],
                      'covered_query_ids': payload.get('covered_query_ids') or [],
                      'missing_query_ids': payload.get('missing_query_ids') or [],
                      'estimated_tokens': payload.get('estimated_tokens'),
                      'answer_supported': payload.get('answer_supported'),
                      'edit_ready': payload.get('edit_ready'),
                  },
              })
          output = {
              'schema': 'docatlas-five-frozen-gap-trace-v1',
              'runtime_anchor': '01f7b43afb00ead4a151099b9b11c0a27b94eafe',
              'rows': rows,
          }
          path = Path('experiments/onboarding-30/five-frozen-gap-trace-20260907.json')
          path.write_text(json.dumps(output, ensure_ascii=False, indent=2) + '\n')
          print('TRACE_SUMMARY=' + json.dumps({
              row['id']: {
                  'candidate_count': row['candidate_count'],
                  'interesting': [(c['path'], list(c['matches'])) for c in row['interesting_candidates']],
                  'public_paths': row['public']['paths'],
                  'missing': [o['id'] for o in row['verdict']['obligations'] if not o['met']],
              }
              for row in rows
          }, ensure_ascii=False, sort_keys=True))
          PY
      - name: Save trace and remove transient workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr178-five-gap-trace.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/onboarding-30/five-frozen-gap-trace-20260907.json .github/workflows/pr178-five-gap-trace.yml
          git diff --cached --check
          git commit -m "test: record five frozen gap traces"
          git push origin HEAD:fix/context-first-project-reads
