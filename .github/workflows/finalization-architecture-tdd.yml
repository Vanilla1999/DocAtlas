name: Finalization architecture routing experiment

on:
  push:
    branches: [fix/context-first-project-reads-finalization]
    paths: [.github/workflows/finalization-architecture-tdd.yml]

permissions:
  contents: read

env:
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: [A, B, C]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads-finalization
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Apply isolated hypothesis
        shell: bash
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          scenario = os.environ['SCENARIO']
          if scenario in {'A', 'C'}:
              path = Path('docatlas.project-docs.yaml')
              text = path.read_text()
              old = '''  - path: docs/modules/project-context-retrieval.md\n    role: development\n    scope: module\n    module_path: docmancer/docs/application\n    description: Project context retrieval bounded context, application allocation, infrastructure port, and MCP invariants.\n'''
              new = '''  - path: docs/modules/project-context-retrieval.md\n    role: module_architecture\n    scope: module\n    module_path: docmancer/docs/application\n    description: Project context retrieval bounded context, application allocation, SQLite persistence and candidate generation, evidence qualification, infrastructure port, and MCP invariants.\n'''
              assert text.count(old) == 1
              path.write_text(text.replace(old, new, 1))
          if scenario in {'B', 'C'}:
              path = Path('docmancer/docs/domain/project_retrieval_intent.py')
              text = path.read_text()
              old = '    "project_architecture": (("project_architecture", "overview"), ("roadmap",)),\n'
              new = '    "project_architecture": (("project_architecture", "module_architecture", "overview"), ("roadmap",)),\n'
              assert text.count(old) == 1
              text = text.replace(old, new, 1)
              old = '''        emit(\n            "project_architecture",\n            True,\n            f"{product_prefix}project architecture overview components indexing retrieval storage",\n        )\n'''
              new = '''        emit(\n            "project_architecture",\n            True,\n            f"{product_prefix}project architecture overview components indexing retrieval storage",\n            f"{product_prefix}SQLite persistence candidate generation metadata evidence qualification",\n        )\n'''
              assert text.count(old) == 1
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Evaluate frozen architecture case
        shell: bash
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          python - <<'PY'
          import json, os
          from eval.project_context_quality_v2_protocol import evaluate_case, load_cases
          from scripts.run_project_docs_self_host_gate import LiveCase, run
          case = next(c for c in load_cases() if c['id'] == 'v2-natural-architecture')
          result = run(cases=(LiveCase(case_id=case['id'], question=case['question'], relevant_paths=(), lookup_queries=tuple(case['lookup_queries']), scope=case['scope']),), negative_cases=())
          payload = result['results'][0]['payload']
          verdict = evaluate_case(case, payload)
          print('ARCH_RESULT=' + json.dumps({
              'scenario': os.environ['SCENARIO'],
              'semantic_useful': verdict['semantic_useful'],
              'obligations': verdict['obligations'],
              'sources': [s['path_or_url'] for s in payload.get('sources', [])],
              'tokens': payload.get('estimated_tokens'),
              'false_full': verdict['false_full_coverage'],
              'answer_supported': payload.get('answer_supported'),
              'edit_ready': payload.get('edit_ready'),
          }, ensure_ascii=False))
          PY
