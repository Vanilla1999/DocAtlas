name: Finalization architecture routing GREEN

on:
  push:
    branches: [fix/context-first-project-reads-finalization]
    paths: [.github/workflows/finalization-architecture-tdd.yml]

permissions:
  contents: write

env:
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads-finalization
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Apply only proven domain intent fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docmancer/docs/domain/project_retrieval_intent.py')
          text = path.read_text()
          old = '    "project_architecture": (("project_architecture", "overview"), ("roadmap",)),\n'
          new = '    "project_architecture": (("project_architecture", "module_architecture", "overview"), ("roadmap",)),\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''        emit(\n            "project_architecture",\n            True,\n            f"{product_prefix}project architecture overview components indexing retrieval storage",\n        )\n'''
          new = '''        emit(\n            "project_architecture",\n            True,\n            f"{product_prefix}project architecture overview components indexing retrieval storage",\n            f"{product_prefix}SQLite persistence candidate generation metadata evidence qualification",\n        )\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))
          PY
          python -m compileall -q docmancer/docs/domain/project_retrieval_intent.py
          git diff --check
      - name: Targeted architecture GREEN
        run: pytest -q tests/docs/test_context_projection_boundaries.py::test_frozen_architecture_infrastructure_boundary_enters_retrieval_candidates
      - name: Neighboring retrieval contracts
        shell: bash
        run: |
          pytest -q tests/docs/test_context7_style_project_chat.py tests/docs/test_project_docs_catalog.py tests/docs/test_generic_context_workflows.py
          python scripts/run_agent_developer_adversarial_gate.py
      - name: Publish architecture slice
        shell: bash
        run: |
          rm .github/workflows/finalization-architecture-tdd.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docmancer/docs/domain/project_retrieval_intent.py .github/workflows/finalization-architecture-tdd.yml
          git diff --cached --check
          git commit -m "fix: route module architecture evidence"
          git push origin HEAD:fix/context-first-project-reads-finalization
