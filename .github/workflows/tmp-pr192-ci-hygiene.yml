name: Temporary PR192 CI hygiene baseline
on:
  push:
    branches: [tmp/pr192-ci-hygiene]
permissions:
  contents: write
jobs:
  full-docs-suite:
    runs-on: ubuntu-24.04
    env:
      DOCATLAS_OFFLINE: '1'
      DOCATLAS_AUTO_VECTORS: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: tmp/pr192-ci-hygiene
          fetch-depth: 20
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Apply exact-path qualification fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docmancer/docs/domain/evidence_qualification.py')
          text = path.read_text()
          old = '''    if str(probe.get("mode") or "") == "exact_path":\n        query_text = str(probe.get("query_text") or "").replace("\\\\", "/").casefold()\n        qualified = bool(query_text and query_text in normalized_visible)\n'''
          new = '''    if str(probe.get("mode") or "") == "exact_path":\n        query_text = str(probe.get("query_text") or "").replace("\\\\", "/").casefold()\n        normalized_visible = visible_text.replace("\\\\", "/").casefold()\n        qualified = bool(query_text and query_text in normalized_visible)\n'''
          if old not in text:
              raise SystemExit('exact-path qualification block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Refresh verified witness revision locks
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          sidecar_path = Path('eval/direct_docatlas_questions_15/cases.json')
          sidecar = json.loads(sidecar_path.read_text())
          sidecar['sources']['docs/DOCMANCER_PRODUCT_BRIEF.md']['git_blob_sha'] = '22c728f92e1647db0b7793a8e7a470203ede6a25'
          sidecar_path.write_text(json.dumps(sidecar, indent=2, ensure_ascii=False) + '\n')

          lock_path = Path('eval/project_context_quality_v2/protocol.lock.json')
          lock = json.loads(lock_path.read_text())
          lock['active_document_sha256']['docs/project-docs-mcp-workflow.md'] = '0b7264fd4572fa6827cf7965c218cf6a09c220c3a7f9fb81d53c113ff332b8c3'
          lock_path.write_text(json.dumps(lock, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Install offline-friendly dependencies
        run: |
          python - <<'PY'
          import subprocess, sys, tomllib
          data = tomllib.load(open('pyproject.toml','rb'))
          deps=[x for x in data['project']['dependencies'] if not x.startswith(('tiktoken','fastembed'))]
          deps += data['project']['optional-dependencies']['dev']
          subprocess.run([sys.executable,'-m','pip','install','-q',*deps], check=True)
          PY
      - name: Exact-path regression cluster
        run: |
          python -m pytest -q \
            tests/docs/test_evidence_qualification.py \
            tests/docs/test_context_projection_boundaries.py::test_path_only_projection_uses_the_current_exact_topic_guard \
            tests/docs/test_exact_document_fallback_context.py
      - name: Witness lock regression cluster
        run: |
          python -m pytest -q \
            tests/docs/test_direct_docatlas_questions_15.py::test_direct_docatlas_questions_15_visible_context_covers_all_required_facts \
            tests/docs/test_generic_context_workflows.py::test_stale_health_live_status_sync_and_removal
      - name: Full docs suite
        run: python -m pytest -q tests/docs
