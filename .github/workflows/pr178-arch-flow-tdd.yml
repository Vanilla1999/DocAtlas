name: PR178 architecture and request flow TDD

on:
  push:
    branches: [fix/context-first-project-reads]
    paths: [.github/workflows/pr178-arch-flow-tdd.yml]

permissions:
  contents: write

env:
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Apply bounded staged routing changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docatlas.project-docs.yaml')
          text = path.read_text()
          old = '''  - path: docs/modules/project-context-retrieval.md\n    role: development\n    scope: module\n    module_path: docmancer/docs/application\n    description: Project context retrieval bounded context, application allocation, infrastructure port, and MCP invariants.\n'''
          new = '''  - path: docs/modules/project-context-retrieval.md\n    role: module_architecture\n    scope: module\n    module_path: docmancer/docs/application\n    description: Project context retrieval bounded context, application allocation, SQLite persistence and candidate generation, evidence qualification, infrastructure port, and MCP invariants.\n'''
          assert text.count(old) == 1, 'project-context catalog entry drifted'
          path.write_text(text.replace(old, new, 1))

          path = Path('docmancer/docs/domain/project_retrieval_intent.py')
          text = path.read_text()
          old = '    "project_architecture": (("project_architecture", "overview"), ("roadmap",)),\n'
          new = '    "project_architecture": (("project_architecture", "module_architecture", "overview"), ("roadmap",)),\n'
          assert text.count(old) == 1, 'project architecture role policy drifted'
          text = text.replace(old, new, 1)
          old = '    "retrieval_pipeline": (("project_architecture", "api_contract"), ("roadmap",)),\n'
          new = '    "retrieval_pipeline": (("module_architecture", "project_architecture", "api_contract"), ("roadmap",)),\n'
          assert text.count(old) == 1, 'retrieval pipeline role policy drifted'
          text = text.replace(old, new, 1)

          old = '''        emit(\n            "retrieval_pipeline",\n            True,\n            f"{product_prefix}retrieval pipeline query planning ranking evidence selection",\n            f"{product_prefix}lexical vector retrieval data flow",\n        )\n'''
          new = '''        emit(\n            "retrieval_pipeline",\n            True,\n            f"{product_prefix}get_docs_context MCP adapter ProjectContextService",\n            f"{product_prefix}ProjectContextService query plan project retrieval",\n            f"{product_prefix}retrieval gateway filtered project chunks",\n            f"{product_prefix}selection maximizes distinct visible query coverage",\n        )\n'''
          assert text.count(old) == 1, 'retrieval pipeline aliases drifted'
          text = text.replace(old, new, 1)
          old = '''        emit(\n            "project_architecture",\n            True,\n            f"{product_prefix}project architecture overview components indexing retrieval storage",\n        )\n'''
          new = '''        emit(\n            "project_architecture",\n            True,\n            f"{product_prefix}project architecture overview components indexing retrieval storage",\n            f"{product_prefix}SQLite persistence candidate generation metadata evidence qualification",\n        )\n'''
          assert text.count(old) == 1, 'project architecture aliases drifted'
          path.write_text(text.replace(old, new, 1))

          path = Path('docmancer/docs/application/_project_docs_service_part03.py')
          text = path.read_text()
          old = '''            public_lookup = requirements is not None and any(item.origin == "host_lookup" for item in lookups)\n            # Public lookups need the same pre-qualification candidate window\n            # as the original question; projection owns the public budget.\n            lane = _run(\n                supplemental_query,\n                query_limit=effective_limit if public_lookup else 4,\n                query_budget=budget if public_lookup else supplemental_budget,\n                query_expand="none",\n                query_filters=filters,\n            )\n'''
          new = '''            public_lookup = requirements is not None and any(item.origin == "host_lookup" for item in lookups)\n            module_architecture_intent = any(\n                item.origin == "canonical_intent"\n                and "module_architecture" in tuple(item.preferred_catalog_roles or ())\n                for item in lookups\n            )\n            # Public lookups keep the full pre-qualification window. Canonical\n            # module-architecture lanes may inspect a few more internal sections\n            # without increasing the model-visible 3-source / 800-token budget.\n            lane = _run(\n                supplemental_query,\n                query_limit=(\n                    effective_limit if public_lookup\n                    else min(effective_limit, 8) if module_architecture_intent\n                    else 4\n                ),\n                query_budget=(\n                    budget if public_lookup\n                    else min(budget, max(512, budget // 2)) if module_architecture_intent\n                    else supplemental_budget\n                ),\n                query_expand="none",\n                query_filters=filters,\n            )\n'''
          assert text.count(old) == 1, 'supplemental lane window drifted'
          path.write_text(text.replace(old, new, 1))
          PY
          python -m compileall -q docmancer/docs/domain/project_retrieval_intent.py docmancer/docs/application/_project_docs_service_part03.py
          git diff --check
      - name: Verify architecture and request flow RED cases are GREEN
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/docs/test_context_projection_boundaries.py::test_frozen_architecture_infrastructure_boundary_enters_retrieval_candidates \
            tests/docs/test_context_projection_boundaries.py::test_frozen_request_flow_prefers_project_context_module_witnesses
      - name: Verify neighboring retrieval contracts
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/docs/test_context_projection_boundaries.py \
            tests/docs/test_context7_style_project_chat.py \
            tests/docs/test_generic_context_workflows.py \
            tests/docs/test_project_docs_catalog.py \
            tests/test_docs_service_part03.py
          python scripts/run_agent_developer_adversarial_gate.py
      - name: Verify full repository suite
        shell: bash
        run: |
          set -euo pipefail
          pytest -q
          python -m compileall -q docmancer tests scripts eval
          git diff --check
      - name: Publish only after full green
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr178-arch-flow-tdd.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: route architecture and request flow module evidence"
          git push origin HEAD:fix/context-first-project-reads
