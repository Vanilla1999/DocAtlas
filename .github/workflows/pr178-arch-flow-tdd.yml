name: PR178 audited flow rewrite TDD

on:
  push:
    branches: [fix/context-first-project-reads]
    paths: [.github/workflows/pr178-arch-flow-tdd.yml]

permissions:
  contents: write

env:
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"

      - name: Add safety regressions and refresh reviewed diagnostic hash
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import hashlib
          import json
          from pathlib import Path

          test_path = Path('tests/docs/test_context_projection_boundaries.py')
          text = test_path.read_text()
          marker = 'def test_audited_host_flow_rewrites_are_parent_bound_and_non_public():'
          assert marker not in text
          text += '''\n\ndef test_audited_host_flow_rewrites_are_parent_bound_and_non_public():\n    from docmancer.docs.domain.documentation_query_plan import build_documentation_query_plan\n\n    plan = build_documentation_query_plan(\n        "How does get_docs_context move from its request boundary to visible sources?",\n        lookup_queries=(\n            "What does the documentation request boundary accept?",\n            "How do retrieved chunks become selected visible sources?",\n        ),\n    )\n    payload = plan.as_payload()\n    rewrites = [\n        row for row in payload["queries"]\n        if row["relation"] == "audited_rewrite"\n        and row["public_parent_query_id"] in {"query-lookup-1", "query-lookup-2"}\n    ]\n    assert any(\n        row["public_parent_query_id"] == "query-lookup-1"\n        and "get_docs_context" in row["text"]\n        for row in rewrites\n    )\n    assert sum(row["public_parent_query_id"] == "query-lookup-2" for row in rewrites) == 2\n    assert not {row["query_id"] for row in rewrites} & set(payload["public_query_ids"])\n\n\ndef test_audited_host_flow_rewrites_fail_closed_on_negation_and_temporal_wording():\n    from docmancer.docs.domain.documentation_query_plan import build_documentation_query_plan\n\n    for lookup in (\n        "What does the documentation request boundary not accept?",\n        "How do retrieved chunks become selected visible sources before validation?",\n    ):\n        plan = build_documentation_query_plan(\n            "How does get_docs_context move from its request boundary to visible sources?",\n            lookup_queries=(lookup,),\n        ).as_payload()\n        assert not any(\n            row["relation"] == "audited_rewrite"\n            and row["public_parent_query_id"] == "query-lookup-1"\n            for row in plan["queries"]\n        )\n'''
          test_path.write_text(text)

          tree = ast.parse(text)
          nodeids = sorted(
              f'tests/docs/test_context_projection_boundaries.py::{node.name}'
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and node.name.startswith('test_')
          )
          digest = hashlib.sha256('\n'.join(nodeids).encode()).hexdigest()
          manifest_path = Path('tests/diagnostic_labels.projection_boundaries.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['module_node_hashes']['tests/docs/test_context_projection_boundaries.py'] = digest
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY
          git diff --check

      - name: Confirm parent-bound rewrite test is RED before implementation
        shell: bash
        run: |
          set +e
          pytest -q tests/docs/test_context_projection_boundaries.py::test_audited_host_flow_rewrites_are_parent_bound_and_non_public
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Expected audited host-flow rewrite regression to be RED before implementation"
            exit 1
          fi

      - name: Apply bounded architecture routing and audited host rewrites
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          catalog = Path('docatlas.project-docs.yaml')
          text = catalog.read_text()
          old = '''  - path: docs/modules/project-context-retrieval.md\n    role: development\n    scope: module\n    module_path: docmancer/docs/application\n    description: Project context retrieval bounded context, application allocation, infrastructure port, and MCP invariants.\n'''
          new = '''  - path: docs/modules/project-context-retrieval.md\n    role: module_architecture\n    scope: module\n    module_path: docmancer/docs/application\n    description: Project context retrieval bounded context, application allocation, SQLite persistence and candidate generation, evidence qualification, infrastructure port, and MCP invariants.\n'''
          assert text.count(old) == 1, 'project-context catalog entry drifted'
          catalog.write_text(text.replace(old, new, 1))

          intent = Path('docmancer/docs/domain/project_retrieval_intent.py')
          text = intent.read_text()
          old = '    "project_architecture": (("project_architecture", "overview"), ("roadmap",)),\n'
          new = '    "project_architecture": (("project_architecture", "module_architecture", "overview"), ("roadmap",)),\n'
          assert text.count(old) == 1, 'project architecture role policy drifted'
          text = text.replace(old, new, 1)
          old = '    "retrieval_pipeline": (("project_architecture", "api_contract"), ("roadmap",)),\n'
          new = '    "retrieval_pipeline": (("module_architecture", "project_architecture", "api_contract"), ("roadmap",)),\n'
          assert text.count(old) == 1, 'retrieval pipeline role policy drifted'
          text = text.replace(old, new, 1)
          old = '''        emit(\n            "project_architecture",\n            True,\n            f"{product_prefix}project architecture overview components indexing retrieval storage",\n        )\n'''
          new = '''        emit(\n            "project_architecture",\n            True,\n            f"{product_prefix}project architecture overview components indexing retrieval storage",\n            f"{product_prefix}SQLite persistence candidate generation metadata evidence qualification",\n        )\n'''
          assert text.count(old) == 1, 'project architecture aliases drifted'
          intent.write_text(text.replace(old, new, 1))

          plan = Path('docmancer/docs/domain/documentation_query_plan.py')
          text = plan.read_text()
          needle = '''    requirement_hints = tuple(\n        str(value).strip()\n        for value in getattr(requirements, "retrieval_hints", ())\n        if str(value).strip()\n    )\n'''
          helper = '''    def host_audited_rewrites(lookup_text: str) -> tuple[tuple[str, tuple[str, ...]], ...]:\n        """Return narrow semantic-preserving rewrites for known retrieval-flow wording."""\n        normalized = " ".join(lookup_text.casefold().split())\n        if re.search(r"\\b(?:not|never|no|without|except|before|after|until|unless)\\b", normalized):\n            return ()\n        tokens = tuple(re.findall(r"[a-z0-9_]+", normalized))\n        rows: list[tuple[str, tuple[str, ...]]] = []\n        if (\n            "documentation" in tokens and "request" in tokens and "boundary" in tokens\n            and any(token.startswith("accept") for token in tokens)\n        ):\n            anchors = technical_anchors(question)\n            if len(anchors) == 1:\n                anchor = anchors[0]\n                rows.append((\n                    f"{anchor} request boundary question project_path lookup_queries module_path scope",\n                    (anchor.casefold(),),\n                ))\n        if (\n            any(token.startswith("retriev") for token in tokens)\n            and any(token.startswith("chunk") for token in tokens)\n            and any(token.startswith("select") for token in tokens)\n            and any(token.startswith("visib") for token in tokens)\n            and any(token.startswith("source") for token in tokens)\n        ):\n            rows.extend((\n                ("retrieval gateway filtered project chunks field-level lexical match provenance exact-source indexed sections", ()),\n                ("selection maximizes distinct user-visible query coverage before expanding snippets", ()),\n            ))\n        return tuple(rows)\n\n''' + needle
          assert text.count(needle) == 1, 'query-plan insertion point drifted'
          text = text.replace(needle, helper, 1)

          old_loop = '''    for index, text in enumerate(lookup_queries[:5], start=1):\n        cleaned = text.strip()\n        if not cleaned:\n            continue\n        queries.append(DocumentationLookup(\n            f"query-lookup-{index}", cleaned, "host_lookup", False,\n            relation="host_lookup",\n            **host_policies(cleaned),\n        ))\n        seen.add(cleaned.casefold())\n'''
          new_loop = '''    for index, text in enumerate(lookup_queries[:5], start=1):\n        cleaned = text.strip()\n        if not cleaned:\n            continue\n        parent_query_id = f"query-lookup-{index}"\n        policies = host_policies(cleaned)\n        queries.append(DocumentationLookup(\n            parent_query_id, cleaned, "host_lookup", False,\n            relation="host_lookup",\n            **policies,\n        ))\n        seen.add(cleaned.casefold())\n        for rewrite_index, (rewrite_text, rewrite_parent_exact_terms) in enumerate(\n            host_audited_rewrites(cleaned), start=1,\n        ):\n            if rewrite_text.casefold() in seen:\n                continue\n            queries.append(DocumentationLookup(\n                f"query-lookup-{index}-rewrite-{rewrite_index}",\n                rewrite_text,\n                "concept_alias",\n                False,\n                relation="audited_rewrite",\n                public_parent_query_id=parent_query_id,\n                parent_exact_terms=rewrite_parent_exact_terms,\n                **policies,\n            ))\n            seen.add(rewrite_text.casefold())\n'''
          assert text.count(old_loop) == 1, 'host lookup loop drifted'
          plan.write_text(text.replace(old_loop, new_loop, 1))
          PY
          python -m compileall -q \
            docmancer/docs/domain/documentation_query_plan.py \
            docmancer/docs/domain/project_retrieval_intent.py
          git diff --check

      - name: Verify audited rewrite safety and frozen architecture/request-flow GREEN
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/docs/test_context_projection_boundaries.py::test_audited_host_flow_rewrites_are_parent_bound_and_non_public \
            tests/docs/test_context_projection_boundaries.py::test_audited_host_flow_rewrites_fail_closed_on_negation_and_temporal_wording \
            tests/docs/test_context_projection_boundaries.py::test_frozen_architecture_infrastructure_boundary_enters_retrieval_candidates \
            tests/docs/test_context_projection_boundaries.py::test_frozen_request_flow_prefers_project_context_module_witnesses

      - name: Verify neighboring retrieval and projection contracts
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/docs/test_context_projection_boundaries.py \
            tests/docs/test_context7_style_project_chat.py \
            tests/docs/test_generic_context_workflows.py \
            tests/docs/test_project_docs_catalog.py \
            tests/docs/test_question_plan_v4.py \
            tests/test_docs_service_part03.py
          python scripts/run_agent_developer_adversarial_gate.py

      - name: Verify full repository suite
        shell: bash
        run: |
          set -euo pipefail
          pytest -q
          python -m compileall -q docmancer tests scripts eval
          git diff --check

      - name: Publish only after full green
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr178-arch-flow-tdd.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: bind retrieval flow rewrites to host lookups"
          git push origin HEAD:fix/context-first-project-reads
