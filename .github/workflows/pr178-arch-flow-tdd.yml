name: PR178 architecture and request flow raw trace

on:
  push:
    branches: [fix/context-first-project-reads]
    paths: [.github/workflows/pr178-arch-flow-tdd.yml]

permissions:
  contents: read

env:
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Trace raw dispatcher lanes with bounded routing hypothesis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Apply only the routing hypothesis in this disposable runner. Nothing is committed.
          path = Path('docatlas.project-docs.yaml')
          text = path.read_text()
          old = '''  - path: docs/modules/project-context-retrieval.md\n    role: development\n    scope: module\n    module_path: docmancer/docs/application\n    description: Project context retrieval bounded context, application allocation, infrastructure port, and MCP invariants.\n'''
          new = '''  - path: docs/modules/project-context-retrieval.md\n    role: module_architecture\n    scope: module\n    module_path: docmancer/docs/application\n    description: Project context retrieval bounded context, application allocation, SQLite persistence and candidate generation, evidence qualification, infrastructure port, and MCP invariants.\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))

          path = Path('docmancer/docs/domain/project_retrieval_intent.py')
          text = path.read_text()
          text = text.replace(
              '    "project_architecture": (("project_architecture", "overview"), ("roadmap",)),\n',
              '    "project_architecture": (("project_architecture", "module_architecture", "overview"), ("roadmap",)),\n', 1)
          text = text.replace(
              '    "retrieval_pipeline": (("project_architecture", "api_contract"), ("roadmap",)),\n',
              '    "retrieval_pipeline": (("module_architecture", "project_architecture", "api_contract"), ("roadmap",)),\n', 1)
          old = '''        emit(\n            "retrieval_pipeline",\n            True,\n            f"{product_prefix}retrieval pipeline query planning ranking evidence selection",\n            f"{product_prefix}lexical vector retrieval data flow",\n        )\n'''
          new = '''        emit(\n            "retrieval_pipeline",\n            True,\n            f"{product_prefix}get_docs_context MCP adapter ProjectContextService",\n            f"{product_prefix}ProjectContextService query plan project retrieval",\n            f"{product_prefix}retrieval gateway filtered project chunks",\n            f"{product_prefix}selection maximizes distinct visible query coverage",\n        )\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''        emit(\n            "project_architecture",\n            True,\n            f"{product_prefix}project architecture overview components indexing retrieval storage",\n        )\n'''
          new = '''        emit(\n            "project_architecture",\n            True,\n            f"{product_prefix}project architecture overview components indexing retrieval storage",\n            f"{product_prefix}SQLite persistence candidate generation metadata evidence qualification",\n        )\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))
          PY
          python - <<'PY'
          import json
          from unittest.mock import patch

          from docmancer.retrieval.dispatch import RetrievalDispatcher
          from eval.project_context_quality_v2_protocol import load_cases, evaluate_case
          from scripts.run_project_docs_self_host_gate import LiveCase, run

          original_run = RetrievalDispatcher.run
          current_case = {'id': None}
          trace_rows = []

          def traced(self, query, **kwargs):
              result = original_run(self, query, **kwargs)
              chunks = []
              for rank, chunk in enumerate(result.chunks, 1):
                  metadata = chunk.metadata or {}
                  path = metadata.get('project_doc_path') or metadata.get('source_path') or chunk.source
                  if path == 'docs/modules/project-context-retrieval.md':
                      chunks.append({
                          'rank': rank,
                          'path': path,
                          'section': metadata.get('section') or metadata.get('parent_title'),
                          'heading_path': (metadata.get('section') or {}).get('heading_path') if isinstance(metadata.get('section'), dict) else None,
                          'chunk_index': chunk.chunk_index,
                          'score': chunk.score,
                          'content': chunk.text,
                      })
              trace_rows.append({
                  'case': current_case['id'],
                  'query': query,
                  'limit': kwargs.get('limit'),
                  'budget': kwargs.get('budget'),
                  'filters': kwargs.get('filters'),
                  'target_chunks': chunks,
              })
              return result

          cases = {c['id']: c for c in load_cases()}
          output = []
          with patch.object(RetrievalDispatcher, 'run', traced):
              for case_id in ('v2-natural-architecture', 'v2-natural-request-flow'):
                  case = cases[case_id]
                  current_case['id'] = case_id
                  result = run(cases=(LiveCase(
                      case_id=case['id'], question=case['question'], relevant_paths=(),
                      lookup_queries=tuple(case['lookup_queries']), scope=case['scope'],
                  ),), negative_cases=())
                  payload = result['results'][0]['payload']
                  verdict = evaluate_case(case, payload)
                  output.append({
                      'id': case_id,
                      'public_sources': payload.get('sources') or [],
                      'obligations': [{
                          'id': row['id'], 'met': row['met'],
                          'visible_witnesses': row.get('visible_witnesses') or [],
                      } for row in verdict['obligations']],
                  })
          print('RAW_LANES=' + json.dumps(trace_rows, ensure_ascii=False, sort_keys=True))
          print('PUBLIC=' + json.dumps(output, ensure_ascii=False, sort_keys=True))
          PY
