name: PR178 audited rewrite allocation TDD

on:
  push:
    branches: [fix/context-first-project-reads]
    paths: [.github/workflows/pr178-arch-flow-tdd.yml]

permissions:
  contents: write

env:
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"

      - name: Add reviewed safety regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, hashlib, json
          from pathlib import Path
          path = Path('tests/docs/test_context_projection_boundaries.py')
          text = path.read_text()
          assert 'test_audited_host_flow_rewrites_are_parent_bound_and_non_public' not in text
          text += '''\n\ndef test_audited_host_flow_rewrites_are_parent_bound_and_non_public():\n    from docmancer.docs.domain.documentation_query_plan import build_documentation_query_plan\n    plan = build_documentation_query_plan(\n        "How does get_docs_context move from its request boundary to visible sources?",\n        lookup_queries=(\n            "What does the documentation request boundary accept?",\n            "How do retrieved chunks become selected visible sources?",\n        ),\n    ).as_payload()\n    rewrites = [row for row in plan["queries"] if row["relation"] == "audited_rewrite"]\n    assert any(row["public_parent_query_id"] == "query-lookup-1" and "get_docs_context" in row["text"] for row in rewrites)\n    assert sum(row["public_parent_query_id"] == "query-lookup-2" for row in rewrites) == 2\n    assert not {row["query_id"] for row in rewrites} & set(plan["public_query_ids"])\n\n\ndef test_audited_host_flow_rewrites_fail_closed_on_negation_and_temporal_wording():\n    from docmancer.docs.domain.documentation_query_plan import build_documentation_query_plan\n    for lookup in (\n        "What does the documentation request boundary not accept?",\n        "How do retrieved chunks become selected visible sources before validation?",\n    ):\n        plan = build_documentation_query_plan(\n            "How does get_docs_context move from its request boundary to visible sources?",\n            lookup_queries=(lookup,),\n        ).as_payload()\n        assert not any(row["relation"] == "audited_rewrite" and row["public_parent_query_id"] == "query-lookup-1" for row in plan["queries"])\n'''
          path.write_text(text)
          nodeids = sorted(
              f'tests/docs/test_context_projection_boundaries.py::{node.name}'
              for node in ast.parse(text).body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name.startswith('test_')
          )
          manifest_path = Path('tests/diagnostic_labels.projection_boundaries.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['module_node_hashes']['tests/docs/test_context_projection_boundaries.py'] = hashlib.sha256('\n'.join(nodeids).encode()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY
          git diff --check

      - name: Apply bounded architecture routing, audited rewrites, and allocation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          catalog = Path('docatlas.project-docs.yaml')
          text = catalog.read_text()
          old = '''  - path: docs/modules/project-context-retrieval.md\n    role: development\n    scope: module\n    module_path: docmancer/docs/application\n    description: Project context retrieval bounded context, application allocation, infrastructure port, and MCP invariants.\n'''
          new = '''  - path: docs/modules/project-context-retrieval.md\n    role: module_architecture\n    scope: module\n    module_path: docmancer/docs/application\n    description: Project context retrieval bounded context, application allocation, SQLite persistence and candidate generation, evidence qualification, infrastructure port, and MCP invariants.\n'''
          assert text.count(old) == 1
          catalog.write_text(text.replace(old, new, 1))

          intent = Path('docmancer/docs/domain/project_retrieval_intent.py')
          text = intent.read_text()
          old = '    "project_architecture": (("project_architecture", "overview"), ("roadmap",)),\n'
          new = '    "project_architecture": (("project_architecture", "module_architecture", "overview"), ("roadmap",)),\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '    "retrieval_pipeline": (("project_architecture", "api_contract"), ("roadmap",)),\n'
          new = '    "retrieval_pipeline": (("module_architecture", "project_architecture", "api_contract"), ("roadmap",)),\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''        emit(\n            "project_architecture",\n            True,\n            f"{product_prefix}project architecture overview components indexing retrieval storage",\n        )\n'''
          new = '''        emit(\n            "project_architecture",\n            True,\n            f"{product_prefix}project architecture overview components indexing retrieval storage",\n            f"{product_prefix}SQLite persistence candidate generation metadata evidence qualification",\n        )\n'''
          assert text.count(old) == 1
          intent.write_text(text.replace(old, new, 1))

          plan = Path('docmancer/docs/domain/documentation_query_plan.py')
          text = plan.read_text()
          needle = '''    requirement_hints = tuple(\n        str(value).strip()\n        for value in getattr(requirements, "retrieval_hints", ())\n        if str(value).strip()\n    )\n'''
          helper = '''    def host_audited_rewrites(lookup_text: str) -> tuple[tuple[str, tuple[str, ...]], ...]:\n        normalized = " ".join(lookup_text.casefold().split())\n        if re.search(r"\\b(?:not|never|no|without|except|before|after|until|unless)\\b", normalized):\n            return ()\n        tokens = tuple(re.findall(r"[a-z0-9_]+", normalized))\n        rows: list[tuple[str, tuple[str, ...]]] = []\n        if "documentation" in tokens and "request" in tokens and "boundary" in tokens and any(token.startswith("accept") for token in tokens):\n            anchors = technical_anchors(question)\n            if len(anchors) == 1:\n                anchor = anchors[0]\n                rows.append((f"{anchor} request boundary question project_path lookup_queries module_path scope", (anchor.casefold(),)))\n        if (any(token.startswith("retriev") for token in tokens) and any(token.startswith("chunk") for token in tokens)\n            and any(token.startswith("select") for token in tokens) and any(token.startswith("visib") for token in tokens)\n            and any(token.startswith("source") for token in tokens)):\n            rows.extend((\n                ("retrieval gateway filtered project chunks field-level lexical match provenance exact-source indexed sections", ()),\n                ("selection maximizes distinct user-visible query coverage before expanding snippets", ()),\n            ))\n        return tuple(rows)\n\n''' + needle
          assert text.count(needle) == 1
          text = text.replace(needle, helper, 1)
          old_loop = '''    for index, text in enumerate(lookup_queries[:5], start=1):\n        cleaned = text.strip()\n        if not cleaned:\n            continue\n        queries.append(DocumentationLookup(\n            f"query-lookup-{index}", cleaned, "host_lookup", False,\n            relation="host_lookup",\n            **host_policies(cleaned),\n        ))\n        seen.add(cleaned.casefold())\n'''
          new_loop = '''    for index, text in enumerate(lookup_queries[:5], start=1):\n        cleaned = text.strip()\n        if not cleaned:\n            continue\n        parent_query_id = f"query-lookup-{index}"\n        policies = host_policies(cleaned)\n        queries.append(DocumentationLookup(parent_query_id, cleaned, "host_lookup", False, relation="host_lookup", **policies))\n        seen.add(cleaned.casefold())\n        for rewrite_index, (rewrite_text, rewrite_parent_exact_terms) in enumerate(host_audited_rewrites(cleaned), start=1):\n            if rewrite_text.casefold() in seen:\n                continue\n            queries.append(DocumentationLookup(\n                f"query-lookup-{index}-rewrite-{rewrite_index}", rewrite_text, "concept_alias", False,\n                relation="audited_rewrite", public_parent_query_id=parent_query_id,\n                parent_exact_terms=rewrite_parent_exact_terms, **policies,\n            ))\n            seen.add(rewrite_text.casefold())\n'''
          assert text.count(old_loop) == 1
          plan.write_text(text.replace(old_loop, new_loop, 1))

          service = Path('docmancer/docs/application/_project_docs_service_part03.py')
          text = service.read_text()
          old = '''        queries_by_origin: dict[str, list[list[Any]]] = {}\n        for item in documentation_query_plan.queries:\n            lane = supplemental_chunks_by_query.get(item.text)\n            if lane:\n                queries_by_origin.setdefault(item.origin, []).append(lane)\n        candidates = select_context_candidates([\n            [\n                *queries_by_origin.get("exact_path", []),\n                *queries_by_origin.get("exact_anchor", []),\n            ],\n            [[*authoritative_chunks, *chunks]],\n            queries_by_origin.get("host_lookup", []),\n            [\n                *queries_by_origin.get("canonical_intent", []),\n                *queries_by_origin.get("concept_alias", []),\n                *queries_by_origin.get("retrieval_hint", []),\n            ],\n        ])\n'''
          new = '''        queries_by_origin: dict[str, list[list[Any]]] = {}\n        audited_rewrite_lanes: list[list[Any]] = []\n        for item in documentation_query_plan.queries:\n            lane = supplemental_chunks_by_query.get(item.text)\n            if not lane:\n                continue\n            if item.relation == "audited_rewrite":\n                audited_rewrite_lanes.append(lane)\n            else:\n                queries_by_origin.setdefault(item.origin, []).append(lane)\n        candidates = select_context_candidates([\n            [\n                *queries_by_origin.get("exact_path", []),\n                *queries_by_origin.get("exact_anchor", []),\n            ],\n            [[*authoritative_chunks, *chunks]],\n            queries_by_origin.get("host_lookup", []),\n            audited_rewrite_lanes,\n            [\n                *queries_by_origin.get("canonical_intent", []),\n                *queries_by_origin.get("concept_alias", []),\n                *queries_by_origin.get("retrieval_hint", []),\n            ],\n        ])\n'''
          assert text.count(old) == 1, 'candidate allocation block drifted'
          service.write_text(text.replace(old, new, 1))
          PY
          python -m compileall -q docmancer/docs/domain/documentation_query_plan.py docmancer/docs/domain/project_retrieval_intent.py docmancer/docs/application/_project_docs_service_part03.py
          git diff --check

      - name: Verify safety and frozen architecture/request-flow
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/docs/test_context_projection_boundaries.py::test_audited_host_flow_rewrites_are_parent_bound_and_non_public \
            tests/docs/test_context_projection_boundaries.py::test_audited_host_flow_rewrites_fail_closed_on_negation_and_temporal_wording \
            tests/docs/test_context_projection_boundaries.py::test_frozen_architecture_infrastructure_boundary_enters_retrieval_candidates \
            tests/docs/test_context_projection_boundaries.py::test_frozen_request_flow_prefers_project_context_module_witnesses

      - name: Verify neighboring contracts and adversarial
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/docs/test_context_projection_boundaries.py \
            tests/docs/test_context7_style_project_chat.py \
            tests/docs/test_generic_context_workflows.py \
            tests/docs/test_project_docs_catalog.py \
            tests/docs/test_question_plan_v4.py \
            tests/test_docs_service_part03.py
          python scripts/run_agent_developer_adversarial_gate.py

      - name: Verify full repository suite
        shell: bash
        run: |
          set -euo pipefail
          pytest -q
          python -m compileall -q docmancer tests scripts eval
          git diff --check

      - name: Publish only after full green
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr178-arch-flow-tdd.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: prioritize audited host rewrite candidates"
          git push origin HEAD:fix/context-first-project-reads
