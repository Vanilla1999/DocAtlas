name: PR178 audited flow candidate trace

on:
  push:
    branches: [fix/context-first-project-reads]
    paths: [.github/workflows/pr178-arch-flow-tdd.yml]

permissions:
  contents: read

env:
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Apply disposable implementation and trace candidate loss
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          catalog = Path('docatlas.project-docs.yaml')
          text = catalog.read_text()
          old = '''  - path: docs/modules/project-context-retrieval.md\n    role: development\n    scope: module\n    module_path: docmancer/docs/application\n    description: Project context retrieval bounded context, application allocation, infrastructure port, and MCP invariants.\n'''
          new = '''  - path: docs/modules/project-context-retrieval.md\n    role: module_architecture\n    scope: module\n    module_path: docmancer/docs/application\n    description: Project context retrieval bounded context, application allocation, SQLite persistence and candidate generation, evidence qualification, infrastructure port, and MCP invariants.\n'''
          assert text.count(old) == 1
          catalog.write_text(text.replace(old, new, 1))

          intent = Path('docmancer/docs/domain/project_retrieval_intent.py')
          text = intent.read_text()
          text = text.replace(
              '    "project_architecture": (("project_architecture", "overview"), ("roadmap",)),\n',
              '    "project_architecture": (("project_architecture", "module_architecture", "overview"), ("roadmap",)),\n', 1)
          text = text.replace(
              '    "retrieval_pipeline": (("project_architecture", "api_contract"), ("roadmap",)),\n',
              '    "retrieval_pipeline": (("module_architecture", "project_architecture", "api_contract"), ("roadmap",)),\n', 1)
          old = '''        emit(\n            "project_architecture",\n            True,\n            f"{product_prefix}project architecture overview components indexing retrieval storage",\n        )\n'''
          new = '''        emit(\n            "project_architecture",\n            True,\n            f"{product_prefix}project architecture overview components indexing retrieval storage",\n            f"{product_prefix}SQLite persistence candidate generation metadata evidence qualification",\n        )\n'''
          assert text.count(old) == 1
          intent.write_text(text.replace(old, new, 1))

          plan = Path('docmancer/docs/domain/documentation_query_plan.py')
          text = plan.read_text()
          needle = '''    requirement_hints = tuple(\n        str(value).strip()\n        for value in getattr(requirements, "retrieval_hints", ())\n        if str(value).strip()\n    )\n'''
          helper = '''    def host_audited_rewrites(lookup_text: str) -> tuple[tuple[str, tuple[str, ...]], ...]:\n        normalized = " ".join(lookup_text.casefold().split())\n        if re.search(r"\\b(?:not|never|no|without|except|before|after|until|unless)\\b", normalized):\n            return ()\n        tokens = tuple(re.findall(r"[a-z0-9_]+", normalized))\n        rows: list[tuple[str, tuple[str, ...]]] = []\n        if (\n            "documentation" in tokens and "request" in tokens and "boundary" in tokens\n            and any(token.startswith("accept") for token in tokens)\n        ):\n            anchors = technical_anchors(question)\n            if len(anchors) == 1:\n                anchor = anchors[0]\n                rows.append((\n                    f"{anchor} request boundary question project_path lookup_queries module_path scope",\n                    (anchor.casefold(),),\n                ))\n        if (\n            any(token.startswith("retriev") for token in tokens)\n            and any(token.startswith("chunk") for token in tokens)\n            and any(token.startswith("select") for token in tokens)\n            and any(token.startswith("visib") for token in tokens)\n            and any(token.startswith("source") for token in tokens)\n        ):\n            rows.extend((\n                ("retrieval gateway filtered project chunks field-level lexical match provenance exact-source indexed sections", ()),\n                ("selection maximizes distinct user-visible query coverage before expanding snippets", ()),\n            ))\n        return tuple(rows)\n\n''' + needle
          assert text.count(needle) == 1
          text = text.replace(needle, helper, 1)
          old_loop = '''    for index, text in enumerate(lookup_queries[:5], start=1):\n        cleaned = text.strip()\n        if not cleaned:\n            continue\n        queries.append(DocumentationLookup(\n            f"query-lookup-{index}", cleaned, "host_lookup", False,\n            relation="host_lookup",\n            **host_policies(cleaned),\n        ))\n        seen.add(cleaned.casefold())\n'''
          new_loop = '''    for index, text in enumerate(lookup_queries[:5], start=1):\n        cleaned = text.strip()\n        if not cleaned:\n            continue\n        parent_query_id = f"query-lookup-{index}"\n        policies = host_policies(cleaned)\n        queries.append(DocumentationLookup(\n            parent_query_id, cleaned, "host_lookup", False, relation="host_lookup", **policies,\n        ))\n        seen.add(cleaned.casefold())\n        for rewrite_index, (rewrite_text, rewrite_parent_exact_terms) in enumerate(\n            host_audited_rewrites(cleaned), start=1,\n        ):\n            if rewrite_text.casefold() in seen:\n                continue\n            queries.append(DocumentationLookup(\n                f"query-lookup-{index}-rewrite-{rewrite_index}", rewrite_text, "concept_alias", False,\n                relation="audited_rewrite", public_parent_query_id=parent_query_id,\n                parent_exact_terms=rewrite_parent_exact_terms, **policies,\n            ))\n            seen.add(rewrite_text.casefold())\n'''
          assert text.count(old_loop) == 1
          plan.write_text(text.replace(old_loop, new_loop, 1))
          PY

          python - <<'PY'
          import json
          from copy import deepcopy
          from unittest.mock import patch

          from docmancer.docs.interfaces.mcp import context_tools
          from eval.project_context_quality_v2_protocol import evaluate_case, load_cases
          from scripts.run_project_docs_self_host_gate import LiveCase, run

          cases = {case['id']: case for case in load_cases()}
          output = []
          for case_id in ('v2-natural-architecture', 'v2-natural-request-flow'):
              case = cases[case_id]
              captured = []
              original_project_context = context_tools.project_docs_context

              def observe(**kwargs):
                  captured.append(deepcopy(kwargs.get('retrieval') or {}))
                  return original_project_context(**kwargs)

              with patch.object(context_tools, 'project_docs_context', observe):
                  result = run(cases=(LiveCase(
                      case_id=case['id'], question=case['question'], relevant_paths=(),
                      lookup_queries=tuple(case['lookup_queries']), scope=case['scope'],
                  ),), negative_cases=())
              payload = result['results'][0]['payload']
              verdict = evaluate_case(case, payload)
              retrieval = captured[-1] if captured else {}
              plan = retrieval.get('documentation_query_plan') or {}
              target_candidates = []
              for candidate in retrieval.get('context_pack') or []:
                  if candidate.get('path') != 'docs/modules/project-context-retrieval.md':
                      continue
                  matches = {}
                  for query_id, trace in (candidate.get('retrieval_query_matches') or {}).items():
                      if query_id.startswith('query-lookup') or query_id.startswith('query-intent'):
                          matches[query_id] = {
                              key: trace.get(key) for key in (
                                  'query_text', 'qualified', 'qualification_reason', 'coverage_kind',
                                  'derived_from_query_id', 'derived_from_query_ids', 'matched_terms',
                                  'missing_parent_exact_terms', 'match_ratio', 'lexical_score',
                                  'relation', 'public_parent_query_id',
                              ) if key in trace
                          }
                  target_candidates.append({
                      'chunk_index': candidate.get('chunk_index'),
                      'stable_chunk_id': candidate.get('stable_chunk_id'),
                      'section': candidate.get('section') or candidate.get('parent_title'),
                      'content': candidate.get('content'),
                      'retrieval_query_ids': candidate.get('retrieval_query_ids') or [],
                      'matches': matches,
                  })
              output.append({
                  'id': case_id,
                  'plan_queries': [
                      {key: row.get(key) for key in (
                          'query_id', 'text', 'origin', 'relation', 'public_parent_query_id',
                          'parent_exact_terms', 'preferred_catalog_roles',
                      )}
                      for row in plan.get('queries') or []
                  ],
                  'target_candidates': target_candidates,
                  'public_sources': payload.get('sources') or [],
                  'covered_query_ids': payload.get('covered_query_ids') or [],
                  'missing_query_ids': payload.get('missing_query_ids') or [],
                  'obligations': [{
                      'id': row['id'], 'met': row['met'],
                      'visible_witnesses': row.get('visible_witnesses') or [],
                  } for row in verdict['obligations']],
              })
          print('AUDITED_FLOW_TRACE=' + json.dumps(output, ensure_ascii=False, sort_keys=True))
          PY
