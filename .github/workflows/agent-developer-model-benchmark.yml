name: Agent Developer model benchmark

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI API model id
        required: true
        default: gpt-5.4-mini
        type: string
      min_pass_rate:
        description: Optional quality threshold between 0 and 1
        required: true
        default: "0.0"
        type: string

permissions:
  contents: read

concurrency:
  group: agent-developer-model-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Install benchmark dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify provider-free benchmark contract
        run: python -m pytest tests/test_product_scope.py -q
      - name: Run and verify model-backed Agent Developer benchmark
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ inputs.model }}
          MIN_PASS_RATE: ${{ inputs.min_pass_rate }}
        run: |
          set +e
          python scripts/run_agent_developer_openai_benchmark.py \
            --model "$MODEL" \
            --min-pass-rate 0.0 \
            --output eval/agent_developer_v1/results/model-benchmark.json
          benchmark_rc=$?
          python scripts/verify_agent_developer_model_report.py \
            eval/agent_developer_v1/results/model-benchmark.json \
            --seal \
            --expected-model "$MODEL" \
            --min-pass-rate "$MIN_PASS_RATE"
          verify_rc=$?
          set -e
          if [ "$benchmark_rc" -ne 0 ]; then
            exit "$benchmark_rc"
          fi
          exit "$verify_rc"
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-developer-model-benchmark
          path: eval/agent_developer_v1/results/model-benchmark.json
          if-no-files-found: warn
