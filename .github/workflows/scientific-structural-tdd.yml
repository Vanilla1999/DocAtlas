name: Scientific structural TDD
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths:
      - .github/workflows/scientific-structural-tdd.yml
      - tests/docs/test_structural_item_integrity.py
      - tests/diagnostic_labels.source_item_integrity.json
      - docmancer/docs/domain/context_windows.py
      - docmancer/docs/application/_docs_context_projection_core.py

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 95e61265656283d609bc1328c46c52b2bf1a069e
          path: frozen-corpus
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - name: Capture P0 H04 H07 H08 baseline
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" uv run --frozen --extra dev python - <<'PY'
          import hashlib, json, os, tempfile
          from pathlib import Path
          from eval.evidence_quality_v2.runtime import write_project, isolated_service, index_project
          from eval.project_context_quality.capture_public_context import capture_public_call

          root=Path.cwd(); frozen=root/'frozen-corpus'; eq=frozen/'eval/evidence_quality_v2'
          manifest=json.loads((eq/'source-manifest.json').read_text())
          questions={c['id']:c for c in json.loads((root/'eval/retrieval_recheck/holdout20_questions.json').read_text())['cases']}
          wanted=('H04','H07','H08')
          def documents(project):
              result={}
              for row in manifest['sources']:
                  if row['project'] != project: continue
                  p=eq/'sources'/project/row['path']; data=p.read_bytes()
                  assert hashlib.sha256(data).hexdigest()==row['sha256']
                  result[row['path']]=data.decode('utf-8')
              return result
          rows=[]
          with tempfile.TemporaryDirectory(prefix='p0-structural-') as raw:
              base=Path(raw)
              services={}
              for project in sorted({questions[c]['project_group'] for c in wanted}):
                  project_root=base/'corpus'/project; write_project(project_root,documents(project))
                  ctx=isolated_service(base/'state'/project); service,config=ctx.__enter__()
                  index_project(service,config,project_root); services[project]=(ctx,service,project_root)
              try:
                  for cid in wanted:
                      c=questions[cid]; ctx,service,project_root=services[c['project_group']]
                      cap=capture_public_call(service,{'project_path':str(project_root),'scope':'all','question':c['question']})
                      rows.append({'id':cid,'question':c['question'],'capture':cap})
              finally:
                  for ctx,_,_ in services.values(): ctx.__exit__(None,None,None)
          out={'runtime_sha':os.environ.get('GITHUB_SHA'),'corpus_sha':'95e61265656283d609bc1328c46c52b2bf1a069e','cases':rows}
          Path(os.environ['RUNNER_TEMP']).joinpath('p0-baseline.json').write_text(json.dumps(out,indent=2,ensure_ascii=False))
          for row in rows:
              p=row['capture']['public_payload']
              print(row['id'],p.get('status'),p.get('estimated_tokens'),[(s.get('path_or_url'),s.get('line_start'),s.get('line_end')) for s in p.get('sources') or []])
          PY
      - name: Run structural RED GREEN
        run: uv run --frozen --extra dev pytest tests/docs/test_structural_item_integrity.py -q
      - name: P2 native H04 structural acceptance
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" uv run --frozen --extra dev python - <<'PY'
          import hashlib, json, os, tempfile
          from pathlib import Path
          from unittest.mock import patch

          from docmancer.docs.application import _docs_context_projection_core as core
          from docmancer.docs.application.model_visible_projection_helpers import docs_context_budget_tokens
          from docmancer.docs.application.model_visible_projection import validate_model_visible_projection
          from eval.evidence_quality_v2.runtime import write_project, isolated_service, index_project
          from eval.project_context_quality.capture_public_context import capture_public_call

          root=Path.cwd(); frozen=root/'frozen-corpus'; eq=frozen/'eval/evidence_quality_v2'
          manifest=json.loads((eq/'source-manifest.json').read_text())
          questions={c['id']:c for c in json.loads((root/'eval/retrieval_recheck/holdout20_questions.json').read_text())['cases']}

          def documents(project):
              result={}
              for row in manifest['sources']:
                  if row['project'] != project: continue
                  p=eq/'sources'/project/row['path']; data=p.read_bytes()
                  assert hashlib.sha256(data).hexdigest()==row['sha256']
                  result[row['path']]=data.decode('utf-8')
              return result

          required = (
              ("allow_methods", "Defaults to `['GET']`"),
              ("allow_headers", "Defaults to `[]`"),
              ("expose_headers", "Defaults to `[]`"),
              ("max_age", "Defaults to `600`"),
          )
          observed_variants=[]
          original_fragments=core._qualified_fragments

          def observe_fragments(*args, **kwargs):
              rows=original_fragments(*args, **kwargs)
              raw=str(kwargs.get('raw_snippet') or '')
              if 'max_age' in raw and 'allow_methods' in raw:
                  observed_variants.extend(str(row.get('snippet') or '') for row in rows)
              return rows

          captures={}
          with tempfile.TemporaryDirectory(prefix='p2-structural-') as raw:
              base=Path(raw)
              for project in ('fastapi','pydantic'):
                  project_root=base/'corpus'/project; write_project(project_root,documents(project))
                  with isolated_service(base/'state'/project) as (service,config):
                      index_project(service,config,project_root)
                      ids=('H04',) if project=='fastapi' else ('H07','H08')
                      for cid in ids:
                          c=questions[cid]
                          request={'project_path':str(project_root),'scope':'all','question':c['question']}
                          if cid=='H04':
                              with patch.object(core,'_qualified_fragments',observe_fragments):
                                  captures[cid]=capture_public_call(service,request)
                          else:
                              captures[cid]=capture_public_call(service,request)

              h04=captures['H04']
              before=h04['projection_attempts'][0]['before_projection']
              raw_candidates=[
                  str(row.get('content') or row.get('display_text') or '')
                  for row in before.get('context_pack') or []
                  if str(row.get('path') or '').endswith('cors.md')
              ]
              assert any(all(name in text and value in text for name,value in required)
                         for text in raw_candidates), raw_candidates
              assert any(all(name in text and value in text for name,value in required)
                         for text in observed_variants), observed_variants

              payload=h04['public_payload']
              visible='\n'.join(str(s.get('snippet') or '') for s in payload.get('sources') or [])
              assert all(name in visible and value in visible for name,value in required), visible
              assert docs_context_budget_tokens(payload) <= 800
              assert len(payload.get('sources') or []) <= 3
              assert payload.get('kind') == 'docs_context'
              assert payload.get('answer_supported') is False
              assert payload.get('answer_available') is False
              assert payload.get('edit_ready') is False

              attempt=h04['projection_attempts'][-1]
              assert validate_model_visible_projection(
                  attempt['projected_payload'], snapshot=attempt['snapshot'], max_tokens=800,
              ) == []

              for source in payload.get('sources') or []:
                  path=project_root if False else None
                  if not str(source.get('path_or_url') or '').endswith('cors.md'):
                      continue
                  source_path=base/'corpus'/'fastapi'/str(source['path_or_url'])
                  text=source_path.read_text(encoding='utf-8')
                  lines=text.splitlines()
                  start,end=source.get('line_start'),source.get('line_end')
                  assert isinstance(start,int) and isinstance(end,int) and 1 <= start <= end
                  assert str(source.get('snippet') or '') in '\n'.join(lines[start-1:end])

          out={
              'runtime_sha':os.environ.get('GITHUB_SHA'),
              'corpus_sha':'95e61265656283d609bc1328c46c52b2bf1a069e',
              'required':required,
              'observed_variants':observed_variants,
              'captures':captures,
          }
          Path(os.environ['RUNNER_TEMP']).joinpath('p2-native.json').write_text(
              json.dumps(out,indent=2,ensure_ascii=False)
          )
          print('H04 tokens',captures['H04']['public_payload'].get('estimated_tokens'))
          print('H04 sources',[(s.get('path_or_url'),s.get('line_start'),s.get('line_end'))
                for s in captures['H04']['public_payload'].get('sources') or []])
          PY
      - name: Structural regression pack
        run: |
          uv run --frozen --extra dev pytest \
            tests/docs/test_structural_item_integrity.py \
            tests/docs/test_compact_context_blocks.py \
            tests/docs/test_list_item_continuation_bridge.py \
            tests/docs/test_context_span_growth.py \
            tests/docs/test_source_continuation.py \
            tests/docs/test_context_capture_integrity.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientific-structural-tdd
          path: |
            ${{ runner.temp }}/p0-baseline.json
            ${{ runner.temp }}/p2-native.json
