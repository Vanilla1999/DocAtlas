name: TEMP harden installed MCP provider boundary

on:
  push:
    branches: [p1/installed-mcp-real-model-capture]
    paths:
      - .github/workflows/temp-harden-provider-boundary.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: p1/installed-mcp-real-model-capture
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Remove paths and ambient secrets from provider-visible input
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old[:100]!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          harness = 'scripts/run_installed_mcp_agent_harness.py'
          replace_once(
              harness,
              'SENSITIVE_KEY_RE = re.compile(r"(?i)(authorization|api[_-]?key|token|password|secret)")\n',
              '''SENSITIVE_KEY_RE = re.compile(r"(?i)(authorization|api[_-]?key|token|password|secret)")
PROJECT_ROOT_TOKEN = "$DOCATLAS_PROJECT_ROOT"
RUN_ROOT_TOKEN = "$DOCATLAS_RUN_ROOT"
USER_HOME_TOKEN = "$DOCATLAS_USER_HOME"
STATE_HOME_TOKEN = "$DOCATLAS_STATE_HOME"
HARNESS_ROOT_TOKEN = "$DOCATLAS_HARNESS_ROOT"
BASE_DRIVER_ENV_NAMES = {
    "PATH", "PATHEXT", "SYSTEMROOT", "WINDIR", "COMSPEC",
    "HOME", "USERPROFILE", "TMPDIR", "TMP", "TEMP",
    "LANG", "LC_ALL", "PYTHONIOENCODING",
}
''',
          )
          replace_once(
              harness,
              '''def adapter_message(
    *,
    command: str,
    turn_payload: dict[str, Any],
    cwd: Path,
) -> dict[str, Any]:
''',
              '''def _provider_safe_value(value: Any, replacements: Mapping[str, str]) -> Any:
    if isinstance(value, dict):
        return {
            str(key): _provider_safe_value(child, replacements)
            for key, child in value.items()
        }
    if isinstance(value, list):
        return [_provider_safe_value(child, replacements) for child in value]
    if isinstance(value, tuple):
        return [_provider_safe_value(child, replacements) for child in value]
    if isinstance(value, str):
        result = value
        for raw, token in sorted(replacements.items(), key=lambda item: len(item[0]), reverse=True):
            if not raw:
                continue
            result = result.replace(raw, token)
            result = result.replace(raw.replace("/", "\\\\"), token)
        return result
    return value


def _restore_provider_tokens(value: Any, replacements: Mapping[str, str]) -> Any:
    inverse = {token: raw for raw, token in replacements.items()}
    if isinstance(value, dict):
        return {
            str(key): _restore_provider_tokens(child, replacements)
            for key, child in value.items()
        }
    if isinstance(value, list):
        return [_restore_provider_tokens(child, replacements) for child in value]
    if isinstance(value, str):
        result = value
        for token, raw in inverse.items():
            result = result.replace(token, raw)
        return result
    return value


def _driver_environment(names: Sequence[str]) -> dict[str, str]:
    allowed = set(BASE_DRIVER_ENV_NAMES)
    for name in names:
        if not re.fullmatch(r"[A-Z][A-Z0-9_]{0,127}", name):
            raise HarnessError(f"invalid --driver-env name: {name!r}")
        allowed.add(name)
    return {name: os.environ[name] for name in sorted(allowed) if name in os.environ}


def _assert_provider_payload_safe(payload: dict[str, Any], *, secret_values: Sequence[str]) -> int:
    rendered = canonical_json(payload)
    encoded = rendered.encode("utf-8")
    if len(encoded) > 64_000:
        raise HarnessError("provider-visible turn exceeds 64 KiB")
    for pattern in ABSOLUTE_PATH_PATTERNS:
        match = pattern.search(rendered)
        if match:
            raise HarnessError(
                f"provider-visible turn contains an absolute path: {match.group(0)[:160]}"
            )
    for value in secret_values:
        if len(value) >= 8 and value in rendered:
            raise HarnessError("provider-visible turn contains a credential value")
    return len(encoded)


def adapter_message(
    *,
    command: str,
    turn_payload: dict[str, Any],
    cwd: Path,
    driver_env_names: Sequence[str],
) -> dict[str, Any]:
''',
          )
          replace_once(
              harness,
              '        env=dict(os.environ),\n',
              '        env=_driver_environment(driver_env_names),\n',
          )
          replace_once(
              harness,
              '    real_model: bool,\n) -> dict[str, Any]:\n',
              '    real_model: bool,\n    driver_env_names: Sequence[str],\n) -> dict[str, Any]:\n',
          )
          replace_once(
              harness,
              '''    tool_rows: list[dict[str, Any]] = []

    async with stdio_client(params) as streams:
''',
              '''    tool_rows: list[dict[str, Any]] = []
    provider_path_replacements = {
        str(project): PROJECT_ROOT_TOKEN,
        str(work): RUN_ROOT_TOKEN,
        str(user_home): USER_HOME_TOKEN,
        str(docatlas_home): STATE_HOME_TOKEN,
        str(root): HARNESS_ROOT_TOKEN,
    }
    provider_payload_sizes: list[int] = []
    provider_secret_values = secret_environment_values()

    async with stdio_client(params) as streams:
''',
          )
          replace_once(
              harness,
              '''                    "host_context": {
                        "project_path": str(project),
                        "working_directory": str(project),
                    },
                    "history": state.ephemeral_history[-12:],
''',
              '''                    "host_context": {
                        "project_path": PROJECT_ROOT_TOKEN,
                        "working_directory": PROJECT_ROOT_TOKEN,
                    },
                    "history": _provider_safe_value(
                        state.ephemeral_history[-12:], provider_path_replacements
                    ),
''',
          )
          replace_once(
              harness,
              '''                try:
                    response = (
''',
              '''                try:
                    if driver == "command":
                        provider_payload_sizes.append(
                            _assert_provider_payload_safe(
                                turn_payload,
                                secret_values=provider_secret_values,
                            )
                        )
                    response = (
''',
          )
          replace_once(
              harness,
              '''                            turn_payload=turn_payload,
                            cwd=root,
                        )
''',
              '''                            turn_payload=turn_payload,
                            cwd=root,
                            driver_env_names=driver_env_names,
                        )
''',
          )
          replace_once(
              harness,
              '''                arguments = message["arguments"]
                state.tool_calls += 1
''',
              '''                provider_arguments = message["arguments"]
                arguments = (
                    _restore_provider_tokens(
                        provider_arguments, provider_path_replacements
                    )
                    if driver == "command"
                    else provider_arguments
                )
                if not isinstance(arguments, dict):
                    state.divergence(
                        "adapter_protocol",
                        "restored tool arguments are not an object",
                    )
                    break
                state.tool_calls += 1
''',
          )
          replace_once(
              harness,
              '''            "credential_value_scan": "pass",
        },
''',
              '''            "credential_value_scan": "pass",
            "provider_payload_absolute_path_scan": "pass",
            "provider_payload_credential_scan": "pass",
            "driver_environment_allowlisted": True,
            "provider_payload_max_bytes": max(provider_payload_sizes, default=0),
        },
''',
          )
          replace_once(
              harness,
              '''    parser.add_argument(
        "--real-model",
        action="store_true",
        help="Mark command-driver responses as a real provider run; requires --driver=command.",
    )
''',
              '''    parser.add_argument(
        "--real-model",
        action="store_true",
        help="Mark command-driver responses as a real provider run; requires --driver=command.",
    )
    parser.add_argument(
        "--driver-env",
        action="append",
        default=[],
        metavar="NAME",
        help="Allow one named environment variable into the command adapter.",
    )
''',
          )
          replace_once(
              harness,
              '''                model=args.model,
                real_model=args.real_model,
            )
''',
              '''                model=args.model,
                real_model=args.real_model,
                driver_env_names=tuple(args.driver_env),
            )
''',
          )

          verifier = 'scripts/verify_installed_mcp_agent_report.py'
          replace_once(
              verifier,
              '''    require(privacy == {
        "raw_prompt_stored": False,
        "raw_tool_result_stored": False,
        "raw_environment_stored": False,
        "absolute_path_scan": "pass",
        "credential_value_scan": "pass",
    }, "privacy contract mismatch")
''',
              '''    require(
        privacy.get("raw_prompt_stored") is False
        and privacy.get("raw_tool_result_stored") is False
        and privacy.get("raw_environment_stored") is False
        and privacy.get("absolute_path_scan") == "pass"
        and privacy.get("credential_value_scan") == "pass"
        and privacy.get("provider_payload_absolute_path_scan") == "pass"
        and privacy.get("provider_payload_credential_scan") == "pass"
        and privacy.get("driver_environment_allowlisted") is True,
        "privacy contract mismatch",
    )
    provider_bytes = privacy.get("provider_payload_max_bytes")
    require(
        isinstance(provider_bytes, int) and 0 <= provider_bytes <= 64_000,
        "provider payload byte bound is invalid",
    )
''',
          )
          replace_once(
              verifier,
              '''            "credential_value_scan": "pass",
        },
''',
              '''            "credential_value_scan": "pass",
            "provider_payload_absolute_path_scan": "pass",
            "provider_payload_credential_scan": "pass",
            "driver_environment_allowlisted": True,
            "provider_payload_max_bytes": 1024,
        },
''',
          )

          driver = 'eval/installed_mcp_agent_v1/provider_free_command_driver.py'
          replace_once(
              driver,
              '''    project_path = payload["host_context"]["project_path"]
''',
              '''    project_path = payload["host_context"]["project_path"]
    assert project_path == "$DOCATLAS_PROJECT_ROOT", project_path
    rendered = json.dumps(payload, ensure_ascii=False, sort_keys=True)
    for fragment in ("/tmp/", "/home/", "/Users/", "\\\\\\\\"):
        assert fragment not in rendered, fragment
''',
          )

          readme = 'eval/installed_mcp_agent_v1/README.md'
          replace_once(
              readme,
              '''The turn payload contains the case question, the exact installed tool schemas, bounded in-memory history, and an ephemeral host-owned `host_context.project_path`. That path is execution context rather than a public MCP field and is never written to the report. Raw payloads and raw tool results are never persisted.
''',
              '''The turn payload contains the case question, the exact installed tool schemas, bounded in-memory history, and an ephemeral host-owned project token. Absolute workspace/home paths are replaced by `$DOCATLAS_*` tokens before the adapter is invoked and restored only inside the harness immediately before MCP schema validation and execution. The command adapter receives only a small platform environment plus names explicitly allowlisted with `--driver-env`. Raw payloads and raw tool results are never persisted.
''',
          )
          PY
          rm .github/workflows/temp-harden-provider-boundary.yml
          python -m py_compile \
            scripts/run_installed_mcp_agent_harness.py \
            scripts/verify_installed_mcp_agent_report.py \
            eval/installed_mcp_agent_v1/provider_free_command_driver.py \
            eval/installed_mcp_agent_v1/github_models_driver.py
          python scripts/verify_installed_mcp_agent_report.py --self-test
          git diff --check

      - name: Commit provider-boundary hardening
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          changed="$(git diff --cached --name-only)"
          expected="$(printf '%s\n' \
            eval/installed_mcp_agent_v1/README.md \
            eval/installed_mcp_agent_v1/provider_free_command_driver.py \
            scripts/run_installed_mcp_agent_harness.py \
            scripts/verify_installed_mcp_agent_report.py)"
          test "$changed" = "$expected" || {
            echo "::error::unexpected provider-boundary diff"
            printf 'actual:\n%s\nexpected:\n%s\n' "$changed" "$expected"
            exit 1
          }
          git commit -m "fix(p1): redact provider-visible paths and ambient environment"
          git push origin HEAD:p1/installed-mcp-real-model-capture
