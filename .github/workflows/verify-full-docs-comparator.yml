name: Verify full docs comparator

on:
  push:
    branches: [feat/adaptive-docs-query-planner]
    paths: [.github/workflows/verify-full-docs-comparator.yml]

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Prepare exact main worktree
        run: |
          git fetch origin main
          git worktree add --detach /tmp/docatlas-main origin/main
      - name: Run full docs suite on main
        shell: bash
        run: |
          set +e
          cd /tmp/docatlas-main
          uv sync --frozen --extra dev
          uv run pytest -q tests/docs 2>&1 | tee /tmp/main-docs.log
          echo ${PIPESTATUS[0]} > /tmp/main-docs.exit
          exit 0
      - name: Run full docs suite on branch
        shell: bash
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          uv sync --frozen --extra dev
          uv run pytest -q tests/docs 2>&1 | tee /tmp/branch-docs.log
          echo ${PIPESTATUS[0]} > /tmp/branch-docs.exit
          exit 0
      - name: Compare failure nodeids
        shell: python
        run: |
          from pathlib import Path
          import re

          def failures(path):
              text = Path(path).read_text(encoding='utf-8', errors='replace')
              values = set()
              for line in text.splitlines():
                  match = re.match(r'^FAILED\s+(\S+)', line)
                  if match:
                      values.add(match.group(1))
              return values

          main = failures('/tmp/main-docs.log')
          branch = failures('/tmp/branch-docs.log')
          new = sorted(branch - main)
          fixed = sorted(main - branch)
          print(f'main failures: {len(main)}')
          print(f'branch failures: {len(branch)}')
          print(f'new failures: {len(new)}')
          print(f'fixed historical failures: {len(fixed)}')
          if new:
              print('NEW:')
              print('\n'.join(new))
              raise SystemExit(1)
      - name: Remove temporary comparator after green
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/verify-full-docs-comparator.yml
          git commit -m "chore: remove temporary full-docs comparator workflow"
          git push
