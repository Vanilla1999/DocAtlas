name: Retrieval external and holdout acceptance
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths:
      - .github/workflows/retrieval-external-holdout.yml

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 7b92cc5e8a99ee7394fde93b46797c5bd0b162a8
          path: baseline-runtime
      - uses: actions/checkout@v4
        with:
          ref: 8cecc0e1355376699bd18d8eb7a720cff6868be0
          path: candidate-runtime
      - uses: actions/checkout@v4
        with:
          ref: 95e61265656283d609bc1328c46c52b2bf1a069e
          path: frozen-corpus
      - uses: astral-sh/setup-uv@v6
      - name: Sync runtimes and verify corpus
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline-runtime && uv sync --frozen --extra dev)
          (cd candidate-runtime && uv sync --frozen --extra dev)
          for rt in baseline-runtime candidate-runtime; do
            cmp "$rt/eval/evidence_quality_v2/cases.json" frozen-corpus/eval/evidence_quality_v2/cases.json
            cmp "$rt/eval/evidence_quality_v2/source-manifest.json" frozen-corpus/eval/evidence_quality_v2/source-manifest.json
            cmp "$rt/eval/evidence_quality_v2/protocol.json" frozen-corpus/eval/evidence_quality_v2/protocol.json
            diff -qr "$rt/eval/evidence_quality_v2/sources" frozen-corpus/eval/evidence_quality_v2/sources
          done
      - name: External80 baseline
        run: cd baseline-runtime && PYTHONPATH="$PWD" uv run --frozen --extra dev python -m eval.evidence_quality_v2.run --output "$RUNNER_TEMP/external80-baseline"
      - name: External80 candidate
        run: cd candidate-runtime && PYTHONPATH="$PWD" uv run --frozen --extra dev python -m eval.evidence_quality_v2.run --output "$RUNNER_TEMP/external80-candidate"
      - name: Compare external80
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP']); a=t/'external80-baseline'; b=t/'external80-candidate'
          changes=[]
          for da in sorted((a/'payloads').glob('*')):
              if not da.is_dir(): continue
              db=b/'payloads'/da.name
              for pa in sorted(da.glob('*.json')):
                  pb=db/pa.name
                  if json.loads(pa.read_text()) != json.loads(pb.read_text()): changes.append({'variant':da.name,'id':pa.stem})
          sa=json.loads((a/'summary.json').read_text()); sb=json.loads((b/'summary.json').read_text())
          out={'payload_changes':changes,'changed_ids':sorted({x['id'] for x in changes}),'baseline_A':sa['variants'].get('A-current'),'candidate_A':sb['variants'].get('A-current')}
          (t/'external80-compare.json').write_text(json.dumps(out,indent=2,ensure_ascii=False))
          print(json.dumps({'changes':len(changes),'ids':out['changed_ids'],'baseline':out['baseline_A']['within_budget_sufficient'],'candidate':out['candidate_A']['within_budget_sufficient']},indent=2))
          PY
      - name: Write holdout runner
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/run_holdout.py" <<'PY'
          from __future__ import annotations
          import argparse, hashlib, json, time
          from pathlib import Path
          ap=argparse.ArgumentParser(); ap.add_argument('--questions',type=Path,required=True); ap.add_argument('--frozen',type=Path,required=True); ap.add_argument('--output',type=Path,required=True); args=ap.parse_args()
          from eval.evidence_quality_v2.runtime import write_project, isolated_service, index_project
          from eval.project_context_quality.capture_public_context import capture_public_call
          cases=json.loads(args.questions.read_text())['cases']; eq=args.frozen/'eval/evidence_quality_v2'; manifest=json.loads((eq/'source-manifest.json').read_text())
          def docs(project):
              out={}
              for row in manifest['sources']:
                  if row['project']!=project: continue
                  p=eq/'sources'/project/row['path']; data=p.read_bytes(); assert hashlib.sha256(data).hexdigest()==row['sha256']; out[row['path']]=data.decode()
              return out
          args.output.mkdir(parents=True,exist_ok=True); rows=[]
          for project in sorted({c['project_group'] for c in cases}):
              root=args.output/'corpus'/project; write_project(root,docs(project))
              with isolated_service(args.output/'state'/project) as (service,config):
                  index_project(service,config,root)
                  for c in [x for x in cases if x['project_group']==project]:
                      st=time.perf_counter(); cap=capture_public_call(service,{'project_path':str(root),'scope':'all','question':c['question']}); sec=time.perf_counter()-st; p=cap['public_payload']
                      assert (p.get('estimated_tokens') or 0)<=800 and len(p.get('sources') or [])<=3
                      rows.append({'id':c['id'],'project_group':project,'question':c['question'],'elapsed_seconds':sec,'public_payload':p})
                      print(c['id'],p.get('status'),p.get('estimated_tokens'),[s.get('path_or_url') for s in p.get('sources') or []],flush=True)
          (args.output/'holdout-retrieval.json').write_text(json.dumps({'cases':rows},indent=2,ensure_ascii=False))
          PY
      - name: Holdout baseline retrieval
        run: cd baseline-runtime && PYTHONPATH="$PWD" uv run --frozen --extra dev python "$RUNNER_TEMP/run_holdout.py" --questions "$GITHUB_WORKSPACE/eval/retrieval_recheck/holdout20_questions.json" --frozen "$GITHUB_WORKSPACE/frozen-corpus" --output "$RUNNER_TEMP/holdout-baseline"
      - name: Holdout candidate retrieval
        run: cd candidate-runtime && PYTHONPATH="$PWD" uv run --frozen --extra dev python "$RUNNER_TEMP/run_holdout.py" --questions "$GITHUB_WORKSPACE/eval/retrieval_recheck/holdout20_questions.json" --frozen "$GITHUB_WORKSPACE/frozen-corpus" --output "$RUNNER_TEMP/holdout-candidate"
      - name: Install weak reader
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull qwen2.5:1.5b
      - name: Run sealed weak reader
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          root=Path.cwd(); t=Path(os.environ['RUNNER_TEMP']); protocol=json.loads((root/'eval/retrieval_recheck/holdout20_protocol.json').read_text()); system=protocol['reader']['prompt']
          def ask(q,p):
              body={'model':protocol['reader']['model'],'stream':False,'messages':[{'role':'system','content':system},{'role':'user','content':'QUESTION:\n'+q+'\n\nCONTEXT (public packet JSON):\n'+json.dumps(p,ensure_ascii=False,separators=(',',':'))}],'options':{'temperature':0,'seed':0,'num_predict':160}}
              req=urllib.request.Request('http://127.0.0.1:11434/api/chat',data=json.dumps(body).encode(),headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=180) as r: return json.loads(r.read())['message']['content']
          allrows={}
          for lane in ('baseline','candidate'):
              src=json.loads((t/f'holdout-{lane}'/'holdout-retrieval.json').read_text()); rows=[]
              for row in src['cases']:
                  ans=ask(row['question'],row['public_payload']); rows.append({**row,'reader_answer':ans}); print(lane,row['id'],repr(ans[:120]),flush=True)
              allrows[lane]=rows; (t/f'holdout-{lane}-reader.json').write_text(json.dumps({'cases':rows},indent=2,ensure_ascii=False))
          changed=[a['id'] for a,b in zip(allrows['baseline'],allrows['candidate']) if a['public_payload']!=b['public_payload'] or a['reader_answer']!=b['reader_answer']]
          (t/'holdout-pair-summary.json').write_text(json.dumps({'changed_ids':changed},indent=2)); print('changed',changed)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-external-holdout
          path: |
            ${{ runner.temp }}/external80-baseline/summary.json
            ${{ runner.temp }}/external80-baseline/rows.json
            ${{ runner.temp }}/external80-candidate/summary.json
            ${{ runner.temp }}/external80-candidate/rows.json
            ${{ runner.temp }}/external80-compare.json
            ${{ runner.temp }}/holdout-baseline/holdout-retrieval.json
            ${{ runner.temp }}/holdout-candidate/holdout-retrieval.json
            ${{ runner.temp }}/holdout-baseline-reader.json
            ${{ runner.temp }}/holdout-candidate-reader.json
            ${{ runner.temp }}/holdout-pair-summary.json
            ${{ runner.temp }}/ollama.log
