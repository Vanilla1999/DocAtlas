name: PR211 isolated installed acceptance
on:
  push:
    branches: [work/pr211-integration-20261014]
permissions:
  contents: read
jobs:
  installed:
    if: github.repository == 'Vanilla1999/DocAtlas' && github.ref == 'refs/heads/work/pr211-integration-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      DOCATLAS_AUTO_VECTORS: '0'
      DOCATLAS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 896ce88d7e5a6b5b261c11710418e2da7defce77
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install exact candidate without source-tree imports
        id: install
        run: |
          mkdir -p "$RUNNER_TEMP/installed-proof"
          git rev-parse HEAD > "$RUNNER_TEMP/installed-proof/head.txt"
          python -m pip install uv==0.9.25
          uv build --wheel --out-dir "$RUNNER_TEMP/dist"
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/installed" uv sync --frozen --no-dev --no-install-project
          uv pip install --python "$RUNNER_TEMP/installed/bin/python" --no-deps "$RUNNER_TEMP"/dist/*.whl
          uv pip check --python "$RUNNER_TEMP/installed/bin/python"
          echo "$RUNNER_TEMP/installed/bin" >> "$GITHUB_PATH"
          echo "TIKTOKEN_CACHE_DIR=$RUNNER_TEMP/tokenizer" >> "$GITHUB_ENV"
          python - <<'PY'
          import gzip,hashlib,os,pathlib
          cache=pathlib.Path(os.environ['RUNNER_TEMP'])/'tokenizer'
          cache.mkdir()
          data=gzip.decompress(pathlib.Path('docmancer/docs/data/o200k_base.tiktoken.gz').read_bytes())
          assert hashlib.sha256(data).hexdigest()=='446a9538cb6c348e3516120d7c08b09f57c36495e2acfffe59a5bf8b0cfb1a2d'
          url='https://openaipublic.blob.core.windows.net/encodings/o200k_base.tiktoken'
          (cache/hashlib.sha1(url.encode()).hexdigest()).write_bytes(data)
          PY
      - name: Real installed MCP stdio and console script outside checkout
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          script="$GITHUB_WORKSPACE/scripts/docs_mcp_stdio_smoke.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/installed/bin/python" -I "$script" > "$RUNNER_TEMP/installed-proof/stdio.log" 2>&1
      - name: Frozen strict V40 on Python 3.12
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.python == '3.12' }}
        run: |
          "$RUNNER_TEMP/installed/bin/python" -I eval/heuristic_removal/ci_acceptance.py \
            --python "$RUNNER_TEMP/installed/bin/python" --wheel "$RUNNER_TEMP"/dist/*.whl \
            --output "$RUNNER_TEMP/installed-proof/v40"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr211-installed-acceptance-${{ matrix.python }}-896ce88d
          path: |
            ${{ runner.temp }}/installed-proof/
            ${{ runner.temp }}/dist/
          retention-days: 30
          if-no-files-found: error
