name: PR211 isolated integration repair
on:
  push:
    branches: [work/pr211-integration-20261014]
permissions:
  contents: read
jobs:
  assemble:
    if: github.repository == 'Vanilla1999/DocAtlas' && github.ref == 'refs/heads/work/pr211-integration-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.commit.outputs.candidate }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply checked follow-up to the published product parent
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], text=True, **kwargs).strip()
          helper = pathlib.Path(os.environ['RUNNER_TEMP']) / 'followup.py'
          helper.write_text(git('show', 'HEAD:.pr211-workspace/followup.py') + '\n')
          base = '5656df52017f050f4f36de07e581ac9c20be6df7'
          git('checkout', '--detach', base)
          subprocess.run(['python', str(helper)], check=True)
          paths = ['tests/test_project_context_quality_v2_protocol.py', 'docmancer/core/config.py', 'docmancer/retrieval/_dispatch_part01.py', 'docmancer/retrieval/_dispatch_part02.py', 'docmancer/docs/application/projection_decision_trace.py', 'tests/test_native_context_preservation_integration.py']
          assert set(git('diff', '--name-only').splitlines()) == set(paths)
          git('diff', '--check')
          results = pathlib.Path(os.environ['RUNNER_TEMP']) / 'assembly'
          results.mkdir()
          (results / 'repair.patch').write_text(git('diff') + '\n')
          (results / 'hashes.json').write_text(json.dumps({p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}, indent=2))
          git('add', '--', *paths)
          tree = git('write-tree')
          author = dict(os.environ, GIT_AUTHOR_NAME='github-actions[bot]', GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com', GIT_COMMITTER_NAME='github-actions[bot]', GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com')
          candidate = git('commit-tree', tree, '-p', base, '-m', 'fix: honor explicit quotas and preserve bounded finalizer diagnostics', env=author)
          (results / 'candidate.txt').write_text(candidate + '\n')
          print('Candidate:', candidate)
          branch = 'work/pr211-candidate-' + os.environ['GITHUB_RUN_ID']
          auth = base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
          push_env = dict(os.environ, GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + auth)
          subprocess.run(['git', 'push', 'origin', candidate + ':refs/heads/' + branch], env=push_env, check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('candidate=' + candidate + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr211-followup-assembly-${{ github.run_id }}
          path: ${{ runner.temp }}/assembly/
          retention-days: 30
          if-no-files-found: error
  integration:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DOCATLAS_AUTO_VECTORS: '0'
      DOCATLAS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.assemble.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Prepare frozen runtime and evidence
        run: |
          mkdir -p "$RUNNER_TEMP/proof"
          git rev-parse HEAD > "$RUNNER_TEMP/proof/head.txt"
          echo "PYTEST_DOCATLAS_ARTIFACT_DIR=$RUNNER_TEMP/proof/scenarios" >> "$GITHUB_ENV"
          python -m pip install uv==0.9.25
          uv sync --frozen --extra dev --extra embeddings-openai
      - name: Existing public integration guards, trace parity and explicit resource contracts
        run: |
          .venv/bin/python -m pytest -v --tb=short -o junit_family=legacy \
            tests/test_heuristic_removal_public_integration.py \
            tests/test_public_surface_integration.py \
            tests/test_prepared_retrieval_review_integration.py \
            tests/test_native_context_preservation_integration.py \
            tests/test_experimental_selection_modes_integration.py \
            tests/test_context_budget_refusal_integration.py \
            tests/test_project_context_quality_v2_protocol.py::test_query_trace_off_on_off_preserves_real_sources_and_retrieval_calls \
            tests/test_retrieval_features.py::test_lexical_compact_results_limit_sections_per_source_when_configured \
            tests/test_retrieval_features.py::test_expand_bypasses_sections_per_source_cap \
            --junitxml="$RUNNER_TEMP/proof/integration.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr211-followup-integration-${{ needs.assemble.outputs.candidate }}
          path: ${{ runner.temp }}/proof/
          retention-days: 30
          if-no-files-found: error
