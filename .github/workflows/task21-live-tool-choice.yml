name: Task 21 live tool choice

on:
  workflow_dispatch:
    inputs:
      model:
        description: GitHub Models model id
        required: true
        default: openai/gpt-4o-mini
        type: string

permissions:
  contents: read
  models: read

concurrency:
  group: task21-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Install evaluation dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify frozen provider-free Task 21 contract
        run: python -m pytest tests/docs/test_tool_choice_eval.py -q
      - name: Run live Task 21 tool-choice evaluation
        env:
          TASK21_GITHUB_TOKEN: ${{ github.token }}
          MODEL: ${{ inputs.model }}
        run: |
          python scripts/run_task21_github_models_live.py \
            --model "$MODEL" \
            --output eval/results/task21_tool_choice_gate.json
      - name: Upload live Task 21 report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task21-live-tool-choice
          path: eval/results/task21_tool_choice_gate.json
          if-no-files-found: warn
