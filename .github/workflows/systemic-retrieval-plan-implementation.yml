name: Systemic retrieval plan implementation

on:
  push:
    branches: [feat/systemic-retrieval-mechanics]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCATLAS_OFFLINE: "1"

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/systemic-retrieval-mechanics
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e '.[dev]' 'tiktoken==0.11.0'
      - name: Confirm the pre-hydration counterexample is RED
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --collect-only tests/test_pre_hydration_source_policy.py
          set +e
          python -m pytest -q tests/test_pre_hydration_source_policy.py > /tmp/pre-hydration-red.log 2>&1
          status=$?
          set -e
          cat /tmp/pre-hydration-red.log
          if [ "$status" -eq 0 ]; then
            echo "TDD counterexample unexpectedly passed before the production patch"
            exit 1
          fi
      - name: Apply the minimal production boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one patch anchor, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "docmancer/core/sqlite_store.py",
              "from ._sqlite_store_active_fts import _SQLiteStoreActiveFTS\n",
              "from ._sqlite_store_active_fts import _SQLiteStoreActiveFTS\n"
              "from ._sqlite_store_filter_metadata import _SQLiteStoreFilterMetadata\n",
          )
          replace_once(
              "docmancer/core/sqlite_store.py",
              "class SQLiteStore(_SQLiteStoreActiveFTS, _SQLiteStorePart01, _SQLiteStorePart02, _SQLiteStorePart03, _SQLiteStorePart04, _SQLiteStorePart05):",
              "class SQLiteStore(_SQLiteStoreActiveFTS, _SQLiteStoreFilterMetadata, _SQLiteStorePart01, _SQLiteStorePart02, _SQLiteStorePart03, _SQLiteStorePart04, _SQLiteStorePart05):",
          )
          replace_once(
              "docmancer/core/sqlite_store.py",
              "'docmancer.core._sqlite_store_shared', 'docmancer.core._sqlite_store_active_fts', 'docmancer.core._sqlite_store_part01'",
              "'docmancer.core._sqlite_store_shared', 'docmancer.core._sqlite_store_active_fts', 'docmancer.core._sqlite_store_filter_metadata', 'docmancer.core._sqlite_store_part01'",
          )

          hydrate_anchor = (
              "    def _hydrate(self, section_ids: list[int], *, budget: int) -> list:\n"
              "        if not section_ids:\n"
              "            return []\n"
              "        return self.store.fetch_sections_by_id(section_ids, budget=budget)\n\n"
              "    def _candidate_limit_for_diversity"
          )
          helper = (
              "    def _hydrate(self, section_ids: list[int], *, budget: int) -> list:\n"
              "        if not section_ids:\n"
              "            return []\n"
              "        return self.store.fetch_sections_by_id(section_ids, budget=budget)\n\n"
              "    def _filter_section_ids_before_hydration(\n"
              "        self,\n"
              "        section_ids: list[int],\n"
              "        filters: dict | None,\n"
              "    ) -> list[int]:\n"
              "        # Apply source policy to expansion ids before loading text.\n"
              "        if not section_ids or not filters:\n"
              "            return section_ids\n"
              "        metadata_for = getattr(self.store, \"section_filter_metadata_for\", None)\n"
              "        if not callable(metadata_for):\n"
              "            # Lightweight compatibility stores do not expose the metadata\n"
              "            # boundary. The post-hydration filter remains defense-in-depth.\n"
              "            return section_ids\n"
              "        try:\n"
              "            metadata_by_id = metadata_for(section_ids)\n"
              "        except Exception as exc:\n"
              "            logger.warning(\n"
              "                \"pre-hydration source-policy metadata failed (%s)\",\n"
              "                type(exc).__name__,\n"
              "            )\n"
              "            return []\n"
              "        return [\n"
              "            section_id\n"
              "            for section_id in section_ids\n"
              "            if (\n"
              "                (metadata := metadata_by_id.get(int(section_id))) is not None\n"
              "                and metadata_matches_filters(\n"
              "                    metadata,\n"
              "                    filters,\n"
              "                    source=str(metadata.get(\"source\") or \"\"),\n"
              "                )\n"
              "            )\n"
              "        ]\n\n"
              "    def _candidate_limit_for_diversity"
          )
          replace_once("docmancer/retrieval/_dispatch_part02.py", hydrate_anchor, helper)

          replace_once(
              "docmancer/retrieval/_dispatch_part01.py",
              (
                  "            section_ids = self._expand_section_ids(\n"
                  "                section_ids,\n"
                  "                mode=retrieval_expand,\n"
                  "                budget_cap=limit * 3,\n"
                  "            )\n\n"
                  "        chunks = self._hydrate(section_ids, budget=budget)\n"
              ),
              (
                  "            section_ids = self._expand_section_ids(\n"
                  "                section_ids,\n"
                  "                mode=retrieval_expand,\n"
                  "                budget_cap=limit * 3,\n"
                  "            )\n"
                  "        section_ids = self._filter_section_ids_before_hydration(\n"
                  "            section_ids, merged_filters,\n"
                  "        )\n\n"
                  "        chunks = self._hydrate(section_ids, budget=budget)\n"
              ),
          )
          replace_once(
              "docmancer/retrieval/_dispatch_part01.py",
              (
                  "            section_ids = self._expand_section_ids(\n"
                  "                section_ids, mode=expand, budget_cap=limit * 3\n"
                  "            )\n"
                  "        chunks = self._hydrate(section_ids, budget=budget)\n"
              ),
              (
                  "            section_ids = self._expand_section_ids(\n"
                  "                section_ids, mode=expand, budget_cap=limit * 3\n"
                  "            )\n"
                  "        section_ids = self._filter_section_ids_before_hydration(\n"
                  "            section_ids, filters,\n"
                  "        )\n"
                  "        chunks = self._hydrate(section_ids, budget=budget)\n"
              ),
          )
          PY
          git diff --check
      - name: Run focused GREEN regressions
        run: |
          python -m pytest -q \
            tests/test_pre_hydration_source_policy.py \
            tests/test_retrieval_diversity_policy.py \
            tests/test_active_fts_projection.py \
            tests/test_retrieval_features.py \
            tests/docs/test_subject_binding_strength.py \
            tests/docs/test_project_answer_contract_v2.py \
            tests/docs/test_project_answer_contract_v3.py \
            tests/docs/test_question_plan_v4.py
          python -m compileall -q docmancer tests scripts eval/systemic_retrieval_plan
          git diff --check
      - name: Run complete systemic retrieval acceptance
        run: |
          python scripts/run_systemic_retrieval_plan_gate.py \
            --work /tmp/docatlas-systemic-plan \
            --report experiments/finalization/PR186_SYSTEMIC_RETRIEVAL_ACCEPTANCE.json
      - name: Publish implementation and self-delete carrier
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/systemic-retrieval-plan-implementation.yml
          git add \
            docmancer/core/sqlite_store.py \
            docmancer/retrieval/_dispatch_part01.py \
            docmancer/retrieval/_dispatch_part02.py \
            experiments/finalization/PR186_SYSTEMIC_RETRIEVAL_ACCEPTANCE.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: enforce pre-hydration policy and record systemic acceptance"
          git push origin HEAD:feat/systemic-retrieval-mechanics
