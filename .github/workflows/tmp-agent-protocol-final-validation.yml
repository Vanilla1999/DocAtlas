name: TEMP validate final agent protocol corrective SHA

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: temp-agent-protocol-final-validation
  cancel-in-progress: true

jobs:
  resolve-final-target:
    if: github.event.pull_request.head.ref == 'tmp/agent-protocol-review-fixes-20260820'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    env:
      TARGET_BRANCH: experiment/agent-developer-protocol-v1
      REVIEWED_HEAD: 7a5a88f6188c793c91ea9231d67a99450bcff0c3
    steps:
      - id: resolve
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            SHA=$(git ls-remote "https://github.com/${{ github.repository }}.git" \
              "refs/heads/$TARGET_BRANCH" | awk '{print $1}')
            if test -n "$SHA" && test "$SHA" != "$REVIEWED_HEAD"; then
              rm -rf target
              git clone --filter=blob:none --no-checkout \
                "https://github.com/${{ github.repository }}.git" target
              cd target
              git fetch --depth=2 origin "$SHA"
              git checkout --detach "$SHA"
              if test "$(git rev-parse HEAD^)" = "$REVIEWED_HEAD" \
                 && test -f scripts/agent_developer_gate_support.py \
                 && grep -q 'apply_agent_protocol_extensions' scripts/run_agent_developer_gate.py \
                 && grep -q 'requested_topic = obligation.context or obligation.target' \
                      docmancer/docs/domain/_answer_units_part02.py; then
                echo "sha=$SHA" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              cd ..
            fi
            sleep 10
          done
          echo 'final corrective SHA was not materialized in time' >&2
          exit 1

  core:
    needs: resolve-final-target
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    runs-on: ubuntu-24.04
    env:
      DOCMANCER_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-final-target.outputs.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - name: Full offline core
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ needs.resolve-final-target.outputs.sha }}'
          python -m compileall -q docmancer scripts
          pytest -q -m 'not advanced'

  advanced:
    needs: resolve-final-target
    runs-on: ubuntu-24.04
    env:
      DOCMANCER_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-final-target.outputs.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Advanced and release-critical contracts
        run: |
          set -euo pipefail
          pytest -q tests/ -m advanced
          python scripts/run_legacy_contract_gate.py
          python scripts/run_project_docs_self_host_gate.py
          python scripts/run_question_surface_gate.py
          python scripts/run_agent_developer_gate.py
          python scripts/run_critical_mutation_gate.py
          python scripts/check_python_module_size.py
          git diff --check

  release:
    needs: resolve-final-target
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-final-target.outputs.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build 'hatchling<1.27'
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python scripts/release_gate.py

  mark-pass:
    needs: [resolve-final-target, core, advanced, release]
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: ${{ needs.resolve-final-target.outputs.sha }}
      PASS_BRANCH: tmp/agent-protocol-validation-passed-20260820
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: true
      - name: Publish exact validated SHA pointer
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git push --force origin "HEAD:refs/heads/$PASS_BRANCH"
