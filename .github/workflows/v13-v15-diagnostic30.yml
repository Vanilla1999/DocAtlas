name: V13 V15 diagnostic30
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths:
      - .github/workflows/v13-v15-diagnostic30.yml
      - scripts/run_v13_v15_diagnostic30.py
      - eval/project_context_quality/v13_v15_questions.json

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate runtime
        uses: actions/checkout@v4
        with:
          path: runtime-candidate
      - name: Checkout frozen main runtime
        uses: actions/checkout@v4
        with:
          ref: fbf36763f89f89f3745b4ea58b773eb33489d2f4
          path: runtime-main
      - name: Checkout frozen main corpus
        uses: actions/checkout@v4
        with:
          ref: fbf36763f89f89f3745b4ea58b773eb33489d2f4
          path: corpus-main
      - uses: astral-sh/setup-uv@v6
      - name: Install main runtime
        working-directory: runtime-main
        run: uv sync --frozen --extra dev
      - name: Verify recorder on main
        working-directory: runtime-main
        run: uv run --frozen --extra dev pytest tests/docs/test_context_capture_integrity.py -q
      - name: Capture main
        working-directory: runtime-main
        run: |
          PYTHONPATH="$PWD" uv run --frozen --extra dev python             ../runtime-candidate/scripts/run_v13_v15_diagnostic30.py             --project-root ../corpus-main             --questions ../runtime-candidate/eval/project_context_quality/v13_v15_questions.json             --output ../dr30-main.json
      - name: Install candidate runtime
        working-directory: runtime-candidate
        run: uv sync --frozen --extra dev
      - name: Verify recorder on candidate
        working-directory: runtime-candidate
        run: uv run --frozen --extra dev pytest tests/docs/test_context_capture_integrity.py -q
      - name: Capture candidate on same corpus
        working-directory: runtime-candidate
        run: |
          PYTHONPATH="$PWD" uv run --frozen --extra dev python             scripts/run_v13_v15_diagnostic30.py             --project-root ../corpus-main             --questions eval/project_context_quality/v13_v15_questions.json             --output ../dr30-candidate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-v15-diagnostic30
          path: |
            dr30-main.json
            dr30-candidate.json
