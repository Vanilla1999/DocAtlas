name: TEMP tighten P1 claim boundary

on:
  push:
    branches: [p1/installed-mcp-live-harness]
    paths:
      - .github/workflows/temp-tighten-p1-claim-boundary.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  tighten:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: p1/installed-mcp-live-harness
          fetch-depth: 0

      - name: Separate source, package and public-truth claims
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: replacement not found exactly once: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          harness = "scripts/run_installed_mcp_agent_harness.py"
          replace_once(
              harness,
              '        dirty = bool(run_checked(["git", "status", "--porcelain"], cwd=root).stdout.strip())\n',
              '        # Build/download products are intentionally untracked.  Source identity\n        # is dirty only when a tracked file differs from the recorded commit.\n        dirty = bool(\n            run_checked(\n                ["git", "status", "--porcelain", "--untracked-files=no"],\n                cwd=root,\n            ).stdout.strip()\n        )\n',
          )
          replace_once(
              harness,
              '            "public_release_proven": package["install_mode"] == "public_package",\n',
              '            "public_package_installed": package["install_mode"] == "public_package",\n            "public_release_truth_closed": False,\n',
          )

          verifier = "scripts/verify_installed_mcp_agent_report.py"
          replace_once(
              verifier,
              '    public_proven = claims.get("public_release_proven")\n    require(public_proven == (package.get("install_mode") == "public_package"), "public-release claim/install-mode mismatch")\n',
              '    public_installed = claims.get("public_package_installed")\n    require(public_installed == (package.get("install_mode") == "public_package"), "public-package claim/install-mode mismatch")\n    require(claims.get("public_release_truth_closed") is False, "harness report cannot close Public Truth")\n',
          )
          replace_once(
              verifier,
              '            "public_release_proven": False,\n',
              '            "public_package_installed": False,\n            "public_release_truth_closed": False,\n',
          )
          replace_once(
              verifier,
              '    false_public["claim_boundary"]["public_release_proven"] = True\n    expect_invalid(false_public, "public-release claim")\n',
              '    false_public["claim_boundary"]["public_package_installed"] = True\n    expect_invalid(false_public, "public-package claim")\n\n    false_closure = copy.deepcopy(sample)\n    false_closure["claim_boundary"]["public_release_truth_closed"] = True\n    expect_invalid(false_closure, "cannot close Public Truth")\n',
          )
          replace_once(
              verifier,
              '    print("Installed MCP Agent v1 report verifier: SELF-TEST PASS (6/6)")\n',
              '    print("Installed MCP Agent v1 report verifier: SELF-TEST PASS (7/7)")\n',
          )

          workflow = ".github/workflows/installed-mcp-agent-v1.yml"
          replace_once(
              workflow,
              '              assert report["claim_boundary"]["public_release_proven"] is False\n',
              '              assert report["claim_boundary"]["public_package_installed"] is False\n          assert report["claim_boundary"]["public_release_truth_closed"] is False\n',
          )

          readme = "eval/installed_mcp_agent_v1/README.md"
          replace_once(
              readme,
              'A `built_wheel` report cannot close any public-release scorecard row. A future Agent Truth claim should normally use `public_package` after the deferred release work is completed.\n',
              'A `built_wheel` report cannot close any public-release scorecard row. `public_package` proves only that exact public bytes were installed for this run; the harness always records `public_release_truth_closed=false` because publication provenance, exact artifact equality and three-platform release evidence are separate gates. A future Agent Truth claim should normally use `public_package` after the deferred release work is completed.\n',
          )
          PY
          rm .github/workflows/temp-tighten-p1-claim-boundary.yml
          python -m py_compile \
            scripts/run_installed_mcp_agent_harness.py \
            scripts/verify_installed_mcp_agent_report.py
          python scripts/verify_installed_mcp_agent_report.py --self-test
          git diff --check

      - name: Commit tightened claims
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          changed="$(git diff --cached --name-only)"
          expected="$(printf '%s\n' \
            .github/workflows/installed-mcp-agent-v1.yml \
            eval/installed_mcp_agent_v1/README.md \
            scripts/run_installed_mcp_agent_harness.py \
            scripts/verify_installed_mcp_agent_report.py)"
          test "$changed" = "$expected" || {
            echo "::error::unexpected claim-boundary diff"
            printf 'actual:\n%s\nexpected:\n%s\n' "$changed" "$expected"
            exit 1
          }
          git commit -m "fix(p1): separate package install from public truth"
          git push origin HEAD:p1/installed-mcp-live-harness
