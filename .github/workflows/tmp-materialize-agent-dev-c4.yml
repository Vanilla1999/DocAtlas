name: TEMP materialize Agent Developer Commit 4

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply reviewed Commit 4 patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/c4.patch
          git apply --check /tmp/c4.patch
          git apply /tmp/c4.patch
          git diff --check
          git rm .github/workflows/tmp-materialize-agent-dev-c4.yml
          git config user.name 'Vanilla1999'
          git config user.email '41183994+Vanilla1999@users.noreply.github.com'
          git add -A
          git commit -m 'TEMP materialize Agent Developer Commit 4'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
