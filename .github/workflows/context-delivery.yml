name: Compact model context installed MCP
on:
  pull_request:
    paths: ['docmancer/**', 'SKILL.md', 'eval/*context*', 'eval/minilm_sections*', '.github/workflows/context-delivery.yml', 'uv.lock']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compact-context-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  installed-model-view:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Freeze exact source and owner baseline instructions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/context-evidence/baseline"
          git rev-parse HEAD > "$RUNNER_TEMP/context-evidence/head.txt"
          git diff --exit-code
          python -m compileall -q docmancer eval/context_delivery_integration.py eval/minilm_sections_integration.py
          base=bde2a101032b204e6a4168c0e8a63f45040b3ddc
          git fetch -q origin "$base" --depth=1
          git show "$base:SKILL.md" > "$RUNNER_TEMP/context-evidence/baseline/SKILL.md"
          git show "$base:docmancer/templates/agent_contract.md" > "$RUNNER_TEMP/context-evidence/baseline/agent_contract.md"
          git show "$base:docmancer/mcp/_docs_server_tool_data.py" > "$RUNNER_TEMP/context-evidence/baseline/tools.py"
          git archive HEAD docmancer SKILL.md eval/context_delivery_integration.py eval/context_instruction_measurements.py eval/minilm_sections_integration.py .github/workflows/context-delivery.yml | gzip > "$RUNNER_TEMP/context-evidence/tested-source.tar.gz"
      - name: Build non-editable wheel and explicitly provision pinned MiniLM
        run: docker build -f eval/minilm_sections.Dockerfile -t docatlas-context-delivery .
      - name: Measure actual instruction and schema tokens (tokenizer provisioning, no model requests)
        run: |
          docker run --rm -v "$RUNNER_TEMP/context-evidence:/evidence" \
            --entrypoint /opt/venv/bin/python docatlas-context-delivery \
            -I /repo/eval/context_instruction_measurements.py --repo /repo \
            --baseline /evidence/baseline --out /evidence/INSTRUCTIONS.json
      - name: Real stdio, exact citations, observer equivalence, all-retained status and revocation
        run: |
          set +e
          docker run --name context-controls --network none --cpus=2 \
            --memory=1000000000 --memory-swap=1000000000 \
            -e TESTED_SHA="$(git rev-parse HEAD)" -e HF_HUB_OFFLINE=1 \
            -v "$RUNNER_TEMP/context-evidence:/evidence" --entrypoint /opt/venv/bin/python \
            docatlas-context-delivery -I /repo/eval/context_delivery_integration.py \
            --repo /repo --work /tmp/controls --out /evidence/controls --model /model
          rc=$?
          docker inspect context-controls > "$RUNNER_TEMP/context-evidence/controls-container.json"
          exit "$rc"
      - name: Same original V40 through model text and exact private ledger; offline under hard 1GB
        run: |
          set +e
          docker run --name context-v40 --network none --cpus=2 \
            --memory=1000000000 --memory-swap=1000000000 \
            -e TESTED_SHA="$(git rev-parse HEAD)" -e HF_HUB_OFFLINE=1 \
            -v "$RUNNER_TEMP/context-evidence:/evidence" docatlas-context-delivery \
            --repo /repo --work /tmp/sections --out /evidence/v40 --model /model --model-view
          rc=$?
          docker inspect context-v40 > "$RUNNER_TEMP/context-evidence/v40-container.json"
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: context-delivery-${{ github.run_id }}
          path: ${{ runner.temp }}/context-evidence/
          retention-days: 30
          if-no-files-found: error

  policy-study:
    name: Policy diagnostic (not quality acceptance) ${{ matrix.top_k }}-${{ matrix.units }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {top_k: 1, units: legacy}
          - {top_k: 2, units: legacy}
          - {top_k: 3, units: legacy}
          - {top_k: 5, units: markdown-owner-v1}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build same pinned installed wheel and scorer
        run: |
          mkdir -p "$RUNNER_TEMP/policy-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/policy-evidence/head.txt"
          docker build -f eval/minilm_sections.Dockerfile -t docatlas-policy-study .
      - name: Actual stdio V40 policy arm; quality failures are reported, never accepted
        run: |
          set +e
          docker run --name policy-study --network none --cpus=2 \
            --memory=1000000000 --memory-swap=1000000000 \
            -e TESTED_SHA="$(git rev-parse HEAD)" -e HF_HUB_OFFLINE=1 \
            -v "$RUNNER_TEMP/policy-evidence:/evidence" docatlas-policy-study \
            --repo /repo --work /tmp/policy --out /evidence/run --model /model \
            --model-view --top-k ${{ matrix.top_k }} --units ${{ matrix.units }} --policy-diagnostic
          rc=$?
          docker inspect policy-study > "$RUNNER_TEMP/policy-evidence/container.json"
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: policy-${{ matrix.top_k }}-${{ matrix.units }}-${{ github.run_id }}
          path: ${{ runner.temp }}/policy-evidence/
          retention-days: 30
          if-no-files-found: error
