name: Release artifact gate and publish

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v1.3.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify dispatched release source is on protected main
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Release tag commit is not reachable from main"
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["RELEASE_REPOSITORY"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/branches/main",
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "DocAtlas-release-source-verifier/1",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              branch = json.load(response)
          if branch.get("protected") is not True:
              raise SystemExit("release source verification failed: remote main is not protected")
          print("Release source ancestry/protection: PASS")
          PY
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - run: python -m pip install build "hatchling<1.27"
      - run: python -m build
      - env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/release_gate.py --tag "$RELEASE_TAG" --manifest dist/release-manifest.json
          else
            python scripts/release_gate.py --manifest dist/release-manifest.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  wheel:
    needs: build
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-dist
          path: dist
      - run: python scripts/release_gate.py
      - run: python -m pip install dist/*.whl
      - run: |
          cd "$(mktemp -d)"
          doc-atlas --help
          doc-atlas --version
          python "$GITHUB_WORKSPACE/scripts/docs_mcp_stdio_smoke.py"

  sdist-and-installer:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-dist
          path: dist
      - run: |
          mkdir sdist-wheel
          cp dist/*.tar.gz sdist-wheel/
          python -m pip wheel --no-deps --wheel-dir sdist-wheel dist/*.tar.gz
          python scripts/release_gate.py --dist sdist-wheel
      - run: python -m pip install --force-reinstall sdist-wheel/*.whl
      - run: |
          cd "$(mktemp -d)"
          python "$GITHUB_WORKSPACE/scripts/docs_mcp_stdio_smoke.py"
      - run: |
          EXPECTED_VERSION="$(python -c 'from docmancer._version import __version__; print(__version__)')"
          DOCATLAS_INSTALL_SOURCE="$(find "$PWD/dist" -name '*.whl' -print -quit)" \
          DOCATLAS_EXPECT_VERSION="$EXPECTED_VERSION" \
          DOCATLAS_AGENT=none sh scripts/install.sh
          cd "$(mktemp -d)"
          doc-atlas --help
          python "$GITHUB_WORKSPACE/scripts/docs_mcp_stdio_smoke.py"

  required-release:
    name: required-release
    if: always()
    needs: [build, wheel, sdist-and-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce required release validation
        env:
          BUILD: ${{ needs.build.result }}
          WHEEL: ${{ needs.wheel.result }}
          SDIST_INSTALLER: ${{ needs.sdist-and-installer.result }}
        run: |
          for result in "$BUILD" "$WHEEL" "$SDIST_INSTALLER"; do
            test "$result" = "success"
          done

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: [required-release]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-dist
          path: dist
      - name: Capture exact artifacts submitted to PyPI
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          artifacts = sorted([
              *Path("dist").glob("*.whl"),
              *Path("dist").glob("*.tar.gz"),
          ])
          if len(artifacts) != 2:
              raise SystemExit(f"expected one wheel and one sdist, found: {[p.name for p in artifacts]}")
          expected = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in artifacts
          }
          target = Path(os.environ["RUNNER_TEMP"]) / "docatlas-expected-public-artifacts.json"
          target.write_text(json.dumps(expected, sort_keys=True), encoding="utf-8")
          print(json.dumps(expected, indent=2, sort_keys=True))
          PY
      - run: rm dist/release-manifest.json
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "dist/*"
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1
      - name: Verify exact public wheel and sdist bytes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          expected_path = Path(os.environ["RUNNER_TEMP"]) / "docatlas-expected-public-artifacts.json"
          expected = json.loads(expected_path.read_text(encoding="utf-8"))
          metadata_url = f"https://pypi.org/pypi/doc-atlas/{version}/json"
          last_error = None

          for attempt in range(1, 6):
              try:
                  request = urllib.request.Request(
                      metadata_url,
                      headers={"Cache-Control": "no-cache", "User-Agent": "DocAtlas-release-verifier/1"},
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      metadata = json.load(response)
                  rows = {
                      row["filename"]: row
                      for row in metadata.get("urls", [])
                      if row.get("packagetype") in {"bdist_wheel", "sdist"}
                  }
                  if set(rows) != set(expected):
                      raise RuntimeError(
                          f"registry artifact names do not match submitted artifacts: "
                          f"expected={sorted(expected)} actual={sorted(rows)}"
                      )

                  actual = {}
                  for filename, row in sorted(rows.items()):
                      with urllib.request.urlopen(row["url"], timeout=60) as response:
                          data = response.read()
                      digest = hashlib.sha256(data).hexdigest()
                      metadata_digest = str((row.get("digests") or {}).get("sha256") or "")
                      if metadata_digest != digest:
                          raise RuntimeError(
                              f"PyPI metadata/content hash mismatch for {filename}: "
                              f"metadata={metadata_digest} downloaded={digest}"
                          )
                      actual[filename] = digest

                  if actual != expected:
                      raise RuntimeError(
                          f"published artifact bytes differ from gated build: "
                          f"expected={expected} actual={actual}"
                      )
                  print("Exact published-artifact verification: PASS")
                  print(json.dumps(actual, indent=2, sort_keys=True))
                  break
              except (urllib.error.URLError, TimeoutError, RuntimeError) as exc:
                  last_error = exc
                  if attempt == 5:
                      raise SystemExit(
                          f"exact public artifact verification failed after {attempt} attempts: {exc}"
                      ) from exc
                  time.sleep(attempt * 15)
          else:
              raise SystemExit(f"exact public artifact verification failed: {last_error}")
          PY
      - name: Verify the exact public release installation and MCP surface
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          export PIP_NO_CACHE_DIR=1
          for attempt in 1 2 3 4 5; do
            if DOCATLAS_INSTALL_VERSION="$RELEASE_VERSION" \
              DOCATLAS_EXPECT_VERSION="$RELEASE_VERSION" \
              DOCATLAS_AGENT=none sh scripts/install.sh; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Public package doc-atlas==$RELEASE_VERSION was not installable after 5 attempts"
              exit 1
            fi
            sleep "$((attempt * 15))"
          done
          cd "$(mktemp -d)"
          doc-atlas --version
          python "$GITHUB_WORKSPACE/scripts/docs_mcp_stdio_smoke.py"

  public-platform-smoke:
    name: public-platform-smoke (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    needs: [publish]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Verify exact public version and three-tool MCP surface
        run: python scripts/public_release_smoke.py --tag "${{ inputs.tag }}"
