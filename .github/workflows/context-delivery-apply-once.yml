name: Apply context delivery branch edits once
on:
  push:
    branches: [fix/compact-context-delivery]
    paths: ['.github/context_delivery_apply.py', '.github/workflows/context-delivery-apply-once.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Vanilla1999/DocAtlas'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 16
      - name: Apply exact anchored changes, remove builder, publish only this branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/compact-context-delivery
          git merge-base --is-ancestor bde2a101032b204e6a4168c0e8a63f45040b3ddc HEAD
          python .github/context_delivery_apply.py
          python -m compileall -q docmancer eval/context_delivery_integration.py eval/minilm_sections_integration.py
          git rm .github/context_delivery_apply.py .github/workflows/context-delivery-apply-once.yml
          git add docmancer SKILL.md docs eval/minilm_sections_integration.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: language-first context delivery, truthful selection status and private evidence ledger'
          git push origin HEAD:refs/heads/fix/compact-context-delivery
          mkdir -p "$RUNNER_TEMP/applied"
          git rev-parse HEAD > "$RUNNER_TEMP/applied/head.txt"
          git diff bde2a101032b204e6a4168c0e8a63f45040b3ddc HEAD > "$RUNNER_TEMP/applied/changes.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: context-delivery-applied-${{ github.run_id }}
          path: ${{ runner.temp }}/applied/
          retention-days: 30
