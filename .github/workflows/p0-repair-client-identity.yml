name: P0 repair client identity

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'p0/docatlas-config-skill-identity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: p0/docatlas-config-skill-identity
          fetch-depth: 1
      - name: Repair escaped newline literals and syntax-check shards
        shell: python
        run: |
          from pathlib import Path
          import ast

          NL = "\n"

          def exact(path: str, old: str, new: str, expected: int) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} matches, got {count}: {old!r}"
                  )
              target.write_text(text.replace(old, new), encoding="utf-8")

          p1 = "docmancer/cli/_commands_part01.py"
          exact(
              p1,
              'marker_block = f"{_AGENTS_MD_START}' + NL + '{body.strip()}' + NL + '{_AGENTS_MD_END}' + NL + '"',
              r'marker_block = f"{_AGENTS_MD_START}\n{body.strip()}\n{_AGENTS_MD_END}\n"',
              1,
          )
          exact(
              p1,
              '_SKILL_FILE_OWNER + "' + NL + '" + marker_block',
              r'_SKILL_FILE_OWNER + "\n" + marker_block',
              3,
          )
          exact(
              p1,
              'marker_block.rstrip("' + NL + '")',
              r'marker_block.rstrip("\n")',
              1,
          )
          exact(
              p1,
              'marker_block = f"{_AGENTS_MD_START}' + NL + '{content_body.strip()}' + NL + '{_AGENTS_MD_END}"',
              r'marker_block = f"{_AGENTS_MD_START}\n{content_body.strip()}\n{_AGENTS_MD_END}"',
              1,
          )
          exact(
              p1,
              'marker_block + "' + NL + '"',
              r'marker_block + "\n"',
              2,
          )
          exact(
              p1,
              'separator = "' + NL + NL + '" if existing and not existing.endswith("' + NL + NL + '") else ""',
              r'separator = "\n\n" if existing and not existing.endswith("\n\n") else ""',
              1,
          )

          p2 = "docmancer/cli/_commands_part02.py"
          exact(
              p2,
              'json.dumps({"agents": sorted(agents)}, indent=2) + "' + NL + '"',
              r'json.dumps({"agents": sorted(agents)}, indent=2) + "\n"',
              1,
          )
          exact(
              p2,
              'dest.write_text(updated + "' + NL + '", encoding="utf-8")',
              r'dest.write_text(updated + "\n", encoding="utf-8")',
              1,
          )

          for path in (
              "docmancer/cli/_commands_part01.py",
              "docmancer/cli/_commands_part02.py",
              "docmancer/cli/_commands_part05.py",
              "docmancer/cli/client_identity.py",
          ):
              ast.parse(Path(path).read_text(encoding="utf-8"), filename=path)
      - run: git diff --check
      - name: Commit repair
        run: |
          git config user.name 'DocAtlas P0 automation'
          git config user.email 'actions@users.noreply.github.com'
          git add docmancer/cli/_commands_part01.py docmancer/cli/_commands_part02.py
          git commit -m 'Repair client identity codemod literals'
          git push origin HEAD:p0/docatlas-config-skill-identity
