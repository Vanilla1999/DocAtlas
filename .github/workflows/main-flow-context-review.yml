name: Main flow context integration

on:
  pull_request:
    branches: [main, feature/main-flow-logging, fix/main-flow-context-delivery, eval/main-flow-extra40-20261012]

permissions:
  contents: read

concurrency:
  group: main-flow-context-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCATLAS_OFFLINE: "1"
      DOCATLAS_AUTO_VECTORS: "0"
      DOCATLAS_REGISTRY_API_URL: "http://127.0.0.1:1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install uv==0.9.25
          uv sync --frozen --extra dev
      - name: Real retrieval, public MCP, CLI and source isolation
        run: |
          mkdir -p "$RUNNER_TEMP/main-flow-proof"
          git rev-parse HEAD > "$RUNNER_TEMP/main-flow-proof/head.txt"
          .venv/bin/python -m pytest -q --tb=short -o junit_family=legacy \
            tests/test_project_context_quality_v2_protocol.py \
            tests/test_main_flow_logging_integration.py \
            tests/test_retrieval_features.py::test_lexical_and_supplemental_paths_enforce_forbidden_sources \
            tests/test_retrieval_features.py::test_lexical_compact_results_limit_sections_per_source_when_configured \
            tests/test_retrieval_features.py::test_expand_bypasses_sections_per_source_cap \
            tests/docs/test_host_scope_contract.py \
            tests/test_docs_service.py::test_get_project_docs_never_returns_hash_mismatched_stale_content \
            --basetemp="$RUNNER_TEMP/main-flow-proof/pytest" \
            --junitxml="$RUNNER_TEMP/main-flow-proof/integration.xml"
      - name: Forty unchanged public MCP questions
        if: ${{ !cancelled() }}
        env:
          EXTRA40_ARTIFACT_DIR: ${{ runner.temp }}/main-flow-proof
        run: PYTHONPATH=. .venv/bin/python eval/main_flow_comparison/run_extra40.py
      - name: Paired lookup calls for twelve failed public MCP questions
        if: ${{ !cancelled() }}
        env:
          EXTRA40_ARTIFACT_DIR: ${{ runner.temp }}/main-flow-proof
          EXTRA40_LOOKUP_ONLY: "1"
        run: PYTHONPATH=. .venv/bin/python eval/main_flow_comparison/run_extra40.py
      - name: Summarize actual visible tokens
        if: ${{ !cancelled() }}
        run: |
          .venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          from docmancer.docs.application.projection_tokenizer import projection_token_count
          root = Path(os.environ['RUNNER_TEMP']) / 'main-flow-proof'
          result = []
          paths = [root / 'pytest/test_frozen_main_flow_question0/main-flow-proof.json',
                   root / 'extra40-results.json', root / 'extra40-lookup-results.json']
          for path in paths:
              if not path.exists():
                  continue
              report = json.loads(path.read_text())
              rows = []
              for row in report['results']:
                  public = {k: v for k, v in row.get('payload', {}).items() if k != 'diagnostics'}
                  snippets = '\n\n'.join(s['snippet'] for s in public.get('sources', []))
                  rows.append({'id': row['id'], 'variant': row.get('lookup_variant', 'no_lookup'),
                               'snippet_tokens': projection_token_count(snippets.encode()),
                               'public_tokens': projection_token_count(json.dumps(public, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode())})
              result.append({'file': str(path.relative_to(root)), 'rows': rows})
              for variant in sorted({r['variant'] for r in rows}):
                  group = [r for r in rows if r['variant'] == variant]
                  print(path.name, variant, 'calls', len(group), 'snippet_tokens', sum(r['snippet_tokens'] for r in group), 'public_tokens', sum(r['public_tokens'] for r in group))
          (root / 'visible-tokens.json').write_text(json.dumps(result, indent=2))
          PY
      - name: Preserve exact-commit integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: main-flow-context-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/main-flow-proof/
          retention-days: 14
          if-no-files-found: error
