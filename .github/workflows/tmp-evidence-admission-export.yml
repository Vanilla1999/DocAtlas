name: Temporary evidence admission validation
on:
  push:
    branches: [fix/evidence-admission-sufficiency]
    paths: [.github/workflows/tmp-evidence-admission-export.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCATLAS_OFFLINE: '1'
      DOCATLAS_AUTO_VECTORS: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/evidence-admission-sufficiency
          fetch-depth: 3
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Apply byte-verified local TDD patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/patch.b64 <<'EOF'
          
          EOF
          python - <<'PY2'
          import base64,gzip,hashlib,pathlib
          encoded=pathlib.Path('/tmp/patch.b64').read_text().strip()
          data=gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(data).hexdigest() == 'e7385c1ae5ff13110ce556b257b6f5a17f6df110d8d447c00e388a61c71e68c6'
          pathlib.Path('/tmp/evidence-admission.patch').write_bytes(data)
          PY2
          git apply --check /tmp/evidence-admission.patch
          git apply /tmp/evidence-admission.patch
          git diff --check
      - name: Install test dependencies without tokenizer/model runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY2'
          import subprocess,sys,tomllib
          with open('pyproject.toml','rb') as fh:
              data=tomllib.load(fh)
          deps=[d for d in data['project']['dependencies'] if not d.startswith(('tiktoken','fastembed'))]
          deps += data['project']['optional-dependencies']['dev']
          subprocess.run([sys.executable,'-m','pip','install','-q',*deps],check=True)
          PY2
      - name: Run evidence admission, relation, skill and public-contract regression block
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/docs/test_evidence_admission_sufficiency.py \
            tests/docs/test_agent_question_planning_contract.py \
            tests/docs/test_agent_question_planning_live_eval.py \
            tests/docs/test_agent_recovery_version_guidance.py \
            tests/docs/test_dependency_version_transition.py \
            tests/docs/test_relation_preserving_projection.py \
            tests/docs/test_comparison_relation_query_planning.py \
            tests/docs/test_documentation_query_plan.py \
            tests/docs/test_query_planning_budget.py \
            tests/docs/test_host_scope_contract.py \
            tests/docs/test_host_scope_planning_contract.py \
            tests/docs/test_mcp_docs_tools_registration.py \
            tests/test_install_cmd.py | tee /tmp/evidence-admission-tests.log
          python -m compileall -q docmancer
          python - <<'PY2'
          import importlib.util
          assert importlib.util.find_spec('tiktoken') is None
          assert importlib.util.find_spec('fastembed') is None
          PY2
          git diff --check
      - name: Publish only the validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-evidence-admission-export.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve supporting evidence across lookup admission'
          git push origin HEAD:fix/evidence-admission-sufficiency
          git rev-parse HEAD > /tmp/evidence-admission-head.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: evidence-admission-validation
          path: |
            /tmp/evidence-admission-tests.log
            /tmp/evidence-admission-head.txt
          if-no-files-found: ignore
          retention-days: 7
