name: Systemic retrieval prehydration TDD fix

on:
  push:
    branches: [feat/systemic-retrieval-mechanics]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCATLAS_OFFLINE: "1"

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/systemic-retrieval-mechanics
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply minimal production boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          active = Path('docmancer/core/_sqlite_store_active_fts.py')
          text = active.read_text()
          text = text.replace('import sqlite3\n', 'import json\nimport sqlite3\n', 1)
          marker = '    def _ensure_schema(self) -> None:\n'
          addition = '''    def fetch_section_filter_metadata(self, section_ids: list[int]) -> list[dict[str, Any]]:\n        """Read only policy metadata for candidate ids before text hydration."""\n        ordered = list(dict.fromkeys(int(value) for value in section_ids))\n        if not ordered:\n            return []\n        placeholders = ",".join("?" for _ in ordered)\n        with self._connect() as conn:\n            generation_id = self._active_generation_id(conn)\n            if not generation_id:\n                return []\n            rows = conn.execute(\n                f"""\n                SELECT hydration_id AS section_id, source, source_path,\n                       source_identity, library_id, project_identity, project_path,\n                       module_id, doc_scope, source_class, authority, lifecycle_status,\n                       temporal_relevance, index_freshness, docs_snapshot_exact, metadata_json\n                FROM retrieval_children\n                WHERE generation_id = ? AND hydration_id IN ({placeholders})\n                """,\n                (generation_id, *ordered),\n            )\n            result: dict[int, dict[str, Any]] = {}\n            for row in rows:\n                try:\n                    metadata = json.loads(str(row["metadata_json"] or "{}"))\n                except (TypeError, json.JSONDecodeError):\n                    metadata = {}\n                metadata.update({\n                    "section_id": int(row["section_id"]),\n                    "source": str(row["source"] or ""),\n                    "source_path": str(row["source_path"] or ""),\n                    "source_identity": str(row["source_identity"] or ""),\n                    "library_id": str(row["library_id"] or ""),\n                    "project_identity": str(row["project_identity"] or ""),\n                    "project_path": str(row["project_path"] or ""),\n                    "module_id": str(row["module_id"] or ""),\n                    "doc_scope": str(row["doc_scope"] or ""),\n                    "source_class": str(row["source_class"] or ""),\n                    "authority": str(row["authority"] or "unknown"),\n                    "lifecycle_status": str(row["lifecycle_status"] or "active"),\n                    "temporal_relevance": str(row["temporal_relevance"] or "current"),\n                    "index_freshness": str(row["index_freshness"] or "synchronized"),\n                })\n                if row["docs_snapshot_exact"] is not None:\n                    metadata["docs_snapshot_exact"] = bool(row["docs_snapshot_exact"])\n                result[int(row["section_id"])] = metadata\n        return [result[value] for value in ordered if value in result]\n\n'''
          if marker not in text or 'def fetch_section_filter_metadata' in text:
              raise SystemExit('active FTS insertion precondition failed')
          active.write_text(text.replace(marker, addition + marker, 1))

          dispatch2 = Path('docmancer/retrieval/_dispatch_part02.py')
          text = dispatch2.read_text()
          marker = '''    def _candidate_limit_for_diversity(self, limit: int, expand: str | None) -> int:\n'''
          addition = '''    def _filter_section_ids_before_hydration(\n        self, section_ids: list[int], filters: dict | None,\n    ) -> list[int]:\n        if not section_ids or not filters:\n            return section_ids\n        read_metadata = getattr(self.store, "fetch_section_filter_metadata", None)\n        if not callable(read_metadata):\n            # Compatibility for third-party/test stores; hydrated chunks still\n            # pass through the existing defense-in-depth policy check.\n            return section_ids\n        allowed = {\n            int(row["section_id"])\n            for row in read_metadata(section_ids)\n            if row.get("section_id") is not None\n            and metadata_matches_filters(\n                row, filters, source=str(row.get("source") or ""),\n            )\n        }\n        return [value for value in section_ids if int(value) in allowed]\n\n    def _hydrate_policy_filtered(\n        self, section_ids: list[int], *, budget: int, filters: dict | None,\n    ) -> list:\n        return self._hydrate(\n            self._filter_section_ids_before_hydration(section_ids, filters),\n            budget=budget,\n        )\n\n'''
          if marker not in text or 'def _hydrate_policy_filtered' in text:
              raise SystemExit('dispatcher insertion precondition failed')
          dispatch2.write_text(text.replace(marker, addition + marker, 1))

          dispatch1 = Path('docmancer/retrieval/_dispatch_part01.py')
          text = dispatch1.read_text()
          old = '''        chunks = self._hydrate(section_ids, budget=budget)\n        chunks = self._filter_chunks(chunks, merged_filters)\n'''
          new = '''        chunks = self._hydrate_policy_filtered(\n            section_ids, budget=budget, filters=merged_filters,\n        )\n        chunks = self._filter_chunks(chunks, merged_filters)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'flat hydration replacement count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '''        chunks = self._hydrate(section_ids, budget=budget)\n        chunks = self._filter_chunks(chunks, filters)\n'''
          new = '''        chunks = self._hydrate_policy_filtered(\n            section_ids, budget=budget, filters=filters,\n        )\n        chunks = self._filter_chunks(chunks, filters)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'hierarchical hydration replacement count={text.count(old)}')
          dispatch1.write_text(text.replace(old, new, 1))
          PY
      - name: GREEN targeted boundary and retrieval regressions
        run: |
          python -m pytest -q \
            tests/test_prehydration_policy.py \
            tests/test_retrieval_diversity_policy.py \
            tests/test_retrieval_features.py \
            tests/test_query_planning.py \
            tests/test_public_vector_retrieval.py
          python -m compileall -q docmancer tests
          git diff --check
      - name: Publish fix and consume carrier
        run: |
          rm .github/workflows/systemic-retrieval-prehydration-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: enforce source policy before hydration'
          git push origin HEAD:feat/systemic-retrieval-mechanics
