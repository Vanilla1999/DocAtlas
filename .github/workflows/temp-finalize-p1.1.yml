name: TEMP finalize P1.1 installed MCP harness

on:
  push:
    branches: [p1/p1.1-final]
    paths:
      - .github/workflows/temp-finalize-p1.1.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: p1/p1.1-final
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Apply exact privacy and failure-stage hardening
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("eval/agent_developer_v1/installed_mcp_benchmark.py")
          text = path.read_text(encoding="utf-8")

          old_env = '''        env = dict(os.environ)
          env.pop("PYTHONPATH", None)
          env.pop("DOCMANCER_HOME", None)
          env.update(
              {
                  "HOME": str(user_home),
                  "USERPROFILE": str(user_home),
                  "DOCATLAS_HOME": str(home),
                  "DOCMANCER_OFFLINE": "1",
                  "NO_PROXY": "*",
              }
          )
          '''
          new_env = '''        env = {
              key: value
              for key in (
                  "PATH",
                  "SYSTEMROOT",
                  "WINDIR",
                  "TMPDIR",
                  "TEMP",
                  "TMP",
                  "LANG",
                  "LC_ALL",
                  "PYTHONUTF8",
              )
              if (value := os.environ.get(key))
          }
          env.update(
              {
                  "HOME": str(user_home),
                  "USERPROFILE": str(user_home),
                  "DOCATLAS_HOME": str(home),
                  "DOCMANCER_OFFLINE": "1",
                  "NO_PROXY": "*",
              }
          )
          '''
          assert text.count(old_env) == 1, text.count(old_env)
          text = text.replace(old_env, new_env, 1)

          old_finish = '''                                "action": {
                                      "action": "finish",
                                      "reason": str(action["reason"]),
                                  },
          '''
          new_finish = '''                                "action": {
                                      "action": "finish",
                                      "reason_sha256": hashlib.sha256(
                                          str(action["reason"]).encode("utf-8")
                                      ).hexdigest(),
                                  },
          '''
          assert text.count(old_finish) == 1, text.count(old_finish)
          text = text.replace(old_finish, new_finish, 1)

          marker = "\n\ndef _aggregate(\n"
          helper = '''

          def _evaluator_failure_stages(score: dict[str, Any]) -> set[str]:
              # A model-format failure before any context call must not be
              # mislabeled as a retrieval failure merely because scope scoring
              # is necessarily false on an empty trajectory.
              if int(score.get("context_call_count") or 0) == 0:
                  return set()
              errors = [str(value).lower() for value in score.get("errors") or ()]
              stages: set[str] = set()
              if (
                  score.get("scope_contract_ok") is False
                  or any(
                      token in error
                      for error in errors
                      for token in (
                          "source",
                          "scope",
                          "module candidate",
                          "module_path",
                      )
                  )
              ):
                  stages.add("retrieval")
              if (
                  int(score.get("false_supported") or 0) > 0
                  or any(
                      token in error
                      for error in errors
                      for token in (
                          "supported result",
                          "support",
                          "expected status",
                          "answer_available",
                      )
                  )
              ):
                  stages.add("support")
              if (
                  score.get("recovery_contract_ok") is False
                  or any(
                      token in error
                      for error in errors
                      for token in (
                          "recovery",
                          "docs_status",
                          "next action",
                          "recommended action",
                      )
                  )
              ):
                  stages.add("recovery")
              return stages


          def _aggregate(
          '''
          assert text.count(marker) == 1, text.count(marker)
          text = text.replace(marker, helper, 1)

          old_score = '''                score["passed"] = bool(
                      score["passed"] and not planning_errors
                  )
                  score = redact(score, project)
          '''
          new_score = '''                score["passed"] = bool(
                      score["passed"] and not planning_errors
                  )
                  failure_stages.extend(_evaluator_failure_stages(score))
                  score = redact(score, project)
          '''
          assert text.count(old_score) == 1, text.count(old_score)
          text = text.replace(old_score, new_score, 1)
          path.write_text(text, encoding="utf-8")

          test_path = Path("scripts/installed_mcp_contract_self_test.py")
          test = test_path.read_text(encoding="utf-8")
          assert test.count("import copy\n") == 1
          test = test.replace("import copy\n", "import copy\nfrom pathlib import Path\n", 1)
          insertion = '''

          def test_server_environment_finish_and_stage_logic_are_hardened() -> None:
              source = Path(
                  "eval/agent_developer_v1/installed_mcp_benchmark.py"
              ).read_text(encoding="utf-8")
              assert "env = dict(os.environ)" not in source
              assert '"OPENAI_API_KEY"' not in source
              assert '"GH_TOKEN"' not in source
              assert '"reason": str(action["reason"])' not in source
              assert '"reason_sha256": hashlib.sha256(' in source
              assert "_evaluator_failure_stages(score)" in source


          def main() -> int:
          '''
          main_marker = "\n\ndef main() -> int:\n"
          assert test.count(main_marker) == 1, test.count(main_marker)
          test = test.replace(main_marker, insertion, 1)
          tuple_marker = '''        test_unknown_origin_and_failure_stage_fail_closed,
              )
          '''
          tuple_replacement = '''        test_unknown_origin_and_failure_stage_fail_closed,
                  test_server_environment_finish_and_stage_logic_are_hardened,
              )
          '''
          assert test.count(tuple_marker) == 1, test.count(tuple_marker)
          test = test.replace(tuple_marker, tuple_replacement, 1)
          test_path.write_text(test, encoding="utf-8")
          PY

          rm .github/workflows/temp-finalize-p1.1.yml
          python -m pip install -e ".[dev]"
          python -m compileall -q eval/agent_developer_v1 scripts/installed_mcp_contract_self_test.py
          python scripts/installed_mcp_contract_self_test.py
          git diff --check

      - name: Commit final ordinary files only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          changed="$(git diff --cached --name-only)"
          expected="$(printf '%s\n' \
            .github/workflows/temp-finalize-p1.1.yml \
            eval/agent_developer_v1/installed_mcp_benchmark.py \
            scripts/installed_mcp_contract_self_test.py)"
          test "$changed" = "$expected" || {
            printf 'unexpected finalization diff\nactual:\n%s\nexpected:\n%s\n' "$changed" "$expected"
            exit 1
          }
          git commit -m "fix(p1): isolate installed MCP evidence and classify divergence"
          git push origin HEAD:p1/p1.1-final
