_VERSION_CAPABILITY_SUBJECT_RE = re.compile(
    r"^\s*(?:since|from)\s+which\s+version\s+can\s+(?:the\s+)?"
    r"(?P<subject>`[^`\n]{2,120}`|[A-Za-z_][A-Za-z0-9_.:-]*)\s+be\b",
