name: Scientific paired full regression
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths: [.github/workflows/scientific-paired-regression.yml]
permissions: {contents: read}
jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: b07dc52bd7ba02a449477bc534cc84dc1d276ffd, path: baseline-runtime}
      - uses: actions/checkout@v4
        with: {ref: e5e1bec980caa1b66758f655940d519f0ba2fa04, path: candidate-runtime}
      - uses: astral-sh/setup-uv@v6
      - name: Sync both runtimes
        run: |
          (cd baseline-runtime && uv sync --frozen --extra dev)
          (cd candidate-runtime && uv sync --frozen --extra dev)
      - name: Run baseline and candidate
        shell: bash
        run: |
          set +e
          (cd baseline-runtime && uv run --frozen --extra dev pytest tests/ -m "not advanced and not live and not live_network" -q) > "$RUNNER_TEMP/base.log" 2>&1
          echo $? > "$RUNNER_TEMP/base.exit"
          (cd candidate-runtime && uv run --frozen --extra dev pytest tests/ -m "not advanced and not live and not live_network" -q) > "$RUNNER_TEMP/cand.log" 2>&1
          echo $? > "$RUNNER_TEMP/cand.exit"
          set -e
      - name: Compare exact failures
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP'])
          def parse(name):
              text=(t/name).read_text(errors='replace')
              failed=sorted(set(re.findall(r'^FAILED\s+([^\s]+)',text,re.M)))
              summary=[line for line in text.splitlines() if re.search(r'\d+ failed, \d+ passed',line)]
              return {'failed':failed,'summary':summary[-1] if summary else None}
          a=parse('base.log'); b=parse('cand.log')
          out={'baseline':a,'candidate':b,'only_baseline':sorted(set(a['failed'])-set(b['failed'])),'only_candidate':sorted(set(b['failed'])-set(a['failed'])),'same_failures':a['failed']==b['failed'],'base_exit':int((t/'base.exit').read_text()),'cand_exit':int((t/'cand.exit').read_text())}
          (t/'compare.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          if out['only_candidate']: raise SystemExit('new regression failures')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientific-paired-full-regression
          path: |
            ${{ runner.temp }}/base.log
            ${{ runner.temp }}/cand.log
            ${{ runner.temp }}/compare.json
