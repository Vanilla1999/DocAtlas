name: Retrieval sealed holdout packets
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths: [.github/workflows/retrieval-holdout20-packets.yml]
permissions: {contents: read}
jobs:
  packets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: 7b92cc5e8a99ee7394fde93b46797c5bd0b162a8, path: baseline-runtime}
      - uses: actions/checkout@v4
        with: {ref: 8cecc0e1355376699bd18d8eb7a720cff6868be0, path: candidate-runtime}
      - uses: actions/checkout@v4
        with: {ref: 95e61265656283d609bc1328c46c52b2bf1a069e, path: frozen-corpus}
      - uses: astral-sh/setup-uv@v6
      - run: |
          (cd baseline-runtime && uv sync --frozen --extra dev)
          (cd candidate-runtime && uv sync --frozen --extra dev)
      - name: Write runner
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/run.py" <<'PY'
          import argparse,hashlib,json
          from pathlib import Path
          ap=argparse.ArgumentParser();ap.add_argument('--questions',type=Path,required=True);ap.add_argument('--frozen',type=Path,required=True);ap.add_argument('--work',type=Path,required=True);ap.add_argument('--out',type=Path,required=True);a=ap.parse_args()
          from eval.evidence_quality_v2.runtime import write_project,isolated_service,index_project
          from eval.project_context_quality.capture_public_context import capture_public_call
          cases=json.loads(a.questions.read_text())['cases'];eq=a.frozen/'eval/evidence_quality_v2';m=json.loads((eq/'source-manifest.json').read_text());rows=[]
          for project in sorted({x['project_group'] for x in cases}):
              pr=a.work/'corpus'/project;docs={}
              for row in m['sources']:
                  if row['project']==project:
                      p=eq/'sources'/project/row['path'];data=p.read_bytes();assert hashlib.sha256(data).hexdigest()==row['sha256'];docs[row['path']]=data.decode()
              write_project(pr,docs)
              with isolated_service(a.work/'state'/project) as (service,config):
                  index_project(service,config,pr)
                  for c in [x for x in cases if x['project_group']==project]:
                      p=capture_public_call(service,{'project_path':str(pr),'scope':'all','question':c['question']})['public_payload'];rows.append({'id':c['id'],'question':c['question'],'public_payload':p})
          a.out.write_text(json.dumps({'cases':rows},indent=2,ensure_ascii=False))
          PY
      - name: Capture both
        shell: bash
        run: |
          (cd baseline-runtime && PYTHONPATH="$PWD" uv run --frozen --extra dev python "$RUNNER_TEMP/run.py" --questions "$GITHUB_WORKSPACE/eval/retrieval_recheck/holdout20_questions.json" --frozen "$GITHUB_WORKSPACE/frozen-corpus" --work "$RUNNER_TEMP/base-work" --out "$RUNNER_TEMP/base.json")
          (cd candidate-runtime && PYTHONPATH="$PWD" uv run --frozen --extra dev python "$RUNNER_TEMP/run.py" --questions "$GITHUB_WORKSPACE/eval/retrieval_recheck/holdout20_questions.json" --frozen "$GITHUB_WORKSPACE/frozen-corpus" --work "$RUNNER_TEMP/cand-work" --out "$RUNNER_TEMP/cand.json")
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-sealed-holdout20-packets
          path: |
            ${{ runner.temp }}/base.json
            ${{ runner.temp }}/cand.json
