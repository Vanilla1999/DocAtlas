name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCMANCER_OFFLINE: "1"

jobs:
  staging-fixture-patch:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/legacy-completeness-build'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - name: Align stale Phase 3.1 expectation with fail-closed contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_docs_service_part03.py")
          text = path.read_text(encoding="utf-8")
          old = '''    assert dispatcher_payload is not None
    assert dispatcher_payload["status"] == "ok", dispatcher_payload.get("missing")
    assert any(
        "raw topic unchanged" in source["snippet"]
        and "must not call vectors or embeddings" in source["snippet"]
        for source in dispatcher_payload["sources"]
    )
'''
          new = '''    assert dispatcher_payload is not None
    assert dispatcher_payload["status"] == "insufficient_evidence"
    assert (
        "unresolved:0:legacy_unresolved:requirement_items"
        in dispatcher_payload.get("missing", [])
    )
'''
          if text.count(old) == 0 and new in text:
              raise SystemExit(0)
          if text.count(old) != 1:
              raise SystemExit(f"expected stale assertion block count=1, got {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check
          if git diff --quiet -- tests/test_docs_service_part03.py; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_docs_service_part03.py
          git commit -m "Align source-isolation fixture with fail-closed legacy coverage"
          git push origin HEAD:${{ github.head_ref }}

  docs-contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Verify documented CLI and public Docs MCP contracts
        run: |
          pytest -q \
            tests/docs/test_user_facing_docs_branding.py \
            tests/docs/test_documented_cli_contract.py \
            tests/docs/test_mcp_docs_tools_registration.py \
            tests/docs/test_tool_choice_eval.py \
            tests/test_cli.py \
            tests/test_support_surface_policy.py

  docs-impact:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install DocAtlas
        run: pip install -e .

      - name: Report documentation impact
        run: doc-atlas docs-impact --project-path . --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --format markdown >> "$GITHUB_STEP_SUMMARY"

  installer-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Installer smoke tests
        run: sh scripts/test-install.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run offline core tests
        run: pytest tests/ -m "not advanced and not live and not live_network" -v

  advanced-contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run offline advanced contract and shared-security tests
        run: pytest tests/ -m advanced -v

      - name: Run legacy contract completeness gate
        run: python scripts/run_legacy_contract_gate.py

      - name: Run critical mutation gate
        run: python scripts/run_critical_mutation_gate.py

      - name: Upload critical mutation gate artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: critical-mutation-gate-${{ github.run_id }}
          path: ${{ runner.temp }}/docmancer-mutation-*
          if-no-files-found: warn
          retention-days: 14
