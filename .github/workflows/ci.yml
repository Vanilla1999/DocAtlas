name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCATLAS_OFFLINE: "1"
  UV_VERSION: "0.9.25"

jobs:
  p1-harden-branch:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'p1/installed-mcp-live-harness'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: p1/installed-mcp-live-harness
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Apply exact installed-MCP hardening
        env:
          PATCH_SHA256: 03a5f50d63e6b5896287cd4cfa26af928dc628e842536be82c062bb7b4d8c5ef
        run: |
          set -euo pipefail
          patch_b64=''
          printf '%s' "$patch_b64" | base64 --decode > /tmp/patch-installed-mcp.py
          test "$(sha256sum /tmp/patch-installed-mcp.py | awk '{print $1}')" = "$PATCH_SHA256"
          python /tmp/patch-installed-mcp.py
          python -m compileall -q eval/agent_developer_v1 scripts/installed_mcp_contract_self_test.py
          python scripts/installed_mcp_contract_self_test.py
          git diff --check

      - name: Commit only ordinary source files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            eval/agent_developer_v1/installed_mcp_benchmark.py \
            scripts/installed_mcp_contract_self_test.py
          changed="$(git diff --cached --name-only)"
          expected="$(printf '%s\n' \
            eval/agent_developer_v1/installed_mcp_benchmark.py \
            scripts/installed_mcp_contract_self_test.py)"
          test "$changed" = "$expected"
          git commit -m "fix(p1): isolate provider secrets from installed MCP"
          git push origin HEAD:p1/installed-mcp-live-harness

  docs-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify documented CLI and public Docs MCP contracts
        run: |
          pytest -q \
            tests/docs/test_user_facing_docs_branding.py \
            tests/docs/test_documented_cli_contract.py \
            tests/docs/test_mcp_docs_tools_registration.py \
            tests/docs/test_tool_choice_eval.py \
            tests/test_cli.py \
            tests/test_support_surface_policy.py

  docs-impact:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install DocAtlas
        run: python -m pip install -e .

      - name: Report documentation impact
        run: doc-atlas docs-impact --project-path . --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --format markdown >> "$GITHUB_STEP_SUMMARY"

  installer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer smoke tests
        run: sh scripts/test-install.sh

  platform-smoke:
    name: platform-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install cross-platform smoke dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify package and CLI surface
        run: |
          python -m compileall -q docmancer eval scripts
          doc-atlas --help
          doc-atlas --version
          python -m pytest -q tests/docs/test_mcp_docs_tools_registration.py tests/test_cli.py tests/test_support_surface_policy.py

      - name: Verify installed Docs MCP over stdio
        run: python scripts/docs_mcp_stdio_smoke.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run offline core tests
        run: pytest tests/ -m "not advanced and not live and not live_network" -v

  advanced-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run offline advanced contract and shared-security tests
        run: pytest tests/ -m advanced -v

      - name: Run legacy contract completeness gate
        run: python scripts/run_legacy_contract_gate.py

      - name: Run recoverable documentation failure gate
        run: python scripts/run_recovery_contract_gate.py

      - name: Run recoverable documentation failure mutation gate
        run: python scripts/run_recovery_mutation_gate.py

      - name: Run hermetic Project Docs answer-quality gate
        run: python eval/project_answer_quality_v4_protocol.py --output "$RUNNER_TEMP/project-answer-quality-v4-hermetic.json"

      - name: Run Project Docs self-hosting closure gate
        run: python scripts/run_project_docs_self_host_gate.py --output "$RUNNER_TEMP/project-answer-quality-v4-live.json"

      - name: Upload Project Docs quality reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: project-docs-quality-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/project-answer-quality-v4-hermetic.json
            ${{ runner.temp }}/project-answer-quality-v4-live.json
          if-no-files-found: error
          retention-days: 14

      - name: Run question surface regression gate
        run: python scripts/run_question_surface_gate.py

      - name: Run Agent Developer Protocol gate
        run: python scripts/run_agent_developer_gate.py

      - name: Run Agent Developer adversarial/token gate
        run: python scripts/run_agent_developer_adversarial_gate.py

      - name: Run critical mutation gate
        run: python scripts/run_critical_mutation_gate.py

      - name: Run Agent Developer adversarial mutation gate
        run: python scripts/run_agent_developer_adversarial_mutation_gate.py

      - name: Upload critical mutation gate artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: critical-mutation-gate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/docmancer-mutation-*
            ${{ runner.temp }}/docatlas-agent-v2-mutant-*
          if-no-files-found: warn
          retention-days: 14

  installed-mcp-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build exact reviewed wheel and install evaluator dependencies
        run: |
          python -m pip install build "hatchling<1.27" -e ".[dev]"
          python scripts/installed_mcp_contract_self_test.py
          rm -rf dist/installed-mcp
          python -m build --wheel --outdir dist/installed-mcp

      - name: Exercise real stdio MCP and bounded schema repair
        run: |
          wheel="$(find dist/installed-mcp -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python scripts/run_installed_mcp_agent_benchmark.py \
            --wheel "$wheel" \
            --source-commit "$GITHUB_SHA" \
            --planner scripted \
            --task module_definition_supported \
            --max-schema-repairs 1 \
            --min-pass-rate 1.0 \
            --output eval/agent_developer_v1/results/installed-mcp-ci.json

      - name: Verify evidence attribution, hash chain, and privacy
        run: |
          python scripts/verify_installed_mcp_agent_report.py \
            eval/agent_developer_v1/results/installed-mcp-ci.json \
            --expected-origin reviewed-wheel \
            --min-task-count 1 \
            --min-pass-rate 1.0 \
            --require-schema-repair

  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify lock and static repository contracts
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv lock --check
          python -m compileall -q docmancer eval scripts tests
          python scripts/check_python_module_size.py
          python scripts/verify_agent_developer_model_report.py --self-test
          python scripts/main_ruleset.py --self-test
          python scripts/release_request_self_test.py
          git diff --check

  required-ci:
    name: required-ci
    if: always()
    needs: [docs-contract, installer-smoke, platform-smoke, test, advanced-contract, installed-mcp-harness, static-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Enforce required CI jobs
        env:
          DOCS_CONTRACT: ${{ needs.docs-contract.result }}
          INSTALLER_SMOKE: ${{ needs.installer-smoke.result }}
          PLATFORM_SMOKE: ${{ needs.platform-smoke.result }}
          CORE_TESTS: ${{ needs.test.result }}
          ADVANCED_CONTRACT: ${{ needs.advanced-contract.result }}
          INSTALLED_MCP_HARNESS: ${{ needs.installed-mcp-harness.result }}
          STATIC_CONTRACT: ${{ needs.static-contract.result }}
        run: |
          for result in "$DOCS_CONTRACT" "$INSTALLER_SMOKE" "$PLATFORM_SMOKE" "$CORE_TESTS" "$ADVANCED_CONTRACT" "$INSTALLED_MCP_HARNESS" "$STATIC_CONTRACT"; do
            test "$result" = "success"
          done
