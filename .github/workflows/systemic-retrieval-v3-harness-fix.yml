name: Systemic retrieval v3 harness fix

on:
  push:
    branches: [feat/systemic-retrieval-mechanics]
    paths:
      - .github/workflows/systemic-retrieval-v3-harness-fix.yml

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/systemic-retrieval-mechanics
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install 'pyyaml>=6,<7'
      - name: Extract accepted v3 commands with multiset control
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          workflow = Path('.github/workflows/systemic-retrieval-finalize-v3.yml')
          text = workflow.read_text(encoding='utf-8')
          old = '            "same_as_current": lane["cap_inputs"] == current["cap_inputs"],\\n'
          new = (
              '            "same_as_current": Counter(lane["cap_inputs"]) == Counter(current["cap_inputs"]),\\n'
              '            "ordered_same_as_current": lane["cap_inputs"] == current["cap_inputs"],\\n'
          )
          if text.count(old) != 1:
              raise SystemExit('fixed-pool equality anchor changed')
          text = text.replace(old, ''.join(new), 1)
          old_message = '        failures.append("2x2/contextualization lanes did not share the same semantic pre-cap candidate pools")\\n'
          new_message = '        failures.append("2x2/contextualization lanes did not share the same semantic pre-cap candidate-pool multiset")\\n'
          if text.count(old_message) != 1:
              raise SystemExit('fixed-pool failure-message anchor changed')
          text = text.replace(old_message, new_message, 1)

          data = yaml.safe_load(text)
          wanted = [
              'Replace the rejected estimator test and prove the admission contract RED',
              'Apply conservative admission budget and canonical pre-hydration boundary',
              'Finish fixed-pool causal and selector controls',
              'GREEN targeted TDD and retrieval regressions',
              'Run complete systemic acceptance',
          ]
          steps = data['jobs']['finalize']['steps']
          by_name = {step.get('name'): step.get('run') for step in steps if step.get('name')}
          missing = [name for name in wanted if not by_name.get(name)]
          if missing:
              raise SystemExit(f'missing v3 run blocks: {missing}')
          script = '#!/usr/bin/env bash\nset -euo pipefail\n\n' + '\n\n'.join(by_name[name] for name in wanted) + '\n'
          out = Path('scripts/pr186_finalize.sh')
          out.write_text(script, encoding='utf-8')
          out.chmod(0o755)
          PY
          bash -n scripts/pr186_finalize.sh
          grep -F 'Counter(lane["cap_inputs"]) == Counter(current["cap_inputs"])' scripts/pr186_finalize.sh
          git diff --check
      - name: Publish ordinary script only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/pr186_finalize.sh
          git commit -m 'test: stage final systemic acceptance script'
          git push origin HEAD:feat/systemic-retrieval-mechanics
