name: Systemic retrieval v3 harness fix

on:
  push:
    branches: [feat/systemic-retrieval-mechanics]
    paths:
      - .github/workflows/systemic-retrieval-v3-harness-fix.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/systemic-retrieval-mechanics
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Add isolated-corpus fingerprint counterexamples
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_systemic_retrieval_candidate_pool.py')
          text = path.read_text(encoding='utf-8')
          marker = '\ndef test_candidate_pool_fingerprint_ignores_isolated_corpus_root() -> None:\n'
          if marker not in text:
              text += '''


def _isolated_chunk(source: str) -> RetrievedChunk:
    return RetrievedChunk(
        source=source,
        chunk_index=7,
        text="Policy fact.",
        score=1.0,
        metadata={"source_class": "project_file"},
    )


def test_candidate_pool_fingerprint_ignores_isolated_corpus_root() -> None:
    first = [_isolated_chunk("/tmp/run-a/cap-on/corpus/uv/docs/policy.md")]
    rebuilt = [_isolated_chunk("/tmp/run-b/cap-off/corpus/uv/docs/policy.md")]

    assert _candidate_pool_fingerprint(first) == _candidate_pool_fingerprint(rebuilt)


def test_candidate_pool_fingerprint_preserves_project_relative_source_identity() -> None:
    policy = [_isolated_chunk("/tmp/run-a/cap-on/corpus/uv/docs/policy.md")]
    config = [_isolated_chunk("/tmp/run-b/cap-off/corpus/uv/docs/config.md")]

    assert _candidate_pool_fingerprint(policy) != _candidate_pool_fingerprint(config)
'''
              path.write_text(text, encoding='utf-8')
          PY
          if python -m pytest -q tests/test_systemic_retrieval_candidate_pool.py; then
            echo 'isolated corpus root counterexample unexpectedly GREEN before normalization' >&2
            exit 1
          fi
      - name: Normalize only explicit isolated corpus roots
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/run_systemic_retrieval_plan_gate.py')
          text = path.read_text(encoding='utf-8')
          anchor = '\ndef _candidate_pool_fingerprint(pool: list[Any]) -> str:\n'
          if anchor not in text:
              raise SystemExit('candidate fingerprint anchor missing')
          if 'def _semantic_source_identity(' not in text:
              helper = '''

def _semantic_source_identity(value: Any) -> str:
    """Remove only the eval lane root from isolated corpus source paths."""
    normalized = str(value or "").replace("\\\\", "/")
    parts = [part for part in normalized.split("/") if part and part != "."]
    corpus_positions = [index for index, part in enumerate(parts) if part == "corpus"]
    if corpus_positions:
        suffix = parts[corpus_positions[-1] + 1 :]
        if len(suffix) >= 2:
            return "/".join(suffix)
    return normalized
'''
              text = text.replace(anchor, helper + anchor, 1)
          old = '''        canonical.append(
            {
                "path": path,
                "chunk_index": chunk_index,
                "text_sha256": hashlib.sha256(body.encode("utf-8")).hexdigest(),
            }
        )
'''
          new = '''        canonical.append(
            {
                "path": _semantic_source_identity(path),
                "chunk_index": chunk_index,
                "text_sha256": hashlib.sha256(body.encode("utf-8")).hexdigest(),
            }
        )
'''
          if old not in text:
              raise SystemExit('candidate fingerprint canonicalization anchor missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m pytest -q tests/test_systemic_retrieval_candidate_pool.py
      - name: Refresh diagnostic node inventory
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('tests/diagnostic_labels.systemic_retrieval_candidate_pool.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['module_node_hashes']['tests/test_systemic_retrieval_candidate_pool.py'] = '227f7ab265d3f9c57acb8f4faa30e84cc6c23ff3d8069e7e08bee0501e9406f7'
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
          python -m pytest -q tests/test_systemic_retrieval_candidate_pool.py tests/test_diagnostic_labels.py
          git diff --check
      - name: Publish ordinary TDD fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run_systemic_retrieval_plan_gate.py tests/test_systemic_retrieval_candidate_pool.py tests/diagnostic_labels.systemic_retrieval_candidate_pool.json
          git commit -m 'test: normalize isolated candidate-pool identities'
          git push origin HEAD:feat/systemic-retrieval-mechanics
