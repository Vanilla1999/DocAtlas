name: TDD context sufficiency

on:
  push:
    branches: [fix/tdd-public-contract-20260926]
    paths:
      - eval/tdd_context_sufficiency.py
      - scripts/report_tdd_context_sufficiency.py
      - tests/docs/test_tdd_context_sufficiency.py
      - tests/diagnostic_labels.tdd_context_sufficiency.json
      - .github/workflows/tdd-context-sufficiency.yml

permissions:
  contents: read

concurrency:
  group: tdd-context-sufficiency-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  assessed-claim-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        id: install
        run: |
          mkdir -p "$RUNNER_TEMP/tdd-sufficiency"
          git rev-parse HEAD > "$RUNNER_TEMP/tdd-sufficiency/head.txt"
          sha256sum uv.lock > "$RUNNER_TEMP/tdd-sufficiency/lock.sha256"
          python -m pip install 'uv==0.9.25'
          uv sync --locked --extra dev --python 3.12
          uv pip freeze --python .venv/bin/python > "$RUNNER_TEMP/tdd-sufficiency/freeze.txt"
      - name: Run new report regressions
        run: |
          set -o pipefail
          .venv/bin/python -m pytest -q --tb=short tests/docs/test_tdd_context_sufficiency.py \
            --junitxml="$RUNNER_TEMP/tdd-sufficiency/regressions.xml" \
            2>&1 | tee "$RUNNER_TEMP/tdd-sufficiency/regressions.log"
      - name: Run existing evidence evaluator controls
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          .venv/bin/python -m pytest -q --tb=short tests/evidence_quality_v2/ \
            --junitxml="$RUNNER_TEMP/tdd-sufficiency/neighbors.xml" \
            2>&1 | tee "$RUNNER_TEMP/tdd-sufficiency/neighbors.log"
      - name: Record unchanged known guidance failure separately
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          .venv/bin/python -m pytest -q --tb=short \
            tests/docs/test_agent_recovery_version_guidance.py \
            tests/docs/test_mcp_token_footprint.py \
            --junitxml="$RUNNER_TEMP/tdd-sufficiency/guidance.xml" \
            2>&1 | tee "$RUNNER_TEMP/tdd-sufficiency/guidance.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: tdd-sufficiency-${{ github.sha }}
          path: ${{ runner.temp }}/tdd-sufficiency
          if-no-files-found: error
          retention-days: 14
