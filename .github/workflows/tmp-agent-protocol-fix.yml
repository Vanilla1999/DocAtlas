name: TEMP materialize agent protocol review fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: temp-agent-protocol-review-fixes
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'tmp/agent-protocol-review-fixes-20260820'
    runs-on: ubuntu-24.04
    env:
      DOCMANCER_OFFLINE: '1'
      TARGET_BRANCH: experiment/agent-developer-protocol-v1
      REVIEWED_HEAD: 7a5a88f6188c793c91ea9231d67a99450bcff0c3
    steps:
      - name: Checkout the real target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Read materializers from the carrier PR
        env:
          CARRIER_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CARRIER_SHA"
          for name in 01_production.py 02_tests_protocol.py 03_runner.py; do
            git show "$CARRIER_SHA:.tmp/$name" > "/tmp/$name"
          done

      - name: Apply the reviewed corrective tree
        id: apply
        run: |
          set -euo pipefail
          if grep -q 'requested_topic = obligation.context or obligation.target' \
              docmancer/docs/domain/_answer_units_part02.py; then
            echo 'already_applied=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$(git rev-parse HEAD)" = "$REVIEWED_HEAD"
          python /tmp/01_production.py
          python /tmp/02_tests_protocol.py
          python /tmp/03_runner.py
          git diff --check
          echo 'already_applied=false' >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.apply.outputs.already_applied != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.apply.outputs.already_applied != 'true'
        run: pip install -e '.[dev]'

      - name: Validate the exact corrective tree
        if: steps.apply.outputs.already_applied != 'true'
        run: |
          set -euo pipefail
          python -m compileall -q docmancer scripts
          pytest -q \
            tests/docs/test_question_plan_v4.py \
            tests/test_tool_selection_policy.py \
            tests/test_unified_docs_context_mcp.py::test_module_recovery_projection_keeps_callable_action_and_full_path_under_tiny_budget \
            tests/test_product_scope.py
          python scripts/run_agent_developer_gate.py
          python scripts/run_legacy_contract_gate.py
          python scripts/run_project_docs_self_host_gate.py
          python scripts/run_question_surface_gate.py
          python scripts/check_python_module_size.py
          git diff --check

      - name: Commit exactly one semantic correction
        if: steps.apply.outputs.already_applied != 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Close agent recovery review gaps'
          test "$(git rev-parse HEAD^)" = "$REVIEWED_HEAD"
          git push origin "HEAD:$TARGET_BRANCH"
