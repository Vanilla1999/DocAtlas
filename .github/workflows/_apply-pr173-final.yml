name: Apply reviewed PR 173 source patch

on:
  push:
    branches:
      - feat/retrieval-first-project-chat-main
    paths:
      - .github/workflows/_apply-pr173-final.yml

permissions:
  contents: write

concurrency:
  group: apply-pr173-final-source
  cancel-in-progress: false

jobs:
  apply-reviewed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/retrieval-first-project-chat-main
          fetch-depth: 0

      - name: Verify staged payload and exact base
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor dd3666e37a6740d2079454c601b54464faca9efe HEAD
          cat > /tmp/expected-staged-paths <<'EOF'
          .github/pr173-patch/chunk-00
          .github/pr173-patch/chunk-01
          .github/pr173-patch/chunk-02
          .github/pr173-patch/chunk-03
          .github/pr173-patch/chunk-04
          .github/workflows/_apply-pr173-final.yml
          EOF
          git diff --name-only dd3666e37a6740d2079454c601b54464faca9efe...HEAD | sort > /tmp/actual-staged-paths
          sort /tmp/expected-staged-paths -o /tmp/expected-staged-paths
          diff -u /tmp/expected-staged-paths /tmp/actual-staged-paths
          cat .github/pr173-patch/chunk-* | tr -d '\r\n' | base64 --decode | gzip --decompress > /tmp/pr173-final-current.patch
          echo "c20bc525964b01104df4516f44a2015d5566eb9a7d7c1a8e82ace79d3efd8e17  /tmp/pr173-final-current.patch" | sha256sum --check -
          git apply --check /tmp/pr173-final-current.patch

      - name: Materialize reviewed production source
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/pr173-final-current.patch
          rm -rf .github/pr173-patch
          rm -f .github/workflows/_apply-pr173-final.yml
          python -m compileall -q docmancer eval tests
          git diff --check
          cat > /tmp/expected-final-paths <<'EOF'
          CHANGELOG.md
          README.md
          docatlas.project-docs.yaml
          docmancer/docs/application/_project_docs_service_part03.py
          docmancer/docs/application/docs_context_projection.py
          docmancer/docs/application/recovery.py
          docmancer/docs/domain/_project_answer_contract_part02.py
          docmancer/docs/domain/documentation_query_plan.py
          docmancer/docs/domain/project_doc_ranking.py
          docmancer/docs/domain/project_query_intent.py
          docmancer/docs/domain/project_retrieval_intent.py
          docmancer/docs/domain/question_surface_normalization.py
          docmancer/docs/interfaces/mcp/context_tools.py
          docs/adr/0002-context-retrieval-vs-answer-proof.md
          docs/analysis/context7-style-project-chat-regression.md
          eval/project_answer_surface_v1/cases.json
          eval/project_chat_context7_v1/README.md
          eval/project_chat_context7_v1/cases.json
          eval/project_chat_context7_v1/protocol.lock.json
          eval/project_chat_context7_v1_protocol.py
          scripts/run_recovery_contract_gate.py
          tests/diagnostic_labels.context7_project_chat.json
          tests/docs/test_context7_style_project_chat.py
          EOF
          {
            git diff --name-only dd3666e37a6740d2079454c601b54464faca9efe
            git ls-files --others --exclude-standard
          } | sort -u > /tmp/actual-final-paths
          sort /tmp/expected-final-paths -o /tmp/expected-final-paths
          diff -u /tmp/expected-final-paths /tmp/actual-final-paths
          test ! -e .github/pr173-patch
          test ! -e .github/workflows/_apply-pr173-final.yml

      - name: Commit final source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make project chat retrieval-first"
          git push origin HEAD:feat/retrieval-first-project-chat-main
