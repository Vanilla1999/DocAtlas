name: TDD inquiry routing

on:
  push:
    branches: [fix/tdd-public-contract-20260926]
    paths:
      - docmancer/docs/domain/request_intent.py
      - tests/docs/test_russian_inquiry_intent.py
      - tests/diagnostic_labels.russian_inquiry_intent.json
      - .github/workflows/tdd-inquiry-routing.yml

permissions:
  contents: read

concurrency:
  group: tdd-inquiry-routing-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  routing-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install locked source and record provenance
        id: install
        run: |
          mkdir -p "$RUNNER_TEMP/inquiry"
          git rev-parse HEAD > "$RUNNER_TEMP/inquiry/head.txt"
          sha256sum uv.lock > "$RUNNER_TEMP/inquiry/lock.sha256"
          python -m pip install 'uv==0.9.25'
          uv sync --locked --extra dev --python 3.12
          uv pip freeze --python .venv/bin/python > "$RUNNER_TEMP/inquiry/freeze.txt"
      - name: Run inquiry regressions
        run: |
          set -o pipefail
          .venv/bin/python -m pytest -q --tb=short tests/docs/test_russian_inquiry_intent.py \
            --junitxml="$RUNNER_TEMP/inquiry/regressions.xml" 2>&1 | tee "$RUNNER_TEMP/inquiry/regressions.log"
      - name: Run existing routing and patch authorization controls
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          .venv/bin/python -m pytest -q --tb=short \
            tests/docs/test_action_packet.py \
            tests/docs/test_action_packet_semantic_density.py \
            --junitxml="$RUNNER_TEMP/inquiry/neighbors.xml" 2>&1 | tee "$RUNNER_TEMP/inquiry/neighbors.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: tdd-inquiry-${{ github.sha }}
          path: ${{ runner.temp }}/inquiry
          if-no-files-found: error
          retention-days: 14
