name: Systemic retrieval final acceptance v3
# trigger: exact-baseline-precap-replay-20260912

on:
  push:
    branches: [feat/systemic-retrieval-mechanics]
    paths:
      - .github/workflows/systemic-retrieval-finalize-v3.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCATLAS_OFFLINE: "1"

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/systemic-retrieval-mechanics
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]' 'tiktoken==0.11.0'
      - name: Repair temporary project-scope generator escaping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('scripts/pr186_prepare_final_acceptance.py')
          text = path.read_text(encoding='utf-8')
          pattern = r'        project_path = str\(filters\.get\("project_path"\) or ""\)\.rstrip\([^\n]+\)'
          replacement = '        project_path = str(filters.get("project_path") or "")'
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit('project scope escaping repair anchor changed')
          path.write_text(text, encoding='utf-8')
          compile(text, str(path), 'exec')
          PY
      - name: Prepare fixed-pool acceptance patches
        run: python scripts/pr186_prepare_final_acceptance.py
      - name: Install canonical causal lane
        run: python scripts/pr186_install_canonical_lane.py
      - name: Prove candidate-pool TDD GREEN
        run: python -m pytest -q tests/test_systemic_retrieval_candidate_pool.py tests/test_diagnostic_labels.py
      - name: Run TDD and complete systemic acceptance
        run: bash scripts/pr186_finalize.sh
      - name: Publish accepted state and remove carriers
        shell: bash
        run: |
          rm -f \
            scripts/pr186_finalize.sh \
            .github/workflows/systemic-retrieval-finalize-v3.yml \
            .github/workflows/systemic-retrieval-v3-harness-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: record final systemic retrieval acceptance'
          git push origin HEAD:feat/systemic-retrieval-mechanics
