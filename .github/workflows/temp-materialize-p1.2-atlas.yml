name: TEMP materialize P1.2 first-divergence atlas

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCMANCER_OFFLINE: "1"

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'p1/p1.2-first-divergence'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: p1/p1.2-first-divergence
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build and validate the exact historical atlas
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          analyzer = Path("eval/agent_developer_v1/first_divergence.py")
          text = analyzer.read_text(encoding="utf-8")
          old = 'raise ValueError("P1.2 cannot close autonomous Agent Truth")'
          new = 'raise ValueError("P1.2 cannot close Autonomous Agent Truth")'
          if text.count(old) != 1:
              raise SystemExit(f"unexpected Agent Truth message count: {text.count(old)}")
          analyzer.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("tests/diagnostic_labels.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          module = "tests/test_agent_developer_first_divergence.py"
          manifest["module_labels"][module] = "behavioral"
          manifest["module_node_hashes"][module] = (
              "85fee42a83e5b204ad272396c27e5d5af38a2a2b46faaeb065d3f2f00b8e994a"
          )
          path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          python -m pip install -e ".[dev]"
          python scripts/build_agent_developer_first_divergence.py
          pytest -q tests/test_agent_developer_first_divergence.py
          python scripts/build_agent_developer_first_divergence.py --check
          rm .github/workflows/temp-materialize-p1.2-atlas.yml
          git diff --check

      - name: Commit only generated evidence and carrier deletion
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          changed="$(git diff --cached --name-only)"
          expected="$(printf '%s\n' \
            .github/workflows/temp-materialize-p1.2-atlas.yml \
            docs/analysis/p1.2-agent-developer-first-divergence.md \
            eval/agent_developer_v1/first_divergence.py \
            eval/agent_developer_v1/results/first-divergence-atlas.json \
            tests/diagnostic_labels.json)"
          test "$changed" = "$expected" || {
            printf 'unexpected materialized diff\nactual:\n%s\nexpected:\n%s\n' "$changed" "$expected"
            exit 1
          }
          git commit -m "docs(p1): materialize the 0/11 first-divergence atlas"
          git push origin HEAD:p1/p1.2-first-divergence
