name: TEMP finalize complete P1 closure

on:
  push:
    branches: [p1/p1-agent-truth-closure-clean]
    paths:
      - .github/workflows/temp-p1-finalize-closure.yml

permissions:
  contents: write

concurrency:
  group: temp-finalize-p1-closure-clean
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCMANCER_OFFLINE: "1"

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: p1/p1-agent-truth-closure-clean
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Merge the reviewed P1.6 main boundary
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Install evaluator dependencies
        run: python -m pip install -e ".[dev]"
      - name: Record the bounded P1 closure status in the roadmap
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("roadmap/README.md")
          text = path.read_text(encoding="utf-8")
          anchor = (
              "P1 asks whether a real coding model can acquire the intended evidence "
              "through the installed public product.\n"
          )
          block = anchor + """

## P1 closure status

**Execution status:** `CLOSED`.

**Evidence outcome:** `AUTONOMOUS_AGENT_TRUTH_NOT_PROVEN`.

P1.1–P1.6 have reviewable evidence outcomes and product decisions. The installed
MCP transport and reviewer-authored replay are green, while a complete fresh
same-model autonomous 11-task run is absent. Closing the worklist does not
authorize a positive universal Agent Truth, Stable maturity, public API change,
or Product Truth claim. See
[`docs/p1-agent-truth-scorecard.md`](../docs/p1-agent-truth-scorecard.md).
"""
          if "## P1 closure status" not in text:
              if text.count(anchor) != 1:
                  raise SystemExit("P1 roadmap insertion anchor missing or ambiguous")
              text = text.replace(anchor, block, 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Materialize and validate every P1 evidence record
        run: |
          set -euo pipefail
          python scripts/build_agent_developer_first_divergence.py
          python scripts/build_agent_developer_first_divergence.py --check
          python scripts/build_agent_contract_v2_ablation.py
          python scripts/build_agent_contract_v2_ablation.py --check
          pytest -q \
            tests/test_agent_developer_first_divergence.py \
            tests/test_agent_developer_contract_v2_ablation.py
          python scripts/run_paraphrase_proofability_gate.py --write
          python scripts/run_paraphrase_proofability_gate.py
          python scripts/run_mixed_evidence_provenance_gate.py --write
          python scripts/run_mixed_evidence_provenance_gate.py
          python scripts/run_evidence_is_data_gate.py --write
          python scripts/run_evidence_is_data_gate.py
          python scripts/run_p1_agent_truth_closure_gate.py --write
          python scripts/run_p1_agent_truth_closure_gate.py
          python scripts/paraphrase_proofability_self_test.py
          python scripts/mixed_evidence_provenance_self_test.py
          python scripts/evidence_is_data_self_test.py
          python scripts/p1_agent_truth_closure_self_test.py
          python scripts/run_agent_developer_adversarial_gate.py
          python scripts/run_agent_developer_adversarial_mutation_gate.py
          python -m compileall -q eval/agent_developer_v1 scripts
          rm .github/workflows/temp-p1-finalize-closure.yml
          git diff --check
      - name: Commit a carrier-free closure branch
        run: |
          set -euo pipefail
          git add -A
          python - <<'PY'
          import subprocess
          allowed = {
              ".github/workflows/temp-p1-finalize-closure.yml",
              "eval/agent_developer_v1/results/first-divergence-atlas.json",
              "docs/analysis/p1.2-agent-developer-first-divergence.md",
              "eval/agent_developer_v1/results/contract-v2-ablation.json",
              "docs/analysis/p1.3-agent-contract-v2-ablation.md",
              "eval/agent_developer_v1/results/paraphrase-proofability.json",
              "eval/agent_developer_v1/results/mixed-evidence-provenance.json",
              "eval/agent_developer_v1/results/evidence-is-data.json",
              "eval/agent_developer_v1/results/p1-agent-truth-closure.json",
              "roadmap/README.md",
          }
          changed = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines()
          bad = [path for path in changed if path not in allowed]
          if bad:
              raise SystemExit(f"unexpected P1 closure paths: {bad}")
          PY
          git commit -m "docs(p1): close the Agent Truth worklist without overclaim"
          git push origin HEAD:p1/p1-agent-truth-closure-clean
