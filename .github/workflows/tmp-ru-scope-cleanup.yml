name: Temporary RU scope cleanup validation
on:
  push:
    branches: [fix/evidence-admission-sufficiency]
    paths: [.github/workflows/tmp-ru-scope-cleanup.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCATLAS_OFFLINE: '1'
      DOCATLAS_AUTO_VECTORS: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/evidence-admission-sufficiency
          fetch-depth: 20
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Keep cross-language rewriting in host layer
        shell: bash
        run: |
          set -euo pipefail
          git checkout 50b363ab9555d379921e097727953bc69f19b5f9 -- \
            docmancer/docs/domain/documentation_query_plan.py \
            docmancer/docs/domain/question_semantic_frames.py
          python - <<'PY'
          from pathlib import Path
          p=Path('docmancer/docs/domain/evidence_qualification.py')
          text=p.read_text()
          text=text.replace('''    r"|(?:различа(?:ются|ется|лся|лась|лось|лись)|отлича(?:ются|ется|лся|лась|лось|лись))\\b|"\n    r"\\b(?:различн(?:ый|ая|ое|ые|ого|ому|ыми)|отдельн(?:ый|ая|ое|ые))\\s+от\\b"\n''','')
          p.write_text(text)

          p=Path('tests/docs/test_evidence_admission_sufficiency.py')
          text=p.read_text()
          starts=[
              'def test_russian_difference_surface_builds_comparison_relation_probe():',
              'def test_russian_comparison_relation_qualification_prefers_supporting_relation():',
          ]
          for marker in starts:
              if marker in text:
                  start=text.index(marker)
                  next_pos=text.find('\ndef ', start+1)
                  next_param=text.find('\n@pytest.mark.parametrize', start+1)
                  candidates=[x for x in (next_pos,next_param) if x!=-1]
                  end=min(candidates) if candidates else len(text)
                  text=text[:start]+text[end:].lstrip('\n')
          p.write_text(text)
          PY
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib
          p=Path('tests/docs/test_evidence_admission_sufficiency.py')
          node=ast.parse(p.read_text())
          hashes=[]
          for item in node.body:
              if isinstance(item,(ast.FunctionDef,ast.AsyncFunctionDef)) and item.name.startswith('test_'):
                  segment=ast.get_source_segment(p.read_text(),item) or ''
                  hashes.append(hashlib.sha256(segment.encode()).hexdigest())
          digest=hashlib.sha256(''.join(hashes).encode()).hexdigest()
          import json
          m=Path('tests/diagnostic_labels.evidence_admission_sufficiency.json')
          data=json.loads(m.read_text())
          data['module_node_hashes']['tests/docs/test_evidence_admission_sufficiency.py']=digest
          m.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          print('test digest', digest)
          PY
      - name: Install test dependencies without model runtime
        run: |
          python - <<'PY'
          import subprocess,sys,tomllib
          d=tomllib.load(open('pyproject.toml','rb'))
          deps=[x for x in d['project']['dependencies'] if not x.startswith(('tiktoken','fastembed'))]
          deps+=d['project']['optional-dependencies']['dev']
          subprocess.run([sys.executable,'-m','pip','install','-q',*deps],check=True)
          PY
      - name: Verify targeted regression block
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/docs/test_evidence_admission_sufficiency.py \
            tests/docs/test_agent_question_planning_contract.py \
            tests/docs/test_documentation_query_plan.py \
            tests/docs/test_docs_context_compound_projection.py \
            tests/docs/test_context_projection_boundaries.py \
            --ignore=tests/docs/test_context_projection_boundaries.py \
            | tee /tmp/cleanup-tests.log
          python -m pytest -q \
            tests/docs/test_evidence_admission_sufficiency.py \
            tests/docs/test_agent_question_planning_contract.py \
            tests/docs/test_documentation_query_plan.py \
            tests/docs/test_docs_context_compound_projection.py \
            | tee /tmp/cleanup-core-tests.log
          git diff --check
      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-ru-scope-cleanup.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: keep cross-language rewriting in host layer'
          git push origin HEAD:fix/evidence-admission-sufficiency
