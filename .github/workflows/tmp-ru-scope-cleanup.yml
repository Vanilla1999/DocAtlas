name: Temporary RU scope cleanup validation
on:
  push:
    branches: [fix/evidence-admission-sufficiency]
    paths: [.github/workflows/tmp-ru-scope-cleanup.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCATLAS_OFFLINE: '1'
      DOCATLAS_AUTO_VECTORS: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/evidence-admission-sufficiency
          fetch-depth: 20
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Restore exact locally verified English-core files
        shell: bash
        run: |
          set -euo pipefail
          git checkout 50b363ab9555d379921e097727953bc69f19b5f9 -- \
            docmancer/docs/domain/documentation_query_plan.py \
            docmancer/docs/domain/question_semantic_frames.py
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          files = {
            'docmancer/docs/domain/evidence_qualification.py': '',
            'tests/docs/test_evidence_admission_sufficiency.py': '',
            'tests/diagnostic_labels.evidence_admission_sufficiency.json': 'H4sIADYLq2oC/6WQQQqDMBBF955CXJeaKDFJLxMmyQQDaoqjgoh3b3TT7rsbHvz3P3MUZVmR63EEs+FMMU3Vq+SPC4/JrwOaASwOlOmRYcYL0kK1T47q6zS4RY+TQwN+jHQZDK0hRBcz3Z/vPUcriz1sMc0wVNly/vqn5NH0QD3+W6Kt9rqVQgbutPTBNZ2UUlkVhFIQtABrO9ewToi2Qcs9Y4FxYBoUE8yp77R7U8oPmXPtPesszuID8LwD5S0BAAA=',
          }
          for path, encoded in files.items():
              Path(path).write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
      - name: Install test dependencies without model runtime
        run: |
          python - <<'PY'
          import subprocess,sys,tomllib
          d=tomllib.load(open('pyproject.toml','rb'))
          deps=[x for x in d['project']['dependencies'] if not x.startswith(('tiktoken','fastembed'))]
          deps+=d['project']['optional-dependencies']['dev']
          subprocess.run([sys.executable,'-m','pip','install','-q',*deps],check=True)
          PY
      - name: Verify targeted regression block
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/docs/test_evidence_admission_sufficiency.py \
            tests/docs/test_agent_question_planning_contract.py \
            tests/docs/test_documentation_query_plan.py \
            tests/docs/test_docs_context_compound_projection.py \
            | tee /tmp/cleanup-core-tests.log
          git diff --check
      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-ru-scope-cleanup.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: keep cross-language rewriting in host layer'
          git push origin HEAD:fix/evidence-admission-sufficiency
