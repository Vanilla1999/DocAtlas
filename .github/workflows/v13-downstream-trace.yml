name: V13 downstream trace
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths:
      - .github/workflows/v13-downstream-trace.yml

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 63062b0375071ff0546bc4cb8936c502f9cc171b
          path: runtime
      - uses: actions/checkout@v4
        with:
          ref: 63062b0375071ff0546bc4cb8936c502f9cc171b
          path: corpus
      - uses: astral-sh/setup-uv@v6
      - working-directory: runtime
        run: uv sync --frozen --extra dev
      - name: Trace V13 downstream boundaries
        working-directory: runtime
        run: |
          PYTHONPATH="$PWD" uv run --frozen --extra dev python - <<'PY'
          import json, os
          from copy import deepcopy
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from unittest.mock import patch

          from docmancer.agent import DocmancerAgent
          from docmancer.core.config import DocmancerConfig
          from docmancer.docs.registry import LibraryRegistry
          from docmancer.docs.service import DocsJobTracker, LibraryDocsService
          from eval.project_context_quality.capture_public_context import capture_public_call
          from docmancer.docs.application import _project_docs_service_part03 as pds
          from docmancer.docs.application import _project_context_service_part01 as pcs1

          ROOT = Path("../corpus").resolve()
          Q = "How does DocAtlas report omitted material when a bounded documentation response cannot include everything?"
          EXPECTED_PATH = "docs/mcp-response-contract.md"
          NEEDLE = "When a bounded Docs MCP response returns"

          def info(chunk):
              md = dict(getattr(chunk, "metadata", None) or {})
              text = str(getattr(chunk, "text", None) or getattr(chunk, "content", None) or "")
              path = str(
                  getattr(chunk, "path", None) or md.get("project_doc_path")
                  or md.get("source_path") or getattr(chunk, "source", "") or ""
              )
              matches = {}
              for qid, trace in (md.get("retrieval_query_matches") or {}).items():
                  if isinstance(trace, dict):
                      matches[str(qid)] = {
                          k: trace.get(k) for k in (
                              "qualified", "qualification_reason", "relation",
                              "match_ratio", "body_matched_terms", "matched_terms",
                              "query_terms", "exact_terms", "missing_exact_terms",
                              "missing_parent_exact_terms", "public_parent_query_id",
                          )
                      }
              span = md.get("line_span") or (None, None)
              return {
                  "path": path,
                  "line_start": getattr(chunk, "line_start", None) or span[0],
                  "line_end": getattr(chunk, "line_end", None) or span[1],
                  "score": getattr(chunk, "score", None) or md.get("score"),
                  "retrieval_query_ids": list(md.get("retrieval_query_ids") or ()),
                  "retrieval_query_matches": matches,
                  "project_ranking": deepcopy(md.get("project_ranking")),
                  "text": text,
              }

          def hit(rows):
              out = []
              for i, row in enumerate(rows):
                  if row["path"] == EXPECTED_PATH and NEEDLE.casefold() in row["text"].casefold():
                      out.append({"index": i, **row})
              return out

          with TemporaryDirectory(prefix="v13-downstream-") as raw:
              tmp = Path(raw)
              os.environ["DOCATLAS_HOME"] = str(tmp / "home")
              cfg = DocmancerConfig()
              cfg.index.db_path = str(tmp / "db.sqlite")
              cfg.index.extracted_dir = str(tmp / "extracted")
              svc = LibraryDocsService(
                  config=cfg, config_source="explicit",
                  registry=LibraryRegistry(cfg.index.db_path),
                  agent=DocmancerAgent(config=cfg), job_tracker=DocsJobTracker(),
              )
              assert svc.sync_project_docs(str(ROOT), with_vectors=False).status == "success"

              stages = {"candidate_pool": [], "query_window": [], "rerank": [], "stage_fit": []}
              real_diag = pds._retrieval_stage_diagnostics
              real_query = svc.project_docs.query_project_docs
              real_rerank = pcs1.rerank_project_doc_chunks
              real_fit = pcs1.fit_stage_items

              def diagnostics(plan, candidates):
                  rows = [info(x) for x in candidates]
                  stages["candidate_pool"].append({"count": len(rows), "hits": hit(rows)})
                  return real_diag(plan, candidates)

              def query(*args, **kwargs):
                  chunks = real_query(*args, **kwargs)
                  rows = [info(x) for x in chunks]
                  stages["query_window"].append({"count": len(rows), "hits": hit(rows)})
                  return chunks

              def rerank(chunks, **kwargs):
                  before = [info(x) for x in chunks]
                  result = real_rerank(chunks, **kwargs)
                  after = [info(x) for x in result]
                  stages["rerank"].append({
                      "before_count": len(before), "before_hits": hit(before),
                      "after_count": len(after), "after_hits": hit(after),
                      "kwargs": deepcopy(kwargs),
                  })
                  return result

              def fit(stage, items):
                  rows = list(items)
                  result, issue = real_fit(stage, rows)
                  if stage == "project_docs":
                      before = [info(x) for x in rows]
                      after = [info(x) for x in result]
                      stages["stage_fit"].append({
                          "before_count": len(before), "before_hits": hit(before),
                          "after_count": len(after), "after_hits": hit(after),
                          "issue": issue,
                      })
                  return result, issue

              with (
                  patch.object(pds, "_retrieval_stage_diagnostics", diagnostics),
                  patch.object(svc.project_docs, "query_project_docs", query),
                  patch.object(pcs1, "rerank_project_doc_chunks", rerank),
                  patch.object(pcs1, "fit_stage_items", fit),
              ):
                  capture = capture_public_call(
                      svc, {"question": Q, "project_path": str(ROOT), "scope": "project"}
                  )

              bp = (capture.get("projection_attempts") or [{}])[0].get("before_projection") or {}
              cp = [
                  {
                      "path": str(x.get("path") or ""),
                      "text": str(x.get("content") or ""),
                  }
                  for x in (bp.get("context_pack") or [])
              ]
              public = capture.get("public_payload") or {}
              public_rows = [
                  {"path": str(x.get("path_or_url") or ""), "text": str(x.get("snippet") or "")}
                  for x in (public.get("sources") or [])
              ]
              out = {
                  "code_sha": os.environ.get("GITHUB_SHA"),
                  "stages": stages,
                  "context_pack": {"count": len(cp), "hits": hit(cp)},
                  "public": {
                      "status": public.get("status"),
                      "context_quality": public.get("context_quality"),
                      "count": len(public_rows),
                      "hits": hit(public_rows),
                      "sources": public_rows,
                  },
              }
              Path("../v13-downstream-trace.json").write_text(
                  json.dumps(out, ensure_ascii=False, indent=2, default=str) + "\n",
                  encoding="utf-8",
              )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v13-downstream-trace
          path: v13-downstream-trace.json
