name: Retrieval subject binding proof
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths:
      - .github/workflows/retrieval-subject-binding-proof.yml
      - docmancer/docs/domain/project_retrieval_intent.py
      - tests/docs/test_retrieval_alias_subject_binding.py
      - tests/diagnostic_labels.retrieval_recheck.json

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate runtime
        uses: actions/checkout@v4
      - name: Checkout frozen corpus
        uses: actions/checkout@v4
        with:
          ref: 95e61265656283d609bc1328c46c52b2bf1a069e
          path: frozen-corpus
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - name: Focused RED-GREEN regression suite
        run: |
          uv run --frozen --extra dev pytest \
            tests/docs/test_retrieval_alias_subject_binding.py \
            tests/docs/test_context_capture_integrity.py \
            tests/docs/test_docs_context_read_next.py \
            tests/docs/test_evidence_admission_sufficiency.py \
            tests/docs/test_context_loss_boundaries.py \
            tests/docs/test_query_planning_alias_regressions.py \
            tests/docs/test_v13_v15_public_regressions.py \
            tests/test_diagnostic_labels.py -q
      - name: Capture G21 against exact frozen corpus
        env:
          DOCATLAS_OFFLINE: '1'
          DOCATLAS_AUTO_VECTORS: '0'
        run: |
          PYTHONPATH="$PWD" uv run --frozen --extra dev python - <<'PY'
          import json, os, tempfile
          from pathlib import Path
          from docmancer.core.config import DocmancerConfig
          from docmancer.docs.service import LibraryDocsService
          from eval.project_context_quality.capture_public_context import capture_public_call

          root = Path.cwd()
          project = root / 'frozen-corpus'
          out = Path(os.environ['RUNNER_TEMP']) / 'retrieval-subject-binding-proof.json'
          with tempfile.TemporaryDirectory(prefix='subject-binding-') as raw:
              state = Path(raw)
              cfg = DocmancerConfig()
              cfg.index.provider = 'sqlite'
              cfg.index.db_path = str(state / 'index.db')
              cfg.index.extracted_dir = str(state / 'extracted')
              service = LibraryDocsService(config=cfg, config_source='explicit')
              sync = service.sync_project_docs(str(project), with_vectors=False)
              assert sync.status == 'success', sync.status
              requests = {
                  'G21': {
                      'project_path': str(project),
                      'scope': 'project',
                      'question': 'If my question compares two things, should I split it into separate documentation searches before seeing the first result?',
                      'lookup_queries': ['comparison question retrieval planning', 'split comparison before first documentation result'],
                  },
                  'chunking': {
                      'project_path': str(project),
                      'scope': 'project',
                      'question': 'How does indexing split parent sections into child chunks?',
                  },
              }
              captures = {k: capture_public_call(service, v) for k, v in requests.items()}
          g = captures['G21']
          p = g['public_payload']
          qplan = g['projection_attempts'][0]['before_projection']['documentation_query_plan']
          assert not any(q.get('origin') == 'canonical_intent' and 'parent child chunks' in q.get('text','') for q in qplan.get('queries', []))
          assert any('do not pre-split a single compound or comparison question' in (s.get('snippet') or '').casefold() for s in p.get('sources', []))
          assert p['estimated_tokens'] <= 800 and len(p['sources']) <= 3
          c = captures['chunking']['public_payload']
          assert any('child chunks' in (s.get('snippet') or '').casefold() for s in c.get('sources', []))
          assert c['estimated_tokens'] <= 800 and len(c['sources']) <= 3
          out.write_text(json.dumps({'runtime_sha': os.environ.get('GITHUB_SHA'), 'corpus_sha': '95e61265656283d609bc1328c46c52b2bf1a069e', 'captures': captures}, indent=2, ensure_ascii=False))
          print('G21 sources:', [(s.get('path_or_url'), s.get('line_start'), s.get('line_end')) for s in p.get('sources', [])])
          print('G21 tokens:', p['estimated_tokens'])
          print('chunking sources:', [(s.get('path_or_url'), s.get('line_start'), s.get('line_end')) for s in c.get('sources', [])])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-subject-binding-proof
          path: ${{ runner.temp }}/retrieval-subject-binding-proof.json
