name: PR179 assignment-identity review validation
on:
  push:
    branches: [fix/context-first-project-reads-finalization]
    paths: [.github/workflows/pr179-review4-publish.yml]
permissions:
  contents: read
env:
  DOCATLAS_OFFLINE: '1'
  DOCATLAS_AUTO_VECTORS: '0'
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  PYTHONHASHSEED: '0'
  PYTHONPATH: '.'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tree: ${{ steps.tree.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install frozen test dependencies
        run: |
          set -euo pipefail
          python -m pip install uv==0.9.25
          uv sync --frozen --extra dev
      - name: Apply the reviewed patch and remove temporary infrastructure
        run: |
          set -euo pipefail
          git diff --exit-code 832ed9a5d050bdf592d6213e77d495dbe1d83b87 HEAD -- . ':!.github/review/pr179-review4.patch' ':!.github/workflows/pr179-review4-publish.yml'
          echo '7a565887399ec58f0711133610babe81ba230a3aa7261ca7c2c46c738f3bfc43  .github/review/pr179-review4.patch' | sha256sum -c -
          git ls-files -z eval scripts docatlas.project-docs.yaml | xargs -0 sha256sum > "$RUNNER_TEMP/review4-frozen.sha256"
          git apply --check .github/review/pr179-review4.patch
          git apply --index .github/review/pr179-review4.patch
          git rm .github/review/pr179-review4.patch .github/workflows/pr179-review4-publish.yml .github/workflows/pr179-review4-snapshot.yml .github/review/pr179-review3.patch .github/workflows/pr179-apply-review3.yml
          git diff --cached --check
      - name: Full offline suite and static checks
        run: |
          set -euo pipefail
          uv run --no-sync pytest tests/ -q --junitxml="$RUNNER_TEMP/review4-full.xml" | tee "$RUNNER_TEMP/review4-full.log"
          uv run --no-sync python -m compileall -q docmancer eval scripts tests
          uv run --no-sync python scripts/check_python_module_size.py | tee "$RUNNER_TEMP/review4-size.log"
      - name: Check existing evidence boundaries without rewriting them
        run: |
          set -euo pipefail
          for script in run_paraphrase_proofability_gate run_mixed_evidence_provenance_gate run_evidence_is_data_gate run_p1_agent_truth_closure_gate p1_agent_truth_closure_self_test; do
            uv run --no-sync python "scripts/$script.py" | tee "$RUNNER_TEMP/review4-$script.log"
          done
          sha256sum -c "$RUNNER_TEMP/review4-frozen.sha256" > "$RUNNER_TEMP/review4-frozen-check.log"
          git diff --exit-code
          git diff --cached --check
      - name: Bind publication to the tested tree
        id: tree
        run: |
          git write-tree > "$RUNNER_TEMP/review4-tested-tree.txt"
          echo "sha=$(cat "$RUNNER_TEMP/review4-tested-tree.txt")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr179-review4-validation
          path: ${{ runner.temp }}/review4-*
          retention-days: 14
          if-no-files-found: error
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Publish exactly the tested tree without a force push
        env:
          TESTED_TREE: ${{ needs.validate.outputs.tree }}
        run: |
          set -euo pipefail
          echo '7a565887399ec58f0711133610babe81ba230a3aa7261ca7c2c46c738f3bfc43  .github/review/pr179-review4.patch' | sha256sum -c -
          git apply --check .github/review/pr179-review4.patch
          git apply --index .github/review/pr179-review4.patch
          git rm .github/review/pr179-review4.patch .github/workflows/pr179-review4-publish.yml .github/workflows/pr179-review4-snapshot.yml .github/review/pr179-review3.patch .github/workflows/pr179-apply-review3.yml
          git diff --cached --check
          test "$(git write-tree)" = "$TESTED_TREE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve canonical assignment identity through visible projection'
          git push origin HEAD:fix/context-first-project-reads-finalization
          git rev-parse HEAD > "$RUNNER_TEMP/review4-published-revision.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/review4-published-tree.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr179-review4-published
          path: ${{ runner.temp }}/review4-published-*
          retention-days: 14
          if-no-files-found: error
