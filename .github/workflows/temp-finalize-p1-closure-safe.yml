name: TEMP safely finalize P1 closure

on:
  push:
    branches: [p1/p1-agent-truth-closure-clean]
    paths:
      - .github/workflows/temp-finalize-p1-closure-safe.yml

permissions:
  contents: write

concurrency:
  group: temp-safe-finalize-p1-closure
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCMANCER_OFFLINE: "1"

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: p1/p1-agent-truth-closure-clean
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Restore permanent validation boundaries
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/p1-stack-exact-validation.yml
          cat > .github/workflows/p1-agent-truth-closure.yml <<'EOF'
          name: P1 Agent Truth closure

          on:
            pull_request:
              branches: [main]
            push:
              branches: [main]

          permissions:
            contents: read

          env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
            DOCMANCER_OFFLINE: "1"

          jobs:
            p1-agent-truth-closure:
              runs-on: ubuntu-latest
              timeout-minutes: 60
              steps:
                - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
                  with:
                    fetch-depth: 0
                    persist-credentials: false
                - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
                  with:
                    python-version: "3.12"
                - name: Install DocAtlas evaluator dependencies
                  run: python -m pip install -e ".[dev]"
                - name: Verify the complete bounded P1 closure
                  run: |
                    set -euo pipefail
                    python scripts/build_agent_developer_first_divergence.py --check
                    python scripts/build_agent_contract_v2_ablation.py --check
                    python scripts/run_paraphrase_proofability_gate.py
                    python scripts/paraphrase_proofability_self_test.py
                    python scripts/run_mixed_evidence_provenance_gate.py
                    python scripts/mixed_evidence_provenance_self_test.py
                    python scripts/run_evidence_is_data_gate.py
                    python scripts/evidence_is_data_self_test.py
                    python scripts/run_p1_agent_truth_closure_gate.py
                    python scripts/p1_agent_truth_closure_self_test.py
                    test -z "$(find .github/workflows -maxdepth 1 -type f -name 'temp-p1*' -print -quit)"
                    python -m compileall -q eval/agent_developer_v1 scripts
                    git diff --check
          EOF
      - name: Install evaluator dependencies
        run: python -m pip install -e ".[dev]"
      - name: Materialize and verify the closure record
        run: |
          set -euo pipefail
          python scripts/build_agent_developer_first_divergence.py --check
          python scripts/build_agent_contract_v2_ablation.py --check
          python scripts/run_paraphrase_proofability_gate.py
          python scripts/paraphrase_proofability_self_test.py
          python scripts/run_mixed_evidence_provenance_gate.py
          python scripts/mixed_evidence_provenance_self_test.py
          python scripts/run_evidence_is_data_gate.py
          python scripts/evidence_is_data_self_test.py
          python scripts/run_agent_developer_adversarial_gate.py
          python scripts/run_agent_developer_adversarial_mutation_gate.py
          python scripts/run_p1_agent_truth_closure_gate.py --write
          python scripts/run_p1_agent_truth_closure_gate.py
          python scripts/p1_agent_truth_closure_self_test.py
          python - <<'PY'
          from pathlib import Path

          path = Path("roadmap/README.md")
          text = path.read_text(encoding="utf-8")
          anchor = (
              "P1 asks whether a real coding model can acquire the intended evidence "
              "through the installed public product.\n"
          )
          block = anchor + """

          ## P1 closure status

          **Execution status:** `CLOSED`.

          **Evidence outcome:** `AUTONOMOUS_AGENT_TRUTH_NOT_PROVEN`.

          P1.1–P1.6 have reviewable evidence outcomes and product decisions. The exact
          installed wheel/CLI/MCP stdio, schema-repair, attribution and privacy boundary
          is green; a committed complete fresh same-model autonomous 11-task result is
          absent. Closing the worklist does not authorize a positive universal Agent
          Truth, Stable maturity, public API change, or Product Truth claim. See
          [`docs/p1-agent-truth-scorecard.md`](../docs/p1-agent-truth-scorecard.md).
          """
          if "## P1 closure status" not in text:
              if text.count(anchor) != 1:
                  raise SystemExit("P1 roadmap insertion anchor missing or ambiguous")
              path.write_text(text.replace(anchor, block, 1), encoding="utf-8")
          PY
          rm -f .github/workflows/temp-p1-finalize-closure.yml
          rm -f .github/workflows/temp-finalize-p1-closure-safe.yml
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'temp-p1*' -print -quit)"
          python -m compileall -q eval/agent_developer_v1 scripts
          git diff --check
      - name: Commit the carrier-free reviewed boundary
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          python - <<'PY'
          import subprocess

          allowed = {
              ".github/workflows/p1-agent-truth-closure.yml",
              ".github/workflows/p1-stack-exact-validation.yml",
              ".github/workflows/temp-p1-finalize-closure.yml",
              ".github/workflows/temp-finalize-p1-closure-safe.yml",
              "eval/agent_developer_v1/results/p1-agent-truth-closure.json",
              "roadmap/README.md",
          }
          changed = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines()
          bad = [path for path in changed if path not in allowed]
          if bad:
              raise SystemExit(f"unexpected safe P1 closure paths: {bad}")
          if not changed:
              raise SystemExit("safe P1 closure produced no reviewable changes")
          PY
          git commit -m "fix(p1): preserve permanent gates in closure boundary"
          git push origin HEAD:p1/p1-agent-truth-closure-clean
