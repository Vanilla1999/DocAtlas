name: TEMP exclude local metadata from P1 closure

on:
  push:
    branches: [p1/p1-agent-truth-closure]
    paths:
      - .github/workflows/temp-p1-closure-exclude-local-metadata.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: p1/p1-agent-truth-closure
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Restrict installed-MCP evidence to reviewable repository files
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("eval/agent_developer_v1/p1_closure.py")
          text = path.read_text(encoding="utf-8")
          old = '''        relative = path.relative_to(repo_root).as_posix().casefold()
                  if "temp-p1" in relative:
                      continue
                  if "installed_mcp" in relative or "installed-mcp" in relative:
                      candidates.add(path)
          '''
          new = '''        relative_path = path.relative_to(repo_root)
                  if any(
                      part in {".git", ".venv", "__pycache__", ".pytest_cache"}
                      for part in relative_path.parts
                  ):
                      continue
                  relative = relative_path.as_posix().casefold()
                  if "temp-p1" in relative:
                      continue
                  if "installed_mcp" in relative or "installed-mcp" in relative:
                      candidates.add(path)
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'part in {".git", ".venv", "__pycache__", ".pytest_cache"}' not in text:
              raise SystemExit("reviewable-tree filter anchor missing")
          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/temp-p1-closure-exclude-local-metadata.yml
          python -m compileall -q eval/agent_developer_v1/p1_closure.py
          git diff --check
      - name: Commit ordinary source only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(p1): exclude local checkout metadata from closure evidence"
          git push origin HEAD:p1/p1-agent-truth-closure
