name: TEMP materialize recoverable docs failures

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'p0/recoverable-docs-failures'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Materialize reviewed implementation
        run: python scripts/_materialize_recoverable_docs_failures_v5.py
      - name: Focused validation
        run: |
          python -m compileall -q docmancer scripts
          python scripts/run_recovery_contract_gate.py
          python scripts/run_recovery_mutation_gate.py
          python scripts/run_legacy_contract_gate.py
          python -m pytest -q tests/test_named_document_context_integration.py tests/docs/test_mcp_docs_tools_registration.py
          git diff --check
      - name: Remove one-shot materializer
        run: |
          rm scripts/_materialize_recoverable_docs_failures.py
          rm scripts/_materialize_recoverable_docs_failures_v2.py
          rm scripts/_materialize_recoverable_docs_failures_v3.py
          rm scripts/_materialize_recoverable_docs_failures_v4.py
          rm scripts/_materialize_recoverable_docs_failures_v5.py
          rm .github/workflows/materialize-recoverable-docs-failures.yml
      - name: Commit semantic tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No semantic changes to commit'
            exit 1
          fi
          git commit -m 'Implement recoverable documentation failures'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
