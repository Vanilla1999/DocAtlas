name: Evidence v2 resume snapshot
on:
  push:
    branches: [fix/evidence-quality-v2-20260910]
    paths: [.github/workflows/evidence-v2-resume-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve exact public source history for isolated review
        run: |
          set -eu
          git merge-base --is-ancestor 9fe3e017fed60169838c3c745356d171720f37f9 HEAD
          mkdir -p "$RUNNER_TEMP/evidence-resume"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence-resume/head.txt"
          git bundle create "$RUNNER_TEMP/evidence-resume/source.bundle" HEAD refs/remotes/origin/main
          git bundle verify "$RUNNER_TEMP/evidence-resume/source.bundle"
          sha256sum "$RUNNER_TEMP/evidence-resume/source.bundle" > "$RUNNER_TEMP/evidence-resume/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-v2-resume-${{ github.sha }}
          path: ${{ runner.temp }}/evidence-resume/
          retention-days: 7
