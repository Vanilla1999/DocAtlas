name: PR211 one-shot lock repair

on:
  push:
    branches: [integration/stage3-v2-identity-pr1]
    paths: [.github/workflows/pr211-lock-repair-once.yml]

permissions:
  contents: read

jobs:
  lock-repair:
    if: github.repository == 'Vanilla1999/DocAtlas' && github.ref == 'refs/heads/integration/stage3-v2-identity-pr1'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Refuse replay or concurrent changes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = d6eed7d6d193889f109e4de09f66f72763f696f9
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/integration/stage3-v2-identity-pr1 | cut -f1)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/lock-repair"
          git rev-parse HEAD > "$RUNNER_TEMP/lock-repair/input-head.txt"
          cp uv.lock "$RUNNER_TEMP/lock-repair/uv.lock.before"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Regenerate without upgrading existing locked dependencies
        run: |
          set -euo pipefail
          python -m pip install uv==0.9.25
          uv lock
          uv lock --check
          test "$(git diff --name-only)" = uv.lock
          cp uv.lock "$RUNNER_TEMP/lock-repair/uv.lock"
          git diff -- uv.lock > "$RUNNER_TEMP/lock-repair/uv.lock.patch"
      - name: Publish only uv.lock with a normal fast-forward
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- uv.lock
          test "$(git diff --cached --name-only)" = uv.lock
          git commit -m 'build: synchronize optional reranker dependencies in uv.lock'
          git push origin HEAD:refs/heads/integration/stage3-v2-identity-pr1
          git rev-parse HEAD > "$RUNNER_TEMP/lock-repair/output-head.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/lock-repair/output-tree.txt"
      - name: Preserve generated lock and commit identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr211-lock-repair-${{ github.sha }}
          path: ${{ runner.temp }}/lock-repair/
          if-no-files-found: error
          retention-days: 30
