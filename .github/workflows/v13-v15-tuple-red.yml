name: V13 V15 tuple-shape check
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths:
      - .github/workflows/v13-v15-tuple-red.yml
      - docmancer/docs/application/context_candidate_ranking.py
      - tests/docs/test_reporting_relation_selection.py

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - run: >-
          uv run --frozen --extra dev pytest
          tests/docs/test_reporting_relation_selection.py::test_relation_priority_keeps_fixed_shape_for_narrow_requests
          -q
