name: PR179 V2 acceptance migration validation 2
on:
  push:
    branches: [fix/context-first-project-reads-finalization]
    paths: [.github/workflows/pr179-v2-acceptance-publish2.yml]
permissions:
  contents: read
env:
  DOCATLAS_OFFLINE: '1'
  DOCATLAS_AUTO_VECTORS: '0'
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  PYTHONHASHSEED: '0'
  PYTHONPATH: '.'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    outputs:
      tree: ${{ steps.tree.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install uv==0.9.25
          uv sync --frozen --extra dev
      - name: Apply reviewed base patch and lineage fix
        run: |
          set -euo pipefail
          cat .github/review/pr179-v2-final.patch.b64.0* > "$RUNNER_TEMP/review.b64"
          echo '1d7107343e9b7e501c0e87225994bbde49489638e5d9316dbd7da50244cd4516  '$RUNNER_TEMP'/review.b64' | sha256sum -c -
          base64 -d "$RUNNER_TEMP/review.b64" | gzip -d > "$RUNNER_TEMP/review.patch"
          echo '2ae4cbeac0478425cd148b6a9f7912ff6b1b3948df1750e791a4fea753d02d70  '$RUNNER_TEMP'/review.patch' | sha256sum -c -
          echo '3352792613682425266ab4e5ad7ccc70a46a02d7fc350b53c4bf3b2254d34e8e  .github/review/pr179-v2-fix1.patch.b64' | sha256sum -c -
          base64 -d .github/review/pr179-v2-fix1.patch.b64 | gzip -d > "$RUNNER_TEMP/fix1.patch"
          echo 'eaa6665a9f321d0bf54ac2ef6bbb2ec5943d675b749ed5f113f402006471bfaf  '$RUNNER_TEMP'/fix1.patch' | sha256sum -c -
          git apply --check "$RUNNER_TEMP/review.patch"
          git apply --index "$RUNNER_TEMP/review.patch"
          git apply --check "$RUNNER_TEMP/fix1.patch"
          git apply --index "$RUNNER_TEMP/fix1.patch"
          git rm .github/review/pr179-v2-final.patch.b64.00 .github/review/pr179-v2-final.patch.b64.01 .github/review/pr179-v2-final.patch.b64.02 .github/review/pr179-v2-final.patch.b64.03 .github/review/pr179-v2-fix1.patch.b64 .github/workflows/pr179-v2-acceptance-publish.yml .github/workflows/pr179-v2-acceptance-publish2.yml
          git diff --cached --check
      - name: Fast regression contracts
        run: |
          set -euo pipefail
          uv run --no-sync pytest -q tests/test_project_context_quality_acceptance.py tests/docs/test_v2_acceptance_gaps.py tests/docs/test_documentation_query_plan.py tests/docs/test_review_span_lineage.py tests/docs/test_review_assignment_identity.py tests/docs/test_review_query_lineage.py tests/docs/test_docs_context_compound_projection.py tests/test_project_context_quality_v2_protocol.py | tee "$RUNNER_TEMP/targeted.log"
      - name: Full offline suite and static checks
        run: |
          set -euo pipefail
          uv run --no-sync pytest tests/ -q --junitxml="$RUNNER_TEMP/full.xml" | tee "$RUNNER_TEMP/full.log"
          uv run --no-sync python -m compileall -q docmancer eval scripts tests
          uv run --no-sync python scripts/check_python_module_size.py | tee "$RUNNER_TEMP/module-size.log"
          git diff --cached --check
      - name: Preserve P1 and recovery contracts
        run: |
          set -euo pipefail
          for script in run_paraphrase_proofability_gate run_mixed_evidence_provenance_gate run_evidence_is_data_gate run_p1_agent_truth_closure_gate p1_agent_truth_closure_self_test run_recovery_contract_gate run_recovery_mutation_gate; do
            uv run --no-sync python "scripts/$script.py" | tee "$RUNNER_TEMP/$script.log"
          done
      - name: Legacy compatibility report and blocking lineage floor
        run: |
          set -euo pipefail
          uv run --no-sync python eval/project_context_quality_protocol.py --live --report-only --output "$RUNNER_TEMP/legacy-live.json" > "$RUNNER_TEMP/legacy-live.stdout"
          uv run --no-sync python scripts/check_legacy_project_context_lineage.py "$RUNNER_TEMP/legacy-live.json" | tee "$RUNNER_TEMP/legacy-lineage.log"
      - name: Blocking V2 acceptance
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/run_project_context_quality_v2_gate.py --output "$RUNNER_TEMP/v2-live.json" | tee "$RUNNER_TEMP/v2-acceptance.log"
      - name: Bind publication to tested tree
        id: tree
        run: |
          set -euo pipefail
          git write-tree > "$RUNNER_TEMP/tested-tree.txt"
          echo "sha=$(cat "$RUNNER_TEMP/tested-tree.txt")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr179-v2-acceptance-validation-2
          path: ${{ runner.temp }}/*
          retention-days: 14
          if-no-files-found: warn
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Publish exactly the validated tree
        env:
          TESTED_TREE: ${{ needs.validate.outputs.tree }}
        run: |
          set -euo pipefail
          cat .github/review/pr179-v2-final.patch.b64.0* > "$RUNNER_TEMP/review.b64"
          echo '1d7107343e9b7e501c0e87225994bbde49489638e5d9316dbd7da50244cd4516  '$RUNNER_TEMP'/review.b64' | sha256sum -c -
          base64 -d "$RUNNER_TEMP/review.b64" | gzip -d > "$RUNNER_TEMP/review.patch"
          echo '2ae4cbeac0478425cd148b6a9f7912ff6b1b3948df1750e791a4fea753d02d70  '$RUNNER_TEMP'/review.patch' | sha256sum -c -
          echo '3352792613682425266ab4e5ad7ccc70a46a02d7fc350b53c4bf3b2254d34e8e  .github/review/pr179-v2-fix1.patch.b64' | sha256sum -c -
          base64 -d .github/review/pr179-v2-fix1.patch.b64 | gzip -d > "$RUNNER_TEMP/fix1.patch"
          echo 'eaa6665a9f321d0bf54ac2ef6bbb2ec5943d675b749ed5f113f402006471bfaf  '$RUNNER_TEMP'/fix1.patch' | sha256sum -c -
          git apply --check "$RUNNER_TEMP/review.patch"
          git apply --index "$RUNNER_TEMP/review.patch"
          git apply --check "$RUNNER_TEMP/fix1.patch"
          git apply --index "$RUNNER_TEMP/fix1.patch"
          git rm .github/review/pr179-v2-final.patch.b64.00 .github/review/pr179-v2-final.patch.b64.01 .github/review/pr179-v2-final.patch.b64.02 .github/review/pr179-v2-final.patch.b64.03 .github/review/pr179-v2-fix1.patch.b64 .github/workflows/pr179-v2-acceptance-publish.yml .github/workflows/pr179-v2-acceptance-publish2.yml
          git diff --cached --check
          test "$(git write-tree)" = "$TESTED_TREE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: promote V2 project-context acceptance'
          git push origin HEAD:fix/context-first-project-reads-finalization
