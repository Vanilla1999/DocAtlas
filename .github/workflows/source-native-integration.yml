name: Source-native integration

on:
  push:
    branches: [integration/stage3-v2-identity-pr1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-native-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCATLAS_AUTO_VECTORS: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture immutable inputs before execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-native-inputs" "$RUNNER_TEMP/source-native-results"
          git rev-parse HEAD > "$RUNNER_TEMP/source-native-inputs/head.txt"
          git rev-parse origin/main > "$RUNNER_TEMP/source-native-inputs/base.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/source-native-inputs/source.tar.gz"
          git archive --format=tar.gz origin/main > "$RUNNER_TEMP/source-native-inputs/base-source.tar.gz"
          git diff --numstat origin/main...HEAD > "$RUNNER_TEMP/source-native-inputs/diff-numstat.tsv"
          git diff --name-status origin/main...HEAD > "$RUNNER_TEMP/source-native-inputs/diff-status.tsv"
          git log --format='%H %s' origin/main..HEAD > "$RUNNER_TEMP/source-native-inputs/commits.txt"
          git for-each-ref --format='%(refname) %(objectname)' refs/remotes/origin/ > "$RUNNER_TEMP/source-native-inputs/refs.txt"
          (cd "$RUNNER_TEMP/source-native-inputs" && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-native-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/source-native-inputs/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install runtime and integration dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -c 'import tiktoken; tiktoken.get_encoding("o200k_base")'
      - name: Execute real public MCP and SDK integration
        run: |
          python -m pytest tests/test_heuristic_removal_public_integration.py -v --tb=short --junitxml="$RUNNER_TEMP/source-native-results/integration.xml"
      - name: Preserve exact-head execution results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-native-results-${{ github.sha }}
          path: ${{ runner.temp }}/source-native-results/
          retention-days: 30
          if-no-files-found: warn
