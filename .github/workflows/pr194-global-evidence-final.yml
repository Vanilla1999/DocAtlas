name: PR194 global evidence final gate
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths:
      - .github/workflows/pr194-global-evidence-final.yml

permissions:
  contents: write

jobs:
  verify-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      DOCATLAS_OFFLINE: "1"
      DOCATLAS_AUTO_VECTORS: "0"
      BASE_SHA: ef39e12ab60fd69f8052079847d9e0ca24a843b4
      PATCH_SHA256: 1c1532613a9a41e25ecdea8627bf05f25ae803cff3adca339b06d125e94d7d65
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: fix/v13-v15-evidence-pipeline
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout frozen source corpus
        uses: actions/checkout@v4
        with:
          ref: 95e61265656283d609bc1328c46c52b2bf1a069e
          path: frozen-corpus

      - uses: astral-sh/setup-uv@v6

      - name: Reconstruct and verify candidate patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          cat             .github/pr194-global-evidence-patch/part-00             .github/pr194-global-evidence-patch/part-01-02             .github/pr194-global-evidence-patch/part-03-04             .github/pr194-global-evidence-patch/part-05-06             > "$RUNNER_TEMP/candidate.patch.gz.b64"
          base64 -d "$RUNNER_TEMP/candidate.patch.gz.b64" > "$RUNNER_TEMP/candidate.patch.gz"
          gzip -dc "$RUNNER_TEMP/candidate.patch.gz" > "$RUNNER_TEMP/candidate.patch"
          echo "$PATCH_SHA256  $RUNNER_TEMP/candidate.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/candidate.patch"
          git apply --index "$RUNNER_TEMP/candidate.patch"
          git diff --cached --check
          echo "candidate patch applied:"
          git diff --cached --stat

      - name: Sync candidate
        run: uv sync --frozen --extra dev

      - name: Focused TDD gate
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --extra dev pytest -q             tests/docs/test_discovery_independent_qualification.py             tests/docs/test_context_constraint_roles.py             tests/docs/test_substantive_markdown_labels.py             tests/docs/test_source_bound_subject_context.py             tests/docs/test_requested_need_partition.py             tests/docs/test_need_local_admission.py             tests/docs/test_requested_evidence_retention.py             tests/docs/test_question_only_lookup_arm.py             tests/docs/test_structural_item_integrity.py             | tee "$RUNNER_TEMP/focused.log"
          uv run --frozen --extra dev python -m compileall -q docmancer eval/global_evidence_tdd

      - name: Prepare exact baseline worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/base-runtime" "$BASE_SHA"
          (cd "$RUNNER_TEMP/base-runtime" && uv sync --frozen --extra dev)

      - name: Compare module-size debt exactly
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (cd "$RUNNER_TEMP/base-runtime" && uv run --frozen --extra dev python scripts/check_python_module_size.py) > "$RUNNER_TEMP/size-base.log" 2>&1
          base_exit=$?
          uv run --frozen --extra dev python scripts/check_python_module_size.py > "$RUNNER_TEMP/size-cand.log" 2>&1
          cand_exit=$?
          set -e
          cat "$RUNNER_TEMP/size-base.log"
          cat "$RUNNER_TEMP/size-cand.log"
          python - <<'PY'
          import os
          from pathlib import Path
          t=Path(os.environ["RUNNER_TEMP"])
          a=t.joinpath("size-base.log").read_text().strip()
          b=t.joinpath("size-cand.log").read_text().strip()
          assert a == b, (a,b)
          assert "_project_docs_service_part03.py" in b
          assert "_docs_context_projection_core.py" not in b
          assert "question_plan.py" not in b
          PY

      - name: Paired full core regression
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (cd "$RUNNER_TEMP/base-runtime" && uv run --frozen --extra dev pytest tests/ -m "not advanced and not live and not live_network" -q) > "$RUNNER_TEMP/core-base.log" 2>&1
          echo $? > "$RUNNER_TEMP/core-base.exit"
          uv run --frozen --extra dev pytest tests/ -m "not advanced and not live and not live_network" -q > "$RUNNER_TEMP/core-cand.log" 2>&1
          echo $? > "$RUNNER_TEMP/core-cand.exit"
          set -e
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          t=Path(os.environ["RUNNER_TEMP"])
          def parse(name):
              text=t.joinpath(name).read_text(errors="replace")
              failed=[]
              for line in text.splitlines():
                  if line.startswith("FAILED "):
                      failed.append(line[7:].split(" - ",1)[0].strip())
              summaries=[line for line in text.splitlines()
                         if re.search(r"\d+ failed, \d+ passed", line)]
              return {"failed":sorted(set(failed)),
                      "summary":summaries[-1] if summaries else None}
          a=parse("core-base.log"); b=parse("core-cand.log")
          out={
              "baseline":a,"candidate":b,
              "only_baseline":sorted(set(a["failed"])-set(b["failed"])),
              "only_candidate":sorted(set(b["failed"])-set(a["failed"])),
              "same_failed_ids":a["failed"]==b["failed"],
              "base_exit":int(t.joinpath("core-base.exit").read_text()),
              "cand_exit":int(t.joinpath("core-cand.exit").read_text()),
          }
          t.joinpath("core-compare.json").write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          if out["only_candidate"]:
              raise SystemExit("candidate-only core failures")
          PY

      - name: External80 baseline shared fixture
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/base-runtime"
          PYTHONPATH="$PWD" uv run --frozen --extra dev python - <<'PY'
          from pathlib import Path
          from eval.evidence_quality_v2.run import run
          import os
          run(Path(os.environ["RUNNER_TEMP"]) / "external-base")
          PY

      - name: External80 candidate on exact baseline fixture
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" uv run --frozen --extra dev python - <<'PY'
          from pathlib import Path
          from eval.evidence_quality_v2.run import run
          import os
          t=Path(os.environ["RUNNER_TEMP"])
          run(t/"external-cand", fixture_output=t/"external-base")
          PY

      - name: External80 causal comparison
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          t=Path(os.environ["RUNNER_TEMP"])
          A=json.loads((t/"external-base/rows.json").read_text())
          B=json.loads((t/"external-cand/rows.json").read_text())
          a={r["id"]:r for r in A if r.get("variant")=="A-current"}
          b={r["id"]:r for r in B if r.get("variant")=="A-current"}
          assert set(a)==set(b)
          def ok(r):
              return (r.get("assessment",{}).get("context_sufficiency")=="sufficient"
                      and not r.get("safety_errors"))
          wins=sorted(i for i in a if ok(b[i]) and not ok(a[i]))
          losses=sorted(i for i in a if ok(a[i]) and not ok(b[i]))
          out={
              "baseline_sufficient":sum(ok(x) for x in a.values()),
              "candidate_sufficient":sum(ok(x) for x in b.values()),
              "wins":wins,"losses":losses,
              "baseline_safety":sum(bool(x.get("safety_errors")) for x in a.values()),
              "candidate_safety":sum(bool(x.get("safety_errors")) for x in b.values()),
          }
          (t/"external-compare.json").write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          expected={"httpx-01","ruff-05","starlette-01"}
          assert not losses, losses
          assert out["candidate_safety"] <= out["baseline_safety"], out
          assert expected <= set(wins), (expected,wins)
          PY

      - name: H04 public regression
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" uv run --frozen --extra dev python - <<'PY'
          import hashlib, json, tempfile
          from pathlib import Path
          from eval.evidence_quality_v2.runtime import write_project, isolated_service, index_project
          from eval.project_context_quality.capture_public_context import capture_public_call
          from docmancer.docs.application.model_visible_projection_helpers import docs_context_budget_tokens

          root=Path.cwd()
          frozen=root/"frozen-corpus"
          eq=frozen/"eval/evidence_quality_v2"
          manifest=json.loads((eq/"source-manifest.json").read_text())
          questions={c["id"]:c for c in json.loads(
              (root/"eval/retrieval_recheck/holdout20_questions.json").read_text()
          )["cases"]}
          def docs(project):
              out={}
              for row in manifest["sources"]:
                  if row["project"] != project:
                      continue
                  p=eq/"sources"/project/row["path"]
                  data=p.read_bytes()
                  assert hashlib.sha256(data).hexdigest()==row["sha256"]
                  out[row["path"]]=data.decode("utf-8")
              return out
          with tempfile.TemporaryDirectory(prefix="h04-final-") as raw:
              base=Path(raw)
              project_root=base/"corpus"/"fastapi"
              write_project(project_root,docs("fastapi"))
              with isolated_service(base/"state") as (service,config):
                  index_project(service,config,project_root)
                  c=questions["H04"]
                  cap=capture_public_call(service,{
                      "project_path":str(project_root),"scope":"all","question":c["question"]
                  })
          payload=cap["public_payload"]
          visible="\n".join(str(s.get("snippet") or "") for s in payload.get("sources") or [])
          required=(
              ("allow_methods","Defaults to `['GET']`"),
              ("allow_headers","Defaults to `[]`"),
              ("expose_headers","Defaults to `[]`"),
              ("max_age","Defaults to `600`"),
          )
          assert all(name in visible and value in visible for name,value in required), visible
          assert docs_context_budget_tokens(payload) <= 800
          assert len(payload.get("sources") or []) <= 3
          assert payload.get("answer_supported") is False
          assert payload.get("answer_available") is False
          assert payload.get("edit_ready") is False
          print(json.dumps({
              "tokens":docs_context_budget_tokens(payload),
              "sources":len(payload.get("sources") or []),
              "required_present":True,
          }))
          PY

      - name: Save verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr194-global-evidence-final-gate
          path: |
            ${{ runner.temp }}/focused.log
            ${{ runner.temp }}/size-base.log
            ${{ runner.temp }}/size-cand.log
            ${{ runner.temp }}/core-base.log
            ${{ runner.temp }}/core-cand.log
            ${{ runner.temp }}/core-compare.json
            ${{ runner.temp }}/external-base/summary.json
            ${{ runner.temp }}/external-cand/summary.json
            ${{ runner.temp }}/external-compare.json

      - name: Commit verified candidate and remove staging
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/pr194-global-evidence-candidate.patch.gz.b64
          rm -rf .github/pr194-global-evidence-patch
          rm -f .github/workflows/pr194-global-evidence-final.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve question-derived evidence through bounded projection"
          git push origin HEAD:fix/v13-v15-evidence-pipeline
