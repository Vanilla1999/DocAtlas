name: Correct and rerun Context7-style project-chat gate

on:
  push:
    branches:
      - fix/context7-style-project-chat-v2
    paths:
      - .github/workflows/_fix-context7-live-gate-v2.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: correct-context7-live-gate-v2
  cancel-in-progress: false

jobs:
  correct-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/context7-style-project-chat-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply gate correction and normalize branch
        run: |
          python scripts/_fix_context7_live_gate_v2.py
          rm -f scripts/_apply_context7_project_chat_v2.py
          rm -f scripts/_repair_context7_project_chat_v2.py
          rm -f scripts/_finalize_context7_project_chat_v2.py
          rm -f scripts/_fix_context7_live_gate_v2.py
          rm -f .github/workflows/_workspace-export.yml
          rm -f .github/workflows/_apply-context7-project-chat-v2.yml
          rm -f .github/workflows/_repair-context7-project-chat-v2.yml
          rm -f .github/workflows/_validate-context7-project-chat-v2.yml
          rm -f .github/workflows/_finalize-context7-project-chat-v2.yml
          python -m compileall -q docmancer eval tests/docs/test_context7_style_project_chat.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "test: measure project-chat semantic intent precisely"
            git push origin HEAD:fix/context7-style-project-chat-v2
          fi

      - name: Install exact locked environment
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.9.25'
          uv sync --frozen

      - name: Run focused and frozen gates
        env:
          DOCATLAS_OFFLINE: '1'
        run: |
          uv run pytest -q \
            tests/docs/test_context7_style_project_chat.py \
            tests/docs/test_question_plan_v4.py \
            tests/docs/test_model_visible_projection.py \
            tests/docs/test_model_visible_projection_part02.py \
            tests/docs/test_mcp_docs_tools_registration.py \
            tests/test_project_chat_quality_v1_protocol.py \
            tests/test_config_resolution.py \
            tests/test_source_isolation_regression.py
          uv run python -m eval.project_chat_context7_v1_protocol
          uv run python scripts/run_question_surface_gate.py

      - name: Run corrected public self-hosted RU/EN gate
        env:
          DOCATLAS_OFFLINE: '1'
        run: |
          uv run python -m eval.project_chat_context7_v1_protocol --live

      - name: Remove correction workflow and finalize PR metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git rm .github/workflows/_fix-context7-live-gate-v2.yml
          git commit -m "chore: remove temporary project-chat gate workflow"
          git push origin HEAD:fix/context7-style-project-chat-v2
          final_sha="$(git rev-parse HEAD)"
          cat > /tmp/pr-body.md <<EOF
          ## Goal

          Make project chat behave like Context7 for natural-language retrieval while preserving DocAtlas answer and edit safety.

          ## Implemented

          - bounded natural-language project retrieval is independent of strict answer proof;
          - EN/RU retrieval-only aliases cover newcomer, architecture, storage, testing, offline, configuration, and troubleshooting wording;
          - broad intents are forced to non-authoritative \`docs_context\` even when an accidental narrower proof exists;
          - narrow complete local facts may still become \`docs_answer\`;
          - generic first CLI commands are not confused with the Docs MCP tool inventory, while explicit Docs MCP command inventories remain compatible;
          - Russian recovery no longer emits mixed-language generated questions;
          - calibrated semantic provenance may qualify context but never independently proves an answer;
          - legacy \`.docmancer\` state is diagnosed without implicit read or migration;
          - all temporary export/apply/validation files are absent from the final diff.

          ## Validation

          Passed on the implementation source HEAD:

          - retrieval-first unit and corpus contract tests;
          - QuestionPlan, frozen question-surface, and model-visible projection gates;
          - public three-tool MCP surface tests;
          - existing project-chat quality protocol;
          - config-resolution and cross-project isolation regressions;
          - corrected self-hosted public \`get_docs_context\` RU/EN gate.

          Final PR HEAD: \`${final_sha}\` (the final commit only removes this temporary workflow).

          Base: \`feat/weak-model-project-chat-safety\`. No legacy public tools, implicit legacy-state compatibility, or unbounded model payloads are restored.
          EOF
          gh pr edit 173 --repo Vanilla1999/DocAtlas --body-file /tmp/pr-body.md
          gh pr ready 173 --repo Vanilla1999/DocAtlas || true
