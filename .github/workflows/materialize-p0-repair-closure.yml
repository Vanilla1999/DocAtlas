name: TEMP materialize one-MR P0 repair and closure

on:
  push:
    branches: [p0/repair-and-close-1.3.1]
    paths:
      - .github/workflows/materialize-p0-repair-closure.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCMANCER_OFFLINE: "1"
  UV_VERSION: "0.9.25"

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: p0/repair-and-close-1.3.1
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Materialize reviewed repair and release semantics
        run: python scripts/materialize_p0_repair_closure.py

      - name: Refresh lockfile from exact source identity
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv lock

      - name: Remove every abandoned or active materializer carrier
        run: |
          rm -f .github/workflows/materialize-*.yml
          rm -f scripts/materialize_*.py
          test ! -e .github/workflows/materialize-p0-repair-closure.yml
          test ! -e scripts/materialize_p0_repair_closure.py
          ! find .github/workflows scripts -maxdepth 1 -type f \
            \( -name 'materialize-*' -o -name 'materialize_*' \) | grep -q .

      - name: Install validation dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install build "hatchling<1.27"

      - name: Run focused release and recovery validation
        run: |
          pytest -q \
            tests/test_p0_release_repair_preflight.py \
            tests/test_patch_release_identity.py \
            tests/test_release_gate.py \
            tests/docs/test_user_facing_docs_branding.py \
            tests/docs/test_source_search_edit_readiness.py \
            tests/docs/test_model_visible_projection.py \
            tests/docs/test_project_context_service.py \
            tests/test_docs_service_part03.py \
            tests/docs/test_python_module_policy_and_manifest.py
          python scripts/run_recovery_contract_gate.py
          python scripts/run_recovery_mutation_gate.py
          python scripts/check_python_module_size.py
          python -m compileall -q docmancer scripts tests

      - name: Build and verify the exact 1.3.1 candidate
        run: |
          rm -rf dist
          python -m build
          python scripts/release_gate.py --manifest dist/release-manifest.json
          test "$(python -c 'from docmancer._version import __version__; print(__version__)')" = "1.3.1"
          git diff --check

      - name: Prove the final branch shape
        run: |
          set -euo pipefail
          test -e .github/workflows/close-p0-after-public-1.3.1.yml
          test -e scripts/close_p0_after_release.py
          test -e tests/test_p0_release_repair_preflight.py
          test ! -e docs/release-evidence/v1.3.1-public.json
          grep -q 'Status: \*\*INCOMPLETE\*\*' docs/public-truth-scorecard.md
          grep -q 'Exact public artifact identity | `pending`' docs/public-truth-scorecard.md
          grep -q 'default: oidc' .github/workflows/publish.yml
          grep -q 'PYPI_API_TOKEN' .github/workflows/publish.yml
          grep -q 'environment: release-current' docs/release-identity.md

      - name: Commit only the reviewed semantic tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::repair materializer produced no semantic diff"
            exit 1
          fi
          git commit -m "fix: repair and close the DocAtlas 1.3.1 release path"
          git push origin HEAD:p0/repair-and-close-1.3.1
