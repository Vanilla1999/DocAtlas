name: Global evidence TDD apply
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths:
      - .github/workflows/global-evidence-tdd-apply.yml
      - .github/global-evidence-prod-*.b64
      - .github/global-evidence-tests-*.b64

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6

      - name: Reconstruct exact reviewed patches
        shell: bash
        run: |
          set -euo pipefail
          cat             .github/global-evidence-prod-00.b64             .github/global-evidence-prod-01.b64             .github/global-evidence-prod-02.b64             .github/global-evidence-prod-03a.b64             .github/global-evidence-prod-03b.b64             .github/global-evidence-prod-04.b64             .github/global-evidence-prod-05.b64 > "$RUNNER_TEMP/prod.b64"
          base64 -d "$RUNNER_TEMP/prod.b64" > "$RUNNER_TEMP/prod.patch.gz"
          echo "c5a6d42080325237322aebb47d2dc8724d06c595c3bd6d4075f60eb924ae134b  $RUNNER_TEMP/prod.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/prod.patch.gz" > "$RUNNER_TEMP/prod.patch"
          echo "588f9deae18d88acd0b09d3cd1c7d52a6d1ad5e0a5dd5aa2f3d471fdbc0057b2  $RUNNER_TEMP/prod.patch" | sha256sum -c -

          cat             .github/global-evidence-tests-00.b64             .github/global-evidence-tests-01.b64             .github/global-evidence-tests-02.b64             .github/global-evidence-tests-03.b64 > "$RUNNER_TEMP/tests.b64"
          base64 -d "$RUNNER_TEMP/tests.b64" > "$RUNNER_TEMP/tests.patch.gz"
          echo "4529b8bdad309b7c9ee2caa8f156f3644b7ad888315e051dfae6402c6bb5a222  $RUNNER_TEMP/tests.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/tests.patch.gz" > "$RUNNER_TEMP/tests.patch"
          echo "ed0d3cb63e90135b5a2e244c8d26a75769164d93b6d2d1c9a80b6b80ea0288c8  $RUNNER_TEMP/tests.patch" | sha256sum -c -

          git apply --check "$RUNNER_TEMP/prod.patch"
          git apply --index "$RUNNER_TEMP/prod.patch"
          git apply --check "$RUNNER_TEMP/tests.patch"
          git apply --index "$RUNNER_TEMP/tests.patch"
          git diff --cached --check

      - name: Sync frozen environment
        run: uv sync --frozen --extra dev

      - name: Run global-evidence TDD gate
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --extra dev pytest -q             tests/docs/test_context_constraint_roles.py             tests/docs/test_discovery_independent_qualification.py             tests/docs/test_need_local_admission.py             tests/docs/test_question_only_lookup_arm.py             tests/docs/test_requested_evidence_retention.py             tests/docs/test_requested_need_partition.py             tests/docs/test_source_bound_subject_context.py             tests/docs/test_substantive_markdown_labels.py             tests/docs/test_structural_item_integrity.py             | tee "$RUNNER_TEMP/focused.log"
          uv run --frozen --extra dev python -m compileall -q docmancer eval scripts tests

      - name: Verify no new Python module size debt
        shell: bash
        run: |
          set +e
          uv run --frozen --extra dev python scripts/check_python_module_size.py > "$RUNNER_TEMP/size.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/size.log"
          test "$code" -eq 1
          python - <<'PY'
          from pathlib import Path
          import os, re
          text=Path(os.environ["RUNNER_TEMP"]).joinpath("size.log").read_text()
          offenders=re.findall(r"^\s+(\d+)\s+(.+\.py)$", text, re.M)
          assert offenders == [("1147", "docmancer/docs/application/_project_docs_service_part03.py")], offenders
          PY

      - name: Upload staging verification
        uses: actions/upload-artifact@v4
        with:
          name: global-evidence-staging-verification
          path: |
            ${{ runner.temp }}/focused.log
            ${{ runner.temp }}/size.log
            ${{ runner.temp }}/prod.patch
            ${{ runner.temp }}/tests.patch

      - name: Commit verified candidate without staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Vanilla1999"
          git config user.email "41183994+Vanilla1999@users.noreply.github.com"
          git rm .github/workflows/global-evidence-tdd-apply.yml
          git rm .github/global-evidence-prod-00.b64
          git rm .github/global-evidence-prod-01.b64
          git rm .github/global-evidence-prod-02.b64
          git rm .github/global-evidence-prod-03a.b64
          git rm .github/global-evidence-prod-03b.b64
          git rm .github/global-evidence-prod-04.b64
          git rm .github/global-evidence-prod-05.b64
          git rm .github/global-evidence-tests-00.b64
          git rm .github/global-evidence-tests-01.b64
          git rm .github/global-evidence-tests-02.b64
          git rm .github/global-evidence-tests-03.b64
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve requested evidence across bounded delivery"
          git push origin HEAD:fix/v13-v15-evidence-pipeline
