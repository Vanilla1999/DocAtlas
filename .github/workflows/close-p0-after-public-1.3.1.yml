name: ONE-SHOT close P0 after public DocAtlas 1.3.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/close-p0-after-public-1.3.1.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  checks: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_TAG: v1.3.1
  RELEASE_VERSION: 1.3.1
  RELEASE_WORKFLOW: publish.yml

concurrency:
  group: close-p0-public-1.3.1
  cancel-in-progress: false

jobs:
  publish-verify-close:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate exact post-merge release source
        id: source
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(python -c 'from docmancer._version import __version__; print(__version__)')" = "$RELEASE_VERSION"
          grep -q '^## \[1\.3\.1\]' CHANGELOG.md
          grep -q 'for example v1.3.1' .github/workflows/publish.yml
          grep -q 'publisher_mode:' .github/workflows/publish.yml
          grep -q "environment: release-current" docs/release-identity.md
          git fetch origin main --tags --force
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            test "$(git rev-parse "$RELEASE_TAG^{}")" = "$TARGET_SHA"
          fi
          printf 'target_sha=%s\n' "$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-head required CI
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.source.outputs.target_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100" \
              > /tmp/source-check-runs.json
            if python - <<'PY'
          import json
          rows = json.load(open('/tmp/source-check-runs.json', encoding='utf-8')).get('check_runs', [])
          latest = {}
          for row in rows:
              name = row.get('name')
              if name == 'required-ci':
                  previous = latest.get(name)
                  if previous is None or str(row.get('started_at') or '') > str(previous.get('started_at') or ''):
                      latest[name] = row
          ok = 'required-ci' in latest and latest['required-ci'].get('conclusion') == 'success'
          raise SystemExit(0 if ok else 1)
          PY
            then
              break
            fi
            if [ "$attempt" -eq 180 ]; then
              echo "::error::required-ci did not become green for ${TARGET_SHA}"
              cat /tmp/source-check-runs.json
              exit 1
            fi
            sleep 10
          done

      - name: Refuse an existing public 1.3.1 before launch
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/preexisting-pypi.json -w '%{http_code}' \
            "https://pypi.org/pypi/doc-atlas/${RELEASE_VERSION}/json")"
          if [ "$status" = "200" ]; then
            echo "::error::doc-atlas==${RELEASE_VERSION} already exists; refusing a duplicate launch"
            exit 1
          fi
          test "$status" = "404"

      - name: Create or verify immutable annotated tag
        id: tag
        env:
          TARGET_SHA: ${{ steps.source.outputs.target_sha }}
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            existing="$(git rev-parse "$RELEASE_TAG^{}")"
            test "$existing" = "$TARGET_SHA" || {
              echo "::error::$RELEASE_TAG points to $existing, expected $TARGET_SHA"
              exit 1
            }
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "DocAtlas ${RELEASE_VERSION}"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          printf 'tag_object_sha=%s\n' "$(git rev-parse "$RELEASE_TAG")" >> "$GITHUB_OUTPUT"
          printf 'peeled_commit_sha=%s\n' "$(git rev-parse "$RELEASE_TAG^{}")" >> "$GITHUB_OUTPUT"

      - name: Dispatch canonical release with reviewed one-time token fallback
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${RELEASE_WORKFLOW}/runs?event=workflow_dispatch&per_page=100" \
            --jq '.workflow_runs[].id' | sort -n > /tmp/release-runs-before.txt
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${RELEASE_WORKFLOW}/dispatches" \
            -f ref=main \
            -f "inputs[tag]=${RELEASE_TAG}" \
            -f "inputs[publisher_mode]=token"
          for attempt in $(seq 1 60); do
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${RELEASE_WORKFLOW}/runs?event=workflow_dispatch&per_page=100" \
              > /tmp/release-runs-after.json
            run_id="$(python - <<'PY'
          import json
          before = {
              int(value)
              for value in open('/tmp/release-runs-before.txt', encoding='utf-8').read().split()
          }
          rows = json.load(open('/tmp/release-runs-after.json', encoding='utf-8')).get('workflow_runs', [])
          fresh = [row for row in rows if int(row.get('id', 0)) not in before]
          fresh.sort(key=lambda row: str(row.get('created_at') or ''), reverse=True)
          print(fresh[0]['id'] if fresh else '')
          PY
            )"
            if [ -n "$run_id" ]; then
              printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
              printf 'run_url=https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$run_id" >> "$GITHUB_OUTPUT"
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "::error::dispatched release run was not observed"
              exit 1
            fi
            sleep 5
          done

      - name: Wait for canonical release terminal success
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              > /tmp/release-run.json
            status="$(python -c "import json; print(json.load(open('/tmp/release-run.json'))['status'])")"
            conclusion="$(python -c "import json; print(json.load(open('/tmp/release-run.json')).get('conclusion') or '')")"
            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success" || {
                echo "::error::release run ${RUN_ID} completed with ${conclusion}"
                cat /tmp/release-run.json
                exit 1
              }
              break
            fi
            if [ "$attempt" -eq 240 ]; then
              echo "::error::release run ${RUN_ID} did not complete"
              exit 1
            fi
            sleep 15
          done
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            > /tmp/release-jobs.json
          python - <<'PY'
          import json
          rows = json.load(open('/tmp/release-jobs.json', encoding='utf-8')).get('jobs', [])
          latest = {}
          for row in rows:
              latest[row.get('name')] = row
          required = {
              'required-release',
              'publish',
              'public-platform-smoke (ubuntu-latest)',
              'public-platform-smoke (macos-latest)',
              'public-platform-smoke (windows-latest)',
          }
          missing = sorted(required - latest.keys())
          failed = sorted(
              name for name in required & latest.keys()
              if latest[name].get('conclusion') != 'success'
          )
          if missing or failed:
              raise SystemExit(f'release job proof incomplete: missing={missing} failed={failed}')
          PY

      - name: Capture exact public artifact bytes
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import urllib.request
          from pathlib import Path

          version = '1.3.1'
          request = urllib.request.Request(
              f'https://pypi.org/pypi/doc-atlas/{version}/json',
              headers={'Cache-Control': 'no-cache', 'User-Agent': 'DocAtlas-P0-closure/1'},
          )
          with urllib.request.urlopen(request, timeout=45) as response:
              metadata = json.load(response)
          rows = {
              row['filename']: row
              for row in metadata.get('urls', [])
              if row.get('packagetype') in {'bdist_wheel', 'sdist'}
          }
          expected_names = {
              'doc_atlas-1.3.1-py3-none-any.whl',
              'doc_atlas-1.3.1.tar.gz',
          }
          if set(rows) != expected_names:
              raise SystemExit(
                  f'public artifact set mismatch: expected={sorted(expected_names)} actual={sorted(rows)}'
              )
          artifacts = {}
          for filename, row in sorted(rows.items()):
              with urllib.request.urlopen(row['url'], timeout=90) as response:
                  data = response.read()
              digest = hashlib.sha256(data).hexdigest()
              metadata_digest = str((row.get('digests') or {}).get('sha256') or '')
              if digest != metadata_digest:
                  raise SystemExit(
                      f'PyPI metadata/content hash mismatch for {filename}: '
                      f'metadata={metadata_digest} downloaded={digest}'
                  )
              artifacts[filename] = {
                  'sha256': digest,
                  'size': len(data),
                  'url': row['url'],
                  'upload_time_iso_8601': row.get('upload_time_iso_8601'),
              }
          Path('/tmp/public-artifacts.json').write_text(
              json.dumps(artifacts, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(artifacts, indent=2, sort_keys=True))
          PY

      - name: Run an independent public Linux MCP smoke
        run: python scripts/public_release_smoke.py --tag "$RELEASE_TAG"

      - name: Materialize exact P0.6 closure and remove one-shot token path
        env:
          TARGET_SHA: ${{ steps.source.outputs.target_sha }}
          TAG_OBJECT_SHA: ${{ steps.tag.outputs.tag_object_sha }}
          PEELED_COMMIT_SHA: ${{ steps.tag.outputs.peeled_commit_sha }}
          RELEASE_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          RELEASE_RUN_URL: ${{ steps.dispatch.outputs.run_url }}
        run: |
          set -euo pipefail
          python scripts/close_p0_after_release.py \
            --target-sha "$TARGET_SHA" \
            --tag-object-sha "$TAG_OBJECT_SHA" \
            --peeled-commit-sha "$PEELED_COMMIT_SHA" \
            --release-run-id "$RELEASE_RUN_ID" \
            --release-run-url "$RELEASE_RUN_URL" \
            --artifacts-json /tmp/public-artifacts.json \
            --jobs-json /tmp/release-jobs.json

      - name: Validate closure tree before direct publication
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]" build "hatchling<1.27"
          pytest -q \
            tests/test_patch_release_identity.py \
            tests/test_public_release_closure.py \
            tests/test_release_gate.py \
            tests/docs/test_user_facing_docs_branding.py \
            tests/docs/test_python_module_policy_and_manifest.py
          python scripts/check_python_module_size.py
          python -m compileall -q docmancer scripts tests
          python -m build
          python scripts/release_gate.py --manifest dist/release-manifest.json
          git diff --check
          test ! -e .github/workflows/close-p0-after-public-1.3.1.yml
          test ! -e scripts/close_p0_after_release.py
          ! find .github/workflows scripts -maxdepth 1 -type f \
            \( -name 'materialize-*' -o -name 'materialize_*' \) | grep -q .

      - name: Commit exact closure evidence to main
        id: closure
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "::error::closure generated no semantic diff"
            exit 1
          }
          git commit -m "docs: close P0 after verified public 1.3.1"
          closure_sha="$(git rev-parse HEAD)"
          git push origin HEAD:main
          printf 'closure_sha=%s\n' "$closure_sha" >> "$GITHUB_OUTPUT"

      - name: Require closure commit CI
        env:
          GH_TOKEN: ${{ github.token }}
          CLOSURE_SHA: ${{ steps.closure.outputs.closure_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${CLOSURE_SHA}/check-runs?per_page=100" \
              > /tmp/closure-check-runs.json
            if python - <<'PY'
          import json
          rows = json.load(open('/tmp/closure-check-runs.json', encoding='utf-8')).get('check_runs', [])
          latest = {}
          for row in rows:
              if row.get('name') == 'required-ci':
                  latest['required-ci'] = row
          ok = (
              'required-ci' in latest
              and latest['required-ci'].get('conclusion') == 'success'
          )
          raise SystemExit(0 if ok else 1)
          PY
            then
              exit 0
            fi
            if [ "$attempt" -eq 180 ]; then
              echo "::error::closure commit required-ci did not become green"
              cat /tmp/closure-check-runs.json
              exit 1
            fi
            sleep 10
          done
