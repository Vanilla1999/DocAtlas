name: P2 Product Truth protocol

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCMANCER_OFFLINE: "1"

jobs:
  p2-product-truth-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install evaluator dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify preregistration and fail-closed mutations
        run: |
          set -euo pipefail
          python scripts/verify_product_truth_protocol.py
          python scripts/product_truth_protocol_self_test.py
          python -m compileall -q eval/product_truth_v1 scripts
          git diff --check
