name: Context selection research
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/context-selection-research.yml'
      - 'experiments/grounded-partial/contextual-late/selection_policy.py'
      - 'experiments/grounded-partial/contextual-late/test_selection_policy.py'
      - 'experiments/grounded-partial/contextual-late/run_selection.py'
permissions:
  contents: read
jobs:
  selection-replay:
    if: github.head_ref == 'experiment/contextual-late-sufficiency'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOCATLAS_OFFLINE: '1'
      DOCATLAS_AUTO_VECTORS: '0'
      PYTHONHASHSEED: '0'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments/grounded-partial/contextual-late
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record exact experiment revision
        run: |
          mkdir -p "$RUNNER_TEMP/selection-research"
          git rev-parse HEAD > "$RUNNER_TEMP/selection-research/head.txt"
          git status --porcelain > "$RUNNER_TEMP/selection-research/initial-status.txt"
      - name: Install project test dependencies
        run: |
          python -m pip install '.[dev]' > "$RUNNER_TEMP/selection-research/pip-install.log" 2>&1
          python -m pip freeze > "$RUNNER_TEMP/selection-research/pip-freeze.txt"
      - name: Run counterexamples and existing research checks
        run: |
          set -o pipefail
          python -m pytest experiments/grounded-partial/contextual-late/test_selection_policy.py experiments/grounded-partial/contextual-late/test_factorial.py experiments/grounded-partial/semantic-selection/test_evaluate.py -q 2>&1 | tee "$RUNNER_TEMP/selection-research/tests.log"
      - name: Restore only frozen development inputs
        run: python experiments/grounded-partial/research-suite/restore.py
      - name: Reproduce all native baselines without network
        run: |
          set -o pipefail
          python experiments/grounded-partial/hypothesis5/no_network.py experiments/grounded-partial/research-suite/verify_baseline.py 2>&1 | tee "$RUNNER_TEMP/selection-research/native-baseline.log"
      - name: Compare fixed retrieval and selection combinations
        run: |
          set -o pipefail
          python experiments/grounded-partial/hypothesis5/no_network.py experiments/grounded-partial/contextual-late/run_selection.py --output "$RUNNER_TEMP/selection-research/results" 2>&1 | tee "$RUNNER_TEMP/selection-research/replay.log"
      - name: Verify tracked files were not modified
        if: always()
        run: git diff --exit-code
      - name: Preserve exact inputs, outputs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-selection-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/selection-research/
          include-hidden-files: true
          retention-days: 14
