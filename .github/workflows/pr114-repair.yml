name: PR114 repair runner

on:
  push:
    branches:
      - p0/docatlas-config-skill-identity

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Repair PR114 identity contracts'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: p0/docatlas-config-skill-identity
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Apply reviewed repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old[:100]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          def edit_test(path: str, name: str, replacements: list[tuple[str, str, int]]) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              match = re.search(rf'(?m)^def {re.escape(name)}\(', text)
              if not match:
                  raise SystemExit(f'{path}: test {name} not found')
              next_match = re.search(r'(?m)^(?:def |@pytest\.mark)', text[match.end():])
              end = match.end() + next_match.start() if next_match else len(text)
              chunk = text[match.start():end]
              for old, new, count in replacements:
                  actual = chunk.count(old)
                  if actual != count:
                      raise SystemExit(f'{path}:{name}: expected {count}, found {actual}: {old[:100]!r}')
                  chunk = chunk.replace(old, new)
              p.write_text(text[:match.start()] + chunk + text[end:], encoding='utf-8')

          # Preserve explicit DOCMANCER_HOME compatibility semantics at the first writer boundary.
          replace(
              'docmancer/cli/client_identity.py',
              '''def ensure_user_home(*, home_dir: str | Path | None = None) -> Path:\n    """Establish ownership before creating new user-level DocAtlas state."""\n\n    return ensure_owned_home(resolved_user_home(home_dir=home_dir))\n''',
              '''def ensure_user_home(*, home_dir: str | Path | None = None) -> Path:\n    """Establish ownership before creating new user-level DocAtlas state."""\n\n    resolution = resolve_home(home_dir=home_dir)\n    return ensure_owned_home(\n        resolution.path,\n        allow_legacy_claim=resolution.compatibility_legacy,\n    )\n''',
          )

          # Claude Desktop export is a machine-state write and must not bypass the ownership gate.
          replace(
              'docmancer/cli/_commands_part02.py',
              '''def _create_claude_desktop_zip(config_path: str | Path | None) -> Path:\n    content = _build_skill_content("claude_desktop_skill.md", config_path)\n    export_dir = _get_user_config_dir() / "exports" / "claude-desktop"\n    export_dir.mkdir(parents=True, exist_ok=True)\n''',
              '''def _create_claude_desktop_zip(config_path: str | Path | None) -> Path:\n    content = _build_skill_content("claude_desktop_skill.md", config_path)\n    owned_home = _ensure_user_home(home_dir=Path.home())\n    export_dir = owned_home / "exports" / "claude-desktop"\n    export_dir.mkdir(parents=True, exist_ok=True)\n''',
          )

          # Corrupt install-state is ownership ambiguity: fail closed instead of pretending no other agent exists.
          replace(
              'docmancer/cli/_commands_part02.py',
              '''    try:\n        payload = json.loads(state_path.read_text(encoding="utf-8"))\n        agents = payload.get("agents", [])\n        return {str(agent) for agent in agents if str(agent) in INSTALL_TARGETS}\n    except (json.JSONDecodeError, OSError, AttributeError):\n        return set()\n''',
              '''    try:\n        payload = json.loads(state_path.read_text(encoding="utf-8"))\n    except (json.JSONDecodeError, OSError) as exc:\n        raise click.ClickException(\n            f"Could not read project install state at {display_path(state_path)}; "\n            "refusing to modify shared project guidance."\n        ) from exc\n    if not isinstance(payload, dict):\n        raise click.ClickException(\n            f"Project install state at {display_path(state_path)} must be a JSON object; "\n            "refusing to modify shared project guidance."\n        )\n    agents = payload.get("agents")\n    if not isinstance(agents, list) or any(not isinstance(agent, str) for agent in agents):\n        raise click.ClickException(\n            f"Project install state at {display_path(state_path)} has an invalid agents list; "\n            "refusing to modify shared project guidance."\n        )\n    unknown = sorted(set(agents) - set(INSTALL_TARGETS))\n    if unknown:\n        raise click.ClickException(\n            f"Project install state at {display_path(state_path)} contains unknown agent ids; "\n            "refusing to modify shared project guidance."\n        )\n    return set(agents)\n''',
          )

          # Normalize a proven old managed skill whose marker wrapped its YAML front matter.
          replace(
              'docmancer/cli/_commands_part01.py',
              '''    if legacy is not None:\n        start_idx, end_idx = legacy\n        existing = (\n            existing[:start_idx]\n            + marker_block.rstrip("\\n")\n            + existing[end_idx + len(_LEGACY_AGENTS_MD_END):]\n        )\n        existing = existing.replace(_LEGACY_SKILL_FILE_OWNER, _SKILL_FILE_OWNER, 1)\n        dest.write_text(existing, encoding="utf-8")\n\n    existing_front_matter, _ = _split_front_matter(existing)\n''',
              '''    if legacy is not None:\n        start_idx, end_idx = legacy\n        legacy_managed = existing[\n            start_idx + len(_LEGACY_AGENTS_MD_START):end_idx\n        ].strip()\n        old_front_matter, _ = _split_front_matter(legacy_managed)\n        legacy_prefix = (\n            existing[:start_idx]\n            .replace(_LEGACY_SKILL_FILE_OWNER, "")\n            .replace(_SKILL_FILE_OWNER, "")\n            .strip()\n        )\n        if old_front_matter and not legacy_prefix and _is_proven_docatlas_text(legacy_managed):\n            suffix = existing[end_idx + len(_LEGACY_AGENTS_MD_END):]\n            dest.write_text(\n                front_matter + _SKILL_FILE_OWNER + "\\n" + marker_block + suffix,\n                encoding="utf-8",\n            )\n            return\n        existing = (\n            existing[:start_idx]\n            + marker_block.rstrip("\\n")\n            + existing[end_idx + len(_LEGACY_AGENTS_MD_END):]\n        )\n        existing = existing.replace(_LEGACY_SKILL_FILE_OWNER, _SKILL_FILE_OWNER, 1)\n        dest.write_text(existing, encoding="utf-8")\n\n    existing_front_matter, _ = _split_front_matter(existing)\n''',
          )

          # Primary identity in user-facing setup help.
          replace(
              'docmancer/cli/_commands_part05.py',
              'short_help="Set up docmancer for local agent docs retrieval."',
              'short_help="Set up DocAtlas for local agent docs retrieval."',
          )
          replace(
              'docmancer/cli/_commands_part05.py',
              'help="Create/use ./docmancer.yaml and project-local state."',
              'help="Create/use ./docatlas.yaml and project-local state."',
          )

          # Windows cp1252 must receive an ASCII help fallback, while UTF-capable terminals keep the banner.
          replace('docmancer/cli/help.py', 'import inspect\nimport textwrap\n', 'import inspect\nimport sys\nimport textwrap\n')
          replace(
              'docmancer/cli/help.py',
              '''HELP_CONTEXT_SETTINGS = {\n    "help_option_names": ["--help"],\n    "max_content_width": TERM_WIDTH,\n    "terminal_width": TERM_WIDTH,\n}\n\n\ndef format_examples''',
              '''HELP_CONTEXT_SETTINGS = {\n    "help_option_names": ["--help"],\n    "max_content_width": TERM_WIDTH,\n    "terminal_width": TERM_WIDTH,\n}\n\n\ndef _unicode_help_supported() -> bool:\n    encoding = getattr(sys.stdout, "encoding", None) or "utf-8"\n    try:\n        "█─◆".encode(encoding)\n    except (LookupError, UnicodeEncodeError):\n        return False\n    return True\n\n\ndef format_examples''',
          )
          replace(
              'docmancer/cli/help.py',
              '''    def _rule(self, ctx: click.Context, char: str = "─") -> str:\n        text = char * self._rule_width\n''',
              '''    def _rule(self, ctx: click.Context, char: str = "─") -> str:\n        if not _unicode_help_supported():\n            char = "-"\n        text = char * self._rule_width\n''',
          )
          replace(
              'docmancer/cli/help.py',
              '''        for line in BANNER_LINES:\n            formatter.write(f"{self._style(ctx, line, fg=BANNER_COLOR, bold=True)}\\n")\n''',
              '''        banner_lines = BANNER_LINES if _unicode_help_supported() else ["  DOCATLAS"]\n        for line in banner_lines:\n            formatter.write(f"{self._style(ctx, line, fg=BANNER_COLOR, bold=True)}\\n")\n''',
          )
          replace(
              'docmancer/cli/help.py',
              '        label = f"◆ {heading}"\n',
              '        label = f"{\'◆\' if _unicode_help_supported() else \'>\'} {heading}"\n',
          )
          replace(
              'docmancer/cli/help.py',
              '''            formatter.write(f"{self._style(ctx, f'◆ {lines[0]}', fg='yellow', bold=True)}\\n")\n''',
              '''            prefix = "◆" if _unicode_help_supported() else ">"\n            formatter.write(f"{self._style(ctx, f'{prefix} {lines[0]}', fg='yellow', bold=True)}\\n")\n''',
          )

          # tests/test_cli.py: fresh writers now assert the primary identity; keep legacy-specific tests elsewhere intact.
          edit_test('tests/test_cli.py', 'test_cli_help', [
              ('    assert "mcp" in result.output\n', '''    assert "mcp" in result.output\n\n    with patch("docmancer.cli.help._unicode_help_supported", return_value=False):\n        ascii_result = CliRunner().invoke(cli, ["--help"])\n    assert ascii_result.exit_code == 0\n    assert "DOCATLAS" in ascii_result.output\n    assert "█" not in ascii_result.output\n''', 1),
          ])
          edit_test('tests/test_cli.py', 'test_cli_init_creates_project_sqlite_config', [
              ('    config_file = tmp_path / "docmancer.yaml"\n', '    config_file = tmp_path / "docatlas.yaml"\n', 1),
              ('    assert data["index"]["db_path"] == ".docmancer/docmancer.db"\n', '    assert data["index"]["db_path"] == ".docatlas/docatlas.db"\n', 1),
          ])
          edit_test('tests/test_cli.py', 'test_load_config_bootstraps_user_config_when_no_local_config', [
              ('    user_config = fake_home / ".docmancer" / "docmancer.yaml"\n', '    user_config = fake_home / ".docatlas" / "docatlas.yaml"\n', 1),
              ('    assert config.index.db_path == str((fake_home / ".docmancer" / "docmancer.db").resolve())\n', '    assert config.index.db_path == str((fake_home / ".docatlas" / "docatlas.db").resolve())\n', 1),
          ])

          # tests/test_install_cmd.py: fresh outputs assert docatlas; proven legacy fixtures retain compatibility coverage.
          replace(
              'tests/test_install_cmd.py',
              '"index": {"provider": "sqlite", "db_path": ".docmancer/docmancer.db", "extracted_dir": ".docmancer/extracted"}',
              '"index": {"provider": "sqlite", "db_path": ".docatlas/docatlas.db", "extracted_dir": ".docatlas/extracted"}',
          )
          edit_test('tests/test_install_cmd.py', 'test_install_claude_code_creates_rebooted_skill_file', [
              ('        skill_file = fake_home / ".claude" / "skills" / "docmancer" / "SKILL.md"\n', '        skill_file = fake_home / ".claude" / "skills" / "docatlas" / "SKILL.md"\n', 1),
              ('        assert content.index("<!-- docmancer:start -->") > content.index("\\n---\\n")\n', '        assert content.index("<!-- docatlas:start -->") > content.index("\\n---\\n")\n', 1),
          ])
          edit_test('tests/test_install_cmd.py', 'test_install_codex_creates_native_and_shared_skills', [
              ('        assert (fake_home / ".codex" / "skills" / "docmancer" / "SKILL.md").exists()\n', '        assert (fake_home / ".codex" / "skills" / "docatlas" / "SKILL.md").exists()\n', 1),
              ('        assert (fake_home / ".agents" / "skills" / "docmancer" / "SKILL.md").exists()\n', '        assert (fake_home / ".agents" / "skills" / "docatlas" / "SKILL.md").exists()\n', 1),
          ])
          edit_test('tests/test_install_cmd.py', 'test_install_github_copilot_project_creates_repo_instructions', [
              ('        assert "docmancer:start" in agents_md.read_text()\n', '        assert "docatlas:start" in agents_md.read_text()\n', 1),
          ])
          edit_test('tests/test_install_cmd.py', 'test_project_install_writes_compact_docs_mcp_bootstrap', [
              ('        assert "<!-- docmancer:start -->" in content\n', '        assert "<!-- docatlas:start -->" in content\n', 1),
          ])
          edit_test('tests/test_install_cmd.py', 'test_project_install_replaces_only_its_managed_bootstrap_block', [
              ('            "# Team instructions\\n\\n<!-- docmancer:start -->\\nold bootstrap\\n<!-- docmancer:end -->\\n\\nKeep this text.\\n",\n', '            "# Team instructions\\n\\n<!-- docmancer:start -->\\nold bootstrap\\ndoc-atlas mcp docs-serve\\n<!-- docmancer:end -->\\n\\nKeep this text.\\n",\n', 1),
              ('        assert first_content.count("<!-- docmancer:start -->") == 1\n', '        assert first_content.count("<!-- docatlas:start -->") == 1\n        assert "<!-- docmancer:start -->" not in first_content\n', 1),
          ])
          edit_test('tests/test_install_cmd.py', 'test_project_uninstall_detects_legacy_shared_bootstrap_owners_from_mcp_configs', [
              ('            Path(".docmancer/agent-installs.json").unlink()\n            uninstall = runner.invoke(cli, ["install", "codex", "--project", "--uninstall"])\n        assert uninstall.exit_code == 0, uninstall.output\n', '''            Path(".docatlas/agent-installs.json").unlink()\n            legacy_state = Path(".docmancer/agent-installs.json")\n            legacy_state.parent.mkdir(parents=True, exist_ok=True)\n            legacy_state.write_text("{broken", encoding="utf-8")\n            blocked = runner.invoke(cli, ["install", "codex", "--project", "--uninstall"])\n            assert blocked.exit_code != 0\n            assert "get_docs_context" in Path("AGENTS.md").read_text(encoding="utf-8")\n            legacy_state.unlink()\n            uninstall = runner.invoke(cli, ["install", "codex", "--project", "--uninstall"])\n        assert uninstall.exit_code == 0, uninstall.output\n''', 1),
          ])
          edit_test('tests/test_install_cmd.py', 'test_failed_project_install_does_not_record_agent_state', [
              ('        skill.write_text("---\\nname: custom\\n---\\n<!-- docmancer:start -->\\nbroken\\n", encoding="utf-8")\n', '        skill.write_text("<!-- docmancer:managed-skill-file -->\\n---\\nname: custom\\n---\\n<!-- docmancer:start -->\\ndoc-atlas mcp docs-serve\\n", encoding="utf-8")\n', 1),
              ('        assert not Path(".docmancer/agent-installs.json").exists()\n', '        assert not Path(".docatlas/agent-installs.json").exists()\n', 1),
          ])
          replace(
              'tests/test_install_cmd.py',
              '''        ("claude-code", ".claude/skills/docmancer/SKILL.md"),\n        ("cursor", ".cursor/skills/docmancer/SKILL.md"),\n        ("cline", ".cline/skills/docmancer/SKILL.md"),\n        ("gemini", ".gemini/skills/docmancer/SKILL.md"),\n''',
              '''        ("claude-code", ".claude/skills/docatlas/SKILL.md"),\n        ("cursor", ".cursor/skills/docatlas/SKILL.md"),\n        ("cline", ".cline/skills/docatlas/SKILL.md"),\n        ("gemini", ".gemini/skills/docatlas/SKILL.md"),\n''',
          )
          edit_test('tests/test_install_cmd.py', 'test_gemini_uninstall_does_not_remove_codex_shared_skill', [
              ('        assert (fake_home / ".agents/skills/docmancer/SKILL.md").exists()\n', '        assert (fake_home / ".agents/skills/docatlas/SKILL.md").exists()\n', 1),
          ])
          edit_test('tests/test_install_cmd.py', 'test_reinstall_migrates_marker_before_front_matter', [
              ('        skill = fake_home / ".claude/skills/docmancer/SKILL.md"\n        skill.parent.mkdir(parents=True)\n        skill.write_text("<!-- docmancer:start -->\\n---\\nname: old\\n---\\nold\\n<!-- docmancer:end -->\\n")\n', '''        legacy_skill = fake_home / ".claude/skills/docmancer/SKILL.md"\n        legacy_skill.parent.mkdir(parents=True)\n        legacy_skill.write_text(\n            "<!-- docmancer:managed-skill-file -->\\n<!-- docmancer:start -->\\n"\n            "---\\nname: old\\n---\\ndoc-atlas mcp docs-serve\\n<!-- docmancer:end -->\\n"\n        )\n''', 1),
              ('        content = skill.read_text(encoding="utf-8")\n        assert content.startswith("---\\n")\n        assert content.count("<!-- docmancer:start -->") == 1\n', '''        skill = fake_home / ".claude/skills/docatlas/SKILL.md"\n        assert skill.exists()\n        assert not legacy_skill.exists()\n        content = skill.read_text(encoding="utf-8")\n        assert content.startswith("---\\n")\n        assert content.count("<!-- docatlas:start -->") == 1\n''', 1),
          ])
          edit_test('tests/test_install_cmd.py', 'test_global_uninstall_removes_fully_managed_skill_file', [
              ('        skill = fake_home / ".claude/skills/docmancer/SKILL.md"\n', '        skill = fake_home / ".claude/skills/docatlas/SKILL.md"\n', 1),
          ])
          edit_test('tests/test_install_cmd.py', 'test_reinstall_updates_owned_skill_front_matter', [
              ('        skill = fake_home / ".claude/skills/docmancer/SKILL.md"\n', '        skill = fake_home / ".claude/skills/docatlas/SKILL.md"\n', 1),
          ])
          edit_test('tests/test_install_cmd.py', 'test_legacy_skill_migration_preserves_user_suffix', [
              ('        skill.write_text(\n            "<!-- docmancer:start -->\\n---\\nname: docmancer\\n---\\nold\\n"\n            "<!-- docmancer:end -->\\n\\n# My local notes\\nDo not delete this.\\n",\n            encoding="utf-8",\n        )\n', '''        skill.write_text(\n            "<!-- docmancer:managed-skill-file -->\\n<!-- docmancer:start -->\\n"\n            "---\\nname: docmancer\\n---\\ndoc-atlas mcp docs-serve\\n"\n            "<!-- docmancer:end -->\\n\\n# My local notes\\nDo not delete this.\\n",\n            encoding="utf-8",\n        )\n''', 1),
              ('        assert result.exit_code == 0, result.output\n        assert "# My local notes\\nDo not delete this." in skill.read_text(encoding="utf-8")\n', '''        assert result.exit_code != 0\n        assert "# My local notes\\nDo not delete this." in skill.read_text(encoding="utf-8")\n        assert not (fake_home / ".claude/skills/docatlas/SKILL.md").exists()\n''', 1),
          ])
          edit_test('tests/test_install_cmd.py', 'test_install_claude_desktop_creates_zip', [
              ('        zip_path = fake_home / ".docmancer" / "exports" / "claude-desktop" / "docmancer.zip"\n', '        zip_path = fake_home / ".docatlas" / "exports" / "claude-desktop" / "docatlas.zip"\n', 1),
              ('                assert "docmancer/Skill.md" in zf.namelist()\n                content = zf.read("docmancer/Skill.md").decode()\n', '                assert "docatlas/Skill.md" in zf.namelist()\n                content = zf.read("docatlas/Skill.md").decode()\n', 1),
              ('                assert "docs_status" in content\n', '''                assert "docs_status" in content\n\n        foreign_home = Path(tmp_dir) / "foreign-home"\n        foreign_home.mkdir()\n        (foreign_home / "foreign.txt").write_text("not DocAtlas state", encoding="utf-8")\n        explicit_config = Path(tmp_dir) / "explicit.yaml"\n        explicit_config.write_text("index: {}\\n", encoding="utf-8")\n        with patch("docmancer.cli.commands.Path.home", return_value=fake_home), \\\n             patch("docmancer.cli.commands._get_config_class", return_value=FakeDocmancerConfig):\n            blocked = runner.invoke(\n                cli,\n                ["install", "claude-desktop", "--config", str(explicit_config)],\n                env={"DOCATLAS_HOME": str(foreign_home)},\n            )\n        assert blocked.exit_code != 0\n        assert not (foreign_home / "exports" / "claude-desktop" / "docatlas.zip").exists()\n''', 1),
          ])
          edit_test('tests/test_install_cmd.py', 'test_setup_all_creates_config_db_and_installs_skills', [
              ('        assert (fake_home / ".docmancer" / "docmancer.yaml").exists()\n', '        assert (fake_home / ".docatlas" / "docatlas.yaml").exists()\n', 1),
              ('        assert (fake_home / ".codex" / "skills" / "docmancer" / "SKILL.md").exists()\n', '        assert (fake_home / ".codex" / "skills" / "docatlas" / "SKILL.md").exists()\n', 1),
              ('        assert (fake_home / ".docmancer" / "exports" / "claude-desktop" / "docmancer.zip").exists()\n', '        assert (fake_home / ".docatlas" / "exports" / "claude-desktop" / "docatlas.zip").exists()\n', 1),
          ])
          edit_test('tests/test_install_cmd.py', 'test_setup_yes_offline_project_local_prints_readiness_summary', [
              ('        assert Path("docmancer.yaml").exists()\n', '        assert Path("docatlas.yaml").exists()\n', 1),
          ])
          PY
      - name: Run focused identity tests
        shell: bash
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q docmancer
          pytest -q tests/test_cli.py tests/test_install_cmd.py tests/test_mcp_agent_config.py
      - name: Commit repair and remove temporary runner
        shell: bash
        run: |
          rm .github/workflows/pr114-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair PR114 identity contracts"
          git push origin HEAD:p0/docatlas-config-skill-identity
