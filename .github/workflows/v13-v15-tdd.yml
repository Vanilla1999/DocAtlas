name: V13 V15 TDD
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - name: Focused parser tests
        run: >-
          uv run --frozen --extra dev pytest
          tests/docs/test_comparison_treat_frame.py
          tests/docs/test_bounded_response_docs_parity.py
          tests/docs/test_reporting_relation_selection.py
          tests/docs/test_question_plan_v4.py
          -k "not test_question_plan_splits_compound_questions_into_mandatory_facets"
          -q
