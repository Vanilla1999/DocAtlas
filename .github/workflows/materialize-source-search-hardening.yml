name: TEMP materialize source-search hardening

on:
  push:
    branches: [p0/harden-source-search-edit-readiness]
    paths:
      - .github/workflows/materialize-source-search-hardening.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCMANCER_OFFLINE: "1"

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: p0/harden-source-search-edit-readiness
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Materialize reviewed semantic changes
        run: python scripts/materialize_source_search_hardening.py

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run focused recovery validation
        run: |
          pytest -q \
            tests/docs/test_source_search_edit_readiness.py \
            tests/docs/test_model_visible_projection.py \
            tests/docs/test_project_context_service.py \
            tests/test_docs_service_part03.py
          python scripts/run_recovery_contract_gate.py
          python scripts/run_recovery_mutation_gate.py
          python scripts/check_python_module_size.py
          python -m compileall -q docmancer tests
          git diff --check

      - name: Commit semantic tree and remove one-shot carrier
        run: |
          rm scripts/materialize_source_search_hardening.py
          rm .github/workflows/materialize-source-search-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden local source edit readiness"
          git push origin HEAD:p0/harden-source-search-edit-readiness
