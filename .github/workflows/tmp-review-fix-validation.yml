name: Temporary relation review validation
on:
  push:
    branches: [fix/evidence-admission-sufficiency]
    paths: [.github/workflows/tmp-review-fix-validation.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCATLAS_OFFLINE: '1'
      DOCATLAS_AUTO_VECTORS: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/evidence-admission-sufficiency
          fetch-depth: 3
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Apply byte-verified review patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/review.b64 <<'EOF'
          
          EOF
          python - <<'PY'
          import base64,gzip,hashlib,pathlib
          data=gzip.decompress(base64.b64decode(pathlib.Path('/tmp/review.b64').read_text().strip()))
          assert hashlib.sha256(data).hexdigest() == 'd2a902a483489f950ee30fa0b66f588dc1e634564503aa35f12bf7c86fcc37b3'
          pathlib.Path('/tmp/review.patch').write_bytes(data)
          PY
          git apply --check /tmp/review.patch
          git apply /tmp/review.patch
          git diff --check
      - name: Install test dependencies without tokenizer/model runtime
        shell: bash
        run: |
          python - <<'PY'
          import subprocess,sys,tomllib
          with open('pyproject.toml','rb') as fh:
              data=tomllib.load(fh)
          deps=[d for d in data['project']['dependencies'] if not d.startswith(('tiktoken','fastembed'))]
          deps += data['project']['optional-dependencies']['dev']
          subprocess.run([sys.executable,'-m','pip','install','-q',*deps],check=True)
          PY
      - name: Run fresh targeted verification
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/docs/test_evidence_admission_sufficiency.py \
            tests/docs/test_agent_question_planning_contract.py \
            tests/docs/test_agent_question_planning_live_eval.py \
            tests/docs/test_agent_recovery_version_guidance.py \
            tests/docs/test_dependency_version_transition.py \
            tests/docs/test_relation_preserving_projection.py \
            tests/docs/test_comparison_relation_query_planning.py \
            tests/docs/test_documentation_query_plan.py \
            tests/docs/test_query_planning_budget_regressions.py \
            tests/docs/test_host_scope_contract.py \
            tests/docs/test_host_scope_planning_contract.py \
            tests/docs/test_mcp_docs_tools_registration.py \
            tests/test_install_cmd.py | tee /tmp/review-tests.log
          python -m compileall -q docmancer
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('tiktoken') is None
          assert importlib.util.find_spec('fastembed') is None
          PY
          git diff --check
      - name: Publish validated review fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-review-fix-validation.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: reject unrelated comparison adjectives'
          git push origin HEAD:fix/evidence-admission-sufficiency
          git rev-parse HEAD > /tmp/review-head.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: relation-review-validation
          path: |
            /tmp/review-tests.log
            /tmp/review-head.txt
          if-no-files-found: ignore
          retention-days: 7
