name: MCP missing target binding - installed Black B01/B02/B05/B06/B08

on:
  push:
    branches: [fix/mcp-docs-target-binding-20261029]
    paths:
      - 'docmancer/mcp/_docs_server_tool_data.py'
      - 'docmancer/mcp/_docs_server_part01.py'
      - 'docmancer/docs/interfaces/mcp/context_tools.py'
      - 'docmancer/docs/interfaces/mcp/error_contract.py'
      - 'docmancer/mcp/agent_workflow_contract.py'
      - 'SKILL.md'
      - 'docmancer/templates/agent_contract.md'
      - 'eval/project_binding/**'
      - '.github/workflows/mcp-target-binding.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  installed:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Freeze baseline selector, Context Assembly and Black corpus
        run: |
          set -euo pipefail
          git fetch -q origin ddd59665a623408ca0ee2107affed1209e267544 --depth=1
          git diff --exit-code ddd59665a623408ca0ee2107affed1209e267544 HEAD -- pyproject.toml uv.lock docmancer/docs/application/section_compression.py docmancer/docs/application/context_assembly.py docmancer/docs/application/standalone_text_view.py eval/prepared_model_comparison40 eval/context_assembly/questions20.json
          python -m compileall -q docmancer eval/project_binding
          mkdir -p "$RUNNER_TEMP/results"
          git rev-parse HEAD > "$RUNNER_TEMP/results/HEAD.txt"
      - name: Build exact installed wheel and pinned MiniLM before memory cap
        run: |
          set -euo pipefail
          docker build -f eval/context_assembly/Dockerfile -t docatlas-binding .
      - name: Real public stdio: five original questions with and without target
        run: |
          set -uo pipefail
          docker run --name binding-test --network none --cpus=2 \
            --memory=1500000000 --memory-swap=1500000000 \
            -e HF_HUB_OFFLINE=1 \
            -v "$RUNNER_TEMP/results:/results" \
            --entrypoint /bin/sh docatlas-binding -ec '
              /opt/venv/bin/python -I /repo/eval/project_binding/installed_stdio.py \
                --repo /repo --work /results/work --out /results/verification
              cat /sys/fs/cgroup/memory.max > /results/MEMORY_MAX
              cat /sys/fs/cgroup/memory.peak > /results/MEMORY_PEAK
              cat /sys/fs/cgroup/memory.events > /results/MEMORY_EVENTS
              test "$(cat /sys/fs/cgroup/memory.swap.max)" = 0
              test "$(awk "/^oom_kill / {print \$2}" /sys/fs/cgroup/memory.events)" = 0
              test "$(cat /sys/fs/cgroup/memory.peak)" -le "$(cat /sys/fs/cgroup/memory.max)"
            '
          rc=$?
          docker inspect binding-test > "$RUNNER_TEMP/results/CONTAINER.json"
          echo "$rc" > "$RUNNER_TEMP/results/EXIT_CODE"
          exit "$rc"
      - name: Record full-agent/provider boundary honestly
        if: always()
        run: |
          printf '%s\n' '{"paid_calls":0,"provider_usage":null,"autonomous_opencode_argument_selection":"NOT_TESTED","same_original_user_workspace":"NOT_VERIFIED"}' > "$RUNNER_TEMP/results/BOUNDARIES.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mcp-target-binding-${{ github.run_id }}
          path: ${{ runner.temp }}/results/
          retention-days: 30
          if-no-files-found: error
