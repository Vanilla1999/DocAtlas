name: Installed MCP Agent v1 live capture

on:
  workflow_dispatch:
    inputs:
      model:
        description: GitHub Models catalog id; empty uses repository variable or the reviewed default
        required: false
        default: ""
        type: string
      require_success:
        description: Fail unless the model completes the frozen smoke case
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  models: read

concurrency:
  group: installed-mcp-agent-v1-live-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCMANCER_OFFLINE: "1"
  GITHUB_MODELS_ENDPOINT: https://models.github.ai/inference/chat/completions
  GITHUB_MODELS_API_VERSION: "2022-11-28"

jobs:
  live-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_MODELS_MODEL: ${{ inputs.model || vars.DOCATLAS_GITHUB_MODELS_MODEL || 'openai/gpt-4.1-mini' }}
      GITHUB_MODELS_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install harness dependencies and build one exact wheel
        run: |
          python -m pip install -e ".[dev]" build
          rm -rf dist
          python -m build --wheel
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1

      - name: Run one bounded real-model trajectory
        id: capture
        continue-on-error: true
        run: |
          python scripts/run_installed_mcp_agent_harness.py \
            --wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)" \
            --case eval/installed_mcp_agent_v1/cases/project_docs_round_trip.json \
            --driver command \
            --driver-command "python eval/installed_mcp_agent_v1/github_models_driver.py" \
            --driver-env GITHUB_MODELS_TOKEN \
            --driver-env GITHUB_MODELS_MODEL \
            --driver-env GITHUB_MODELS_ENDPOINT \
            --driver-env GITHUB_MODELS_API_VERSION \
            --provider github-models \
            --model "$GITHUB_MODELS_MODEL" \
            --real-model \
            --output "$RUNNER_TEMP/installed-mcp-agent-v1-live.json"

      - name: Verify and summarize any produced evidence
        id: verify
        if: always()
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/installed-mcp-agent-v1-live.json"
          test -f "$report" || {
            echo "::error::live adapter did not produce a report"
            exit 1
          }
          python scripts/verify_installed_mcp_agent_report.py "$report"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(
              (Path(os.environ['RUNNER_TEMP']) / 'installed-mcp-agent-v1-live.json').read_text(
                  encoding='utf-8'
              )
          )
          assert report['model']['real_model'] is True
          assert report['model']['provider'] == 'github-models'
          assert report['model']['request_ids']
          assert report['claim_boundary']['agent_truth_closed'] is False
          assert report['claim_boundary']['public_release_truth_closed'] is False
          summary = {
              'case_id': report['case']['case_id'],
              'model': report['model']['model'],
              'request_count': len(report['model']['request_ids']),
              'success': report['outcome']['success'],
              'first_divergence': report['first_divergence'],
              'tool_calls': report['budgets']['tool_calls_used'],
              'repairs': report['budgets']['repairs_used'],
              'wheel_sha256': report['package']['artifact_sha256'],
              'schema_sha256': report['mcp']['tool_schemas_sha256'],
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write('## Installed MCP Agent v1 live capture\n\n')
              handle.write('```json\n')
              handle.write(json.dumps(summary, indent=2, sort_keys=True))
              handle.write('\n```\n')
          PY

      - name: Upload the sanitized live report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installed-mcp-agent-v1-live-${{ github.run_id }}
          path: ${{ runner.temp }}/installed-mcp-agent-v1-live.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce requested outcome
        if: always()
        env:
          REQUIRE_SUCCESS: ${{ inputs.require_success }}
        run: |
          set -euo pipefail
          test "${{ steps.verify.outcome }}" = "success"
          report="$RUNNER_TEMP/installed-mcp-agent-v1-live.json"
          if [ "$REQUIRE_SUCCESS" = "true" ]; then
            python - "$report" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          assert report['outcome']['success'] is True, report['first_divergence']
          PY
          fi
