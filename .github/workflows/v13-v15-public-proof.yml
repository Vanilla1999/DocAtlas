name: V13 V15 public regression proof
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths:
      - .github/workflows/v13-v15-public-proof.yml
      - tests/docs/test_v13_v15_public_regressions.py

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate assets
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: fbf36763f89f89f3745b4ea58b773eb33489d2f4
          path: main
      - uses: astral-sh/setup-uv@v6
      - name: Install main
        working-directory: main
        run: uv sync --frozen --extra dev
      - name: Copy public regression into main
        run: |
          cp candidate/tests/docs/test_v13_v15_public_regressions.py main/tests/docs/
          cp candidate/tests/diagnostic_labels.v13_v15.json main/tests/
      - name: Prove main is RED
        working-directory: main
        run: |
          set +e
          uv run --frozen --extra dev pytest tests/docs/test_v13_v15_public_regressions.py -q
          code=$?
          set -e
          test "$code" -ne 0
      - name: Install candidate
        working-directory: candidate
        run: uv sync --frozen --extra dev
      - name: Prove candidate is GREEN
        working-directory: candidate
        run: uv run --frozen --extra dev pytest tests/docs/test_v13_v15_public_regressions.py -q
