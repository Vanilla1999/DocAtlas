name: TEMP materialize P2.1C task pack

on:
  push:
    branches: [p2/p2.1c-task-pack]
    paths:
      - .github/workflows/temp-p2-materialize-task-pack.yml

permissions:
  contents: write

concurrency:
  group: temp-p2-materialize-task-pack
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCMANCER_OFFLINE: "1"

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: p2/p2.1c-task-pack
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Generate and verify the exact report
        run: |
          set -euo pipefail
          python scripts/verify_product_truth_protocol.py
          python scripts/run_product_truth_positive_controls.py
          python scripts/run_product_truth_task_pack.py --write
          python scripts/product_truth_task_pack_self_test.py
          rm .github/workflows/temp-p2-materialize-task-pack.yml
          git diff --check
      - name: Commit the carrier-free evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/product_truth_v1/results/task-pack.json .github/workflows/temp-p2-materialize-task-pack.yml
          git commit -m "evidence(p2): record the preregistered task-pack capacity"
          git push origin HEAD:p2/p2.1c-task-pack
