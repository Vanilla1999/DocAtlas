name: Temp Agent Developer C2 Materialization

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'tmp/agent-developer-c2-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Decode and validate production patch
        run: |
          base64 -d .tmp/c2.patch.gz.b64 | gzip -d > /tmp/c2.patch
          patch -p1 --dry-run < /tmp/c2.patch
      - name: Apply protocol progression edits
        run: |
          patch -p1 < /tmp/c2.patch
          python - <<'PY'
          from pathlib import Path

          runner = Path('scripts/run_agent_developer_gate.py')
          text = runner.read_text(encoding='utf-8')
          start = text.index('                    if actual_status != baseline_status:')
          end = text.index('                    task_target_closed = task_target_closed and target_closed', start)
          replacement = '''                    target_closed = _call_matches_target(call, payload)\n                    if actual_status != baseline_status:\n                        if not target_closed:\n                            errors.append(\n                                f"{task_id}:{index}: neither frozen baseline nor target status matched; "\n                                f"actual={actual_status!r} baseline={baseline_status!r} "\n                                f"target={call.get('target_expected_status')!r}"\n                            )\n                    elif not target_closed:\n                        if baseline_status == "ok" and not paths:\n                            errors.append(f"{task_id}:{index}: ok without source-backed evidence")\n                        if not _matches_sources(paths, call.get("required_sources")):\n                            errors.append(\n                                f"{task_id}:{index}: required baseline source missing; paths={paths!r}"\n                            )\n                        baseline_tool = str(call.get("baseline_next_action_tool") or "")\n                        if baseline_tool and action_tool != baseline_tool:\n                            errors.append(\n                                f"{task_id}:{index}: recovery tool drift "\n                                f"{action_tool!r} != {baseline_tool!r}"\n                            )\n                        baseline_confirmation = str(call.get("baseline_confirmation_reason") or "")\n                        if baseline_confirmation and confirmation_reason != baseline_confirmation:\n                            errors.append(\n                                f"{task_id}:{index}: confirmation drift "\n                                f"{confirmation_reason!r} != {baseline_confirmation!r}"\n                            )\n                    contaminated = sorted(source for source in paths if source in forbidden)\n                    if contaminated:\n                        contamination += 1\n                        errors.append(\n                            f"{task_id}:{index}: forbidden source contamination: {contaminated!r}"\n                        )\n                    if baseline_status != "ok" and actual_status == "ok" and not target_closed:\n                        false_supported += 1\n                        errors.append(f"{task_id}:{index}: unexpected supported result outside target contract")\n\n'''
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              '        gap = f" gap={task[\'known_gap\']}" if task.get("known_gap") else ""\n',
              '        gap = (\n            f" gap={task[\'known_gap\']}" if not task["target_closed"] and task.get("known_gap") else ""\n        )\n',
          )
          runner.write_text(text, encoding='utf-8')

          scope_test = Path('tests/test_product_scope.py')
          text = scope_test.read_text(encoding='utf-8')
          text = text.replace('assert report["target_closed_tasks"] == 8', 'assert report["target_closed_tasks"] == 10')
          text = text.replace('        ("module_behavior_named_gap", "generic_behavior_predicate_stores"),\n', '')
          text = text.replace('        ("module_requirements_named_gap", "domain_neutral_requirements"),\n', '')
          scope_test.write_text(text, encoding='utf-8')

          protocol = Path('eval/agent_developer_v1/README.md')
          text = protocol.read_text(encoding='utf-8')
          old = 'The runner exits non-zero for baseline drift, false-supported outcomes, missing required baseline sources, wrong recovery actions, or forbidden-source contamination. A target gap is reported but does not fail this first diagnostic commit.'
          new = ('The frozen baseline remains a historical reference while later commits close named safe gaps. '
                 'The runner accepts a changed result only when the **complete target contract** matches, including target status, required sources, recovery tool, and confirmation reason. '
                 'This prevents an `insufficient_evidence → ok` improvement from being mislabeled as false support while still rejecting an unsupported `ok` that lacks its target evidence.\n\n'
                 'The runner exits non-zero when a call matches neither its frozen baseline nor its complete target contract, or when it produces false support, missing required evidence, a wrong recovery action, or forbidden-source contamination. A target gap is reported until the complete target contract is closed.')
          if old not in text:
              raise SystemExit('protocol README baseline paragraph not found')
          protocol.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
      - name: Push candidate tree
        run: |
          git config user.name 'docatlas-temp-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add docmancer/docs/domain/_answer_units_part02.py \
                  docmancer/docs/domain/question_plan_proof.py \
                  tests/docs/test_question_plan_v4.py \
                  scripts/run_agent_developer_gate.py \
                  tests/test_product_scope.py \
                  eval/agent_developer_v1/README.md
          git commit -m 'Materialize Agent Developer Commit 2 candidate'
          git push origin HEAD:${{ github.head_ref }}
