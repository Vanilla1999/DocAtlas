name: Systemic retrieval derived-report refresh

on:
  push:
    branches: [feat/systemic-retrieval-mechanics]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCATLAS_OFFLINE: "1"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/systemic-retrieval-mechanics
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install evaluator dependencies
        run: python -m pip install -e '.[dev]'
      - name: Recompute only derived P1 reports
        run: |
          set -euo pipefail
          python scripts/run_paraphrase_proofability_gate.py --write
          python scripts/run_evidence_is_data_gate.py --write
          python scripts/run_p1_agent_truth_closure_gate.py --write
          echo '--- derived report diff ---'
          git diff -- \
            eval/agent_developer_v1/results/paraphrase-proofability.json \
            eval/agent_developer_v1/results/evidence-is-data.json \
            eval/agent_developer_v1/results/p1-agent-truth-closure.json
      - name: Reject unexpected generated changes
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected = {
              'eval/agent_developer_v1/results/paraphrase-proofability.json',
              'eval/agent_developer_v1/results/evidence-is-data.json',
              'eval/agent_developer_v1/results/p1-agent-truth-closure.json',
          }
          changed = set(filter(None, subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines()))
          if changed != expected:
              raise SystemExit(f'unexpected derived-report changes: {sorted(changed)}')
          PY
      - name: Re-run every P1 evidence and closure gate
        run: |
          set -euo pipefail
          python scripts/build_agent_developer_first_divergence.py --check
          python scripts/build_agent_contract_v2_ablation.py --check
          python scripts/run_paraphrase_proofability_gate.py
          python scripts/paraphrase_proofability_self_test.py
          python scripts/run_mixed_evidence_provenance_gate.py
          python scripts/mixed_evidence_provenance_self_test.py
          python scripts/run_evidence_is_data_gate.py
          python scripts/evidence_is_data_self_test.py
          python scripts/run_p1_agent_truth_closure_gate.py
          python scripts/p1_agent_truth_closure_self_test.py
          python -m compileall -q eval/agent_developer_v1 scripts
          git diff --check
      - name: Publish reviewed derived reports and consume carrier
        run: |
          set -euo pipefail
          rm .github/workflows/systemic-retrieval-report-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: refresh P1 reports for systemic retrieval runtime'
          git push origin HEAD:feat/systemic-retrieval-mechanics
