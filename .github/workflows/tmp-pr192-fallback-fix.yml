name: Temporary PR192 fallback fix
on:
  push:
    branches: [fix/pr192-ci-hygiene]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      DOCATLAS_OFFLINE: '1'
      DOCATLAS_AUTO_VECTORS: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/pr192-ci-hygiene
          fetch-depth: 20
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Apply minimal fallback guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docmancer/docs/application/_docs_context_projection_core.py')
          text=p.read_text()
          old='''    decision = context_selection_decision(sources, public_query_ids)\n    payload = _payload(sources, decision=decision, query_plan=query_plan)\n    projection_diagnostics["final_visible_evidence_ids"] = [\n'''
          new='''    decision = context_selection_decision(sources, public_query_ids)\n    component_decision = component_coverage_decision(\n        query_plan.get("_component_contract") or (), assignments, sources,\n        unresolved_residue=query_plan.get("unresolved_parts") or (),\n        component_scope_complete=query_plan.get("component_scope_complete", True),\n    )\n    payload = _payload(sources, decision=decision, query_plan=query_plan)\n    projection_diagnostics["final_visible_evidence_ids"] = [\n'''
          if old not in text: raise SystemExit('decision block not found')
          text=text.replace(old,new,1)
          old='''    if selection_diagnostics is not None:\n        selection_diagnostics["component_coverage"] = component_coverage_decision(\n            query_plan.get("_component_contract") or (), assignments, sources,\n            unresolved_residue=query_plan.get("unresolved_parts") or (),\n            component_scope_complete=query_plan.get("component_scope_complete", True),\n        ).as_payload()\n'''
          new='''    if selection_diagnostics is not None:\n        selection_diagnostics["component_coverage"] = component_decision.as_payload()\n'''
          if old not in text: raise SystemExit('component diagnostics block not found')
          text=text.replace(old,new,1)
          old='''        fallback_ids\n        and not _allow_context_hints\n        and len(payload["sources"]) < MAX_DOCS_SOURCES\n    ):\n'''
          new='''        fallback_ids\n        and not _allow_context_hints\n        and len(payload["sources"]) < MAX_DOCS_SOURCES\n        and (decision.missing_query_ids or component_decision.missing_component_ids)\n    ):\n'''
          if old not in text: raise SystemExit('fallback gate not found')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Install test dependencies
        run: |
          python - <<'PY'
          import subprocess,sys,tomllib
          d=tomllib.load(open('pyproject.toml','rb'))
          deps=[x for x in d['project']['dependencies'] if not x.startswith(('tiktoken','fastembed'))]
          deps+=d['project']['optional-dependencies']['dev']
          subprocess.run([sys.executable,'-m','pip','install','-q',*deps],check=True)
          PY
      - name: Verify fallback behavior
        run: |
          set -euo pipefail
          python -m pytest -q tests/docs/test_context_loss_boundaries.py
          python -m pytest -q tests/docs/test_evidence_admission_sufficiency.py
          python -m pytest -q tests/docs/test_context_projection_boundaries.py -k 'not frozen_request_flow_prefers_project_context_module_witnesses'
          python -m compileall -q docmancer
          git diff --check
      - name: Commit validated fallback fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/tmp-pr192-fallback-fix.yml
          git add docmancer/docs/application/_docs_context_projection_core.py .github/workflows/tmp-pr192-fallback-fix.yml
          git commit -m 'fix: skip hint fallback when primary coverage is complete'
          git push origin HEAD:fix/pr192-ci-hygiene
