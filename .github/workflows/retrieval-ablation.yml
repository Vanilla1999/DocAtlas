name: Retrieval ablation diagnostics
on:
  push:
    branches: ['experiment/retrieval-ablation-t00-t04']
    paths:
      - '.github/workflows/retrieval-ablation.yml'
      - 'experiments/retrieval_ablation/*.py'
      - 'experiments/retrieval_ablation/protocol.json'
      - 'tests/docs/test_retrieval_ablation_*.py'
      - 'tests/diagnostic_labels.retrieval_ablation.json'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DOCATLAS_OFFLINE: '1'
      DOCATLAS_AUTO_VECTORS: '0'
      PYTHONHASHSEED: '0'
      DOCATLAS_REGISTRY_API_URL: 'http://127.0.0.1:1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Frozen environment
        run: |
          mkdir -p "$RUNNER_TEMP/ablation"
          git rev-parse HEAD > "$RUNNER_TEMP/ablation/head.txt"
          python -m pip install uv==0.9.25
          uv sync --frozen --extra dev
          uv pip freeze > "$RUNNER_TEMP/ablation/packages.txt"
          sha256sum uv.lock > "$RUNNER_TEMP/ablation/lock.sha256"
      - name: Real native, packet, structural and handler guards
        run: |
          set -o pipefail
          .venv/bin/python -m pytest tests/docs/test_retrieval_ablation_*.py tests/test_sqlite_ranking_truth.py tests/test_sqlite_phrase_ranking.py -q --junitxml="$RUNNER_TEMP/ablation/guards.xml" 2>&1 | tee "$RUNNER_TEMP/ablation/guards.log"
      - name: Freeze four synthetic mechanisms before executing P A B D and gate
        run: |
          .venv/bin/python - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          from experiments.retrieval_ablation.run import freeze_inputs
          root = Path(os.environ['RUNNER_TEMP']) / 'ablation'
          for case, owner, reverse in [('original', 'Alpha', False), ('renamed', 'Zeta', False), ('reordered', 'Alpha', True), ('renamed-reordered', 'Zeta', True)]:
              base = root / case
              corpus = base / 'input'
              corpus.mkdir(parents=True)
              target = owner + '.wait\n------------\n\n' + owner + '.wait has a retry budget. ' + 'The operation has a documented lifecycle. ' * 12 + '\n\nDo not restart cancelled work.\n'
              other = 'Beta.wait\n---------\n\nAlways restart cancelled work.\n'
              raw = ('\n'.join([other, target] if reverse else [target, other])).encode()
              (corpus / 'methods.md').write_bytes(raw)
              spec = {'schema_version': 1, 'sources': [{'path': 'methods.md', 'sha256': hashlib.sha256(raw).hexdigest()}]}
              freeze_inputs(corpus, spec, {'question': owner + '.wait retry budget'}, base / 'frozen')
          PYCODE
          for case in original renamed reordered renamed-reordered; do
            .venv/bin/python -m experiments.retrieval_ablation.run matrix --frozen "$RUNNER_TEMP/ablation/$case/frozen" --output "$RUNNER_TEMP/ablation/$case/results"
            .venv/bin/python -m experiments.retrieval_ablation.review "$RUNNER_TEMP/ablation/$case/results/"*/result.json > "$RUNNER_TEMP/ablation/$case/review.json"
          done
      - name: Same-call budget observer for historical path investigation
        run: |
          cat > "$RUNNER_TEMP/ablation/path_observer.py" <<'PYCODE'
          import json, os
          from copy import deepcopy
          from pathlib import Path
          calls, current, original = [], None, None
          def pytest_runtest_setup(item):
              global current
              current = item.nodeid
          def pytest_sessionstart(session):
              global original
              from docmancer.docs.application import source_continuation as module
              original = module.docs_context_budget_tokens
              def cost(payload):
                  value = original(payload)
                  if payload.get('read_next'):
                      calls.append({'test': current, 'tokens': value, 'payload': deepcopy(payload)})
                  return value
              module.docs_context_budget_tokens = cost
          def pytest_sessionfinish(session, exitstatus):
              from docmancer.docs.application import source_continuation as module
              module.docs_context_budget_tokens = original
              Path(os.environ['PATH_TRACE']).write_text(json.dumps({'exitstatus': int(exitstatus), 'calls': calls}, ensure_ascii=False, indent=2))
          PYCODE
      - name: Matched physical checkout and fixture paths for base and head
        run: |
          set +e
          PY="$GITHUB_WORKSPACE/.venv/bin/python"
          PAIR="$RUNNER_TEMP/ablation-paired"
          HEAD=$(git rev-parse HEAD)
          mkdir -p /tmp/pytest-of-runner
          git clone --shared --no-checkout "$GITHUB_WORKSPACE" "$PAIR" || exit $?
          for side in base head; do
            REV=55637eb4d29a0d06c01714ee647a5b486a5be725
            if [ "$side" = head ]; then REV="$HEAD"; fi
            git -C "$PAIR" checkout --detach "$REV" || exit $?
            for path in 3 4; do
              (cd "$PAIR" && PYTHONPATH="$RUNNER_TEMP/ablation:$PAIR" PATH_TRACE="$RUNNER_TEMP/ablation/path-$side-$path.json" "$PY" -m pytest -p path_observer tests/docs/test_context_completion_followup.py::test_priority_rule_available_in_first_packet_or_one_registered_read tests/docs/test_contiguous_seed_envelope.py::test_old_inspection_uri_survives_replacement_of_unissued_draft_locators --basetemp="/tmp/pytest-of-runner/pytest-$path" -q --junitxml="$RUNNER_TEMP/ablation/path-$side-$path.xml") > "$RUNNER_TEMP/ablation/path-$side-$path.log" 2>&1
              echo "$?" > "$RUNNER_TEMP/ablation/path-$side-$path.exit"
            done
            (cd "$PAIR" && PYTEST_ADDOPTS='--basetemp=/tmp/docatlas-ablation-focused' "$PY" -m experiments.language_aware_context.flow_regressions --condition baseline --junit "$RUNNER_TEMP/ablation/focused-$side.xml") > "$RUNNER_TEMP/ablation/focused-$side.log" 2>&1
            echo "$?" > "$RUNNER_TEMP/ablation/focused-$side.exit"
            (cd "$PAIR" && "$PY" -m pytest tests/ -m 'not advanced and not live and not live_network' --basetemp=/tmp/docatlas-ablation-offline -q --junitxml="$RUNNER_TEMP/ablation/offline-$side.xml") > "$RUNNER_TEMP/ablation/offline-$side.log" 2>&1
            echo "$?" > "$RUNNER_TEMP/ablation/offline-$side.exit"
          done
          # Preserve red gates, even when base has known failures. Path replays
          # are diagnostic and their nonzero statuses remain separate artifacts.
          test "$(cat "$RUNNER_TEMP/ablation/focused-base.exit")" -eq 0 && test "$(cat "$RUNNER_TEMP/ablation/focused-head.exit")" -eq 0 && test "$(cat "$RUNNER_TEMP/ablation/offline-base.exit")" -eq 0 && test "$(cat "$RUNNER_TEMP/ablation/offline-head.exit")" -eq 0
      - name: Preserve source and verify no tracked writes
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ablation"
          git bundle create "$RUNNER_TEMP/ablation/checkout.bundle" HEAD
          git diff --exit-code
      - name: Preserve evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retrieval-ablation-${{ github.sha }}
          path: ${{ runner.temp }}/ablation/
          retention-days: 7
          if-no-files-found: error
