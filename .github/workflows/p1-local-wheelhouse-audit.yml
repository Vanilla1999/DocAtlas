name: TEMP P1 local wheelhouse audit

on:
  push:
    branches:
      - audit/p1-local-wheelhouse
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-wheelhouse:
    if: github.head_ref == 'audit/p1-local-wheelhouse' || github.ref == 'refs/heads/audit/p1-local-wheelhouse'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build exact offline wheelhouse for the checked-out candidate
        run: |
          python -m pip install --upgrade pip build "hatchling<1.27"
          mkdir -p wheelhouse
          python -m pip wheel --wheel-dir wheelhouse .
          python - <<'PY'
          import hashlib
          import json
          import platform
          import sys
          from pathlib import Path

          rows = []
          for path in sorted(Path("wheelhouse").glob("*.whl")):
              rows.append({
                  "filename": path.name,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size": path.stat().st_size,
              })
          payload = {
              "schema_version": 1,
              "source_commit": "${{ github.event.pull_request.head.sha || github.sha }}",
              "python": sys.version,
              "platform": platform.platform(),
              "wheel_count": len(rows),
              "wheels": rows,
          }
          Path("wheelhouse-manifest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p1-local-wheelhouse-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            wheelhouse/
            wheelhouse-manifest.json
          if-no-files-found: error
          retention-days: 7
