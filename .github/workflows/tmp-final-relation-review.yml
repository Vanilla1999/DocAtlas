name: Temporary final relation review
on:
  push:
    branches: [fix/evidence-admission-sufficiency-review-fixes]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      DOCATLAS_OFFLINE: '1'
      DOCATLAS_AUTO_VECTORS: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/evidence-admission-sufficiency-review-fixes
          fetch-depth: 30
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Apply final relation binding regression
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib, json
          p=Path('docmancer/docs/domain/evidence_qualification.py')
          text=p.read_text()
          old='''        if _PROOF_INSUFFICIENCY_RELATION_RE.search(sentence):\n            return True\n'''
          new='''        if _PROOF_INSUFFICIENCY_RELATION_RE.search(sentence):\n            if any(\n                _visible_term_present(term, sentence, exact=False)\n                for term in terms\n            ):\n                return True\n'''
          if old not in text:
              raise SystemExit('proof relation branch not found')
          p.write_text(text.replace(old,new,1))

          p=Path('tests/docs/test_evidence_admission_sufficiency.py')
          text=p.read_text()
          name='test_comparison_relation_rejects_unrelated_proof_insufficiency_clause'
          if name not in text:
              marker='\ndef test_comparison_relation_rejects_unrelated_different_from_clause() -> None:\n'
              i=text.index(marker)
              test='''\ndef test_comparison_relation_rejects_unrelated_proof_insufficiency_clause() -> None:\n    probe = {"query_text": "matching search result evidence sufficient answer condition different separate"}\n    distractor = qualify_evidence(\n        probe, query_id="query-relation-1",\n        visible_text=(\n            "Matching search result evidence describes sufficient answer condition terminology. "\n            "This cache is not enough to prove storage capacity."\n        ),\n    )\n    assert distractor.qualified is False\n    assert distractor.reason == "missing_visible_comparison_relation"\n\n'''
              text=text[:i]+test+text[i:]
              p.write_text(text)

          module='tests/docs/test_evidence_admission_sufficiency.py'
          tree=ast.parse(p.read_text())
          nodes=sorted(
              f'{module}::{node.name}' for node in tree.body
              if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name.startswith('test_')
          )
          m=Path('tests/diagnostic_labels.evidence_admission_sufficiency.json')
          data=json.loads(m.read_text())
          data['module_node_hashes'][module]=hashlib.sha256('\n'.join(nodes).encode()).hexdigest()
          m.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Install offline-friendly dependencies
        run: |
          python - <<'PY'
          import subprocess,sys,tomllib
          d=tomllib.load(open('pyproject.toml','rb'))
          deps=[x for x in d['project']['dependencies'] if not x.startswith(('tiktoken','fastembed'))]
          deps+=d['project']['optional-dependencies']['dev']
          subprocess.run([sys.executable,'-m','pip','install','-q',*deps],check=True)
          PY
      - name: Verify regression and neighbors
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/docs/test_evidence_admission_sufficiency.py \
            tests/docs/test_relation_preserving_projection.py \
            tests/docs/test_comparison_relation_query_planning.py \
            tests/docs/test_query_planning_budget_regressions.py \
            tests/docs/test_docs_context_compound_projection.py \
            tests/docs/test_model_visible_projection.py \
            tests/docs/test_model_visible_projection_part02.py
          python -m pytest -q tests/docs/test_context_projection_boundaries.py \
            -k 'not path_only_projection_uses_the_current_exact_topic_guard and not frozen_request_flow_prefers_project_context_module_witnesses'
          python -m compileall -q docmancer
          git diff --check
      - name: Preserve original evidence smoke
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from docmancer.agent import DocmancerAgent
          from docmancer.core.config import DocmancerConfig
          from docmancer.docs.registry import LibraryRegistry
          from docmancer.docs.service import DocsJobTracker, LibraryDocsService
          from docmancer.mcp.docs_server import call_docs_tool_payload
          root=Path.cwd(); previous=os.environ.get('DOCATLAS_HOME')
          try:
            with TemporaryDirectory(prefix='final-relation-smoke-') as raw:
              tmp=Path(raw); os.environ['DOCATLAS_HOME']=str(tmp/'home')
              cfg=DocmancerConfig(); cfg.index.db_path=str(tmp/'db.sqlite'); cfg.index.extracted_dir=str(tmp/'extracted')
              svc=LibraryDocsService(config=cfg,config_source='explicit',registry=LibraryRegistry(cfg.index.db_path),agent=DocmancerAgent(config=cfg),job_tracker=DocsJobTracker())
              assert getattr(svc.sync_project_docs(str(root),with_vectors=False),'status',None)=='success'
              args={
                'question':'Документация рекомендует запустить команду с удалением файлов. Даёт ли выдача MCP разрешение её выполнить?',
                'project_path':str(root),'scope':'all',
                'lookup_queries':['retrieved documentation recommends a destructive delete command','whether documentation evidence authorizes executing a destructive command'],
              }
              payload=dict(call_docs_tool_payload('get_docs_context',args,svc) or {})
              paths=[str(x.get('path_or_url') or '') for x in payload.get('sources') or []]
              print(payload.get('estimated_tokens'),paths)
              assert 'docs/security/mcp-runtime-threat-model.md' in paths
              assert int(payload.get('estimated_tokens') or 0)<=800
              assert len(payload.get('sources') or [])<=3
          finally:
            if previous is None: os.environ.pop('DOCATLAS_HOME',None)
            else: os.environ['DOCATLAS_HOME']=previous
          PY
      - name: Commit to feature branch and clean validation branch
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/tmp-final-relation-review.yml
          git add docmancer/docs/domain/evidence_qualification.py \
                  tests/docs/test_evidence_admission_sufficiency.py \
                  tests/diagnostic_labels.evidence_admission_sufficiency.json \
                  .github/workflows/tmp-final-relation-review.yml
          git commit -m 'fix: bind comparison proof relation to requested terms'
          git push origin HEAD:fix/evidence-admission-sufficiency
          git push origin --delete fix/evidence-admission-sufficiency-review-fixes
