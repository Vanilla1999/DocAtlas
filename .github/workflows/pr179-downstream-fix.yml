name: PR179 downstream acceptance fix

on:
  push:
    branches:
      - fix/context-first-project-reads-finalization
    paths:
      - .github/workflows/pr179-downstream-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads-finalization
          fetch-depth: 0
      - name: Apply reviewed downstream fix
        env:
          PATCH_GZ_B64: ""
        run: |
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/pr179-downstream.patch
          git apply --check /tmp/pr179-downstream.patch
          git apply /tmp/pr179-downstream.patch
          rm .github/workflows/pr179-downstream-fix.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: stabilize downstream acceptance gates"
          git push origin HEAD:fix/context-first-project-reads-finalization
