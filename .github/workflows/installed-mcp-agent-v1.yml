name: Installed MCP Agent v1

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/release-requests/v1.3.1.json"
      - ".github/workflows/installed-mcp-agent-v1.yml"
      - "eval/installed_mcp_agent_v1/**"
      - "scripts/run_installed_mcp_agent_harness.py"
      - "scripts/verify_installed_mcp_agent_report.py"
  workflow_dispatch:
    inputs:
      package_spec:
        description: Optional exact public package, for example doc-atlas==1.3.1; empty uses a built wheel
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: installed-mcp-agent-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCMANCER_OFFLINE: "1"

jobs:
  provider-free-positive-control:
    name: provider-free-positive-control
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install harness dependencies
        run: python -m pip install -e ".[dev]" build

      - name: Verify report contract mutations
        run: python scripts/verify_installed_mcp_agent_report.py --self-test

      - name: Build the exact reviewed wheel
        if: inputs.package_spec == ''
        run: |
          rm -rf dist
          python -m build --wheel
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1

      - name: Exercise the installed MCP boundary from a built wheel
        if: inputs.package_spec == ''
        run: |
          python scripts/run_installed_mcp_agent_harness.py \
            --wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)" \
            --case eval/installed_mcp_agent_v1/cases/project_docs_round_trip.json \
            --driver scripted \
            --output "$RUNNER_TEMP/installed-mcp-agent-v1.json"

      - name: Exercise an exact public package when explicitly dispatched
        if: inputs.package_spec != ''
        env:
          PACKAGE_SPEC: ${{ inputs.package_spec }}
        run: |
          case "$PACKAGE_SPEC" in
            doc-atlas==[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::package_spec must be exact doc-atlas==MAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          python scripts/run_installed_mcp_agent_harness.py \
            --package-spec "$PACKAGE_SPEC" \
            --case eval/installed_mcp_agent_v1/cases/project_docs_round_trip.json \
            --driver scripted \
            --output "$RUNNER_TEMP/installed-mcp-agent-v1.json"

      - name: Verify the sanitized installed report
        run: |
          python scripts/verify_installed_mcp_agent_report.py \
            "$RUNNER_TEMP/installed-mcp-agent-v1.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "installed-mcp-agent-v1.json").read_text(
                  encoding="utf-8"
              )
          )
          assert report["outcome"]["success"] is True
          assert report["claim_boundary"]["agent_truth_closed"] is False
          assert report["claim_boundary"]["scripted_positive_control"] is True
          if report["package"]["install_mode"] == "built_wheel":
              assert report["claim_boundary"]["public_release_proven"] is False
          print(json.dumps({
              "case": report["case"]["case_id"],
              "install_mode": report["package"]["install_mode"],
              "wheel_sha256": report["package"]["artifact_sha256"],
              "schema_sha256": report["mcp"]["tool_schemas_sha256"],
              "tool_calls": report["budgets"]["tool_calls_used"],
              "repairs": report["budgets"]["repairs_used"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installed-mcp-agent-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/installed-mcp-agent-v1.json
          if-no-files-found: warn
          retention-days: 30
