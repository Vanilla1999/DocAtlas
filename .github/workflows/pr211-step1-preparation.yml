name: PR211 step1 preparation
on:
  push:
    branches: [maintenance/pr211-step1-build-20261014]
permissions:
  contents: write
  actions: read
jobs:
  prepare-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCATLAS_AUTO_VECTORS: '0'
      DOCATLAS_OFFLINE: '1'
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Apply reviewed preparation to exact PR parent, without bootstrap ancestry
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/step1-results"
          cp .step1/apply.py "$RUNNER_TEMP/step1-apply.py"
          gh api repos/Vanilla1999/DocAtlas/actions/artifacts/11883953054/zip > "$RUNNER_TEMP/baseline.zip"
          git checkout --detach c35aabe21397fb378d29eb26bb58d5ac6fceb622
          python "$RUNNER_TEMP/step1-apply.py" "$RUNNER_TEMP/baseline.zip" 2>&1 | tee "$RUNNER_TEMP/step1-results/preparation.log"
          cp .github/workflows/source-native-integration.yml "$RUNNER_TEMP/step1-results/source-native-integration.proposed.yml"
          git restore .github/workflows/source-native-integration.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eval scripts tests v2plan/pr211-execution/STEP1_*
          git -c core.hooksPath=/dev/null commit -m 'test: retire obsolete checks and restore source-native measurements and frozen V2 inputs'
          git rev-parse HEAD > "$RUNNER_TEMP/step1-results/head.txt"
          git diff c35aabe2 HEAD --stat > "$RUNNER_TEMP/step1-results/diff-stat.txt"
          git diff c35aabe2 HEAD > "$RUNNER_TEMP/step1-results/changes.patch"
          cp v2plan/pr211-execution/STEP1_*.json "$RUNNER_TEMP/step1-results/"
          git push origin HEAD:refs/heads/maintenance/pr211-step1-candidate-20261014
      - name: Install pinned CI dependencies
        run: |
          python -m pip install uv==0.9.25
          uv sync --frozen --extra dev --extra embeddings-openai
          echo "PYTEST_DOCATLAS_ARTIFACT_DIR=$RUNNER_TEMP/step1-results/scenarios" >> "$GITHUB_ENV"
      - name: Collect complete current inventory without deselecting legacy failures
        run: |
          .venv/bin/python -m pytest tests/ --collect-only -q > "$RUNNER_TEMP/step1-results/collection.txt" 2>&1
      - name: Execute remaining core once and preserve actual failures
        run: |
          set +e
          timeout 900 .venv/bin/python -m pytest tests/ -m 'not advanced and not live and not live_network' -q --tb=short --junitxml="$RUNNER_TEMP/step1-results/core.xml" > "$RUNNER_TEMP/step1-results/core.log" 2>&1
          code=$?
          echo "$code" > "$RUNNER_TEMP/step1-results/core-exit.txt"
          tail -100 "$RUNNER_TEMP/step1-results/core.log"
          test "$code" -le 1
      - name: Execute unchanged 25-case V2 and distinguish measurement from quality
        if: always()
        run: |
          test -x .venv/bin/python
          set +e
          timeout 900 .venv/bin/python -m scripts.run_project_context_quality_v2_gate --output "$RUNNER_TEMP/step1-results/v2.json" > "$RUNNER_TEMP/step1-results/v2.log" 2>&1
          code=$?
          echo "$code" > "$RUNNER_TEMP/step1-results/v2-exit.txt"
          tail -80 "$RUNNER_TEMP/step1-results/v2.log"
          .venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'step1-results/v2.json'
          report=json.loads(path.read_text())
          assert report['validation']['case_count']==25, report.get('validation')
          assert len(report['results'])==25
          print('V2 completed all 25 cases; quality verdict is recorded separately, not relabelled PASS.')
          PY
      - name: Preserve candidate, baseline and all diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr211-step1-${{ github.run_id }}
          path: ${{ runner.temp }}/step1-results/
          retention-days: 30
          if-no-files-found: error
