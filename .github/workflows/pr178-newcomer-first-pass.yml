name: PR178 newcomer first pass

on:
  push:
    branches: [fix/context-first-project-reads]
    paths: [.github/workflows/pr178-newcomer-first-pass.yml]

permissions:
  contents: write

env:
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  first-pass:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Run 30 first calls with host-planned scope and no lookup hints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.run_project_docs_self_host_gate import LiveCase, run

          root = Path('.')
          questions_doc = json.loads((root / 'experiments/onboarding-30/questions.json').read_text())
          scope_doc = json.loads((root / 'experiments/onboarding-30/host-scope-plan-20260907.json').read_text())
          scopes = {row['id']: row['scope'] for row in scope_doc['plan']}
          questions = questions_doc['questions']
          assert {row['id'] for row in questions} == set(scopes)
          live = tuple(LiveCase(
              case_id=row['id'], question=row['question'], relevant_paths=(),
              lookup_queries=(), scope=scopes[row['id']],
          ) for row in questions)
          result = run(cases=live, negative_cases=())
          rows = []
          for question, observed in zip(questions, result['results'], strict=True):
              payload = observed['payload']
              public = {key: value for key, value in payload.items() if key != 'diagnostics'}
              checks = {
                  'source_count_le_3': len(public.get('sources') or []) <= 3,
                  'estimated_tokens_le_800': not isinstance(public.get('estimated_tokens'), int) or public['estimated_tokens'] <= 800,
                  'answer_supported_not_true': public.get('answer_supported') is not True,
                  'edit_ready_not_true': public.get('edit_ready') is not True,
              }
              rows.append({
                  'id': question['id'],
                  'question': question['question'],
                  'scope': scopes[question['id']],
                  'request_lookup_queries': [],
                  'payload': public,
                  'safety_checks': checks,
                  'failed_safety_checks': [key for key, value in checks.items() if not value],
              })
          violations = [
              {'id': row['id'], 'failed': row['failed_safety_checks']}
              for row in rows if row['failed_safety_checks']
          ]
          output = {
              'schema': 'docatlas-onboarding-first-pass-v2',
              'runtime_anchor': '01f7b43afb00ead4a151099b9b11c0a27b94eafe',
              'questions_source': 'experiments/onboarding-30/questions.json',
              'scope_plan': 'experiments/onboarding-30/host-scope-plan-20260907.json',
              'lookup_hints_used': False,
              'summary': {
                  'count': len(rows),
                  'ok': sum(row['payload'].get('status') == 'ok' for row in rows),
                  'insufficient': sum(row['payload'].get('status') == 'insufficient_evidence' for row in rows),
                  'max_tokens': max((row['payload'].get('estimated_tokens') or 0) for row in rows),
                  'max_sources': max(len(row['payload'].get('sources') or []) for row in rows),
                  'safety_violations': violations,
              },
              'rows': rows,
          }
          path = root / 'experiments/onboarding-30/published-head-first-pass-20260907.json'
          path.write_text(json.dumps(output, ensure_ascii=False, indent=2) + '\n')
          assert len(rows) == 30
          print('NEWCOMER_SUMMARY=' + json.dumps(output['summary'], ensure_ascii=False, sort_keys=True))
          PY
      - name: Save first-pass evidence and remove transient workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr178-newcomer-first-pass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/onboarding-30/published-head-first-pass-20260907.json .github/workflows/pr178-newcomer-first-pass.yml
          git diff --cached --check
          git commit -m "test: record scoped newcomer first pass"
          git push origin HEAD:fix/context-first-project-reads
