name: ABC retrieval architecture review
on:
  push:
    branches: [experiment/abc-retrieval-review-20260919]
    paths:
      - .github/workflows/abc-retrieval-review-20260919.yml
      - scripts/abc_retrieval_review_20260919.py
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: 95e61265656283d609bc1328c46c52b2bf1a069e
          path: runtime
      - uses: actions/checkout@v4
        with:
          ref: 95e61265656283d609bc1328c46c52b2bf1a069e
          path: corpus
      - uses: actions/download-artifact@v4
        with:
          name: generic-blind-lookup-pair30
          run-id: 35385533863
          github-token: ${{ github.token }}
          path: input
      - uses: astral-sh/setup-uv@v6
      - name: Install frozen runtime
        working-directory: runtime
        run: uv sync --frozen --extra dev --python 3.12
      - name: Check recorder and source policy
        working-directory: runtime
        run: uv run --frozen --extra dev pytest tests/docs/test_context_capture_integrity.py tests/docs/test_evidence_qualification.py -q
      - name: Install isolated experimental scorer
        working-directory: runtime
        run: uv pip install --python .venv/bin/python 'onnxruntime==1.22.1' 'transformers==4.53.3'
      - name: Compare frozen alternatives
        working-directory: runtime
        env:
          CORPUS: ${{ github.workspace }}/corpus
          ABC_OUT: ${{ runner.temp }}/abc-results
          ABC_INPUT: ${{ github.workspace }}/input/generic-blind-lookup-pair30.json
          TOKENIZERS_PARALLELISM: 'false'
          HF_HUB_DISABLE_XET: '1'
        run: |
          mkdir -p "$ABC_OUT"
          .venv/bin/python -m py_compile ../harness/scripts/abc_retrieval_review_20260919.py
          uv pip freeze --python .venv/bin/python > "$ABC_OUT/environment.txt"
          cp ../harness/scripts/abc_retrieval_review_20260919.py "$ABC_OUT/runner.py"
          PYTHONPATH="$PWD" .venv/bin/python ../harness/scripts/abc_retrieval_review_20260919.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abc-retrieval-review-20260919
          path: |
            ${{ runner.temp }}/abc-results/*.json
            ${{ runner.temp }}/abc-results/*.txt
            ${{ runner.temp }}/abc-results/runner.py
          if-no-files-found: warn
