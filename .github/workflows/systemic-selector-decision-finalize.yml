name: Systemic selector decision finalize

on:
  push:
    branches: [feat/systemic-retrieval-mechanics]
    paths:
      - .github/workflows/systemic-selector-decision-finalize.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCATLAS_OFFLINE: "1"

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/systemic-retrieval-mechanics
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]' 'tiktoken==0.11.0'
      - name: Install blind selector decision control
        run: |
          python scripts/pr186_selector_decision_patch.py
          python -m compileall -q scripts/run_systemic_retrieval_plan_gate.py
          git diff --check
      - name: Re-run complete systemic acceptance
        run: |
          python scripts/run_systemic_retrieval_plan_gate.py \
            --work /tmp/docatlas-systemic-selector \
            --report experiments/finalization/PR186_SYSTEMIC_RETRIEVAL_ACCEPTANCE.json
      - name: Validate selector conclusion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('experiments/finalization/PR186_SYSTEMIC_RETRIEVAL_ACCEPTANCE.json').read_text())
          selection = report['selection']
          decision = selection['production_selector_decision']
          allowed = {
              'NOT_JUSTIFIED_BY_THIS_SAMPLE',
              'BOUNDED_SINGLETON_RESCUE_JUSTIFIED_ON_EXPOSED_SAMPLE',
              'NO_PRODUCTION_SELECTOR_VALIDATED',
          }
          if decision not in allowed:
              raise SystemExit(f'unresolved selector decision: {decision}')
          if selection['projector_failures']:
              raise SystemExit('selector diagnostic projector failures')
          print(json.dumps({
              'decision': decision,
              'exact': selection['exact_recoveries'],
              'blind_recoveries': selection['blind_singleton_recoveries'],
              'blind_losses': selection['blind_singleton_losses'],
              'blind_changes': selection['blind_singleton_changes'],
              'blind_gap': selection['blind_proxy_exact_gap'],
          }, indent=2))
          PY
      - name: Publish decision and consume carrier
        run: |
          rm .github/workflows/systemic-selector-decision-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: finalize blind selector decision'
          git push origin HEAD:feat/systemic-retrieval-mechanics
