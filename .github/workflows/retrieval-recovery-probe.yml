name: Retrieval recovery probe

on:
  push:
    branches: [feat/systemic-retrieval-mechanics]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCATLAS_OFFLINE: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/systemic-retrieval-mechanics
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install probe dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run frozen pydantic probe
        run: python scripts/retrieval_recovery_probe.py
