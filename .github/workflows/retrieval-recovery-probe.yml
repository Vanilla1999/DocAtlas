name: Retrieval recovery probe

on:
  push:
    branches: [feat/systemic-retrieval-mechanics]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCATLAS_OFFLINE: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/systemic-retrieval-mechanics
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install probe dependencies
        run: python -m pip install -e '.[dev]' 'tiktoken==0.11.0'
      - name: Run systemic retrieval regressions
        run: |
          python -m pytest -q \
            tests/test_retrieval_diversity_policy.py \
            tests/test_active_fts_projection.py \
            tests/test_parent_child_index.py \
            tests/test_retrieval_features.py \
            tests/docs/test_subject_binding_strength.py \
            tests/docs/test_project_answer_contract_v2.py \
            tests/docs/test_project_answer_contract_v3.py \
            tests/docs/test_question_plan_v4.py
          python -m compileall -q docmancer tests
          git diff --check
      - name: Run all frozen evidence-quality rows
        run: python scripts/retrieval_recovery_probe.py
