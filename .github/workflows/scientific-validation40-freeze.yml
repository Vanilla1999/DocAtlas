name: Scientific validation40 source freeze
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths:
      - .github/workflows/scientific-validation40-freeze.yml
      - eval/scientific_validation40/source_plan.json
permissions: {contents: read}
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: psf/black, ref: acd6198877ced2d8126b9b3958bb17f4a65ef0d1, path: ext/black}
      - uses: actions/checkout@v4
        with: {repository: python-poetry/poetry, ref: 6de19222e44a948bc64f215ea3539b93ecf08719, path: ext/poetry}
      - uses: actions/checkout@v4
        with: {repository: Textualize/textual, ref: 06dbeef4bb70fb718236aa418ed658ef4667a126, path: ext/textual}
      - uses: actions/checkout@v4
        with: {repository: vitejs/vite, ref: e9078f865cdff6bed77cd729214a7e2868f126b5, path: ext/vite}
      - uses: actions/checkout@v4
        with: {repository: eslint/eslint, ref: 3c0b7c6e1fe2dec778b97a996018126f22d437ae, path: ext/eslint}
      - name: Copy exactly planned source files and hash them
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          root=Path.cwd(); plan=json.loads((root/'eval/scientific_validation40/source_plan.json').read_text())
          out=Path(__import__('os').environ['RUNNER_TEMP'])/'validation40-freeze'; sources=out/'sources'; rows=[]
          for family in plan['families']:
              checkout=root/'ext'/family['id']
              for rel in family['paths']:
                  src=checkout/rel
                  if not src.is_file(): raise SystemExit(f'missing planned source: {family["id"]}:{rel}')
                  data=src.read_bytes(); dst=sources/family['id']/rel; dst.parent.mkdir(parents=True,exist_ok=True); dst.write_bytes(data)
                  rows.append({
                      'family':family['id'],'repo':family['repo'],'commit':family['commit'],'license':family['license'],
                      'path':rel,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'lines':data.count(b'\n')+1,
                  })
          manifest={'schema_version':1,'source_plan_sha256':hashlib.sha256((root/'eval/scientific_validation40/source_plan.json').read_bytes()).hexdigest(),'sources':rows}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scientific-validation40-frozen-sources
          path: ${{ runner.temp }}/validation40-freeze
