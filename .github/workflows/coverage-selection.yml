name: Evidence coverage selector comparison
on:
  pull_request:
    paths:
      - 'docmancer/docs/application/coverage_selection.py'
      - 'docmancer/docs/application/facet_selection.py'
      - 'docmancer/docs/application/section_compression.py'
      - 'docmancer/docs/application/model_context_packing.py'
      - 'eval/packing_selection_integration.py'
      - 'eval/compare_packing_selection.py'
      - '.github/workflows/coverage-selection.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: coverage-selection-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        suite: [v40, new16, fresh8, semantic12, preservation8]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Freeze data and exact current code, not obsolete selector implementation
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/coverage-evidence"
          git fetch -q origin 6f85081df32d88634b362bce99570236068ff619 --depth=1
          git diff --exit-code 6f85081df32d88634b362bce99570236068ff619 HEAD -- \
            eval/prepared_model_comparison40 eval/adaptive_gap_holdout \
            eval/fresh_dialogues/fixtures eval/fresh_dialogues/oracle \
            eval/semantic_sufficiency_holdout eval/semantic_preservation_holdout pyproject.toml uv.lock
          git rev-parse HEAD > "$RUNNER_TEMP/coverage-evidence/head.txt"
          python -m compileall -q docmancer eval/packing_selection_integration.py eval/compare_packing_selection.py
          git archive HEAD docmancer eval/packing_selection_integration.py eval/compare_packing_selection.py \
            eval/coverage_selection_integration.py eval/semantic_preservation_integration.py \
            .github/workflows/coverage-selection.yml | gzip > "$RUNNER_TEMP/coverage-evidence/tested-source.tar.gz"
      - name: Build actual installed package; provision only the unchanged MiniLM
        run: docker build -f eval/minilm_sections.Dockerfile -t docatlas-packed .
      - name: Current fixed, prior facet and guarded v2 through public MCP; same-response packing
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -uo pipefail
          failed=0
          for policy in fixed facet-guarded-v1 facet-guarded-lexical-v2; do
            name="packed-$policy"
            docker run --name "$name" --network none --cpus=2 \
              --memory=1000000000 --memory-swap=1000000000 \
              -e TESTED_SHA="$(git rev-parse HEAD)" -e HF_HUB_OFFLINE=1 \
              -v "$RUNNER_TEMP/coverage-evidence:/evidence" --entrypoint /opt/venv/bin/python \
              docatlas-packed -I /repo/eval/packing_selection_integration.py \
              --repo /repo --work /tmp/packing-study --out "/evidence/$SUITE/$policy" \
              --model /model --qa-model /unused-qa --suite "$SUITE" --policy "$policy"
            rc=$?
            docker inspect "$name" > "$RUNNER_TEMP/coverage-evidence/$policy-container.json"
            echo "$rc" > "$RUNNER_TEMP/coverage-evidence/$policy-exit.txt"
            if [ "$rc" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: packing-${{ matrix.suite }}-${{ github.run_id }}
          path: ${{ runner.temp }}/coverage-evidence/
          retention-days: 30
          if-no-files-found: error
  compare:
    needs: paired
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Download only controls executed at this exact revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/arms" "$RUNNER_TEMP/comparison"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'packing-*' --dir "$RUNNER_TEMP/arms"
      - name: Required-witness gate, exact reference binding, then same-packet token savings
        run: |
          python eval/compare_packing_selection.py --artifacts "$RUNNER_TEMP/arms" --out "$RUNNER_TEMP/comparison"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: packing-comparison-${{ github.run_id }}
          path: ${{ runner.temp }}/comparison/
          retention-days: 30
          if-no-files-found: error
