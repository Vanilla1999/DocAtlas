name: Evidence coverage selector comparison
on:
  pull_request:
    paths:
      - 'docmancer/docs/application/coverage_selection.py'
      - 'eval/coverage_selection_integration.py'
      - '.github/workflows/coverage-selection.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: coverage-selection-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        suite: [v40, new16, fresh8]
        policy: [fixed, adaptive-gap-b1-v1, mmr-budget-v1, facet-cover-v1, facet-guarded-v1]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Freeze exact source; no corpus or gold rewriting
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/coverage-evidence"
          git fetch -q origin 6a1b3fac7f8607d7d5f62bc6374db7c093a1a5b9 --depth=1
          git fetch -q origin 2376217843bb2ac236195f9ccb05f7bba257c256 --depth=1
          git diff --exit-code 6a1b3fac7f8607d7d5f62bc6374db7c093a1a5b9 HEAD -- eval/prepared_model_comparison40 eval/adaptive_gap_holdout pyproject.toml uv.lock
          git diff --exit-code 2376217843bb2ac236195f9ccb05f7bba257c256 HEAD -- eval/fresh_dialogues/fixtures eval/fresh_dialogues/oracle
          git rev-parse HEAD > "$RUNNER_TEMP/coverage-evidence/head.txt"
          python -m compileall -q docmancer eval/coverage_selection_integration.py
          git archive HEAD docmancer eval/coverage_selection_integration.py .github/workflows/coverage-selection.yml | gzip > "$RUNNER_TEMP/coverage-evidence/tested-source.tar.gz"
      - name: Build exact installed wheel and provision pinned MiniLM
        run: docker build -f eval/minilm_sections.Dockerfile -t docatlas-coverage .
      - name: Public MCP, real SQLite and local MiniLM; offline, hard 1 GB
        env:
          SUITE: ${{ matrix.suite }}
          POLICY: ${{ matrix.policy }}
        run: |
          set +e
          docker run --name coverage --network none --cpus=2 --memory=1000000000 --memory-swap=1000000000 \
            -e TESTED_SHA="$(git rev-parse HEAD)" -e HF_HUB_OFFLINE=1 \
            -v "$RUNNER_TEMP/coverage-evidence:/evidence" --entrypoint /opt/venv/bin/python \
            docatlas-coverage -I /repo/eval/coverage_selection_integration.py \
            --repo /repo --work /tmp/coverage-study --out /evidence/run --model /model \
            --suite "$SUITE" --policy "$POLICY"
          rc=$?
          docker inspect coverage > "$RUNNER_TEMP/coverage-evidence/container.json"
          echo "$rc" > "$RUNNER_TEMP/coverage-evidence/exit-code.txt"
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coverage-${{ matrix.suite }}-${{ matrix.policy }}-${{ github.run_id }}
          path: ${{ runner.temp }}/coverage-evidence/
          retention-days: 30
          if-no-files-found: error
  compare:
    needs: paired
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download this run's paired evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/arms" "$RUNNER_TEMP/comparison"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'coverage-*' --dir "$RUNNER_TEMP/arms"
      - name: Accuracy first, token cost second; never average away a lost fact
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])/'arms'
          policies = ('fixed','adaptive-gap-b1-v1','mmr-budget-v1','facet-cover-v1','facet-guarded-v1')
          summaries, rows, missing, pools = {}, {}, [], []
          for suite in ('v40','new16','fresh8'):
              for policy in policies:
                  folder = root/f'coverage-{suite}-{policy}-{os.environ["GITHUB_RUN_ID"]}'/'run'
                  key = suite+'/'+policy
                  if not (folder/'SUMMARY.json').exists():
                      missing.append(key); continue
                  summaries[key] = json.loads((folder/'SUMMARY.json').read_text())
                  assert summaries[key]['head'] == os.environ['TESTED_SHA'], 'mixed commit results'
                  rows[key] = {r['case_id']: r for r in json.loads((folder/'ASSESSMENTS.json').read_text())}
              if any(suite+'/'+p not in rows for p in policies): continue
              for policy in policies[1:]:
                  assert rows[suite+'/fixed'].keys() == rows[suite+'/'+policy].keys()
              for cid, base in rows[suite+'/fixed'].items():
                  for policy in policies[1:]:
                      other = rows[suite+'/'+policy][cid]
                      if base['candidate_fingerprint'] != other['candidate_fingerprint']:
                          pools.append({'suite':suite,'case':cid,'policy':policy})
                      assert base['question'] == other['question'] and base['search_question'] == other['search_question']
          aggregates, losses = {}, {}
          for policy in policies:
              items = [r for key, group in rows.items() if key.endswith('/'+policy) for r in group.values()]
              aggregates[policy] = {'cases':len(items),
                  'complete_documented':sum(r['passed'] for r in items if r['answerability']!='unanswerable'),
                  'documented_cases':sum(r['answerability']!='unanswerable' for r in items),
                  'retained_facts':sum(c['covered'] for r in items for c in r['claims']),
                  'required_facts':sum(len(r['claims']) for r in items),
                  'strict_negatives_passed':sum(r['passed'] for r in items if r['answerability']=='unanswerable'),
                  'model_visible_tokens':sum(r.get('tokens',0) for r in items),
                  'prepared_input_tokens':sum(r.get('prepared_input_tokens',0) for r in items),
                  'runtime_errors':sum(r['runtime_error'] for r in items),
                  'integrity_errors':sum(not r['integrity'] for r in items),
                  'seconds_total':sum(r['seconds'] for r in items)}
              losses[policy] = []
              for suite in ('v40','new16','fresh8'):
                  if suite+'/'+policy not in rows: continue
                  for reference in ('fixed','adaptive-gap-b1-v1'):
                      if suite+'/'+reference not in rows: continue
                      for cid, a in rows[suite+'/'+reference].items():
                          if a['answerability']=='unanswerable': continue
                          b=rows[suite+'/'+policy][cid]
                          old={c['id'] for c in a['claims'] if c['covered']}
                          new={c['id'] for c in b['claims'] if c['covered']}
                          if old-new:
                              losses[policy].append({'suite':suite,'case':cid,'reference':reference,'lost_facts':sorted(old-new)})
          eligible=[p for p in policies[2:] if not missing and not pools and not losses[p]
                    and aggregates[p]['cases']==64 and not aggregates[p]['runtime_errors']
                    and not aggregates[p]['integrity_errors']]
          best=min(eligible,key=lambda p:(-aggregates[p]['complete_documented'], -aggregates[p]['retained_facts'],
                   aggregates[p]['model_visible_tokens'],aggregates[p]['seconds_total'])) if eligible else None
          result={'head':os.environ['TESTED_SHA'],'summaries':summaries,'aggregate':aggregates,'fact_losses':losses,'missing_arms':missing,
                  'candidate_pool_mismatches':pools,'eligible_new_policies':eligible,'recommended_by_evidence_gate':best,
                  'provider_usage':None,'answer_generation_tested':False,'all_suites_are_known_regressions':True,
                  'default_promoted':False}
          out=Path(os.environ['RUNNER_TEMP'])/'comparison'/'PAIRED.json'
          out.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({k:v for k,v in result.items() if k!='summaries'},ensure_ascii=False,indent=2))
          assert not missing and not pools, 'Incomplete or unmatched paired experiment'
          assert eligible, 'No non-regressing candidate: keep experimental, do not promote'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coverage-comparison-${{ github.run_id }}
          path: ${{ runner.temp }}/comparison/
          retention-days: 30
          if-no-files-found: error
