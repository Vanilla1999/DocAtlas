name: Evidence coverage selector comparison
on:
  pull_request:
    paths:
      - 'docmancer/docs/application/coverage_selection.py'
      - 'eval/coverage_selection_integration.py'
      - 'eval/compare_coverage_selection.py'
      - '.github/workflows/coverage-selection.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: coverage-selection-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        suite: [v40, new16, fresh8]
        policy: [facet-bundled-cover-v1]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Freeze inputs and shared implementation before comparing against archived controls
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/coverage-evidence"
          git fetch -q origin 95c7bf4bedeefa98a565ec44c83b5df0aa7c526d --depth=1
          git diff --exit-code 95c7bf4bedeefa98a565ec44c83b5df0aa7c526d HEAD -- eval/prepared_model_comparison40 eval/adaptive_gap_holdout eval/fresh_dialogues/fixtures eval/fresh_dialogues/oracle pyproject.toml uv.lock eval/minilm_sections.Dockerfile docmancer/docs/application/section_compression.py docmancer/docs/interfaces/mcp/context_tools.py
          git rev-parse HEAD > "$RUNNER_TEMP/coverage-evidence/head.txt"
          python -m compileall -q docmancer eval/coverage_selection_integration.py eval/compare_coverage_selection.py
          git archive HEAD docmancer eval/coverage_selection_integration.py eval/compare_coverage_selection.py .github/workflows/coverage-selection.yml | gzip > "$RUNNER_TEMP/coverage-evidence/tested-source.tar.gz"
      - name: Build exact installed wheel and provision pinned MiniLM
        run: docker build -f eval/minilm_sections.Dockerfile -t docatlas-coverage .
      - name: Public MCP, real SQLite and local MiniLM; offline, hard 1 GB
        env:
          SUITE: ${{ matrix.suite }}
          POLICY: ${{ matrix.policy }}
        run: |
          set +e
          docker run --name coverage --network none --cpus=2 --memory=1000000000 --memory-swap=1000000000 \
            -e TESTED_SHA="$(git rev-parse HEAD)" -e HF_HUB_OFFLINE=1 \
            -v "$RUNNER_TEMP/coverage-evidence:/evidence" --entrypoint /opt/venv/bin/python \
            docatlas-coverage -I /repo/eval/coverage_selection_integration.py \
            --repo /repo --work /tmp/coverage-study --out /evidence/run --model /model \
            --suite "$SUITE" --policy "$POLICY"
          rc=$?
          docker inspect coverage > "$RUNNER_TEMP/coverage-evidence/container.json"
          echo "$rc" > "$RUNNER_TEMP/coverage-evidence/exit-code.txt"
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coverage-${{ matrix.suite }}-${{ matrix.policy }}-${{ github.run_id }}
          path: ${{ runner.temp }}/coverage-evidence/
          retention-days: 30
          if-no-files-found: error
  compare:
    needs: paired
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reuse immutable prior arms and download this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/arms" "$RUNNER_TEMP/comparison"
          gh run download 40219786995 --repo "$GITHUB_REPOSITORY" --pattern 'coverage-*' --dir "$RUNNER_TEMP/arms"
          gh run download 40221157968 --repo "$GITHUB_REPOSITORY" --pattern 'coverage-*' --dir "$RUNNER_TEMP/arms"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'coverage-*' --dir "$RUNNER_TEMP/arms"
      - name: Compare every preserved fact, actual scored pool, and frozen input hashes
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python eval/compare_coverage_selection.py --artifacts "$RUNNER_TEMP/arms" \
            --out "$RUNNER_TEMP/comparison" --head "$TESTED_SHA" --run "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coverage-comparison-${{ github.run_id }}
          path: ${{ runner.temp }}/comparison/
          retention-days: 30
          if-no-files-found: error
