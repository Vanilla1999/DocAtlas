name: TEMP finalize clean DocAtlas 1.3.1 release state

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: finalize-release-state-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCMANCER_OFFLINE: "1"
  UV_VERSION: "0.9.25"

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'p0/repair-release-state-1.3.1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: p0/repair-release-state-1.3.1
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Materialize final semantic tree
        run: python scripts/finalize_release_state_repair.py

      - name: Refresh lockfile
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv lock

      - name: Install validation dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install build "hatchling<1.27"

      - name: Run focused release and recovery review gates
        shell: bash
        run: |
          pytest -q \
            tests/test_release_state_repair.py \
            tests/test_patch_release_identity.py \
            tests/test_release_gate.py \
            tests/docs/test_user_facing_docs_branding.py \
            tests/docs/test_python_module_policy_and_manifest.py \
            tests/test_source_search_edit_readiness.py
          python scripts/run_recovery_contract_gate.py
          python scripts/run_recovery_mutation_gate.py
          python scripts/check_python_module_size.py
          python -m compileall -q docmancer scripts tests
          git diff --check

          test "$(find .github/workflows -maxdepth 1 -type f -name 'materialize-*.yml' | wc -l)" -eq 0
          test "$(find scripts -maxdepth 1 -type f -name 'materialize_*.py' | wc -l)" -eq 0
          test ! -e .github/workflows/finalize-release-state-repair.yml
          test ! -e .github/workflows/repair-release-state-1.3.1.yml
          test ! -e scripts/finalize_release_state_repair.py
          grep -qx '__version__ = "1.3.1"' docmancer/_version.py
          grep -q 'environment: release-current' .github/workflows/publish.yml

      - name: Build and gate exact 1.3.1 candidate
        run: |
          rm -rf dist
          python -m build
          python scripts/release_gate.py --manifest dist/release-manifest.json

      - name: Commit only the clean semantic repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo '::error::no semantic repair diff'; exit 1; }
          git commit -m "fix: repair and clean the DocAtlas 1.3.1 release state"
          git push origin HEAD:p0/repair-release-state-1.3.1
