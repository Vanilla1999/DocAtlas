name: Finalization request flow identity trace

on:
  push:
    branches: [fix/context-first-project-reads-finalization]
    paths: [.github/workflows/finalization-request-flow-tdd.yml]

permissions:
  contents: read

env:
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads-finalization
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python .github/scripts/finalization_request_flow_patch.py
      - name: Trace raw and packed chunk identities
        shell: bash
        run: |
          python - <<'PY'
          import json
          from copy import deepcopy
          from unittest.mock import patch
          from docmancer.docs.interfaces.mcp import context_tools
          from eval.project_context_quality_v2_protocol import load_cases
          from scripts.run_project_docs_self_host_gate import LiveCase, run

          case = next(c for c in load_cases() if c['id'] == 'v2-natural-request-flow')
          captured = []
          original = context_tools.project_docs_context
          raw_rows = []

          def observe(**kwargs):
              captured.append(deepcopy(kwargs.get('retrieval') or {}))
              return original(**kwargs)

          # Capture production gateway calls by wrapping the dispatcher class method
          # indirectly through ProjectDocsService._tagged results is unnecessary:
          # internal diagnostics already records all retrieved stable identities.
          with patch.object(context_tools, 'project_docs_context', observe):
              result = run(cases=(LiveCase(
                  case_id=case['id'], question=case['question'], relevant_paths=(),
                  lookup_queries=tuple(case['lookup_queries']), scope=case['scope'],
              ),), negative_cases=())
          retrieval = captured[-1]
          diagnostics = ((retrieval.get('retrieval_diagnostics') or {}).get('project_docs') or {})
          print('DIAGNOSTICS=' + json.dumps(diagnostics, ensure_ascii=False, sort_keys=True))
          print('PACK=' + json.dumps([{
              'path': c.get('path') or c.get('source'),
              'section': c.get('section') or c.get('parent_title'),
              'chunk_index': c.get('chunk_index'),
              'stable_chunk_id': c.get('stable_chunk_id'),
              'parent_logical_id': c.get('parent_logical_id'),
              'line_start': c.get('line_start'),
              'ids': c.get('retrieval_query_ids') or [],
          } for c in retrieval.get('context_pack') or []], ensure_ascii=False, sort_keys=True))
          PY
