name: Finalization raw audited identity trace

on:
  push:
    branches: [fix/context-first-project-reads-finalization]
    paths: [.github/workflows/finalization-request-flow-tdd.yml]

permissions:
  contents: read

env:
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads-finalization
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python .github/scripts/finalization_request_flow_patch.py
      - name: Trace raw audited identities
        shell: bash
        run: |
          python - <<'PY'
          import json
          from copy import deepcopy
          from unittest.mock import patch
          from docmancer.retrieval.dispatch import RetrievalDispatcher
          from docmancer.docs.interfaces.mcp import context_tools
          from eval.project_context_quality_v2_protocol import load_cases
          from scripts.run_project_docs_self_host_gate import LiveCase, run

          audited = {
              'get_docs_context question project_path lookup_queries module_path scope',
              'retrieval gateway filtered project chunks',
              'selection maximizes distinct visible query coverage',
          }
          raw = []
          captured = []
          original_dispatch = RetrievalDispatcher.run
          original_projection = context_tools.project_docs_context
          def trace_dispatch(self, query, **kwargs):
              result = original_dispatch(self, query, **kwargs)
              if query in audited:
                  raw.append({'query': query, 'chunks': [{
                      'rank': i,
                      'path': (c.metadata or {}).get('project_doc_path') or c.source,
                      'heading_path': (c.metadata or {}).get('heading_path'),
                      'chunk_index': c.chunk_index,
                      'stable_chunk_id': (c.metadata or {}).get('stable_chunk_id'),
                      'parent_logical_id': (c.metadata or {}).get('parent_logical_id'),
                      'line_start': (c.metadata or {}).get('line_start'),
                      'tokens': (c.metadata or {}).get('token_estimate'),
                      'text': c.text,
                  } for i,c in enumerate(result.chunks, 1)]})
              return result
          def observe(**kwargs):
              captured.append(deepcopy(kwargs.get('retrieval') or {}))
              return original_projection(**kwargs)
          case = next(c for c in load_cases() if c['id'] == 'v2-natural-request-flow')
          with patch.object(RetrievalDispatcher, 'run', trace_dispatch), patch.object(context_tools, 'project_docs_context', observe):
              run(cases=(LiveCase(case_id=case['id'], question=case['question'], relevant_paths=(), lookup_queries=tuple(case['lookup_queries']), scope=case['scope']),), negative_cases=())
          print('RAW=' + json.dumps(raw, ensure_ascii=False, sort_keys=True))
          print('PACK=' + json.dumps([{
              'path': c.get('path') or c.get('source'),
              'section': c.get('section') or c.get('parent_title'),
              'stable_chunk_id': c.get('stable_chunk_id'),
              'parent_logical_id': c.get('parent_logical_id'),
              'line_start': c.get('line_start'),
              'ids': c.get('retrieval_query_ids') or [],
          } for c in captured[-1].get('context_pack') or []], ensure_ascii=False, sort_keys=True))
          PY
