name: Finalization request-flow variant trace

on:
  push:
    branches: [fix/context-first-project-reads-finalization]
    paths: [.github/workflows/finalization-request-flow-tdd.yml]

permissions:
  contents: read

env:
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads-finalization
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python .github/scripts/finalization_request_flow_patch.py
      - name: Trace Application orchestration variants
        shell: bash
        run: |
          python - <<'PY'
          import json
          from unittest.mock import patch
          import docmancer.docs.application.docs_context_projection as dcp
          from docmancer.docs.interfaces.mcp import context_tools
          from eval.project_context_quality_v2_protocol import load_cases, evaluate_case
          from scripts.run_project_docs_self_host_gate import LiveCase, run

          rows=[]
          original=dcp._qualified_fragments
          def observe(source, **kwargs):
              variants=original(source, **kwargs)
              if 'Application orchestration' in str(source.get('section') or ''):
                  rows.append({
                      'raw_len': len(kwargs.get('raw_snippet') or ''),
                      'query_ids': sorted(kwargs.get('query_ids') or ()),
                      'variants': [{
                          'len': len(v.get('snippet') or ''),
                          'ids': sorted(dcp.qualified_query_ids((v,))),
                          'snippet': v.get('snippet'),
                      } for v in variants[:20]],
                  })
              return variants
          case=next(c for c in load_cases() if c['id']=='v2-natural-request-flow')
          with patch.object(dcp,'_qualified_fragments',observe):
              result=run(cases=(LiveCase(case_id=case['id'],question=case['question'],relevant_paths=(),lookup_queries=tuple(case['lookup_queries']),scope=case['scope']),),negative_cases=())
          payload=result['results'][0]['payload']
          print('VARIANTS='+json.dumps(rows,ensure_ascii=False,sort_keys=True))
          print('PUBLIC='+json.dumps({'sources':payload.get('sources'),'obligations':evaluate_case(case,payload)['obligations'],'estimated_tokens':payload.get('estimated_tokens')},ensure_ascii=False,sort_keys=True))
          PY
