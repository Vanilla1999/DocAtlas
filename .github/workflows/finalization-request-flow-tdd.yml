name: Finalization request flow projection trace

on:
  push:
    branches: [fix/context-first-project-reads-finalization]
    paths: [.github/workflows/finalization-request-flow-tdd.yml]

permissions:
  contents: read

env:
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads-finalization
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python .github/scripts/finalization_request_flow_patch.py
      - name: Trace projection diagnostics
        shell: bash
        run: |
          python - <<'PY'
          import json
          from copy import deepcopy
          from unittest.mock import patch
          from docmancer.docs.interfaces.mcp import context_tools
          from eval.project_context_quality_v2_protocol import load_cases, evaluate_case
          from scripts.run_project_docs_self_host_gate import LiveCase, run

          captured = []
          original = context_tools.project_docs_context
          def observe(**kwargs):
              result = original(**kwargs)
              captured.append({
                  'retrieval': deepcopy(kwargs.get('retrieval') or {}),
                  'projection': deepcopy(result[0]),
              })
              return result
          case = next(c for c in load_cases() if c['id'] == 'v2-natural-request-flow')
          with patch.object(context_tools, 'project_docs_context', observe):
              result = run(cases=(LiveCase(
                  case_id=case['id'], question=case['question'], relevant_paths=(),
                  lookup_queries=tuple(case['lookup_queries']), scope=case['scope'],
              ),), negative_cases=())
          payload = result['results'][0]['payload']
          verdict = evaluate_case(case, payload)
          retrieval = captured[-1]['retrieval']
          diag = ((retrieval.get('retrieval_diagnostics') or {}).get('docs_context_projection') or {})
          print('DIAG=' + json.dumps(diag, ensure_ascii=False, sort_keys=True))
          print('PUBLIC=' + json.dumps({
              'estimated_tokens': payload.get('estimated_tokens'),
              'covered': payload.get('covered_query_ids') or [],
              'missing': payload.get('missing_query_ids') or [],
              'sources': [{'path': s.get('path_or_url'), 'section': s.get('section'), 'snippet': s.get('snippet')} for s in payload.get('sources') or []],
              'obligations': verdict['obligations'],
          }, ensure_ascii=False, sort_keys=True))
          PY
