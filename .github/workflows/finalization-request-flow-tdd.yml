name: Finalization request flow allocation trace

on:
  push:
    branches: [fix/context-first-project-reads-finalization]
    paths: [.github/workflows/finalization-request-flow-tdd.yml]

permissions:
  contents: read

env:
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads-finalization
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python .github/scripts/finalization_request_flow_patch.py
      - name: Trace raw audited lanes and bounded context pack
        shell: bash
        run: |
          python - <<'PY'
          import json
          from copy import deepcopy
          from unittest.mock import patch
          from docmancer.retrieval.dispatch import RetrievalDispatcher
          from docmancer.docs.interfaces.mcp import context_tools
          from eval.project_context_quality_v2_protocol import evaluate_case, load_cases
          from scripts.run_project_docs_self_host_gate import LiveCase, run

          case = next(c for c in load_cases() if c['id'] == 'v2-natural-request-flow')
          raw = []
          captured = []
          dispatcher_run = RetrievalDispatcher.run
          project_context = context_tools.project_docs_context

          def trace_dispatch(self, query, **kwargs):
              result = dispatcher_run(self, query, **kwargs)
              if query in {
                  'get_docs_context question project_path lookup_queries module_path scope',
                  'retrieval gateway filtered project chunks',
                  'selection maximizes distinct visible query coverage',
              }:
                  raw.append({
                      'query': query,
                      'limit': kwargs.get('limit'),
                      'budget': kwargs.get('budget'),
                      'chunks': [{
                          'rank': rank,
                          'path': (chunk.metadata or {}).get('project_doc_path') or chunk.source,
                          'chunk_index': chunk.chunk_index,
                          'text': chunk.text,
                          'tokens': (chunk.metadata or {}).get('token_estimate'),
                      } for rank, chunk in enumerate(result.chunks, 1)],
                  })
              return result

          def observe(**kwargs):
              captured.append(deepcopy(kwargs.get('retrieval') or {}))
              return project_context(**kwargs)

          with patch.object(RetrievalDispatcher, 'run', trace_dispatch), patch.object(context_tools, 'project_docs_context', observe):
              result = run(cases=(LiveCase(case_id=case['id'], question=case['question'], relevant_paths=(), lookup_queries=tuple(case['lookup_queries']), scope=case['scope']),), negative_cases=())
          payload = result['results'][0]['payload']
          verdict = evaluate_case(case, payload)
          retrieval = captured[-1]
          pack = [{
              'index': i,
              'path': c.get('path') or c.get('source'),
              'section': c.get('section') or c.get('parent_title'),
              'text': c.get('content') or c.get('snippet'),
              'ids': c.get('retrieval_query_ids') or [],
              'matches': {qid: {
                  'qualified': tr.get('qualified'),
                  'relation': tr.get('relation'),
                  'parent': tr.get('public_parent_query_id'),
                  'coverage_kind': tr.get('coverage_kind'),
                  'derived_from': tr.get('derived_from_query_id'),
              } for qid, tr in (c.get('retrieval_query_matches') or {}).items()},
          } for i, c in enumerate(retrieval.get('context_pack') or [])]
          print('RAW_AUDITED=' + json.dumps(raw, ensure_ascii=False, sort_keys=True))
          print('PACK=' + json.dumps(pack, ensure_ascii=False, sort_keys=True))
          print('PUBLIC=' + json.dumps({
              'sources': payload.get('sources') or [],
              'covered': payload.get('covered_query_ids') or [],
              'missing': payload.get('missing_query_ids') or [],
              'obligations': verdict['obligations'],
          }, ensure_ascii=False, sort_keys=True))
          PY
