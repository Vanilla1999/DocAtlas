name: Finalization request flow GREEN

on:
  push:
    branches: [fix/context-first-project-reads-finalization]
    paths: [.github/workflows/finalization-request-flow-tdd.yml]

permissions:
  contents: write

env:
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads-finalization
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python .github/scripts/finalization_request_flow_patch.py
      - name: Static checks
        run: |
          python -m compileall -q docmancer/docs/domain/documentation_query_plan.py docmancer/docs/application/_project_docs_service_part03.py
          git diff --check
      - name: Request-flow contract
        run: pytest -q tests/docs/test_request_flow_lineage.py
      - name: Neighboring retrieval contracts
        run: |
          pytest -q tests/docs/test_context_projection_boundaries.py tests/docs/test_context7_style_project_chat.py tests/test_docs_service_part03.py tests/docs/test_project_context_service.py tests/docs/test_context_selection.py
          python scripts/run_agent_developer_adversarial_gate.py
      - name: Publish request-flow slice
        run: |
          rm .github/workflows/finalization-request-flow-tdd.yml
          rm .github/scripts/finalization_request_flow_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docmancer/docs/domain/documentation_query_plan.py docmancer/docs/application/_project_docs_service_part03.py .github/workflows/finalization-request-flow-tdd.yml .github/scripts/finalization_request_flow_patch.py
          git diff --cached --check
          git commit -m "fix: preserve public request flow coverage"
          git push origin HEAD:fix/context-first-project-reads-finalization
