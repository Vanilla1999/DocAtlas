name: Finalization request flow aggregate trace

on:
  push:
    branches: [fix/context-first-project-reads-finalization]
    paths: [.github/workflows/finalization-request-flow-tdd.yml]

permissions:
  contents: read

env:
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads-finalization
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python .github/scripts/finalization_request_flow_patch.py
      - name: Trace aggregate candidate order
        shell: bash
        run: |
          python - <<'PY'
          import json
          from unittest.mock import patch
          import docmancer.docs.application._project_docs_service_part03 as p3
          from eval.project_context_quality_v2_protocol import load_cases
          from scripts.run_project_docs_self_host_gate import LiveCase, run

          original_select = p3.select_context_candidates
          traces = []
          def row(c):
              md = c.metadata or {}
              return {
                  'path': md.get('project_doc_path') or c.source,
                  'chunk_index': c.chunk_index,
                  'stable_chunk_id': md.get('stable_chunk_id'),
                  'heading_path': md.get('heading_path'),
                  'tokens': md.get('token_estimate'),
                  'ids': list(md.get('retrieval_query_ids') or ()),
              }
          class TraceList(list):
              def sort(self, *args, **kwargs):
                  super().sort(*args, **kwargs)
                  traces.append({'after_sort': [row(c) for c in self[:30]]})
          def observe(groups):
              value = TraceList(original_select(groups))
              traces.append({'before_sort': [row(c) for c in value[:30]]})
              return value
          case = next(c for c in load_cases() if c['id'] == 'v2-natural-request-flow')
          with patch.object(p3, 'select_context_candidates', observe):
              result = run(cases=(LiveCase(case_id=case['id'], question=case['question'], relevant_paths=(), lookup_queries=tuple(case['lookup_queries']), scope=case['scope']),), negative_cases=())
          print('AGGREGATE=' + json.dumps(traces, ensure_ascii=False, sort_keys=True))
          payload = result['results'][0]['payload']
          print('PUBLIC=' + json.dumps({'covered': payload.get('covered_query_ids'), 'sources': [{'path': s.get('path_or_url'), 'section': s.get('section')} for s in payload.get('sources') or []]}, ensure_ascii=False, sort_keys=True))
          PY
