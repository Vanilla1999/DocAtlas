          end = text.index("\ndef _bounded_recovery_action", start)
          text = text[:start] + "\n" + text[end:]
          write(path, text)
          replace_once(
              path,
              "    if operational_reason in _MODULE_RECOVERY_REASON_CODES:\n"
              "        candidates.sort(\n"
              "            key=lambda action: 0\n"
              "            if isinstance(action, dict) and action.get(\"tool\") == \"docs_status\" else 1\n"
