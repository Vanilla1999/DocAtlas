name: TEMP finalize PR 122

on:
  push:
    branches:
      - p0/recoverable-docs-failures

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: p0/recoverable-docs-failures
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply reviewed integration fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}: {old[:80]!r}")
              write(path, text.replace(old, new, 1))

          recovery_projection = '''"""MCP projection helpers for bounded documentation-failure recovery.

This module only explains failed canonical support. It never grants support and
never replaces a concrete lifecycle/status/user-confirmation recovery with a
semantic rephrase.
"""
from __future__ import annotations

from copy import deepcopy
from typing import Any

from docmancer.docs.application.model_visible_projection import estimate_projection_tokens
from docmancer.docs.application.recovery import build_recovery_diagnosis, recovery_action

_RECOVERY_SUMMARY_KEYS = (
    "documentation_supported", "investigation_allowed", "hard_stop",
    "recovery_origin", "recovery_reason_code", "recovery_disposition",
)


def is_operational_recovery_action(value: Any) -> bool:
    if not isinstance(value, dict):
        return False
    return bool(
        value.get("tool") in {"prepare_docs", "docs_status"}
        or value.get("type") == "ask_user_for_library_docs_source"
        or value.get("requires_confirmation")
    )


def _first_operational_action(payload: dict[str, Any]) -> dict[str, Any] | None:
    candidates = [payload.get("next_action"), *(payload.get("next_actions") or [])]
    return next((item for item in candidates if is_operational_recovery_action(item)), None)


def _clean_string(value: Any) -> str | None:
    text = str(value or "").strip()
    return text or None


def _refresh_estimate(payload: dict[str, Any]) -> None:
    payload["estimated_tokens"] = 0
    for _ in range(3):
        actual = estimate_projection_tokens(payload)
        if payload["estimated_tokens"] == actual:
            break
        payload["estimated_tokens"] = actual


def _attach_recovery_diagnosis(
    payload: dict[str, Any],
    *,
    question: str,
    request: dict[str, Any],
    canonical_selection: Any,
    operational_reason_code: Any = None,
) -> dict[str, Any]:
    if canonical_selection is None:
        return payload
    support = getattr(canonical_selection, "support_decision", None)
    if support is not None and bool(getattr(support, "answer_supported", False)):
        return payload
    diagnosis = build_recovery_diagnosis(
        question,
        canonical_selection,
        operational_reason_code=(
            payload.get("operational_reason_code")
            or operational_reason_code
            or payload.get("reason_code")
        ),
    )
    if not diagnosis:
        return payload

    updated = dict(payload)
    updated.update({
        "documentation_supported": bool(diagnosis.get("documentation_supported")),
        "investigation_allowed": bool(diagnosis.get("investigation_allowed", True)),
        "hard_stop": bool(diagnosis.get("hard_stop")),
        "recovery_origin": str(diagnosis.get("origin") or "selection"),
        "recovery_reason_code": str(diagnosis.get("reason_code") or "support_not_provable"),
        "recovery_disposition": str(diagnosis.get("disposition") or "search_local_source"),
    })

    # Lifecycle/status/user-confirmation recovery is more precise than changing
    # wording. Preserve it even if parser diagnostics would otherwise suggest a
    # rephrase. Authoritative conflicts remain hard stops and do not enter here.
    operational = _first_operational_action(updated)
    if operational is not None and not bool(diagnosis.get("hard_stop")):
        updated.update({
            "recovery_origin": "operational",
            "recovery_reason_code": str(
                updated.get("operational_reason_code") or "operational_recovery_precedence"
            ),
            "recovery_disposition": "use_operational_recovery",
        })
        return updated

    action = recovery_action(
        diagnosis,
        project_path=_clean_string(request.get("project_path")),
        scope=_clean_string(request.get("scope")),
        mode=_clean_string(request.get("mode")),
    )
    if action:
        existing = [
            item for item in updated.get("next_actions") or []
            if isinstance(item, dict) and item != action
        ]
        updated["next_action"] = action
        updated["next_actions"] = [action, *existing]
    return updated


def _recovery_summary(payload: dict[str, Any]) -> dict[str, Any]:
    return {
        key: deepcopy(payload[key])
        for key in _RECOVERY_SUMMARY_KEYS
        if key in payload
    }


def _annotate_recovery_handoff(
    projection: dict[str, Any], recovery: dict[str, Any] | None
) -> None:
    if bool(projection.get("hard_stop")):
        projection.update({
            "disposition": "resolve_authoritative_conflict",
            "edit_ready": False,
            "source_search_status": "blocked",
        })
        _refresh_estimate(projection)
        return
    if not isinstance(recovery, dict):
        return
    if recovery.get("type") == "rephrase_question":
        projection.update({
            "disposition": "rephrase_question",
            "edit_ready": False,
            "source_search_status": "not_required",
            "requires_confirmation": False,
        })
    elif recovery.get("tool") == "code_search":
        projection.update({
            "disposition": "search_local_source",
            "edit_ready": False,
            "source_search_status": "required",
            "requires_confirmation": False,
        })
    _refresh_estimate(projection)


__all__ = [
    "_annotate_recovery_handoff",
    "_attach_recovery_diagnosis",
    "_recovery_summary",
    "is_operational_recovery_action",
]
'''
          write("docmancer/docs/interfaces/mcp/recovery_projection.py", recovery_projection)

          insufficient_projection = '''"""Terminal bounded projection helpers for insufficient documentation evidence."""
from __future__ import annotations

import re
from copy import deepcopy
from typing import Any, Iterable

_SAFE_MISSING_ID_RE = re.compile(r"^[A-Za-z0-9_.:/=-]{1,180}$")
_RECOVERY_SUMMARY_KEYS = (
    "documentation_supported", "investigation_allowed", "hard_stop",
    "recovery_origin", "recovery_reason_code", "recovery_disposition",
)


def bounded_missing_value(value: Any, *, default: str) -> str:
    if isinstance(value, list):
        for item in value:
            text = str(item or "").strip()
            if _SAFE_MISSING_ID_RE.fullmatch(text):
                return text
    return default


def _minimal_rephrase_action(value: Any) -> dict[str, Any] | None:
    if not isinstance(value, dict) or value.get("type") != "rephrase_question":
        return None
    arguments = value.get("arguments_patch") if isinstance(value.get("arguments_patch"), dict) else {}
    question = str(arguments.get("question") or "")[:320]
    if not question:
        return None
    return {
        "tool": "get_docs_context",
        "type": "rephrase_question",
        "arguments_patch": {"question": question},
        "auto_execute": False,
    }


def apply_terminal_insufficient_projection(
    payload: dict[str, Any],
    *,
    kind: Any,
    missing: str,
    original_action: Any,
    support_keys: Iterable[str],
) -> None:
    recovery_summary = {
        key: deepcopy(payload[key])
        for key in _RECOVERY_SUMMARY_KEYS
        if key in payload
    }
    support = {
        key: payload[key]
        for key in support_keys
        if key in payload and key != "reason_code"
    }
    payload.clear()
    payload.update({
        "status": "insufficient_evidence",
        "kind": "docs_answer" if kind == "docs_answer" else "patch_context",
        "missing": [missing],
        "answer_supported": False,
        "answer_available": False,
        "support_status": "insufficient_evidence",
        "estimated_tokens": 0,
        **support,
        **recovery_summary,
    })
    minimal_recovery = _minimal_rephrase_action(original_action)
    if minimal_recovery is not None:
        payload["recommended_next_action"] = minimal_recovery


__all__ = ["apply_terminal_insufficient_projection", "bounded_missing_value"]
'''
