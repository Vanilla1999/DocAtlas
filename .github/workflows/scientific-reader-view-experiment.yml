name: Scientific reader-view experiment
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths:
      - .github/workflows/scientific-reader-view-experiment.yml

permissions:
  contents: read
  actions: read

jobs:
  reader-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OLLAMA_NUM_PARALLEL: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - name: Download frozen original H20 packets
        uses: actions/download-artifact@v4
        with:
          name: retrieval-sealed-holdout20-fast
          path: ${{ runner.temp }}/h20
          github-token: ${{ github.token }}
          repository: Vanilla1999/DocAtlas
          run-id: '35436382180'
      - name: Verify frozen packet bytes
        shell: bash
        run: |
          set -euo pipefail
          echo '3827e944a27a925bf51df092f0d543f50b38f2bcb98ab4404d1eb32622b011ec  ${{ runner.temp }}/h20/base.json' | sha256sum -c -
      - name: Install frozen reader model
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull qwen2.5:1.5b
      - name: Capture model identity
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,subprocess,urllib.request,os
          from pathlib import Path
          def post(path, body):
              req=urllib.request.Request('http://127.0.0.1:11434'+path,data=json.dumps(body).encode(),headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=120) as r:return json.loads(r.read())
          with urllib.request.urlopen('http://127.0.0.1:11434/api/tags',timeout=120) as r:tags=json.loads(r.read())
          model=next(x for x in tags['models'] if x['name'].startswith('qwen2.5:1.5b'))
          show=post('/api/show',{'model':'qwen2.5:1.5b'})
          version=subprocess.run(['ollama','--version'],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,check=True).stdout.strip()
          identity={
              'model':'qwen2.5:1.5b',
              'model_digest':model['digest'],
              'runtime_version':version,
              'chat_template_digest':'sha256:'+hashlib.sha256(str(show.get('template') or '').encode()).hexdigest(),
              'quantization_level':(show.get('details') or {}).get('quantization_level'),
              'family':(show.get('details') or {}).get('family'),
          }
          Path(os.environ['RUNNER_TEMP']).joinpath('model-identity.json').write_text(json.dumps(identity,indent=2,ensure_ascii=False))
          print(json.dumps(identity,indent=2))
          PY
      - name: Run three independent draws per arm and case
        shell: bash
        run: |
          PYTHONPATH="$PWD" uv run --frozen --extra dev python - <<'PY'
          import concurrent.futures,json,os,urllib.request
          from pathlib import Path
          from eval.evidence_quality_v2.reader_experiment import make_reader_record
          from eval.evidence_quality_v2.reader_views import render_reader_view

          root=Path.cwd(); tmp=Path(os.environ['RUNNER_TEMP'])
          source=json.loads((tmp/'h20/base.json').read_text())
          model_identity=json.loads((tmp/'model-identity.json').read_text())
          protocol=json.loads((root/'eval/retrieval_recheck/holdout20_protocol.json').read_text())
          system=protocol['reader']['prompt']
          arms=('raw_json','view_json','view_text')
          jobs=[]
          for case_index,row in enumerate(source['cases']):
              for draw in range(3):
                  rotation=(case_index+draw)%len(arms)
                  order=arms[rotation:]+arms[:rotation]
                  for arm_index,arm in enumerate(order):
                      jobs.append((case_index,draw,arm_index,row,arm))

          def invoke(job):
              case_index,draw,arm_index,row,arm=job
              rendered=render_reader_view(row['public_payload'],mode=arm)
              user='QUESTION:\n'+row['question']+'\n\nCONTEXT:\n'+rendered
              body={'model':'qwen2.5:1.5b','stream':False,'messages':[
                  {'role':'system','content':system},{'role':'user','content':user}],
                  'options':{'temperature':0,'seed':0,'num_predict':160}}
              req=urllib.request.Request('http://127.0.0.1:11434/api/chat',data=json.dumps(body).encode(),headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=300) as response:
                  provider=json.loads(response.read())
              record=make_reader_record(
                  case_id=row['id'],arm=arm,draw=draw,system_prompt=system,
                  question=row['question'],rendered_context=rendered,
                  model_identity=model_identity,provider_response=provider,
              )
              record.update({
                  'case_index':case_index,'arm_order_index':arm_index,
                  'rendered_context_utf8_bytes':len(rendered.encode('utf-8')),
                  'question':row['question'],
                  'packet_sha256':__import__('hashlib').sha256(json.dumps(row['public_payload'],ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest(),
              })
              return record

          records=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
              for record in executor.map(invoke,jobs):
                  records.append(record)
                  content=((record['provider_response'].get('message') or {}).get('content') or '')
                  print(record['case_id'],record['arm'],record['draw'],repr(content[:100]),flush=True)
          records.sort(key=lambda row:(row['case_index'],row['draw'],arms.index(row['arm'])))
          out={
              'schema_version':1,
              'source_packet_sha256':'3827e944a27a925bf51df092f0d543f50b38f2bcb98ab4404d1eb32622b011ec',
              'model_identity':model_identity,
              'system_prompt':system,
              'arms':list(arms),
              'draws_per_arm_case':3,
              'records':records,
          }
          (tmp/'reader-view-experiment.json').write_text(json.dumps(out,indent=2,ensure_ascii=False))
          assert len(records)==20*3*3
          assert all('reused_from' not in row for row in records)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scientific-reader-view-experiment
          path: |
            ${{ runner.temp }}/reader-view-experiment.json
            ${{ runner.temp }}/model-identity.json
            ${{ runner.temp }}/ollama.log
