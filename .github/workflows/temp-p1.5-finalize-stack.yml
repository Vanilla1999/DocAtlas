name: TEMP finalize P1.5 branch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temp-finalize-p1-5
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'p1/p1.5-mixed-evidence-provenance'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: p1/p1.5-mixed-evidence-provenance
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Merge the reviewed P1.4 main boundary
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Install evaluator dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify inherited evidence and materialize P1.5
        run: |
          set -euo pipefail
          python scripts/build_agent_developer_first_divergence.py --check
          python scripts/build_agent_contract_v2_ablation.py --check
          python scripts/run_paraphrase_proofability_gate.py
          python scripts/paraphrase_proofability_self_test.py
          python scripts/run_mixed_evidence_provenance_gate.py --write
          python scripts/run_mixed_evidence_provenance_gate.py
          python scripts/mixed_evidence_provenance_self_test.py
          find .github/workflows -maxdepth 1 -type f -name 'temp-p1.5-*.yml' -delete
          git diff --check
      - name: Commit a carrier-free branch
        run: |
          set -euo pipefail
          git add -A
          python - <<'PY'
          import subprocess

          allowed = {"eval/agent_developer_v1/results/mixed-evidence-provenance.json"}
          changed = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines()
          bad = [
              path for path in changed
              if path not in allowed
              and not path.startswith(".github/workflows/temp-p1.5-")
          ]
          if bad:
              raise SystemExit(f"unexpected P1.5 finalization paths: {bad}")
          PY
          if ! git diff --cached --quiet; then
            git commit -m "chore(p1): materialize P1.5 evidence and remove carriers"
          fi
          git push origin HEAD:p1/p1.5-mixed-evidence-provenance
