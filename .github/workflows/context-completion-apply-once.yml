name: Apply PR221 client follow-up once
on:
  push:
    branches: [fix/compact-context-delivery]
    paths: [.github/workflows/context-completion-apply-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/compact-context-delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/compact-context-delivery
      - name: Apply anchored patch, remove this builder, push without force
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          python - <<'PY'
          import base64,gzip,hashlib,subprocess
          from pathlib import Path
          encoded=''
          # Never apply a truncated or corrupted upload.
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='926e9e1495527238b5adc61a735b4e72ba86bc48c6bec529f7e927df7c71795b'
          Path('/tmp/pr221-followup.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/pr221-followup.patch'],check=True)
          subprocess.run(['git','apply','--index','/tmp/pr221-followup.patch'],check=True)
          PY
          python -m compileall -q docmancer eval/context_delivery_integration.py eval/minilm_sections_integration.py
          git rm .github/workflows/context-completion-apply-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bounded MCP host history, SDK budgets and structural selection pilot'
          git push origin HEAD:refs/heads/fix/compact-context-delivery
