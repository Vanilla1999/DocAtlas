name: Apply PR221 client follow-up once
on:
  push:
    branches: [fix/compact-context-delivery]
    paths: [.github/workflows/context-completion-apply-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/compact-context-delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/compact-context-delivery
      - name: Apply hash-verified product patch without modifying workflow files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          python - <<'PY'
          import base64,gzip,hashlib,subprocess
          from pathlib import Path
          parts=[Path(f'.ci/pr221-completion-{i}.b64') for i in range(4)]
          patch=gzip.decompress(base64.b64decode(''.join(p.read_text() for p in parts),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='926e9e1495527238b5adc61a735b4e72ba86bc48c6bec529f7e927df7c71795b'
          Path('/tmp/pr221-followup.patch').write_bytes(patch)
          args=['git','apply','--exclude=.github/workflows/context-delivery.yml']
          subprocess.run([*args,'--check','/tmp/pr221-followup.patch'],check=True)
          subprocess.run([*args,'--index','/tmp/pr221-followup.patch'],check=True)
          p=Path('docmancer/docs/interfaces/model_context_session.py')
          text=p.read_text()
          old='identity_row = {k: v for k, v in source.items() if k not in {"source_uri", "evidence_id"}}'
          assert text.count(old)==1
          text=text.replace(old,'identity_row = source  # include issued snapshot-bound URI and all provenance')
          old='"unverified_snapshot_response": None if self._snapshot else display["ref"]})'
          assert text.count(old)==1
          text=text.replace(old,'"unverified_snapshot_response": None if self._snapshot and source.get("source_uri")\n                    else [len(self._audit), display["ref"]]})')
          p.write_text(text)
          subprocess.run(['git','add',str(p)],check=True)
          PY
          python -m compileall -q docmancer eval/context_delivery_integration.py eval/minilm_sections_integration.py
          git diff --cached --check
          git diff --exit-code -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bounded MCP host history, SDK budgets and structural selection pilot'
          git push origin HEAD:refs/heads/fix/compact-context-delivery
