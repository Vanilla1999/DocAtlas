name: PR178 final semantic closure

on:
  push:
    branches: [fix/context-first-project-reads]
    paths: [.github/workflows/pr178-final-semantic-closure.yml]

permissions:
  contents: write

env:
  DOCATLAS_OFFLINE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install exact branch dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply already-reviewed transient patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/pr178-quantified-scope-fix.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          body = textwrap.dedent(workflow[start:end])
          exec(compile(body, '<pr178-reviewed-base-patch>', 'exec'), {})
          PY
      - name: Apply semantic authority closure and strengthen regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docmancer/docs/application/docs_context_projection.py')
          text = path.read_text()
          old = '''    while prepared:\n        selected_public_ids = _fully_matched_query_ids(sources) & public_query_id_set\n        selected_canonical_ids = qualified_query_ids(sources) & canonical_intent_query_ids\n        selected_components = {key for source in sources for key in component_witnesses(source, obligations)}\n'''
          new = '''    while prepared:\n        selected_qualified_public_ids = qualified_query_ids(sources) & public_query_id_set\n        selected_public_ids = _fully_matched_query_ids(sources) & public_query_id_set\n        selected_canonical_ids = qualified_query_ids(sources) & canonical_intent_query_ids\n        selected_authoritative_public_ids = {\n            query_id\n            for source in sources\n            if str(source.get("authority") or "supporting").casefold() == "source_of_truth"\n            for query_id in qualified_query_ids((source,))\n            if query_id in public_query_id_set\n        }\n        selected_components = {key for source in sources for key in component_witnesses(source, obligations)}\n'''
          assert text.count(old) == 1, f'while setup drifted: {text.count(old)}'
          text = text.replace(old, new, 1)

          old = '''        component_ids = set(component_witnesses(normalized, obligations))\n        new_components = component_ids - selected_components\n        if not (qualified_ids & eligible_query_ids) and not component_ids:\n            continue\n        if sources and not (new_components or\n            qualified_ids & public_query_id_set - selected_public_ids or\n            qualified_ids & canonical_intent_query_ids - selected_canonical_ids\n        ):\n            continue\n'''
          new = '''        component_ids = set(component_witnesses(normalized, obligations))\n        new_components = component_ids - selected_components\n        if not (qualified_ids & eligible_query_ids) and not component_ids:\n            continue\n        # Once a source-of-truth document already qualifies a fully parsed semantic\n        # question, a lower-authority source may still add a new public direction or\n        # a missing semantic component. It may not become visible merely because its\n        # wording raises lexical match_ratio for a query that is already qualified.\n        # This prevents disclaimer/mention-only notes from masquerading as contract\n        # evidence without globally suppressing honest partial multi-document reads.\n        if (\n            sources\n            and obligations\n            and query_plan.get("component_scope_complete", True)\n            and selected_authoritative_public_ids\n            and str(normalized.get("authority") or "supporting").casefold() != "source_of_truth"\n            and not new_components\n            and not (qualified_ids & public_query_id_set - selected_qualified_public_ids)\n            and not (qualified_ids & canonical_intent_query_ids - selected_canonical_ids)\n        ):\n            continue\n        if sources and not (new_components or\n            qualified_ids & public_query_id_set - selected_public_ids or\n            qualified_ids & canonical_intent_query_ids - selected_canonical_ids\n        ):\n            continue\n'''
          assert text.count(old) == 1, f'admission block drifted: {text.count(old)}'
          path.write_text(text.replace(old, new, 1))

          path = Path('tests/test_docs_service_part03.py')
          text = path.read_text()
          old = '''    assert all(\n        source["path_or_url"] != "docs/note-00.md"\n        for source in payload["sources"]\n    )\n'''
          new = '''    assert payload["sources"][0]["path_or_url"] == "zz-authoritative-plan.md"\n    assert all(\n        not source["path_or_url"].startswith("docs/note-")\n        for source in payload["sources"]\n    ), payload["sources"]\n'''
          assert text.count(old) == 1, f'distractor regression drifted: {text.count(old)}'
          path.write_text(text.replace(old, new, 1))
          PY
          python -m compileall -q docmancer tests scripts eval
          git diff --check
      - name: Prove distractor rejection across process variation
        shell: bash
        run: |
          set -euo pipefail
          for seed in $(seq 0 31); do
            PYTHONHASHSEED="$seed" pytest -q tests/test_docs_service_part03.py::test_project_query_does_not_return_non_project_docs_with_same_terms
          done
      - name: Verify focused contracts and adversarial gate
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/docs/test_quantified_attribute_scope_isolation.py \
            tests/docs/test_project_answer_contract_v2.py \
            tests/docs/test_answer_units_v2.py \
            tests/docs/test_answer_units_v3.py \
            tests/docs/test_docs_context_compound_projection.py \
            tests/docs/test_context7_style_project_chat.py \
            tests/docs/test_host_scope_planning_contract.py \
            tests/docs/test_host_scope_contract.py \
            tests/docs/test_action_packet.py \
            tests/docs/test_mcp_docs_tools_registration.py \
            tests/docs/test_model_visible_projection_part02.py::test_docs_context_covered_facet_uses_only_assigned_witness \
            tests/docs/test_generic_context_workflows.py::test_wider_windows_preserve_contiguous_witnesses_and_table_qualifiers \
            tests/test_docs_service_part03.py::test_project_query_does_not_return_non_project_docs_with_same_terms \
            tests/test_install_cmd.py
          python scripts/run_agent_developer_adversarial_gate.py
      - name: Verify full repository suite
        shell: bash
        run: |
          set -euo pipefail
          pytest -q
          python -m compileall -q docmancer tests scripts eval
          git diff --check
      - name: Publish only after every gate is green
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr178-final-semantic-closure.yml
          rm .github/workflows/pr178-quantified-scope-fix.yml
          rm .github/workflows/pr178-hashseed-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close scoped semantic evidence contracts"
          git push origin HEAD:fix/context-first-project-reads
