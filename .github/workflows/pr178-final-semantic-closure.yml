name: PR178 final semantic closure

on:
  push:
    branches: [fix/context-first-project-reads]
    paths: [.github/workflows/pr178-final-semantic-closure.yml]

permissions:
  contents: write

env:
  DOCATLAS_OFFLINE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install exact branch dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply already-reviewed transient patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/pr178-quantified-scope-fix.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          body = textwrap.dedent(workflow[start:end])
          exec(compile(body, '<pr178-reviewed-base-patch>', 'exec'), {})
          PY
      - name: Apply contract-fact disclaimer proof and strengthen regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docmancer/docs/domain/_answer_units_part02.py')
          text = path.read_text()
          old = '''def _contract_fact_relation_valid(text: str) -> bool:\n    normalized = _normal(text)\n    if _NEGATION_RE.search(text) or re.search(\n        r"\\b(?:obsolete|deprecated|documented|described|mentioned)\\b", normalized,\n    ):\n        return False\n'''
          new = '''def _contract_fact_disclaimer(text: str) -> bool:\n    normalized = _normal(text)\n    return bool(\n        _NEGATION_RE.search(text)\n        or re.search(\n            r"\\b(?:obsolete|deprecated|document(?:ed|s)?|describ(?:ed|es)?|mention(?:ed|s)?)\\b",\n            normalized,\n        )\n    )\n\n\ndef _contract_fact_relation_valid(text: str) -> bool:\n    normalized = _normal(text)\n    if _contract_fact_disclaimer(text):\n        return False\n'''
          assert text.count(old) == 1, f'contract fact helper drifted: {text.count(old)}'
          text = text.replace(old, new, 1)

          old = '''    if obligation.kind == "exact_fact":\n        relation = 2 if (not obligation.attribute or _attribute_present(obligation.attribute, text)) else 0\n        if (\n            obligation.relation == "contract_fact"\n            and _normal(obligation.attribute) == "response contract"\n        ):\n            relation = 3 if relation and _contract_fact_relation_valid(text) else 0\n'''
          new = '''    if obligation.kind == "exact_fact":\n        relation = 2 if (not obligation.attribute or _attribute_present(obligation.attribute, text)) else 0\n        if obligation.relation == "contract_fact":\n            if _contract_fact_disclaimer(text):\n                relation = 0\n            elif _normal(obligation.attribute) == "response contract":\n                relation = 3 if relation and _contract_fact_relation_valid(text) else 0\n'''
          assert text.count(old) == 1, f'exact contract proof drifted: {text.count(old)}'
          path.write_text(text.replace(old, new, 1))

          path = Path('tests/docs/test_answer_units_v3.py')
          text = path.read_text()
          addition = '''\n\ndef test_generic_contract_fact_rejects_disclaimer_mentions_and_negation():\n    question = "What contract governs EvidenceRequirementSet?"\n    contract = build_project_answer_contract(question)\n    obligation = next(\n        row for row in contract.proof_obligations\n        if row.relation == "contract_fact" and row.subject == "EvidenceRequirementSet"\n    )\n    source = {"path": "docs/contract.md", "authority": "source_of_truth"}\n\n    valid_units = extract_answer_units(\n        "EvidenceRequirementSet is a canonical selector input.",\n        include_soft_wrapped_prose=True,\n    )\n    assert best_local_proof(obligation, valid_units, source=source) is not None\n\n    for text in (\n        "Presentation notes mention EvidenceRequirementSet, but this note does not define the acceptance contract.",\n        "EvidenceRequirementSet is mentioned in an obsolete presentation note.",\n    ):\n        units = extract_answer_units(text, include_soft_wrapped_prose=True)\n        assert best_local_proof(obligation, units, source=source) is None\n'''
          assert 'test_generic_contract_fact_rejects_disclaimer_mentions_and_negation' not in text
          path.write_text(text.rstrip() + addition + '\n')

          path = Path('tests/test_docs_service_part03.py')
          text = path.read_text()
          old = '''    assert all(\n        source["path_or_url"] != "docs/note-00.md"\n        for source in payload["sources"]\n    )\n'''
          new = '''    assert payload["sources"][0]["path_or_url"] == "zz-authoritative-plan.md"\n    assert all(\n        not source["path_or_url"].startswith("docs/note-")\n        for source in payload["sources"]\n    ), payload["sources"]\n'''
          assert text.count(old) == 1, f'distractor regression drifted: {text.count(old)}'
          path.write_text(text.replace(old, new, 1))
          PY
          python -m compileall -q docmancer tests scripts eval
          git diff --check
      - name: Prove distractor rejection across isolated processes
        shell: bash
        run: |
          set -euo pipefail
          for seed in $(seq 0 31); do
            PYTHONHASHSEED="$seed" pytest -q tests/test_docs_service_part03.py::test_project_query_does_not_return_non_project_docs_with_same_terms
          done
      - name: Verify focused contracts and adversarial gate
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/docs/test_quantified_attribute_scope_isolation.py \
            tests/docs/test_project_answer_contract_v2.py \
            tests/docs/test_answer_units_v2.py \
            tests/docs/test_answer_units_v3.py \
            tests/docs/test_docs_context_compound_projection.py \
            tests/docs/test_context7_style_project_chat.py \
            tests/docs/test_host_scope_planning_contract.py \
            tests/docs/test_host_scope_contract.py \
            tests/docs/test_action_packet.py \
            tests/docs/test_mcp_docs_tools_registration.py \
            tests/docs/test_model_visible_projection_part02.py::test_docs_context_covered_facet_uses_only_assigned_witness \
            tests/docs/test_generic_context_workflows.py::test_wider_windows_preserve_contiguous_witnesses_and_table_qualifiers \
            tests/test_docs_service_part03.py::test_project_query_does_not_return_non_project_docs_with_same_terms \
            tests/test_install_cmd.py
          python scripts/run_agent_developer_adversarial_gate.py
      - name: Verify full repository suite
        shell: bash
        run: |
          set -euo pipefail
          pytest -q
          python -m compileall -q docmancer tests scripts eval
          git diff --check
      - name: Publish only after every gate is green
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr178-final-semantic-closure.yml
          rm .github/workflows/pr178-quantified-scope-fix.yml
          rm .github/workflows/pr178-hashseed-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close scoped semantic evidence contracts"
          git push origin HEAD:fix/context-first-project-reads
