name: Temporary PR192 final hygiene validation
on:
  push:
    branches: [fix/pr192-ci-hygiene]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      DOCATLAS_OFFLINE: '1'
      DOCATLAS_AUTO_VECTORS: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/pr192-ci-hygiene
          fetch-depth: 30
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python - <<'PY'
          import subprocess, sys, tomllib
          data = tomllib.load(open('pyproject.toml','rb'))
          deps = [x for x in data['project']['dependencies'] if not x.startswith(('tiktoken','fastembed'))]
          deps += data['project']['optional-dependencies']['dev']
          subprocess.run([sys.executable, '-m', 'pip', 'install', '-q', *deps], check=True)
          PY
      - name: Full docs suite
        run: python -m pytest -q tests/docs
      - name: Compile and diff check
        run: |
          python -m compileall -q docmancer
          git diff --check
      - name: Commit clean hygiene delta to PR branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/tmp-pr192-final-hygiene-validation.yml .github/workflows/tmp-pr192-hygiene-export.yml
          git add docmancer/docs/domain/evidence_qualification.py \
                  docmancer/docs/application/_docs_context_projection_core.py \
                  tests/diagnostic_labels.direct_questions.json \
                  tests/diagnostic_labels.v2_acceptance_gaps.json \
                  .github/workflows/tmp-pr192-final-hygiene-validation.yml \
                  .github/workflows/tmp-pr192-hygiene-export.yml
          git commit -m 'fix: close PR192 docs suite hygiene gaps'
          git push origin HEAD:fix/version-evidence-skill-validation
          git push origin --delete fix/pr192-ci-hygiene || true
