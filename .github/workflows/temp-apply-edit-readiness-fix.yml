name: TEMP apply edit-readiness repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCMANCER_OFFLINE: "1"

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'p0/repair-release-state-1.3.1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: p0/repair-release-state-1.3.1
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Materialize the source-handoff authorization fix
        run: |
          python scripts/apply_edit_readiness_fix.py
          rm scripts/apply_edit_readiness_fix.py

      - name: Install validation dependencies
        run: python -m pip install -e ".[dev]"

      - name: Prove legitimate and fail-closed paths
        run: |
          pytest -q \
            tests/test_source_search_edit_readiness.py \
            tests/test_docs_service_part03.py::test_project_query_does_not_return_non_project_docs_with_same_terms \
            tests/docs/test_model_visible_projection.py::test_partial_navigational_docs_result_fails_closed
          python scripts/run_agent_developer_adversarial_gate.py
          python scripts/run_agent_developer_adversarial_mutation_gate.py
          python scripts/run_recovery_contract_gate.py
          python scripts/run_recovery_mutation_gate.py
          python scripts/check_python_module_size.py
          python -m compileall -q docmancer tests
          git diff --check

      - name: Commit the validated semantic fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docmancer/docs/interfaces/mcp/context_tools.py \
            docmancer/docs/interfaces/mcp/recovery_projection.py \
            tests/test_source_search_edit_readiness.py \
            tests/test_docs_service_part03.py \
            scripts/apply_edit_readiness_fix.py
          git diff --cached --check
          git diff --cached --quiet && { echo '::error::semantic fix produced no diff'; exit 1; }
          git commit -m "fix(agent): authorize only host-owned patch source handoffs"
          git push origin HEAD:p0/repair-release-state-1.3.1
