name: Finalization projection size cleanup
# final rerun after formatting-only reduction
on:
  push:
    branches: [fix/context-first-project-reads-finalization]
    paths: [.github/workflows/finalization-size-cleanup.yml]

permissions:
  contents: write

env:
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads-finalization
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python .github/scripts/finalization_size_patch.py
      - name: Validate size and behavior
        run: |
          python scripts/check_python_module_size.py
          python -m compileall -q docmancer/docs/application/docs_context_projection.py
          git diff --check
          pytest -q tests/docs/test_request_flow_lineage.py tests/docs/test_context_projection_boundaries.py tests/docs/test_model_visible_projection.py tests/docs/test_model_visible_projection_part02.py
      - name: Publish size cleanup
        run: |
          rm .github/workflows/finalization-size-cleanup.yml
          rm .github/scripts/finalization_size_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docmancer/docs/application/docs_context_projection.py .github/workflows/finalization-size-cleanup.yml .github/scripts/finalization_size_patch.py
          git diff --cached --check
          git commit -m "refactor: keep docs context projection within size budget"
          git push origin HEAD:fix/context-first-project-reads-finalization
