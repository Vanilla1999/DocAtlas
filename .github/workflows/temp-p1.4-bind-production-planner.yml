name: TEMP bind P1.4 to the existing production planner module

on:
  push:
    branches: [p1/p1.4-paraphrase-proofability]
    paths:
      - .github/workflows/temp-p1.4-bind-production-planner.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: p1/p1.4-paraphrase-proofability
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Add a bounded fail-closed production planner resolver
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("scripts/run_paraphrase_proofability_gate.py"),
              Path("scripts/paraphrase_proofability_self_test.py"),
          ]
          old = 'planner_path=REPO_ROOT / "docmancer" / "docs" / "domain" / "project_answer_contract.py",'
          helper = '''

          def _production_planner_path() -> Path:
              candidates = (
                  REPO_ROOT / "docmancer" / "docs" / "domain" / "project_answer_contract.py",
                  REPO_ROOT / "docmancer" / "docs" / "domain" / "question_planning.py",
                  REPO_ROOT / "docmancer" / "docs" / "domain" / "question_plan.py",
                  REPO_ROOT / "docmancer" / "docs" / "domain" / "answer_completeness.py",
              )
              existing = [path for path in candidates if path.is_file()]
              if not existing:
                  raise RuntimeError("no reviewed production question-planning module exists")
              return existing[0]
          '''
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if "def _production_planner_path()" not in text:
                  marker = '\n\nREPO_ROOT = Path(__file__).resolve().parents[1]\n'
                  if marker not in text:
                      raise SystemExit(f"planner resolver insertion anchor missing: {path}")
                  text = text.replace(marker, marker + helper, 1)
              if old in text:
                  text = text.replace(old, "planner_path=_production_planner_path(),", 1)
              elif "planner_path=_production_planner_path()," not in text:
                  raise SystemExit(f"planner path call anchor missing: {path}")
              path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/temp-p1.4-bind-production-planner.yml
          python -m compileall -q \
            scripts/run_paraphrase_proofability_gate.py \
            scripts/paraphrase_proofability_self_test.py
          git diff --check
      - name: Commit ordinary source only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(p1): bind P1.4 to a reviewed planner module"
          git push origin HEAD:p1/p1.4-paraphrase-proofability
