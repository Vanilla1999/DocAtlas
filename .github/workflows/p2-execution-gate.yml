name: P2.2B/C execution gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCATLAS_OFFLINE: "1"

jobs:
  p2-execution-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install evaluator dependencies
        run: python -m pip install -e ".[dev]"
      - name: Enforce preregistered execution authorization
        run: |
          set -euo pipefail
          python scripts/verify_product_truth_protocol.py
          python scripts/run_product_truth_positive_controls.py
          python scripts/run_product_truth_task_pack.py
          python scripts/run_product_truth_comparative_harness.py
          python scripts/run_product_truth_execution_gate.py --write
          python scripts/product_truth_execution_gate_self_test.py
          python -m compileall -q \
            eval/product_truth_v1/execution_gate.py \
            scripts/run_product_truth_execution_gate.py \
            scripts/product_truth_execution_gate_self_test.py
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p2-execution-gate
          path: eval/product_truth_v1/results/execution-gate.json
          if-no-files-found: error
