name: TEMP resolve P1.4 build_requirements location

on:
  push:
    branches: [p1/p1.4-paraphrase-proofability]
    paths:
      - .github/workflows/temp-p1.4-resolve-build-requirements.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: p1/p1.4-paraphrase-proofability
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Bind evaluator to one reviewed production function
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("eval/agent_developer_v1/paraphrase_robustness.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("import hashlib\n", "import hashlib\nimport importlib\n", 1)
          old = '''from docmancer.docs.application.evidence_selection import (
              build_requirements,
              project_docs_selection_config,
              select_evidence,
          )
          '''
          new = '''from docmancer.docs.application.evidence_selection import (
              project_docs_selection_config,
              select_evidence,
          )


          def _resolve_build_requirements():
              for module_name in (
                  "docmancer.docs.application.evidence_selection",
                  "docmancer.docs.domain.answer_completeness",
                  "docmancer.docs.domain.project_answer_contract",
                  "docmancer.docs.domain.question_planning",
              ):
                  try:
                      module = importlib.import_module(module_name)
                  except ModuleNotFoundError:
                      continue
                  value = getattr(module, "build_requirements", None)
                  if callable(value):
                      return value
              raise RuntimeError("reviewed production build_requirements function is missing")


          build_requirements = _resolve_build_requirements()
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif "def _resolve_build_requirements():" not in text:
              raise SystemExit("P1.4 build_requirements import anchor missing")
          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/temp-p1.4-resolve-build-requirements.yml
          python -m compileall -q eval/agent_developer_v1/paraphrase_robustness.py
          git diff --check
      - name: Commit ordinary evaluator source only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(p1): resolve the reviewed requirement builder"
          git push origin HEAD:p1/p1.4-paraphrase-proofability
