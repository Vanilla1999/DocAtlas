name: PR178 final runtime publication

on:
  push:
    branches: [fix/context-first-project-reads]
    paths: [.github/workflows/pr178-final-runtime-publication.yml]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCATLAS_OFFLINE: "1"

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify source ancestry and install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 866f65e48f4aafb3039da4f765396ddf38f85e0d HEAD
          python -m pip install -e ".[dev]"
      - name: Apply reviewed bounded-projection patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/pr178-patcher.py
          python /tmp/pr178-patcher.py
          python -m compileall -q docmancer/docs/application/docs_context_projection.py docmancer/docs/domain/context_windows.py docmancer/docs/domain/query_terms.py
          git diff --check
      - name: Verify regression and existing contracts
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/docs/test_context_preservation.py \
            tests/docs/test_context_projection_boundaries.py \
            tests/docs/test_exact_document_fallback_context.py \
            tests/test_docs_service_part03.py \
            tests/docs/test_docs_context_compound_projection.py \
            tests/docs/test_context7_style_project_chat.py
          pytest -q tests/docs/test_generic_context_workflows.py -k 'generic_workflow_facts or stale_health'
      - name: Publish runtime fix and remove transient workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr178-final-runtime-publication.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve exact witnesses during bounded projection [skip ci]"
          git push origin HEAD:fix/context-first-project-reads
