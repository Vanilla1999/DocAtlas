name: Global evidence final acceptance
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths:
      - .github/workflows/global-evidence-final-acceptance.yml
      - .github/global-evidence-transfer-*.b64

permissions:
  contents: write

jobs:
  final-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: 12c27cd29bab87cd53c87aece22f71575b20cfc9
          path: candidate-runtime
      - name: Checkout exact baseline
        uses: actions/checkout@v4
        with:
          ref: ef39e12ab60fd69f8052079847d9e0ca24a843b4
          path: baseline-runtime
      - name: Checkout frozen Generic/external corpus
        uses: actions/checkout@v4
        with:
          ref: 95e61265656283d609bc1328c46c52b2bf1a069e
          path: frozen-corpus
      - uses: astral-sh/setup-uv@v6

      - name: Reconstruct frozen transfer24 before any run
        shell: bash
        run: |
          set -euo pipefail
          cat             .github/global-evidence-transfer-00.b64             .github/global-evidence-transfer-01.b64             .github/global-evidence-transfer-02.b64             .github/global-evidence-transfer-03.b64             .github/global-evidence-transfer-04.b64 > "$RUNNER_TEMP/transfer.b64"
          base64 -d "$RUNNER_TEMP/transfer.b64" > "$RUNNER_TEMP/transfer.tar.gz"
          echo "11e7c60419eb20c8b87fe7cb0a999b1a6eba5a33578f37515e1befc69972d96e  $RUNNER_TEMP/transfer.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/transfer"
          tar -xzf "$RUNNER_TEMP/transfer.tar.gz" -C "$RUNNER_TEMP/transfer"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"transfer/eval/global_evidence_tdd/transfer24"
          freeze=json.loads((root/"freeze.json").read_text())
          assert freeze["state"] == "frozen_before_candidate_output"
          assert freeze["candidate_base"] == "ef39e12ab60fd69f8052079847d9e0ca24a843b4"
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha(root/"cases.json") == freeze["cases_sha256"]
          assert sha(root/"protocol.json") == freeze["protocol_sha256"]
          assert sha(root/"source-manifest.json") == freeze["source_manifest_sha256"]
          for rel, digest in freeze["source_hashes"].items():
              assert sha(root/"sources"/rel) == digest, rel
          print("transfer24 freeze verified", freeze["case_count"], freeze["projects"])
          PY

      - name: Sync exact runtimes
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline-runtime && uv sync --frozen --extra dev)
          (cd candidate-runtime && uv sync --frozen --extra dev)

      - name: Native H04 regression on frozen corpus
        shell: bash
        run: |
          set -euo pipefail
          cd candidate-runtime
          PYTHONPATH="$PWD" uv run --frozen --extra dev python - <<'PY'
          import hashlib, json, os, tempfile
          from pathlib import Path
          from eval.evidence_quality_v2.runtime import write_project, isolated_service, index_project
          from eval.project_context_quality.capture_public_context import capture_public_call
          from docmancer.docs.application.model_visible_projection_helpers import docs_context_budget_tokens

          root=Path.cwd(); frozen=Path(os.environ["GITHUB_WORKSPACE"])/"frozen-corpus"
          eq=frozen/"eval/evidence_quality_v2"
          manifest=json.loads((eq/"source-manifest.json").read_text())
          cases={c["id"]:c for c in json.loads((root/"eval/retrieval_recheck/holdout20_questions.json").read_text())["cases"]}
          case=cases["H04"]
          docs={}
          for row in manifest["sources"]:
              if row["project"]!="fastapi": continue
              p=eq/"sources"/"fastapi"/row["path"]; data=p.read_bytes()
              assert hashlib.sha256(data).hexdigest()==row["sha256"]
              docs[row["path"]]=data.decode("utf-8")
          with tempfile.TemporaryDirectory(prefix="h04-final-") as raw:
              base=Path(raw); project_root=base/"corpus"/"fastapi"; write_project(project_root,docs)
              with isolated_service(base/"state") as (service,config):
                  index_project(service,config,project_root)
                  cap=capture_public_call(service,{"project_path":str(project_root),"scope":"all","question":case["question"]})
              payload=cap["public_payload"]
          visible="\n".join(str(s.get("snippet") or "") for s in payload.get("sources") or ())
          required=(("allow_methods","Defaults to `['GET']`"),("allow_headers","Defaults to `[]`"),("expose_headers","Defaults to `[]`"),("max_age","Defaults to `600`"))
          missing=[name for name,value in required if not (name in visible and value in visible)]
          out={"missing":missing,"tokens":docs_context_budget_tokens(payload),"sources":len(payload.get("sources") or ()),
               "answer_supported":payload.get("answer_supported"),"answer_available":payload.get("answer_available"),"edit_ready":payload.get("edit_ready")}
          Path(os.environ["RUNNER_TEMP"]).joinpath("h04.json").write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          assert not missing
          assert out["tokens"] <= 800 and out["sources"] <= 3
          assert out["answer_supported"] is out["answer_available"] is out["edit_ready"] is False
          PY

      - name: Target30 paired public capture
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline-runtime && PYTHONPATH="$PWD" uv run --frozen --extra dev python scripts/run_v13_v15_diagnostic30.py             --project-root "$GITHUB_WORKSPACE/baseline-runtime"             --questions "$GITHUB_WORKSPACE/candidate-runtime/eval/project_context_quality/v13_v15_questions.json"             --output "$RUNNER_TEMP/target-base.json")
          (cd candidate-runtime && PYTHONPATH="$PWD" uv run --frozen --extra dev python scripts/run_v13_v15_diagnostic30.py             --project-root "$GITHUB_WORKSPACE/baseline-runtime"             --questions "$GITHUB_WORKSPACE/candidate-runtime/eval/project_context_quality/v13_v15_questions.json"             --output "$RUNNER_TEMP/target-cand.json")
          python - <<'PY'
          import json, os
          from pathlib import Path
          t=Path(os.environ["RUNNER_TEMP"])
          def load(name):
              d=json.loads((t/name).read_text())
              assert d["execution_errors"]==0
              return {r["id"]:r["capture"]["public_payload"] for r in d["cases"]}
          a=load("target-base.json"); b=load("target-cand.json"); assert set(a)==set(b)
          def vis(p):
              return [(s.get("path_or_url"),s.get("line_start"),s.get("line_end"),s.get("snippet")) for s in p.get("sources") or ()]
          changed=[i for i in a if vis(a[i])!=vis(b[i])]
          out={"cases":len(b),"changed_visible_ids":changed}
          (t/"target-compare.json").write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY

      - name: Create Generic30 runner
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/run_generic30.py" <<'PY'
          from __future__ import annotations
          import argparse, json, os
          from pathlib import Path
          p=argparse.ArgumentParser()
          p.add_argument("--project-root",type=Path,required=True); p.add_argument("--questions",type=Path,required=True); p.add_argument("--output",type=Path,required=True)
          a=p.parse_args()
          os.environ["DOCATLAS_OFFLINE"]="1"; os.environ["DOCATLAS_AUTO_VECTORS"]="0"; os.environ["DOCATLAS_HOME"]=str(a.output.parent/(a.output.stem+"-home"))
          from docmancer.agent import DocmancerAgent
          from docmancer.core.config import DocmancerConfig
          from docmancer.docs.registry import LibraryRegistry
          from docmancer.docs.service import DocsJobTracker, LibraryDocsService
          from eval.project_context_quality.capture_public_context import capture_public_call
          from docmancer.docs.application.model_visible_projection_helpers import docs_context_budget_tokens
          cfg=DocmancerConfig(); cfg.index.db_path=str(a.output.parent/(a.output.stem+".sqlite")); cfg.index.extracted_dir=str(a.output.parent/(a.output.stem+"-extracted"))
          service=LibraryDocsService(config=cfg,config_source="explicit",registry=LibraryRegistry(cfg.index.db_path),agent=DocmancerAgent(config=cfg),job_tracker=DocsJobTracker())
          sync=service.sync_project_docs(str(a.project_root.resolve()),with_vectors=False)
          if sync.status!="success": raise RuntimeError(sync.status)
          rows=[]
          for case in json.loads(a.questions.read_text())["cases"]:
              for lane in ("root_only","with_lookups"):
                  req={"project_path":str(a.project_root.resolve()),"scope":"project","question":case["question"]}
                  if lane=="with_lookups": req["lookup_queries"]=list(case.get("lookup_queries") or ())
                  payload=capture_public_call(service,req)["public_payload"]
                  assert docs_context_budget_tokens(payload)<=800 and len(payload.get("sources") or ())<=3
                  rows.append({"id":case["id"],"lane":lane,"payload":payload})
                  print(case["id"],lane,payload.get("status"),payload.get("estimated_tokens"),flush=True)
          a.output.write_text(json.dumps({"rows":rows},ensure_ascii=False,indent=2)+"\n")
          PY

      - name: Generic30 paired frozen-corpus capture
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline-runtime && PYTHONPATH="$PWD" uv run --frozen --extra dev python "$RUNNER_TEMP/run_generic30.py"             --project-root "$GITHUB_WORKSPACE/frozen-corpus"             --questions "$GITHUB_WORKSPACE/candidate-runtime/eval/project_context_quality/generic_blind_lookup_pair30_questions.json"             --output "$RUNNER_TEMP/generic-base.json")
          (cd candidate-runtime && PYTHONPATH="$PWD" uv run --frozen --extra dev python "$RUNNER_TEMP/run_generic30.py"             --project-root "$GITHUB_WORKSPACE/frozen-corpus"             --questions "$GITHUB_WORKSPACE/candidate-runtime/eval/project_context_quality/generic_blind_lookup_pair30_questions.json"             --output "$RUNNER_TEMP/generic-cand.json")
          python - <<'PY'
          import json, os
          from pathlib import Path
          t=Path(os.environ["RUNNER_TEMP"])
          def load(name):
              return {(r["id"],r["lane"]):r["payload"] for r in json.loads((t/name).read_text())["rows"]}
          a=load("generic-base.json"); b=load("generic-cand.json"); assert set(a)==set(b)==set(a)
          def vis(p): return [(s.get("path_or_url"),s.get("line_start"),s.get("line_end"),s.get("snippet")) for s in p.get("sources") or ()]
          changed=[{"id":i,"lane":lane} for (i,lane) in a if vis(a[(i,lane)])!=vis(b[(i,lane)])]
          out={"calls":len(b),"changed_visible":changed}
          (t/"generic-compare.json").write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY

      - name: External80 paired semantic acceptance
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline-runtime && PYTHONPATH="$PWD" uv run --frozen --extra dev python - <<'PY'
          from pathlib import Path
          from eval.evidence_quality_v2.run import run
          import os
          run(Path(os.environ["RUNNER_TEMP"])/"ext-base")
          PY
          )
          (cd candidate-runtime && PYTHONPATH="$PWD" uv run --frozen --extra dev python - <<'PY'
          from pathlib import Path
          from eval.evidence_quality_v2.run import run
          import os
          t=Path(os.environ["RUNNER_TEMP"]); run(t/"ext-cand",fixture_output=t/"ext-base")
          PY
          )
          python - <<'PY'
          import json, os
          from pathlib import Path
          t=Path(os.environ["RUNNER_TEMP"]); A=json.loads((t/"ext-base/rows.json").read_text()); B=json.loads((t/"ext-cand/rows.json").read_text())
          a={r["id"]:r for r in A if r.get("variant")=="A-current"}; b={r["id"]:r for r in B if r.get("variant")=="A-current"}; assert set(a)==set(b)
          def ok(r): return r.get("assessment",{}).get("context_sufficiency")=="sufficient" and not r.get("safety_errors")
          wins=[i for i in a if ok(b[i]) and not ok(a[i])]; losses=[i for i in a if ok(a[i]) and not ok(b[i])]
          families=sorted({i.split("-",1)[0] for i in wins})
          out={"baseline_sufficient":sum(ok(x) for x in a.values()),"candidate_sufficient":sum(ok(x) for x in b.values()),
               "wins":wins,"losses":losses,"win_families":families,
               "baseline_safety":sum(bool(x.get("safety_errors")) for x in a.values()),"candidate_safety":sum(bool(x.get("safety_errors")) for x in b.values())}
          (t/"external80-compare.json").write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          assert not losses, losses
          assert out["candidate_safety"] <= out["baseline_safety"]
          assert len(families) >= 3, out
          PY

      - name: Transfer24 paired frozen acceptance
        shell: bash
        run: |
          set -euo pipefail
          TRANSFER="$RUNNER_TEMP/transfer/eval/global_evidence_tdd/transfer24"
          RUNNER="$RUNNER_TEMP/transfer/run_transfer24.py"
          (cd baseline-runtime && PYTHONPATH="$PWD" uv run --frozen --extra dev python "$RUNNER"             --transfer-root "$TRANSFER" --fixture-root "$RUNNER_TEMP/t24-fixture" --state-root "$RUNNER_TEMP/t24-base-state" --output "$RUNNER_TEMP/t24-base.json" --label baseline)
          (cd candidate-runtime && PYTHONPATH="$PWD" uv run --frozen --extra dev python "$RUNNER"             --transfer-root "$TRANSFER" --fixture-root "$RUNNER_TEMP/t24-fixture" --state-root "$RUNNER_TEMP/t24-cand-state" --output "$RUNNER_TEMP/t24-cand.json" --label candidate)
          python - <<'PY'
          import json, os
          from pathlib import Path
          t=Path(os.environ["RUNNER_TEMP"]); A=json.loads((t/"t24-base.json").read_text()); B=json.loads((t/"t24-cand.json").read_text())
          a={r["id"]:r for r in A["rows"] if r["answerability"]=="within_budget"}; b={r["id"]:r for r in B["rows"] if r["answerability"]=="within_budget"}; assert set(a)==set(b)
          def ok(r): return r["assessment"]["context_sufficiency"]=="sufficient" and not r["safety_errors"]
          wins=[i for i in a if ok(b[i]) and not ok(a[i])]; losses=[i for i in a if ok(a[i]) and not ok(b[i])]
          out={"baseline_sufficient":sum(ok(x) for x in a.values()),"candidate_sufficient":sum(ok(x) for x in b.values()),
               "wins":wins,"losses":losses,"baseline_safety":A["summary"]["safety_violations"],"candidate_safety":B["summary"]["safety_violations"],
               "decision":"transfer_gain" if wins and not losses else "transfer_not_established" if not losses else "transfer_regression"}
          (t/"transfer24-compare.json").write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          assert not losses, losses
          assert out["candidate_safety"] <= out["baseline_safety"]
          PY

      - name: Build final machine-readable summary
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          t=Path(os.environ["RUNNER_TEMP"])
          def load(name): return json.loads((t/name).read_text())
          out={"schema_version":1,"baseline_sha":"ef39e12ab60fd69f8052079847d9e0ca24a843b4","candidate_sha":"12c27cd29bab87cd53c87aece22f71575b20cfc9",
               "h04":load("h04.json"),"target30":load("target-compare.json"),"generic30":load("generic-compare.json"),
               "external80":load("external80-compare.json"),"transfer24":load("transfer24-compare.json")}
          (t/"global-evidence-final-summary.json").write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY

      - name: Upload final acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-evidence-final-acceptance
          path: |
            ${{ runner.temp }}/h04.json
            ${{ runner.temp }}/target-base.json
            ${{ runner.temp }}/target-cand.json
            ${{ runner.temp }}/target-compare.json
            ${{ runner.temp }}/generic-base.json
            ${{ runner.temp }}/generic-cand.json
            ${{ runner.temp }}/generic-compare.json
            ${{ runner.temp }}/ext-base/summary.json
            ${{ runner.temp }}/ext-cand/summary.json
            ${{ runner.temp }}/external80-compare.json
            ${{ runner.temp }}/t24-base.json
            ${{ runner.temp }}/t24-cand.json
            ${{ runner.temp }}/transfer24-compare.json
            ${{ runner.temp }}/global-evidence-final-summary.json

      - name: Remove temporary acceptance transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Vanilla1999"
          git config user.email "41183994+Vanilla1999@users.noreply.github.com"
          git rm .github/workflows/global-evidence-final-acceptance.yml
          git rm .github/global-evidence-transfer-00.b64
          git rm .github/global-evidence-transfer-01.b64
          git rm .github/global-evidence-transfer-02.b64
          git rm .github/global-evidence-transfer-03.b64
          git rm .github/global-evidence-transfer-04.b64
          git commit -m "chore: remove global evidence acceptance staging"
          git push origin HEAD:fix/v13-v15-evidence-pipeline
