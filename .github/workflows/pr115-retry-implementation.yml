name: PR115 corrected implementation

on:
  push:
    branches:
      - p0/docatlas-migrate-home

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message != 'Implement reviewed migrate-home contract'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: p0/docatlas-migrate-home
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Reuse reviewed patch with corrected marker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pr115-migrate-home-implementation.yml').read_text(encoding='utf-8')
          opener = "          python - <<'PY'\n"
          start = workflow.index(opener) + len(opener)
          end = workflow.index("\n          PY\n", start)
          embedded = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in embedded.splitlines()
          )
          script = script.replace(
              "marker = '\\n\\n__all__ = [\"clear_index_cmd\"]\\n'",
              "marker = '\\n\\n__all__ = [\"clear_index_cmd\"]'",
          )
          exec(compile(script, '<reviewed-pr115-patch>', 'exec'))
          PY

          python -m compileall -q docmancer
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_config_resolution.py tests/test_cli.py tests/test_support_surface_policy.py tests/docs/test_documented_cli_contract.py

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docmancer tests
          git commit -m 'Implement reviewed migrate-home contract'
          git push origin HEAD:p0/docatlas-migrate-home
