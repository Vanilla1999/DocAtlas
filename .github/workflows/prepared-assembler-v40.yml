name: Prepared parent V40 paired integration
on:
  push:
    branches: [fix/main-flow-compact-evidence]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOCATLAS_OFFLINE: "1"
      DOCATLAS_AUTO_VECTORS: "0"
      DOCATLAS_REGISTRY_API_URL: "http://127.0.0.1:1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compare 40 public context pairs
        run: |
          python -m eval.structural_assembly40.run \
            --run-dir "$RUNNER_TEMP/prepared-v40" \
            --work-dir "$RUNNER_TEMP/prepared-v40-work"
      - name: Analyze context sources and logs
        if: success()
        run: python -m eval.structural_assembly40.analyze --run-dir "$RUNNER_TEMP/prepared-v40"
      - name: Preserve raw results including failed runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prepared-v40-${{ github.sha }}
          path: ${{ runner.temp }}/prepared-v40/
          retention-days: 14
          if-no-files-found: warn
