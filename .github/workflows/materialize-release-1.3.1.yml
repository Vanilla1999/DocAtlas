name: TEMP materialize release 1.3.1

on:
  push:
    branches: [p0/release-1.3.1]
    paths:
      - .github/workflows/materialize-release-1.3.1.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCMANCER_OFFLINE: "1"
  UV_VERSION: "0.9.25"

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: p0/release-1.3.1
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Materialize release identity
        run: python scripts/materialize_release_1_3_1.py

      - name: Refresh lockfile from source identity
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv lock

      - name: Remove one-shot carrier before validation
        run: |
          rm scripts/materialize_release_1_3_1.py
          rm .github/workflows/materialize-release-1.3.1.yml

      - name: Install and validate release candidate
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install build "hatchling<1.27"
          pytest -q \
            tests/test_patch_release_identity.py \
            tests/test_release_gate.py \
            tests/docs/test_user_facing_docs_branding.py \
            tests/docs/test_python_module_policy_and_manifest.py
          python scripts/check_python_module_size.py
          python -m compileall -q docmancer scripts tests
          git diff --check
          rm -rf dist
          python -m build
          python scripts/release_gate.py --manifest dist/release-manifest.json

      - name: Commit semantic release tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::release materializer produced no diff"
            exit 1
          fi
          git commit -m "chore: prepare DocAtlas 1.3.1 release"
          git push origin HEAD:p0/release-1.3.1
