name: P1 exact-head validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: P1 evidence stage being validated
        required: true
        default: p1.2
        type: string

permissions:
  contents: read

concurrency:
  group: p1-exact-head-${{ github.ref }}-${{ inputs.stage || 'pr' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCMANCER_OFFLINE: "1"

jobs:
  core:
    name: p1-core (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/ -m "not advanced and not live and not live_network" -q

  platform:
    name: p1-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: |
          python -m compileall -q docmancer eval scripts
          doc-atlas --version
          python scripts/docs_mcp_stdio_smoke.py

  advanced:
    name: p1-advanced-security
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run permanent production-path gates
        run: |
          pytest tests/ -m advanced -q
          python scripts/run_legacy_contract_gate.py
          python scripts/run_recovery_contract_gate.py
          python scripts/run_recovery_mutation_gate.py
          python scripts/run_project_docs_self_host_gate.py
          python scripts/run_question_surface_gate.py
          python scripts/run_agent_developer_gate.py
          python scripts/run_agent_developer_adversarial_gate.py
          python scripts/run_critical_mutation_gate.py
          python scripts/run_agent_developer_adversarial_mutation_gate.py
      - name: Run every P1 evidence gate present on this exact ref
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            run_agent_developer_first_divergence_gate.py \
            first_divergence_contract_self_test.py \
            run_agent_contract_v2_ablation_gate.py \
            agent_contract_v2_ablation_self_test.py \
            run_paraphrase_proofability_gate.py \
            paraphrase_proofability_self_test.py \
            run_mixed_evidence_provenance_gate.py \
            mixed_evidence_provenance_self_test.py \
            run_evidence_is_data_gate.py \
            evidence_is_data_self_test.py \
            run_p1_agent_truth_closure_gate.py \
            p1_agent_truth_closure_self_test.py
          do
            if [ -f "scripts/$script" ]; then
              python "scripts/$script"
            fi
          done
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'temp-p1*' -print -quit)"
          python -m compileall -q docmancer eval scripts tests
          python scripts/check_python_module_size.py
          git diff --check

  package:
    name: p1-release-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install build "hatchling<1.27"
      - run: |
          rm -rf dist
          python -m build
          python scripts/release_gate.py --manifest dist/release-manifest.json

  p1-exact-head:
    name: p1-exact-head
    if: always()
    needs: [core, platform, advanced, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every exact-head lane
        env:
          CORE: ${{ needs.core.result }}
          PLATFORM: ${{ needs.platform.result }}
          ADVANCED: ${{ needs.advanced.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          test "$CORE" = success
          test "$PLATFORM" = success
          test "$ADVANCED" = success
          test "$PACKAGE" = success
