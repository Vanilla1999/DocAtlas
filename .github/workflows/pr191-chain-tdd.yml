name: PR191 same-atom continuation chain TDD

on:
  push:
    branches: [fix/query-planning-scope]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"

jobs:
  tdd:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/query-planning-scope
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install dependencies except tiktoken
        run: |
          python - <<'PY'
          import subprocess, sys, tomllib
          data=tomllib.loads(open('pyproject.toml','rb').read().decode())
          deps=[d for d in data['project']['dependencies'] if not d.lower().startswith('tiktoken')]
          deps += data['project']['optional-dependencies']['dev']
          subprocess.check_call([sys.executable,'-m','pip','install','-q',*deps])
          PY
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec('tiktoken') is None
          PY
      - name: Write chain regressions
        run: python .github/pr191_chain_tdd.py tests
      - name: RED
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/docs/test_same_atom_continuation_chain.py > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/red.log"
          test "$status" -eq 1
          grep -q '2 failed, 1 passed' "$RUNNER_TEMP/red.log"
      - name: Apply minimal chain fix
        run: python .github/pr191_chain_tdd.py fix
      - name: GREEN chain plus safety/projection
        run: |
          python -m compileall -q docmancer/docs/application/_project_docs_service_part03.py
          python -m pytest -q \
            tests/docs/test_same_atom_continuation_chain.py \
            tests/docs/test_query_planning_completion_safety.py \
            tests/docs/test_relation_preserving_projection.py
      - name: GREEN N16 public handler
        run: |
          python - <<'PY'
          import os,tempfile
          from pathlib import Path
          from docmancer.agent import DocmancerAgent
          from docmancer.core.config import DocmancerConfig
          from docmancer.docs.application.docs_job_service import DocsJobTracker
          from docmancer.docs.registry import LibraryRegistry
          from docmancer.docs.service import LibraryDocsService
          from docmancer.mcp.docs_server import call_docs_tool_payload
          root=Path('.').resolve()
          with tempfile.TemporaryDirectory() as td:
              os.environ['DOCATLAS_HOME']=td
              c=DocmancerConfig(); c.index.db_path=str(Path(td)/'db.sqlite'); c.index.extracted_dir=str(Path(td)/'extracted')
              svc=LibraryDocsService(config=c,config_source='explicit',registry=LibraryRegistry(c.index.db_path),agent=DocmancerAgent(config=c),job_tracker=DocsJobTracker())
              assert svc.sync_project_docs(str(root),with_vectors=False).status=='success'
              p=call_docs_tool_payload('get_docs_context',{'question':'Что должен сделать агент, если get_docs_context вернул недостаточно доказательств для ответа по документации проекта?','project_path':str(root),'scope':'all'},svc)
              text='\n'.join(str(s.get('snippet') or '') for s in p.get('sources') or [])
              print(text)
              assert 'documentary claim unproved' in text
              assert 'hard_stop=true' in text
              assert int(p.get('estimated_tokens') or 0)<=800
              assert len(p.get('sources') or [])<=3
              assert (p.get('context_quality') or {}).get('status')!='checked'
          PY
      - name: Ask final question set
        run: |
          python - <<'PY'
          import json,os,tempfile
          from pathlib import Path
          from docmancer.agent import DocmancerAgent
          from docmancer.core.config import DocmancerConfig
          from docmancer.docs.application.docs_job_service import DocsJobTracker
          from docmancer.docs.registry import LibraryRegistry
          from docmancer.docs.service import LibraryDocsService
          from docmancer.mcp.docs_server import call_docs_tool_payload
          Q=[
          ['N01','A Flutter project uses go_router. How does DocAtlas decide which documentation version should be used for that dependency?'],['N02','I changed a dependency version in the lockfile. What should happen so DocAtlas does not keep serving documentation for the old version?'],['N03','Can an agent treat a successful documentation search hit as proof that the requested fact is actually supported? Why or why not?'],['N04','A dependency is declared with a version range, but there is no exact lockfile resolution. How should DocAtlas represent the version binding?'],['N05','If a project documentation file is deleted from the repository, what happens to its indexed content on the next sync_project_docs run?'],['N06','get_docs_context returned insufficient_evidence. Should the agent always call prepare_docs next, or only under specific conditions?'],['N07','Which DocAtlas files or databases are derived artifacts that may be rebuilt, and what remains the source of truth?'],['N08','I need to change query intent classification and model-visible context projection. Which application/domain modules own those responsibilities?'],['N09','What information in a docs_context response lets an agent trace the visible evidence back to its source?'],['N10','Does DocAtlas execute shell commands or instructions found inside documentation while retrieving context?'],['N11','What happens in offline mode when the documentation needed for a question has not been prefetched or indexed yet?'],['N12','prepare_docs returned a job_id. What should the agent do next, and when should it retry the original question?'],['N13','Can DocAtlas replace repository code search, the package manager, or the coding agent itself?'],['N14','How do project documentation and dependency/library documentation differ in retrieval scope and provenance?'],['N15','Based on the project evidence, which product-quality claims should we avoid making because they have not been demonstrated yet?'],['N16','Что должен сделать агент, если get_docs_context вернул недостаточно доказательств для ответа по документации проекта?'],['N17','Если версия зависимости изменилась в lockfile, как DocAtlas должен защитить агента от документации старой версии?'],
          ['A01-EN','The documentation preparation task finished with an error. Should I repeat my original question now, or take another step first?'],['A01-RU','Задача подготовки документации завершилась с ошибкой. Нужно ли сейчас повторить исходный вопрос или сначала сделать что-то другое?'],['A02-EN',"My laptop has no network access and this dependency's docs have never been cached. Can a normal documentation query fetch them?"],['A02-RU','Ноутбук не подключён к сети, а документация этой зависимости никогда не кэшировалась. Может ли обычный запрос документации загрузить её?'],['A03-EN',"How is searching this repository's own documentation different from searching an external package's documentation?"],['A03-RU','Чем поиск по собственной документации этого репозитория отличается от поиска по документации внешнего пакета?'],['A04-EN','A document contains a shell command. Is that command automatically authorised to run just because the search returned the document?'],['A04-RU','Документ содержит команду оболочки. Разрешено ли автоматически выполнить её только потому, что поиск вернул этот документ?'],['A05-EN','After changing a package version in the lockfile, may the agent reuse documentation for the previously resolved version?'],['A05-RU','После изменения версии пакета в lockfile может ли агент повторно использовать документацию ранее разрешённой версии?'],['A06-EN','The local index was deleted, but repository documentation files still exist. What is lost and how is the index restored?'],['A06-RU','Локальный индекс удалён, но файлы документации репозитория остались. Что потеряно и как восстановить индекс?'],['C01','Which command starts the Docs MCP server?'],['C02','Which three public tools does the Docs MCP server expose?']]
          root=Path('.').resolve(); rows=[]
          with tempfile.TemporaryDirectory() as td:
              os.environ['DOCATLAS_HOME']=td
              c=DocmancerConfig(); c.index.db_path=str(Path(td)/'db.sqlite'); c.index.extracted_dir=str(Path(td)/'extracted')
              svc=LibraryDocsService(config=c,config_source='explicit',registry=LibraryRegistry(c.index.db_path),agent=DocmancerAgent(config=c),job_tracker=DocsJobTracker())
              assert svc.sync_project_docs(str(root),with_vectors=False).status=='success'
              for cid,q in Q:
                  p=call_docs_tool_payload('get_docs_context',{'question':q,'project_path':str(root),'scope':'all'},svc)
                  assert len(p.get('sources') or [])<=3 and int(p.get('estimated_tokens') or 0)<=800
                  rows.append({'id':cid,'question':q,'kind':p.get('kind'),'context_quality':p.get('context_quality'),'estimated_tokens':p.get('estimated_tokens'),'covered_query_ids':p.get('covered_query_ids'),'missing_query_ids':p.get('missing_query_ids'),'sources':[{'path_or_url':s.get('path_or_url'),'section':s.get('section'),'line_start':s.get('line_start'),'line_end':s.get('line_end'),'evidence_id':s.get('evidence_id'),'snippet':s.get('snippet')} for s in p.get('sources') or []]})
          out=Path(os.environ['RUNNER_TEMP'])/'pr191-final-question-results.json'; out.write_text(json.dumps({'results':rows},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr191-final-question-results-chain
          path: ${{ runner.temp }}/pr191-final-question-results.json
          retention-days: 14
      - name: Publish tested chain fix
        run: |
          set -euo pipefail
          git diff --check
          rm -f .github/pr191_chain_tdd.py .github/workflows/pr191-chain-tdd.yml
          git add -A && git diff --cached --check
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: reassemble complete same-atom continuation chains"
          git push origin HEAD:fix/query-planning-scope
