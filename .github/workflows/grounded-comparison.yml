name: Grounded comparison
on:
  push:
    branches: [experiment/grounded-comparison-20260927]
    paths: [.github/workflows/grounded-comparison.yml, experiments/grounded-comparison/**]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOCATLAS_OFFLINE: '1'
      DOCATLAS_AUTO_VECTORS: '0'
      DOCS_MCP_APP_TELEMETRY_ENABLED: 'false'
      HUSKY: '0'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: docatlas
          ref: 4df3da33cbf0e1a128ffefd0b6452505cdf3da0b
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: arabold/docs-mcp-server
          ref: 9699882df95c9d13ce0b2c40f18c678f292eb8cc
          path: grounded
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install unchanged locked DocAtlas
        working-directory: docatlas
        run: |
          mkdir -p "$RUNNER_TEMP/comparison-evidence"
          python -m pip install 'uv==0.9.25'
          uv sync --locked --extra dev --python 3.13
          uv pip freeze --python .venv/bin/python > "$RUNNER_TEMP/comparison-evidence/docatlas-freeze.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/comparison-evidence/docatlas-head.txt"
          sha256sum uv.lock > "$RUNNER_TEMP/comparison-evidence/docatlas-lock.sha256"
      - name: Build unchanged locked Grounded Docs 3.2.0
        working-directory: grounded
        run: |
          set -o pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/comparison-evidence/grounded-head.txt"
          sha256sum package-lock.json > "$RUNNER_TEMP/comparison-evidence/grounded-lock.sha256"
          node --version > "$RUNNER_TEMP/comparison-evidence/node-version.txt"
          npm ci 2>&1 | tee "$RUNNER_TEMP/comparison-evidence/grounded-install.log"
          npm run build 2>&1 | tee "$RUNNER_TEMP/comparison-evidence/grounded-build.log"
          node dist/index.js --help > "$RUNNER_TEMP/comparison-evidence/grounded-help.txt"
      - name: Run same questions against both products and both document views
        run: |
          set -o pipefail
          "$GITHUB_WORKSPACE/docatlas/.venv/bin/python" "$GITHUB_WORKSPACE/harness/experiments/grounded-comparison/run_comparison.py" \
            --repo "$GITHUB_WORKSPACE/docatlas" --grounded "$GITHUB_WORKSPACE/grounded" \
            --output "$RUNNER_TEMP/comparison-evidence/results" \
            2>&1 | tee "$RUNNER_TEMP/comparison-evidence/run.log"
      - name: Preserve script and product status
        if: always()
        run: |
          cp harness/experiments/grounded-comparison/run_comparison.py "$RUNNER_TEMP/comparison-evidence/"
          git -C docatlas status --porcelain > "$RUNNER_TEMP/comparison-evidence/docatlas-final-status.txt"
          git -C grounded status --porcelain > "$RUNNER_TEMP/comparison-evidence/grounded-final-status.txt"
          tar -czf "$RUNNER_TEMP/comparison-evidence/grounded-source.tar.gz" --exclude=node_modules --exclude=.git --exclude=dist -C grounded src docs ARCHITECTURE.md package.json package-lock.json LICENSE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: grounded-comparison-${{ github.sha }}
          path: ${{ runner.temp }}/comparison-evidence
          retention-days: 14
          if-no-files-found: error
