name: Temp Agent Developer C2 Runner Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'tmp/agent-developer-c2-runner-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Make target matcher inherit baseline evidence constraints
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/run_agent_developer_gate.py')
          text = p.read_text(encoding='utf-8')
          old = '''    if not _matches_sources(_source_paths(payload), call.get("target_required_sources")):\n        return False\n    action = _recommended_action(payload)\n    target_tool = str(call.get("target_next_action_tool") or "")\n    if target_tool and str(action.get("tool") or "") != target_tool:\n        return False\n    target_confirmation = str(call.get("target_confirmation_reason") or "")\n    if target_confirmation and str(\n        action.get("confirmation_reason") or payload.get("confirmation_reason") or ""\n    ) != target_confirmation:\n        return False\n'''
          new = '''    target_sources = (\n        call.get("target_required_sources")\n        if "target_required_sources" in call\n        else call.get("required_sources")\n    )\n    if not _matches_sources(_source_paths(payload), target_sources):\n        return False\n    action = _recommended_action(payload)\n    target_tool_value = (\n        call.get("target_next_action_tool")\n        if "target_next_action_tool" in call\n        else call.get("baseline_next_action_tool")\n    )\n    target_tool = str(target_tool_value or "")\n    if target_tool and str(action.get("tool") or "") != target_tool:\n        return False\n    target_confirmation_value = (\n        call.get("target_confirmation_reason")\n        if "target_confirmation_reason" in call\n        else call.get("baseline_confirmation_reason")\n    )\n    target_confirmation = str(target_confirmation_value or "")\n    if target_confirmation and str(\n        action.get("confirmation_reason") or payload.get("confirmation_reason") or ""\n    ) != target_confirmation:\n        return False\n'''
          if old not in text:
              raise SystemExit('target matcher block not found')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m py_compile scripts/run_agent_developer_gate.py
          git diff --check
      - name: Push candidate runner
        run: |
          git config user.name 'docatlas-temp-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/run_agent_developer_gate.py
          git commit -m 'Materialize Commit 2 runner fallback fix'
          git push origin HEAD:${{ github.head_ref }}
