name: Scientific structural external80 regression
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths: [.github/workflows/scientific-structural-external80.yml]
permissions: {contents: read}
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: b07dc52bd7ba02a449477bc534cc84dc1d276ffd, path: baseline-runtime}
      - uses: actions/checkout@v4
        with: {ref: e5e1bec980caa1b66758f655940d519f0ba2fa04, path: candidate-runtime}
      - uses: astral-sh/setup-uv@v6
      - run: |
          (cd baseline-runtime && uv sync --frozen --extra dev)
          (cd candidate-runtime && uv sync --frozen --extra dev)
      - name: Baseline creates frozen fixture
        shell: bash
        run: |
          cd baseline-runtime
          PYTHONPATH="$PWD" uv run --frozen --extra dev python - <<'PY'
          from pathlib import Path
          from eval.evidence_quality_v2.run import run
          import os
          run(Path(os.environ['RUNNER_TEMP'])/'base')
          PY
      - name: Candidate reuses exact baseline corpus/state identity
        shell: bash
        run: |
          cd candidate-runtime
          PYTHONPATH="$PWD" uv run --frozen --extra dev python - <<'PY'
          from pathlib import Path
          from eval.evidence_quality_v2.run import run
          import os
          t=Path(os.environ['RUNNER_TEMP'])
          run(t/'cand', fixture_output=t/'base')
          PY
      - name: Compare final A-current rows
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP']); A=json.loads((t/'base/rows.json').read_text()); B=json.loads((t/'cand/rows.json').read_text())
          a={r['id']:r for r in A if r.get('variant')=='A-current'}; b={r['id']:r for r in B if r.get('variant')=='A-current'}; assert set(a)==set(b)
          def ok(r): return r.get('assessment',{}).get('context_sufficiency')=='sufficient' and not r.get('safety_errors')
          wins=[i for i in a if ok(b[i]) and not ok(a[i])]; losses=[i for i in a if ok(a[i]) and not ok(b[i])]
          changed=[i for i in a if a[i].get('payload')!=b[i].get('payload')]
          out={'baseline_sufficient':sum(ok(x) for x in a.values()),'candidate_sufficient':sum(ok(x) for x in b.values()),'wins':wins,'losses':losses,'payload_changed_ids':changed,'baseline_safety':sum(bool(x.get('safety_errors')) for x in a.values()),'candidate_safety':sum(bool(x.get('safety_errors')) for x in b.values())}
          (t/'compare.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          if losses or out['candidate_safety']>out['baseline_safety']: raise SystemExit('regression')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scientific-structural-external80
          path: |
            ${{ runner.temp }}/base/summary.json
            ${{ runner.temp }}/cand/summary.json
            ${{ runner.temp }}/compare.json
