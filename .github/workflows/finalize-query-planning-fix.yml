name: Finalize query-planning fix

on:
  push:
    branches:
      - fix/query-planning-scope
    paths:
      - '.github/workflows/finalize-query-planning-fix.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore verified whitespace and verify syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = (
              (
                  Path('docmancer/docs/domain/project_retrieval_intent.py'),
                  '     docs_file_subject = bool(re.search(\n',
                  '    docs_file_subject = bool(re.search(\n',
              ),
              (
                  Path('tests/docs/test_query_planning_alias_regressions.py'),
                  "     monkeypatch.setattr(planner, 'build_project_retrieval_aliases',\n",
                  "    monkeypatch.setattr(planner, 'build_project_retrieval_aliases',\n",
              ),
          )
          for path, bad, good in replacements:
              text = path.read_text(encoding='utf-8')
              if text.count(bad) != 1:
                  raise SystemExit(f'expected exactly one verified whitespace defect in {path}')
              path.write_text(text.replace(bad, good), encoding='utf-8')
          PY
          python -m compileall -q docmancer tests
          git diff --check
      - name: Install existing development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Refresh measured P1 reports
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_paraphrase_proofability_gate.py --write
          python scripts/run_mixed_evidence_provenance_gate.py --write
          python scripts/run_evidence_is_data_gate.py --write
          python scripts/run_p1_agent_truth_closure_gate.py --write
          python scripts/run_paraphrase_proofability_gate.py
          python scripts/run_mixed_evidence_provenance_gate.py
          python scripts/run_evidence_is_data_gate.py
          python scripts/run_p1_agent_truth_closure_gate.py
      - name: Recheck query-planning regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/docs/test_query_planning_scope_regressions.py \
            tests/docs/test_query_planning_temporal_regressions.py \
            tests/docs/test_query_planning_alias_regressions.py \
            tests/docs/test_query_planning_budget_regressions.py \
            tests/docs/test_relation_preserving_projection.py \
            tests/docs/test_documentation_query_plan.py
      - name: Commit final verified tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-query-planning-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: refresh query-planning proof snapshots'
          git push origin HEAD:fix/query-planning-scope

# trigger through the contents API
