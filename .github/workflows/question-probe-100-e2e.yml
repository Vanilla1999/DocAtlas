name: Question Probe 100 E2E

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/question_probe_100.py
      - scripts/question_probe_100_e2e.py
      - .github/workflows/question-probe-100-e2e.yml

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCMANCER_OFFLINE: "1"

jobs:
  e2e-probe:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install DocAtlas
        run: pip install -e .

      - name: Run public MCP 100-question probe
        run: python scripts/question_probe_100_e2e.py

      - name: Upload public MCP probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: question-probe-100-e2e-results
          path: question-probe-100-e2e-results.json
          if-no-files-found: warn
