name: Generic blind lookup pair 30
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths:
      - .github/workflows/generic-blind-lookup-pair30.yml
      - eval/project_context_quality/generic_blind_lookup_pair30_questions.json
      - scripts/run_generic_blind_lookup_pair30.py

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - name: Run paired project-blind questions
        run: |
          PYTHONPATH="$PWD" uv run --frozen --extra dev python \
            scripts/run_generic_blind_lookup_pair30.py \
            --project-root "$PWD" \
            --questions eval/project_context_quality/generic_blind_lookup_pair30_questions.json \
            --output "$RUNNER_TEMP/generic-blind-lookup-pair30.json"
      - uses: actions/upload-artifact@v4
        with:
          name: generic-blind-lookup-pair30
          path: ${{ runner.temp }}/generic-blind-lookup-pair30.json
