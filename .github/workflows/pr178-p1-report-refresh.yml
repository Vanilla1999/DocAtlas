name: PR178 P1 report refresh publish

on:
  push:
    branches: [fix/context-first-project-reads]
    paths: [.github/workflows/pr178-p1-report-refresh.yml]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCATLAS_OFFLINE: "1"

jobs:
  publish-refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install evaluator dependencies
        run: python -m pip install -e ".[dev]"
      - name: Recompute and verify reviewed P1 reports
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_paraphrase_proofability_gate.py --write
          python scripts/run_mixed_evidence_provenance_gate.py --write
          python scripts/run_evidence_is_data_gate.py --write
          python scripts/run_paraphrase_proofability_gate.py
          python scripts/run_mixed_evidence_provenance_gate.py
          python scripts/run_evidence_is_data_gate.py
          python scripts/paraphrase_proofability_self_test.py
          python scripts/mixed_evidence_provenance_self_test.py
          python scripts/evidence_is_data_self_test.py
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            eval/agent_developer_v1/results/evidence-is-data.json \
            eval/agent_developer_v1/results/mixed-evidence-provenance.json \
            eval/agent_developer_v1/results/paraphrase-proofability.json | sort)"
          test "$changed" = "$expected"
          git diff --check
      - name: Publish only reviewed report artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr178-p1-report-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: refresh measured P1 evidence reports"
          git push origin HEAD:fix/context-first-project-reads
