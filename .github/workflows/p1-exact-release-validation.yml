name: P1 exact release validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: P1 evidence stage being validated
        required: true
        default: p1.2
        type: string

permissions:
  contents: read

concurrency:
  group: p1-exact-release-${{ github.ref }}-${{ inputs.stage || 'pr' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: p1-release-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install build "hatchling<1.27"
      - run: |
          rm -rf dist
          python -m build
          python scripts/release_gate.py --manifest dist/release-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p1-release-dist
          path: dist/
          if-no-files-found: error

  wheel:
    name: p1-release-wheel (${{ matrix.python }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: p1-release-dist
          path: dist
      - run: |
          python scripts/release_gate.py
          python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          doc-atlas --version
          python "$GITHUB_WORKSPACE/scripts/docs_mcp_stdio_smoke.py"

  sdist:
    name: p1-release-sdist-installer
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: p1-release-dist
          path: dist
      - run: |
          mkdir sdist-wheel
          cp dist/*.tar.gz sdist-wheel/
          python -m pip wheel --no-deps --wheel-dir sdist-wheel dist/*.tar.gz
          python scripts/release_gate.py --dist sdist-wheel
          python -m pip install --force-reinstall sdist-wheel/*.whl
          cd "$(mktemp -d)"
          python "$GITHUB_WORKSPACE/scripts/docs_mcp_stdio_smoke.py"
      - name: Verify the installer against the exact built wheel
        shell: bash
        run: |
          EXPECTED_VERSION="$(python -c 'from docmancer._version import __version__; print(__version__)')"
          DOCATLAS_INSTALL_SOURCE="$(find "$GITHUB_WORKSPACE/dist" -name '*.whl' -print -quit)" \
          DOCATLAS_EXPECT_VERSION="$EXPECTED_VERSION" \
          DOCATLAS_AGENT=none sh "$GITHUB_WORKSPACE/scripts/install.sh"

  p1-exact-release:
    name: p1-exact-release
    if: always()
    needs: [build, wheel, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require exact release lanes
        env:
          BUILD: ${{ needs.build.result }}
          WHEEL: ${{ needs.wheel.result }}
          SDIST: ${{ needs.sdist.result }}
        run: |
          test "$BUILD" = success
          test "$WHEEL" = success
          test "$SDIST" = success
