name: Temporary legacy fixture patch

on:
  push:
    branches:
      - tmp/legacy-completeness-build

permissions:
  contents: write

jobs:
  patch-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: tmp/legacy-completeness-build
      - name: Align stale Phase 3.1 expectation with fail-closed contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_docs_service_part03.py")
          text = path.read_text(encoding="utf-8")
          old = '''    assert dispatcher_payload is not None
    assert dispatcher_payload["status"] == "ok", dispatcher_payload.get("missing")
    assert any(
        "raw topic unchanged" in source["snippet"]
        and "must not call vectors or embeddings" in source["snippet"]
        for source in dispatcher_payload["sources"]
    )
'''
          new = '''    assert dispatcher_payload is not None
    assert dispatcher_payload["status"] == "insufficient_evidence"
    assert (
        "unresolved:0:legacy_unresolved:requirement_items"
        in dispatcher_payload.get("missing", [])
    )
'''
          if old not in text:
              raise SystemExit("expected stale assertion block not found exactly once")
          if text.count(old) != 1:
              raise SystemExit("expected stale assertion block is not unique")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check
          git diff --exit-code -- tests/test_docs_service_part03.py >/dev/null && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_docs_service_part03.py
          git commit -m "Align source-isolation fixture with fail-closed legacy coverage"
          git push origin HEAD:tmp/legacy-completeness-build
