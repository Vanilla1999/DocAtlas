name: PR194 global evidence development gate
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths: [.github/workflows/pr194-global-evidence-development-gate.yml]

permissions:
  contents: read

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      DOCATLAS_OFFLINE: "1"
      DOCATLAS_AUTO_VECTORS: "0"
      BASE_SHA: ef39e12ab60fd69f8052079847d9e0ca24a843b4
      FROZEN_GENERIC_SHA: 95e61265656283d609bc1328c46c52b2bf1a069e
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Checkout exact baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: baseline-runtime
      - name: Checkout frozen Generic30 corpus
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_GENERIC_SHA }}
          path: frozen-corpus
      - uses: astral-sh/setup-uv@v6
      - name: Sync runtimes
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline-runtime && uv sync --frozen --extra dev)
          (cd candidate && uv sync --frozen --extra dev)

      - name: Target30 baseline
        shell: bash
        run: |
          set -euo pipefail
          cd baseline-runtime
          PYTHONPATH="$PWD" uv run --frozen --extra dev python scripts/run_v13_v15_diagnostic30.py \
            --project-root "$GITHUB_WORKSPACE/baseline-runtime" \
            --questions "$GITHUB_WORKSPACE/candidate/eval/project_context_quality/v13_v15_questions.json" \
            --output "$RUNNER_TEMP/target-base.json"

      - name: Target30 candidate
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          PYTHONPATH="$PWD" uv run --frozen --extra dev python scripts/run_v13_v15_diagnostic30.py \
            --project-root "$GITHUB_WORKSPACE/baseline-runtime" \
            --questions "$GITHUB_WORKSPACE/candidate/eval/project_context_quality/v13_v15_questions.json" \
            --output "$RUNNER_TEMP/target-cand.json"

      - name: Create Generic30 runner
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/run_generic30.py" <<'PY'
          from __future__ import annotations
          import argparse, json, os
          from pathlib import Path

          p=argparse.ArgumentParser()
          p.add_argument("--project-root",type=Path,required=True)
          p.add_argument("--questions",type=Path,required=True)
          p.add_argument("--output",type=Path,required=True)
          a=p.parse_args()

          os.environ["DOCATLAS_OFFLINE"]="1"
          os.environ["DOCATLAS_AUTO_VECTORS"]="0"
          os.environ["DOCATLAS_HOME"]=str(a.output.parent/(a.output.stem+"-home"))

          from docmancer.agent import DocmancerAgent
          from docmancer.core.config import DocmancerConfig
          from docmancer.docs.registry import LibraryRegistry
          from docmancer.docs.service import DocsJobTracker, LibraryDocsService
          from eval.project_context_quality.capture_public_context import capture_public_call

          cfg=DocmancerConfig()
          cfg.index.db_path=str(a.output.parent/(a.output.stem+".sqlite"))
          cfg.index.extracted_dir=str(a.output.parent/(a.output.stem+"-extracted"))
          service=LibraryDocsService(
              config=cfg,config_source="explicit",registry=LibraryRegistry(cfg.index.db_path),
              agent=DocmancerAgent(config=cfg),job_tracker=DocsJobTracker(),
          )
          sync=service.sync_project_docs(str(a.project_root.resolve()),with_vectors=False)
          if sync.status!="success":
              raise RuntimeError(f"sync failed: {sync.status}")
          cases=json.loads(a.questions.read_text())["cases"]
          rows=[]
          for case in cases:
              for lane in ("root_only","with_lookups"):
                  req={"project_path":str(a.project_root.resolve()),"scope":"project","question":case["question"]}
                  if lane=="with_lookups":
                      req["lookup_queries"]=list(case.get("lookup_queries") or ())
                  cap=capture_public_call(service,req)
                  rows.append({"id":case["id"],"lane":lane,"request":req,"payload":cap["public_payload"]})
                  print(case["id"],lane,cap["public_payload"].get("status"),cap["public_payload"].get("estimated_tokens"),flush=True)
          a.output.write_text(json.dumps({"rows":rows},ensure_ascii=False,indent=2)+"\n")
          PY

      - name: Generic30 baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline-runtime && PYTHONPATH="$PWD" uv run --frozen --extra dev python "$RUNNER_TEMP/run_generic30.py" \
            --project-root "$GITHUB_WORKSPACE/frozen-corpus" \
            --questions "$GITHUB_WORKSPACE/candidate/eval/project_context_quality/generic_blind_lookup_pair30_questions.json" \
            --output "$RUNNER_TEMP/generic-base.json")
          (cd candidate && PYTHONPATH="$PWD" uv run --frozen --extra dev python "$RUNNER_TEMP/run_generic30.py" \
            --project-root "$GITHUB_WORKSPACE/frozen-corpus" \
            --questions "$GITHUB_WORKSPACE/candidate/eval/project_context_quality/generic_blind_lookup_pair30_questions.json" \
            --output "$RUNNER_TEMP/generic-cand.json")

      - name: Compare Target30 and Generic30 visible packets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          t=Path(os.environ["RUNNER_TEMP"])

          def signature(payload):
              keys=("status","kind","context_status","context_available","context_quality",
                    "answer_supported","answer_available","support_status","edit_ready",
                    "missing","omitted_counts","limitations","recommended_next_action",
                    "covered_query_ids","missing_query_ids")
              src_keys=("path_or_url","path","section","symbol_or_section","snippet",
                        "version_binding","authority","instruction_trust","scope","line_start","line_end")
              return {
                  **{k:payload.get(k) for k in keys if k in payload},
                  "sources":[{k:s.get(k) for k in src_keys if k in s}
                             for s in payload.get("sources") or ()],
              }

          def safety(payload):
              errors=[]
              if payload.get("answer_supported") is True: errors.append("answer_supported")
              if payload.get("answer_available") is True: errors.append("answer_available")
              if payload.get("edit_ready") is True: errors.append("edit_ready")
              if len(payload.get("sources") or ()) > 3: errors.append("source_cap")
              if int(payload.get("estimated_tokens") or 0) > 800: errors.append("token_budget")
              return errors

          def target(path):
              data=json.loads(path.read_text())
              return {r["id"]:r["capture"]["public_payload"] for r in data["cases"]}
          ta=target(t/"target-base.json"); tb=target(t/"target-cand.json")
          assert set(ta)==set(tb)
          target_changed=[i for i in ta if signature(ta[i])!=signature(tb[i])]
          target_safety={i:safety(p) for i,p in tb.items() if safety(p)}

          def generic(path):
              data=json.loads(path.read_text())
              return {(r["id"],r["lane"]):r["payload"] for r in data["rows"]}
          ga=generic(t/"generic-base.json"); gb=generic(t/"generic-cand.json")
          assert set(ga)==set(gb)
          generic_changed=[{"id":i,"lane":lane}
                           for (i,lane) in ga if signature(ga[(i,lane)])!=signature(gb[(i,lane)])]
          generic_safety={f"{i}:{lane}":safety(p) for (i,lane),p in gb.items() if safety(p)}

          target_manual=json.loads(
              (Path("candidate")/"eval/project_context_quality/v13_v15_manual_assessment.json").read_text()
          )
          target_prior=[r["id"] for r in target_manual["cases"] if r.get("final")=="sufficient"]
          generic_manual=json.loads(
              (Path("candidate")/"eval/project_context_quality/generic_blind_lookup_pair30_manual_assessment.json").read_text()
          )
          generic_prior={
              "root_only":[r["id"] for r in generic_manual["cases"] if r.get("root_rating")=="sufficient"],
              "with_lookups":[r["id"] for r in generic_manual["cases"] if r.get("lookup_rating")=="sufficient"],
          }
          out={
              "target30":{
                  "changed_ids":target_changed,
                  "changed_prior_sufficient_ids":[i for i in target_changed if i in target_prior],
                  "candidate_safety":target_safety,
              },
              "generic30":{
                  "changed":generic_changed,
                  "changed_prior_sufficient":[row for row in generic_changed
                      if row["id"] in generic_prior[row["lane"]]],
                  "candidate_safety":generic_safety,
              },
          }
          (t/"packet-compare.json").write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          if target_safety or generic_safety:
              raise SystemExit("public packet safety regression")
          PY

      - name: External80 exact baseline fixture
        shell: bash
        run: |
          set -euo pipefail
          cd baseline-runtime
          PYTHONPATH="$PWD" uv run --frozen --extra dev python - <<'PY'
          from pathlib import Path
          from eval.evidence_quality_v2.run import run
          import os
          run(Path(os.environ["RUNNER_TEMP"])/"external-base")
          PY

      - name: External80 candidate on same fixture
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          PYTHONPATH="$PWD" uv run --frozen --extra dev python - <<'PY'
          from pathlib import Path
          from eval.evidence_quality_v2.run import run
          import os
          t=Path(os.environ["RUNNER_TEMP"])
          run(t/"external-cand",fixture_output=t/"external-base")
          PY

      - name: Compare External80
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          t=Path(os.environ["RUNNER_TEMP"])
          A=json.loads((t/"external-base/rows.json").read_text())
          B=json.loads((t/"external-cand/rows.json").read_text())
          a={r["id"]:r for r in A if r.get("variant")=="A-current"}
          b={r["id"]:r for r in B if r.get("variant")=="A-current"}
          assert set(a)==set(b)
          def ok(r):
              return r.get("assessment",{}).get("context_sufficiency")=="sufficient" and not r.get("safety_errors")
          wins=[i for i in a if ok(b[i]) and not ok(a[i])]
          losses=[i for i in a if ok(a[i]) and not ok(b[i])]
          changed=[i for i in a if a[i].get("payload")!=b[i].get("payload")]
          out={
              "baseline_sufficient":sum(ok(x) for x in a.values()),
              "candidate_sufficient":sum(ok(x) for x in b.values()),
              "wins":wins,"losses":losses,"payload_changed_ids":changed,
              "baseline_safety":sum(bool(x.get("safety_errors")) for x in a.values()),
              "candidate_safety":sum(bool(x.get("safety_errors")) for x in b.values()),
          }
          (t/"external-compare.json").write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          if losses or out["candidate_safety"]>out["baseline_safety"]:
              raise SystemExit("external80 regression")
          PY

      - name: Final development summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          t=Path(os.environ["RUNNER_TEMP"])
          def load(name):
              p=t/name
              return json.loads(p.read_text()) if p.exists() else {"missing":name}
          out={
              "candidate_sha":os.environ.get("GITHUB_SHA"),
              "packet_compare":load("packet-compare.json"),
              "external80":load("external-compare.json"),
          }
          (t/"development-summary.json").write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr194-global-evidence-development-gate
          path: |
            ${{ runner.temp }}/target-base.json
            ${{ runner.temp }}/target-cand.json
            ${{ runner.temp }}/generic-base.json
            ${{ runner.temp }}/generic-cand.json
            ${{ runner.temp }}/packet-compare.json
            ${{ runner.temp }}/external-base/rows.json
            ${{ runner.temp }}/external-cand/rows.json
            ${{ runner.temp }}/external-base/summary.json
            ${{ runner.temp }}/external-cand/summary.json
            ${{ runner.temp }}/external-compare.json
            ${{ runner.temp }}/development-summary.json
