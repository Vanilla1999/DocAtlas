name: PR115 migrate-home implementation

on:
  push:
    branches:
      - p0/docatlas-migrate-home

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message != 'Implement reviewed migrate-home contract'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: p0/docatlas-migrate-home
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Apply reviewed implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old[:120]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Core: make migration planning reconstructable after a successful apply,
          # and serialize concurrent public migration attempts with a non-blocking OS lock.
          p = Path('docmancer/core/state_migration.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('import shutil\nfrom dataclasses', 'import shutil\nimport tempfile\nfrom dataclasses', 1)
          text = text.replace('import yaml\n\nfrom docmancer._version', 'import yaml\nfrom filelock import FileLock, Timeout\n\nfrom docmancer._version', 1)
          plan_start = text.index('def plan_home_migration(')
          plan_end = text.index('\n\ndef _migration_record', plan_start)
          new_plan = '''def plan_home_migration(\n    source: str | Path,\n    target: str | Path,\n    *,\n    max_files: int = DEFAULT_MAX_FILES,\n    max_bytes: int = DEFAULT_MAX_BYTES,\n) -> HomeMigrationPlan:\n    if not 1 <= max_files <= DEFAULT_MAX_FILES:\n        raise HomeMigrationError(f"max_files must be between 1 and {DEFAULT_MAX_FILES}")\n    if not 1 <= max_bytes <= DEFAULT_MAX_BYTES:\n        raise HomeMigrationError(f"max_bytes must be between 1 and {DEFAULT_MAX_BYTES}")\n    raw_source = Path(source).expanduser()\n    raw_target = Path(target).expanduser()\n    if raw_source.is_symlink() or raw_target.is_symlink():\n        raise HomeMigrationError("migration roots must not be symlinks")\n    source_path = raw_source.resolve()\n    target_path = raw_target.resolve()\n    if source_path == target_path:\n        raise HomeMigrationError("migration source and target must differ")\n    if source_path in target_path.parents or target_path in source_path.parents:\n        raise HomeMigrationError("migration source and target must not contain each other")\n\n    source_state = inspect_state(source_path)\n    target_state = inspect_state(target_path)\n    eligible_source = source_state.classification in {"legacy_docatlas", "owned_docatlas"}\n    if not eligible_source:\n        return HomeMigrationPlan(\n            str(source_path), str(target_path), source_state.classification,\n            target_state.classification, 0, 0, "", "", False,\n            "source_not_proven_docatlas", (),\n        )\n    if target_state.classification not in {"missing", "empty", "owned_docatlas"}:\n        return HomeMigrationPlan(\n            str(source_path), str(target_path), source_state.classification,\n            target_state.classification, 0, 0, "", "", False,\n            "target_not_empty_or_unowned", (),\n        )\n\n    entries, total = _enumerate_entries(\n        source_path, target_path, max_files=max_files, max_bytes=max_bytes\n    )\n    fingerprint = _source_fingerprint(entries)\n    digest = _sha256(_canonical_json(_plan_digest_payload(\n        source=source_path,\n        target=target_path,\n        source_fingerprint=fingerprint,\n        entries=entries,\n    )))\n    candidate = HomeMigrationPlan(\n        str(source_path), str(target_path), source_state.classification,\n        target_state.classification, len(entries), total, fingerprint, digest,\n        True, None, entries,\n    )\n    if target_state.classification == "owned_docatlas":\n        if _already_applied(candidate):\n            return candidate\n        return HomeMigrationPlan(\n            candidate.source, candidate.target, candidate.source_classification,\n            candidate.target_classification, candidate.file_count,\n            candidate.total_source_bytes, candidate.source_fingerprint,\n            candidate.plan_digest, False, "target_not_matching_migration",\n            candidate.entries,\n        )\n    return candidate\n'''
          text = text[:plan_start] + new_plan + text[plan_end:]

          apply_start = text.index('def apply_home_migration(')
          apply_end = text.index('\n\n__all__', apply_start)
          new_apply = '''def _migration_lock_path(source: Path, target: Path) -> Path:\n    identity = _sha256(_canonical_json({"source": str(source), "target": str(target)}))[:24]\n    return Path(tempfile.gettempdir()) / f"docatlas-home-migration-{identity}.lock"\n\n\ndef _apply_home_migration_locked(\n    plan: HomeMigrationPlan,\n    *,\n    source: Path,\n    target: Path,\n) -> HomeMigrationResult:\n    if target.exists() and _already_applied(plan):\n        return HomeMigrationResult(\n            "already_applied", plan.source, plan.target, plan.plan_digest,\n            plan.file_count, plan.total_source_bytes,\n        )\n\n    fresh = plan_home_migration(source, target)\n    if not fresh.can_apply or fresh.plan_digest != plan.plan_digest:\n        raise HomeMigrationError("migration source/target changed after the reviewed plan")\n\n    staging = target.parent / f".{target.name}.migration-{plan.plan_digest[:12]}"\n    if staging.exists():\n        raise HomeMigrationError(f"stale migration staging directory exists: {staging}")\n    staging.mkdir(parents=True, exist_ok=False)\n    try:\n        by_source = {entry.source_relative: entry for entry in plan.entries}\n        for source_relative, entry in by_source.items():\n            source_file = source / source_relative\n            data = source_file.read_bytes()\n            if _sha256(data) != entry.source_sha256:\n                raise HomeMigrationError(f"source changed while migrating: {source_relative}")\n            relative = Path(source_relative)\n            target_relative, target_data = _target_bytes(relative, data, source, target)\n            if target_relative.as_posix() != entry.target_relative:\n                raise HomeMigrationError(f"migration mapping changed for {source_relative}")\n            destination = staging / target_relative\n            destination.parent.mkdir(parents=True, exist_ok=True)\n            destination.write_bytes(target_data)\n            try:\n                shutil.copystat(source_file, destination, follow_symlinks=False)\n            except OSError:\n                pass\n            _verify_target_file(destination, entry.target_sha256)\n\n        _assert_source_unchanged(plan)\n\n        (staging / STATE_OWNER_FILENAME).write_text(\n            json.dumps(ownership_payload(), indent=2, sort_keys=True) + "\\n",\n            encoding="utf-8",\n        )\n        record = {\n            "product_id": PRODUCT_ID,\n            "state_schema_version": STATE_SCHEMA_VERSION,\n            "migrated_by_version": __version__,\n            "source": plan.source,\n            "source_fingerprint": plan.source_fingerprint,\n            "plan_digest": plan.plan_digest,\n            "source_preserved": True,\n        }\n        (staging / MIGRATION_RECORD_FILENAME).write_text(\n            json.dumps(record, indent=2, sort_keys=True) + "\\n",\n            encoding="utf-8",\n        )\n        for entry in plan.entries:\n            _verify_target_file(staging / entry.target_relative, entry.target_sha256)\n        if inspect_state(staging).classification != "owned_docatlas":\n            raise HomeMigrationError("staged migration ownership verification failed")\n\n        _assert_source_unchanged(plan)\n        if target.exists():\n            target_state = inspect_state(target)\n            if target_state.classification != "empty":\n                raise HomeMigrationError("migration target changed before publish")\n            target.rmdir()\n        os.replace(staging, target)\n    except Exception:\n        shutil.rmtree(staging, ignore_errors=True)\n        raise\n\n    if inspect_state(target).classification != "owned_docatlas":\n        raise HomeMigrationError("published migration ownership verification failed")\n    return HomeMigrationResult(\n        "applied", plan.source, plan.target, plan.plan_digest,\n        plan.file_count, plan.total_source_bytes,\n    )\n\n\ndef apply_home_migration(plan: HomeMigrationPlan) -> HomeMigrationResult:\n    if not plan.can_apply:\n        raise HomeMigrationError(f"migration plan is not applicable: {plan.reason}")\n    source = Path(plan.source)\n    target = Path(plan.target)\n    lock_path = _migration_lock_path(source, target)\n    try:\n        with FileLock(str(lock_path), timeout=0):\n            return _apply_home_migration_locked(plan, source=source, target=target)\n    except Timeout as exc:\n        raise HomeMigrationError(\n            f"another DocAtlas home migration is already in progress for {target}"\n        ) from exc\n'''
          text = text[:apply_start] + new_apply + text[apply_end:]
          p.write_text(text, encoding='utf-8')

          # CLI binding: default source is the explicit legacy env or ~/.docmancer;
          # default target honors DOCATLAS_HOME only, never DOCMANCER_HOME.
          p = Path('docmancer/cli/state_commands.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('import json\n\nimport click', 'import json\nimport os\nfrom pathlib import Path\n\nimport click', 1)
          text = text.replace(
              'from docmancer.core.product_identity import resolve_home\n',
              '''from docmancer.core.product_identity import (\n    LEGACY_HOME_ENV,\n    PRODUCT_HOME_ENV,\n    legacy_default_home,\n    resolve_home,\n)\nfrom docmancer.core.state_migration import (\n    HomeMigrationError,\n    apply_home_migration,\n    plan_home_migration,\n)\n''',
              1,
          )
          marker = '\n\n__all__ = ["clear_index_cmd"]\n'
          if marker not in text:
              raise SystemExit('state_commands.py: __all__ marker not found')
          addition = r'''


def _migration_source(source: str | None) -> Path:
    if source:
        return Path(source).expanduser()
    legacy_env = str(os.environ.get(LEGACY_HOME_ENV) or "").strip()
    if legacy_env:
        return resolve_home(
            env={LEGACY_HOME_ENV: legacy_env},
            home_dir=Path.home(),
        ).path
    return legacy_default_home(home_dir=Path.home())


def _migration_target(target: str | None) -> Path:
    if target:
        return Path(target).expanduser()
    primary_env = str(os.environ.get(PRODUCT_HOME_ENV) or "").strip()
    env = {PRODUCT_HOME_ENV: primary_env} if primary_env else {}
    return resolve_home(env=env, home_dir=Path.home()).path


@click.command(
    "migrate-home",
    cls=DocmancerCommand,
    context_settings=HELP_CONTEXT_SETTINGS,
    short_help="Preview or copy proven legacy DocAtlas state into the primary home.",
    epilog=format_examples(
        "doc-atlas migrate-home",
        "doc-atlas migrate-home --format json",
        "doc-atlas migrate-home --apply --plan-digest <reviewed-digest>",
        "doc-atlas migrate-home --source /old/home --target /new/home",
    ),
)
@click.option(
    "--source",
    default=None,
    type=click.Path(path_type=str),
    help="Legacy source root. Defaults to explicit DOCMANCER_HOME, otherwise ~/.docmancer.",
)
@click.option(
    "--target",
    default=None,
    type=click.Path(path_type=str),
    help="Target root. Defaults to DOCATLAS_HOME when set, otherwise ~/.docatlas.",
)
@click.option("--apply", is_flag=True, default=False, help="Apply a previously reviewed preview plan.")
@click.option(
    "--plan-digest",
    default=None,
    help="Exact digest printed by the reviewed preview; required with --apply.",
)
@click.option(
    "output_format",
    "--format",
    type=click.Choice(["text", "json"], case_sensitive=False),
    default="text",
    show_default=True,
)
def migrate_home_cmd(
    source: str | None,
    target: str | None,
    apply: bool,
    plan_digest: str | None,
    output_format: str,
) -> None:
    """Safely copy proven legacy DocAtlas state without deleting the source."""

    if apply and not plan_digest:
        raise click.UsageError(
            "--plan-digest is required with --apply; run migrate-home without --apply first"
        )
    source_path = _migration_source(source)
    target_path = _migration_target(target)
    try:
        plan = plan_home_migration(source_path, target_path)
    except HomeMigrationError as exc:
        raise click.ClickException(str(exc)) from exc

    if not plan.can_apply:
        if output_format == "json":
            payload = plan.to_dict()
            payload["status"] = "blocked"
            click.echo(json.dumps(payload, ensure_ascii=False, indent=2))
        raise click.ClickException(
            f"migration cannot be applied: {plan.reason}; "
            f"source={plan.source_classification}, target={plan.target_classification}"
        )

    if apply:
        if plan.plan_digest != plan_digest:
            raise click.ClickException(
                "reviewed migration plan digest no longer matches source/target state"
            )
        try:
            result = apply_home_migration(plan)
        except HomeMigrationError as exc:
            raise click.ClickException(str(exc)) from exc
        payload = result.to_dict()
        payload["source_preserved"] = True
        if output_format == "json":
            click.echo(json.dumps(payload, ensure_ascii=False, indent=2))
            return
        click.echo(f"Migration status: {result.status}")
        click.echo(f"Source: {result.source}")
        click.echo(f"Target: {result.target}")
        click.echo(f"Plan digest: {result.plan_digest}")
        click.echo("Source preserved: yes")
        return

    payload = plan.to_dict()
    payload["status"] = "preview"
    if output_format == "json":
        click.echo(json.dumps(payload, ensure_ascii=False, indent=2))
        return
    click.echo(f"Source: {plan.source} ({plan.source_classification})")
    click.echo(f"Target: {plan.target} ({plan.target_classification})")
    click.echo(f"Files: {plan.file_count}")
    click.echo(f"Source bytes: {plan.total_source_bytes}")
    click.echo(f"Plan digest: {plan.plan_digest}")
    click.echo("Plan:")
    for entry in plan.entries:
        click.echo(
            f"  {entry.source_relative} -> {entry.target_relative} "
            f"({entry.size_bytes} bytes, sha256={entry.source_sha256})"
        )
    click.echo(
        "Preview only; source and target were not modified. "
        "Rerun with --apply --plan-digest <digest> after review."
    )
'''
          text = text.replace(marker, addition + '\n\n__all__ = ["clear_index_cmd", "migrate_home_cmd"]\n', 1)
          p.write_text(text, encoding='utf-8')

          replace(
              'docmancer/cli/commands.py',
              'from .state_commands import clear_index_cmd  # noqa: F401,E402',
              'from .state_commands import clear_index_cmd, migrate_home_cmd  # noqa: F401,E402',
          )
          replace(
              'docmancer/cli/__main__.py',
              '    list_cmd,\n    patch_review_cmd,',
              '    list_cmd,\n    migrate_home_cmd,\n    patch_review_cmd,',
          )
          replace(
              'docmancer/cli/__main__.py',
              'cli.add_command(clear_index_cmd, "clear-index")\ncli.add_command(doctor_cmd, "doctor")',
              'cli.add_command(clear_index_cmd, "clear-index")\ncli.add_command(migrate_home_cmd, "migrate-home")\ncli.add_command(doctor_cmd, "doctor")',
          )

          # Classify the new public CLI surface as core/release-blocking.
          support = Path('docmancer/support_surfaces.json')
          text = support.read_text(encoding='utf-8')
          needle = '''    {\n      "id": "cli:mcp",\n'''
          if text.count(needle) != 1:
              raise SystemExit('support surface insertion point not unique')
          entry = '''    {\n      "id": "cli:migrate-home",\n      "kind": "cli",\n      "tier": "core",\n      "owner": "DocAtlas maintainers",\n      "docs": "docs/support-surface-policy.md",\n      "test_tier": "core-offline",\n      "network_dependencies": [],\n      "compatibility": "stable within the current major release",\n      "removal_rule": "breaking release with migration notes",\n      "failure_budget": "blocks release; migration must remain preview-first, source-preserving, hash-verified, locked, and fail-closed"\n    },\n'''
          support.write_text(text.replace(needle, entry + needle, 1), encoding='utf-8')

          # Existing test identities are extended rather than adding new nodeids,
          # preserving the reviewed diagnostic-label inventory.
          replace(
              'tests/test_cli.py',
              '    ("install", ["doc-atlas install claude-code", "--project"]),\n',
              '    ("install", ["doc-atlas install claude-code", "--project"]),\n    ("migrate-home", ["--apply", "--plan-digest", "--source", "--target"]),\n',
          )
          old_test = '''def test_cli_init_creates_project_sqlite_config(tmp_path):\n    result = CliRunner().invoke(cli, ["init", "--dir", str(tmp_path)])\n    assert result.exit_code == 0\n    config_file = tmp_path / "docatlas.yaml"\n    data = yaml.safe_load(config_file.read_text())\n    assert data["index"]["db_path"] == ".docatlas/docatlas.db"\n    assert "SQLite FTS5" in result.output\n'''
          new_test = '''def test_cli_init_creates_project_sqlite_config(tmp_path):\n    result = CliRunner().invoke(cli, ["init", "--dir", str(tmp_path)])\n    assert result.exit_code == 0\n    config_file = tmp_path / "docatlas.yaml"\n    data = yaml.safe_load(config_file.read_text())\n    assert data["index"]["db_path"] == ".docatlas/docatlas.db"\n    assert "SQLite FTS5" in result.output\n\n    source = tmp_path / ".docmancer"\n    target = tmp_path / "migrated-docatlas"\n    (source / "mcp").mkdir(parents=True)\n    (source / "mcp" / "manifest.json").write_text("{}", encoding="utf-8")\n    (source / "docmancer.yaml").write_text(\n        "index:\\n  db_path: ~/.docmancer/docmancer.db\\n", encoding="utf-8"\n    )\n    (source / "docmancer.db").write_bytes(b"legacy-db")\n    runner = CliRunner()\n    preview = runner.invoke(\n        cli,\n        [\n            "migrate-home", "--source", str(source), "--target", str(target),\n            "--format", "json",\n        ],\n    )\n    assert preview.exit_code == 0, preview.output\n    preview_payload = json.loads(preview.output)\n    assert preview_payload["status"] == "preview"\n    assert preview_payload["can_apply"] is True\n    assert not target.exists()\n\n    missing_digest = runner.invoke(\n        cli, ["migrate-home", "--source", str(source), "--target", str(target), "--apply"]\n    )\n    assert missing_digest.exit_code != 0\n    assert not target.exists()\n\n    digest = preview_payload["plan_digest"]\n    applied = runner.invoke(\n        cli,\n        [\n            "migrate-home", "--source", str(source), "--target", str(target),\n            "--apply", "--plan-digest", digest, "--format", "json",\n        ],\n    )\n    assert applied.exit_code == 0, applied.output\n    assert json.loads(applied.output)["status"] == "applied"\n    assert source.exists() and (source / "docmancer.yaml").exists()\n    assert (target / "docatlas.yaml").exists()\n\n    repeated = runner.invoke(\n        cli,\n        [\n            "migrate-home", "--source", str(source), "--target", str(target),\n            "--apply", "--plan-digest", digest, "--format", "json",\n        ],\n    )\n    assert repeated.exit_code == 0, repeated.output\n    assert json.loads(repeated.output)["status"] == "already_applied"\n'''
          replace('tests/test_cli.py', old_test, new_test)

          replace(
              'tests/test_config_resolution.py',
              '    assert apply_home_migration(plan).status == "already_applied"\n',
              '''    repeat_plan = plan_home_migration(source, target)\n    assert repeat_plan.can_apply is True\n    assert repeat_plan.plan_digest == plan.plan_digest\n    assert repeat_plan.target_classification == "owned_docatlas"\n    assert apply_home_migration(repeat_plan).status == "already_applied"\n''',
          )
          PY

          python -m compileall -q docmancer
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_config_resolution.py tests/test_cli.py tests/test_support_surface_policy.py tests/docs/test_documented_cli_contract.py

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docmancer tests
          git commit -m 'Implement reviewed migrate-home contract'
          git push origin HEAD:p0/docatlas-migrate-home
