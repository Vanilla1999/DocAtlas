name: TEMP locate DocAtlas 1.3.0 release run

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: temp-release-1.3.0-monitor
  cancel-in-progress: true

jobs:
  locate:
    if: github.event.pull_request.head.ref == 'ops/release-1.3.0-launch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 42c3bf1fccc839dad4be4077b0b2c6a203f9bbac
      RELEASE_TAG: v1.3.0
      NOT_BEFORE: '2026-08-22T00:47:00Z'
    steps:
      - name: Locate the canonical workflow-dispatch run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/publish.yml/runs?event=workflow_dispatch&branch=main&per_page=20"
          for attempt in 1 2 3 4 5 6; do
            curl --silent --show-error --fail \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$api" > "$RUNNER_TEMP/runs.json"

            if python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads((Path(os.environ["RUNNER_TEMP"]) / "runs.json").read_text())
          candidates = [
              row for row in payload.get("workflow_runs", [])
              if row.get("event") == "workflow_dispatch"
              and row.get("head_sha") == os.environ["EXPECTED_SHA"]
              and str(row.get("created_at") or "") >= os.environ["NOT_BEFORE"]
          ]
          candidates.sort(key=lambda row: (str(row.get("created_at") or ""), int(row.get("id") or 0)))
          if not candidates:
              raise SystemExit(1)
          row = candidates[-1]
          print(f"CANONICAL_RELEASE_RUN_ID={row['id']}")
          print(f"CANONICAL_RELEASE_RUN_STATUS={row['status']}")
          print(f"CANONICAL_RELEASE_RUN_CONCLUSION={row.get('conclusion')}")
          print(f"CANONICAL_RELEASE_RUN_CREATED_AT={row['created_at']}")
          print(f"CANONICAL_RELEASE_RUN_HEAD_SHA={row['head_sha']}")
          print(f"CANONICAL_RELEASE_RUN_URL={row['html_url']}")
          print(f"MATCHING_RELEASE_RUNS={len(candidates)}")
          PY
            then
              exit 0
            fi
            sleep "$((attempt * 5))"
          done

          echo "::error::Canonical release workflow-dispatch run was not found"
          cat "$RUNNER_TEMP/runs.json" || true
          exit 1
