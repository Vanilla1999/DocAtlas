name: PR179 V2 migration source snapshot
on:
  push:
    branches: [fix/context-first-project-reads-finalization]
    paths: [.github/workflows/pr179-v2-migration-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact source and history
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr179-v2-migration"
          git rev-parse HEAD > "$RUNNER_TEMP/pr179-v2-migration/HEAD.txt"
          git bundle create "$RUNNER_TEMP/pr179-v2-migration/source.bundle" HEAD
          cd "$RUNNER_TEMP/pr179-v2-migration"
          sha256sum source.bundle > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr179-v2-migration-source
          path: ${{ runner.temp }}/pr179-v2-migration/
          retention-days: 3
