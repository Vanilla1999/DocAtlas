name: Host rephrase pinned snapshot

on:
  push:
    branches: [fix/context-first-project-reads]
    paths: [.github/workflows/host-rephrase-snapshot.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPERIMENT_BASE: 3cae4f83f0b2fa8be1c4597340a1fd4150104ce8
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 3cae4f83f0b2fa8be1c4597340a1fd4150104ce8
          fetch-depth: 0
          persist-credentials: false
      - name: Record immutable experiment input (not a measured baseline)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPERIMENT_BASE"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/host-rephrase-snapshot"
          export SNAPSHOT_DIR="$RUNNER_TEMP/host-rephrase-snapshot"
          git status --porcelain=v1 --branch > "$SNAPSHOT_DIR/status.txt"
          git log -10 --format=fuller > "$SNAPSHOT_DIR/log.txt"
          git ls-tree HEAD > "$SNAPSHOT_DIR/trees.txt"
          git bundle create "$SNAPSHOT_DIR/source.bundle" HEAD
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          hashes = {name: hashlib.sha256((root / name).read_bytes()).hexdigest()
                    for name in sorted(files) if name and (root / name).is_file()}
          output = pathlib.Path(os.environ['SNAPSHOT_DIR'])
          payload = {
              'schema': 'host-rephrase-source-snapshot-v1',
              'head': os.environ['EXPERIMENT_BASE'],
              'origin': 'fresh GitHub Actions checkout; NOT the previous local run',
              'user_workspace_status': 'unavailable: Tunnel3 HTTP 404',
              'legacy_tmp_artifacts': 'unverified on user machine',
              'baseline_measured': False,
              'model_generations': 0,
              'model_api_calls': 0,
              'persistent_docs_sync': False,
              'tracked_sha256': hashes,
              'source_bundle_sha256': hashlib.sha256((output / 'source.bundle').read_bytes()).hexdigest(),
          }
          (output / 'manifest.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-rephrase-source-${{ github.run_id }}
          path: ${{ runner.temp }}/host-rephrase-snapshot/
          if-no-files-found: error
          retention-days: 14
