name: Grounded Docs comparison
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths:
      - .github/workflows/grounded-docs-compare.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCS_MCP_APP_STORE_PATH: ${{ github.workspace }}/.grounded-store
      DOCS_MCP_APP_TELEMETRY_ENABLED: 'false'
      DOCS_MCP_SCRAPER_SECURITY_FILE_ACCESS_MODE: unrestricted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 95e61265656283d609bc1328c46c52b2bf1a069e
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare comparable project-doc corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gd-corpus
          for p in docs wiki roadmap adr adrs runbook runbooks; do
            if [ -e "$p" ]; then cp -a "$p" gd-corpus/; fi
          done
          for f in README.md SKILL.md CHANGELOG.md CONTRIBUTING.md ARCHITECTURE.md; do
            if [ -f "$f" ]; then cp "$f" gd-corpus/; fi
          done
          find gd-corpus -type f | sort > "$RUNNER_TEMP/corpus-files.txt"
          wc -l "$RUNNER_TEMP/corpus-files.txt"
      - name: Install Grounded Docs 3.1.0
        run: npm install --no-save @arabold/docs-mcp-server@3.1.0
      - name: Index local corpus
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/docs-mcp-server scrape docatlas file://$GITHUB_WORKSPACE/gd-corpus --version 0.0.0-95e6126 --quiet
          ./node_modules/.bin/docs-mcp-server list --output json --quiet > "$RUNNER_TEMP/list.json"
      - name: Run frozen 30 questions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, time
          from pathlib import Path

          root = Path.cwd()
          outdir = Path(os.environ['RUNNER_TEMP'])
          cli = root / 'node_modules/.bin/docs-mcp-server'
          cases = json.loads((root/'eval/project_context_quality/generic_blind_lookup_pair30_questions.json').read_text())['cases']

          def run(args):
              started=time.perf_counter()
              p=subprocess.run([str(cli), *args], cwd=root, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              return p, time.perf_counter()-started

          def search(q):
              p, elapsed = run(['search','docatlas',q,'--version','0.0.0-95e6126','--exact-match','--limit','5','--output','json','--quiet'])
              if p.returncode != 0:
                  return {'status':'error','stderr':p.stderr[-4000:],'elapsed_seconds':elapsed,'results':[]}
              try:
                  results=json.loads(p.stdout)
              except Exception as exc:
                  return {'status':'parse_error','stderr':str(exc),'stdout':p.stdout[:4000],'elapsed_seconds':elapsed,'results':[]}
              return {'status':'ok','elapsed_seconds':elapsed,'results':results}

          rows=[]
          for case in cases:
              root_search=search(case['question'])
              lookup_searches=[search(q) for q in case.get('lookup_queries',[])]
              top_url=''
              if root_search['results']:
                  top_url=str(root_search['results'][0].get('url') or '')
              read={'status':'not_attempted','content':'','elapsed_seconds':0.0}
              if top_url:
                  p, elapsed=run(['fetch-url',top_url,'--quiet'])
                  read={'status':'ok' if p.returncode==0 else 'error','content':p.stdout if p.returncode==0 else '', 'stderr':p.stderr[-4000:], 'elapsed_seconds':elapsed}
              rows.append({
                  'id':case['id'],
                  'question':case['question'],
                  'lookup_queries':case.get('lookup_queries',[]),
                  'root_search':root_search,
                  'lookup_searches':lookup_searches,
                  'top1_read':read,
              })
              print(case['id'], root_search['status'], [x['status'] for x in lookup_searches], read['status'], flush=True)

          payload={
              'schema_version':1,
              'competitor':'@arabold/docs-mcp-server',
              'competitor_version':'3.1.0',
              'retrieval_mode':'fts_only_no_embedding_credentials',
              'corpus_sha':'95e61265656283d609bc1328c46c52b2bf1a069e',
              'library_version':'0.0.0-95e6126',
              'search_limit':5,
              'cases':rows,
          }
          (outdir/'grounded-full30.json').write_text(json.dumps(payload,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: grounded-docs-compare-full30
          path: |
            ${{ runner.temp }}/grounded-full30.json
            ${{ runner.temp }}/list.json
            ${{ runner.temp }}/corpus-files.txt
