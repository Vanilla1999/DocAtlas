name: TEMP materialize final agent protocol review fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: temp-agent-protocol-review-fixes-v2
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'tmp/agent-protocol-review-fixes-20260820'
    runs-on: ubuntu-24.04
    env:
      DOCMANCER_OFFLINE: '1'
      TARGET_BRANCH: experiment/agent-developer-protocol-v1
      REVIEWED_HEAD: 7a5a88f6188c793c91ea9231d67a99450bcff0c3
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Read reviewed materializers from carrier
        env:
          CARRIER_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CARRIER_SHA"
          for name in 01_production.py 02_tests_protocol.py 04_runner_support.py; do
            git show "$CARRIER_SHA:.tmp/$name" > "/tmp/$name"
          done

      - name: Build exactly one final semantic commit tree
        id: build
        run: |
          set -euo pipefail
          ORIGINAL_HEAD=$(git rev-parse HEAD)
          echo "original_head=$ORIGINAL_HEAD" >> "$GITHUB_OUTPUT"

          if test -f scripts/agent_developer_gate_support.py \
             && grep -q 'apply_agent_protocol_extensions' scripts/run_agent_developer_gate.py \
             && grep -q 'requested_topic = obligation.context or obligation.target' \
                  docmancer/docs/domain/_answer_units_part02.py; then
            echo 'state=already_final' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -q 'requested_topic = obligation.context or obligation.target' \
              docmancer/docs/domain/_answer_units_part02.py; then
            test "$(git rev-parse HEAD^)" = "$REVIEWED_HEAD"
            git reset --mixed "$REVIEWED_HEAD"
            python /tmp/04_runner_support.py
            echo 'state=rewritten_partial' >> "$GITHUB_OUTPUT"
          else
            test "$ORIGINAL_HEAD" = "$REVIEWED_HEAD"
            python /tmp/01_production.py
            python /tmp/02_tests_protocol.py
            python /tmp/04_runner_support.py
            echo 'state=built_from_reviewed_head' >> "$GITHUB_OUTPUT"
          fi

          git diff --check

      - name: Set up Python
        if: steps.build.outputs.state != 'already_final'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.build.outputs.state != 'already_final'
        run: pip install -e '.[dev]'

      - name: Validate corrective tree before commit
        if: steps.build.outputs.state != 'already_final'
        run: |
          set -euo pipefail
          python -m compileall -q docmancer scripts
          pytest -q \
            tests/docs/test_question_plan_v4.py \
            tests/test_tool_selection_policy.py \
            tests/test_unified_docs_context_mcp.py::test_module_recovery_projection_keeps_callable_action_and_full_path_under_tiny_budget \
            tests/test_product_scope.py
          python scripts/run_agent_developer_gate.py
          python scripts/run_legacy_contract_gate.py
          python scripts/run_project_docs_self_host_gate.py
          python scripts/run_question_surface_gate.py
          python scripts/check_python_module_size.py
          git diff --check

      - name: Commit and update working branch atomically
        if: steps.build.outputs.state != 'already_final'
        env:
          ORIGINAL_HEAD: ${{ steps.build.outputs.original_head }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Close agent recovery review gaps'
          test "$(git rev-parse HEAD^)" = "$REVIEWED_HEAD"
          git push \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$ORIGINAL_HEAD" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
