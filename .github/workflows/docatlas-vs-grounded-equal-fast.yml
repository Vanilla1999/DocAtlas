name: DocAtlas vs Grounded equal-budget fast
on:
  push:
    branches: [fix/v13-v15-evidence-pipeline]
    paths: [.github/workflows/docatlas-vs-grounded-equal-fast.yml]
permissions: {contents: read}
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DOCS_MCP_APP_TELEMETRY_ENABLED: 'false'
      DOCS_MCP_SCRAPER_SECURITY_FILE_ACCESS_MODE: unrestricted
      OPENAI_API_KEY: ollama
      OPENAI_API_BASE: http://127.0.0.1:11434/v1
      DOCS_MCP_EMBEDDING_MODEL: openai:all-minilm
      DOCS_MCP_EMBEDDINGS_VECTOR_DIMENSION: '384'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: 95e61265656283d609bc1328c46c52b2bf1a069e, path: frozen-corpus}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - name: Install tools and models
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save @arabold/docs-mcp-server@3.1.0
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull all-minilm
          ollama pull qwen2.5:1.5b
      - name: Index both Grounded modes
        shell: bash
        run: |
          python - <<'PY' > "$RUNNER_TEMP/versions.tsv"
          import json
          from pathlib import Path
          m=json.loads(Path('frozen-corpus/eval/evidence_quality_v2/source-manifest.json').read_text()); d={}
          for r in m['sources']: d.setdefault(r['project'],set()).add(r['ref'])
          for p,refs in sorted(d.items()): assert len(refs)==1; print(p,next(iter(refs)),sep='\t')
          PY
          while IFS=$'\t' read -r project version; do
            src="$GITHUB_WORKSPACE/frozen-corpus/eval/evidence_quality_v2/sources/$project"
            DOCS_MCP_APP_STORE_PATH="$RUNNER_TEMP/fts" ./node_modules/.bin/docs-mcp-server scrape "$project" "file://$src" --version "$version" --quiet
            DOCS_MCP_APP_STORE_PATH="$RUNNER_TEMP/hybrid" ./node_modules/.bin/docs-mcp-server scrape "$project" "file://$src" --version "$version" --embedding-model openai:all-minilm --quiet
          done < "$RUNNER_TEMP/versions.tsv"
      - name: Search, pack and read equal-budget modes
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/run.py" <<'PY'
          import json, os, subprocess, urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.parse import urlparse, unquote
          from docmancer.docs.application.model_visible_projection_helpers import docs_context_budget_tokens
          root=Path.cwd(); tmp=Path(os.environ['RUNNER_TEMP']); cli=root/'node_modules/.bin/docs-mcp-server'
          cases=json.loads((root/'eval/retrieval_recheck/holdout20_questions.json').read_text())['cases']
          m=json.loads((root/'frozen-corpus/eval/evidence_quality_v2/source-manifest.json').read_text()); versions={}
          for r in m['sources']: versions.setdefault(r['project'],r['ref']); assert versions[r['project']]==r['ref']
          system=json.loads((root/'eval/retrieval_recheck/holdout20_protocol.json').read_text())['reader']['prompt']
          def packet0(): return {'kind':'docs_context','status':'ok','answer_supported':False,'answer_available':False,'edit_ready':False,'sources':[]}
          def source(project,version,row):
              p=Path(unquote(urlparse(row['url']).path)); base=root/'frozen-corpus/eval/evidence_quality_v2/sources'/project
              try:path=p.relative_to(base).as_posix()
              except Exception:path=p.name
              return {'path_or_url':path,'snippet':row.get('content',''),'version_binding':version}
          def pack(project,version,rows):
              p=packet0()
              for row in rows:
                  if len(p['sources'])>=3: break
                  q=json.loads(json.dumps(p)); q['sources'].append(source(project,version,row))
                  if docs_context_budget_tokens(q)<=800: p=q
              p['estimated_tokens']=docs_context_budget_tokens(p); return p
          def search(store,project,version,q):
              env=os.environ.copy(); env['DOCS_MCP_APP_STORE_PATH']=str(store)
              cp=subprocess.run([str(cli),'search',project,q,'--version',version,'--exact-match','--limit','5','--output','json','--quiet'],env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if cp.returncode: raise RuntimeError(cp.stderr[-2000:])
              return json.loads(cp.stdout)
          rows=[]
          for c in cases:
              p=c['project_group']; v=versions[p]
              fr=search(tmp/'fts',p,v,c['question']); hr=search(tmp/'hybrid',p,v,c['question'])
              rows.append({'id':c['id'],'project_group':p,'question':c['question'],'fts_results':fr,'hybrid_results':hr,'fts_equal':pack(p,v,fr),'hybrid_equal':pack(p,v,hr)})
          def ask(task):
              i,lane=task; row=rows[i]; p=row[lane]
              user='QUESTION:\n'+row['question']+'\n\nCONTEXT (public packet JSON):\n'+json.dumps(p,ensure_ascii=False,separators=(',',':'))
              body={'model':'qwen2.5:1.5b','stream':False,'messages':[{'role':'system','content':system},{'role':'user','content':user}],'options':{'temperature':0,'seed':0,'num_predict':160}}
              req=urllib.request.Request('http://127.0.0.1:11434/api/chat',data=json.dumps(body).encode(),headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=300) as r: ans=json.loads(r.read())['message']['content']
              return i,lane,ans
          tasks=[(i,l) for i in range(len(rows)) for l in ('fts_equal','hybrid_equal')]
          with ThreadPoolExecutor(max_workers=4) as ex:
              futs=[ex.submit(ask,t) for t in tasks]
              for fut in as_completed(futs):
                  i,lane,ans=fut.result(); rows[i][lane+'_reader']=ans; print(rows[i]['id'],lane,repr(ans[:80]),flush=True)
          (tmp/'equal-budget.json').write_text(json.dumps({'competitor':'Grounded Docs 3.1.0','cases':rows},indent=2,ensure_ascii=False))
          PY
          PYTHONPATH="$PWD" uv run --frozen --extra dev python "$RUNNER_TEMP/run.py"
      - uses: actions/upload-artifact@v4
        with:
          name: docatlas-vs-grounded-equal-budget
          path: ${{ runner.temp }}/equal-budget.json
