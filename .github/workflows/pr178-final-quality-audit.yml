name: PR178 cache reset TDD

on:
  push:
    branches: [fix/context-first-project-reads]
    paths: [.github/workflows/pr178-final-quality-audit.yml]

permissions:
  contents: read

env:
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Expected RED before runtime fix
        run: |
          pytest -q \
            tests/docs/test_context_projection_boundaries.py::test_complete_qualified_variant_precedes_mid_sentence_prefix \
            tests/docs/test_context_projection_boundaries.py::test_frozen_cache_reset_keeps_preview_and_preserve_in_visible_context
