name: PR178 cache reset quality trace

on:
  push:
    branches: [fix/context-first-project-reads]
    paths: [.github/workflows/pr178-final-quality-audit.yml]

permissions:
  contents: read

env:
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Trace frozen cache-reset case
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from copy import deepcopy
          from unittest.mock import patch
          import json
          from eval.project_context_quality_v2_protocol import load_cases, evaluate_case
          from scripts.run_project_docs_self_host_gate import LiveCase, run
          from docmancer.docs.interfaces.mcp import context_tools
          from docmancer.docs.application import docs_context_projection

          case = next(c for c in load_cases() if c['id'] == 'v2-paraphrase-cache-reset')
          captured = []
          project_context = context_tools.project_docs_context
          def observe(**kwargs):
              captured.append(deepcopy(kwargs['retrieval']))
              return project_context(**kwargs)
          with patch.object(context_tools, 'project_docs_context', observe):
              result = run(cases=(LiveCase(
                  case_id=case['id'], question=case['question'], relevant_paths=(),
                  lookup_queries=tuple(case['lookup_queries']), scope=case['scope'],
              ),), negative_cases=())
          payload = result['results'][0]['payload']
          verdict = evaluate_case(case, payload)
          print('CASE', json.dumps({
              'question': case['question'], 'lookups': case['lookup_queries'],
              'scope': case['scope'], 'obligations': verdict['obligations'],
          }, ensure_ascii=False, sort_keys=True))
          print('PAYLOAD', json.dumps({
              'status': payload.get('status'), 'estimated_tokens': payload.get('estimated_tokens'),
              'covered': payload.get('covered_query_ids'), 'missing': payload.get('missing_query_ids'),
              'sources': payload.get('sources'), 'diagnostics': payload.get('diagnostics'),
          }, ensure_ascii=False, sort_keys=True))
          retrieval = captured[-1]
          for row in retrieval.get('context_pack') or []:
              if row.get('path') != 'docs/index-cleanup.md':
                  continue
              print('CANDIDATE', json.dumps({
                  'path': row.get('path'), 'authority': row.get('authority'), 'line_start': row.get('line_start'),
                  'content': row.get('content'), 'parent_content': row.get('parent_content'),
                  'matches': row.get('retrieval_query_matches'), 'stable_chunk_id': row.get('stable_chunk_id'),
                  'parent_logical_id': row.get('parent_logical_id'),
              }, ensure_ascii=False, sort_keys=True))
              query_text = {str(q.get('query_id')): str(q.get('text') or '') for q in (retrieval.get('documentation_query_plan') or {}).get('queries') or []}
              query_ids = set((row.get('retrieval_query_matches') or {}).keys())
              variants = docs_context_projection._focused_variants(
                  row, queries=tuple(query_text[q] for q in query_ids if q in query_text),
                  query_ids=query_ids, query_text=query_text, source_line_start=row.get('line_start'),
              )
              for variant in variants:
                  print('VARIANT', json.dumps({
                      'snippet': variant.get('snippet'), 'line_start': variant.get('line_start'),
                      'line_end': variant.get('line_end'), 'qualified': variant.get('retrieval_query_ids'),
                      'matches': variant.get('retrieval_query_matches'),
                  }, ensure_ascii=False, sort_keys=True))
          PY
