name: PR178 complete span closure

on:
  push:
    branches: [fix/context-first-project-reads]
    paths: [.github/workflows/pr178-final-quality-audit.yml]

permissions:
  contents: write

env:
  DOCATLAS_OFFLINE: "1"
  DOCATLAS_AUTO_VECTORS: "0"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/context-first-project-reads
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install exact branch dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply minimal complete-span priority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("docmancer/docs/domain/context_windows.py")
          text = path.read_text()
          needle = '''def _query_terms(queries: tuple[str, ...]) -> set[str]:\n    return {\n        token.casefold()\n        for query in queries\n        for token in re.findall(r"[A-Za-zА-Яа-яЁё0-9_.-]{4,}", query)\n        if token.casefold() not in _QUERY_STOP_WORDS\n    }\n\n\ndef _focused_snippet(\n'''
          replacement = '''def _query_terms(queries: tuple[str, ...]) -> set[str]:\n    return {\n        token.casefold()\n        for query in queries\n        for token in re.findall(r"[A-Za-zА-Яа-яЁё0-9_.-]{4,}", query)\n        if token.casefold() not in _QUERY_STOP_WORDS\n    }\n\n\ndef _is_complete_source_span(text: str, snippet: str) -> bool:\n    \"\"\"Return whether *snippet* ends at a source-local semantic boundary.\n\n    This is a projection preference only. It never creates query attribution or\n    answer proof; it prevents a mid-sentence prefix from outranking a bounded,\n    contiguous alternative carrying the same qualified evidence.\n    \"\"\"\n    if not snippet:\n        return False\n    start = text.find(snippet)\n    if start < 0:\n        return False\n    end = start + len(snippet)\n    left = text[:start]\n    right = text[end:]\n    left_complete = not left.strip() or left.endswith("\\n\\n")\n    stripped = snippet.rstrip()\n    right_complete = (\n        not right.strip()\n        or right.startswith("\\n\\n")\n        or stripped.endswith((".", "!", "?", "|", "```", "~~~"))\n    )\n    return left_complete and right_complete\n\n\ndef _focused_snippet(\n'''
          assert text.count(needle) == 1, "context window insertion point drifted"
          path.write_text(text.replace(needle, replacement, 1))

          path = Path("docmancer/docs/application/docs_context_projection.py")
          text = path.read_text()
          needle = '''from docmancer.docs.domain.context_windows import (\n    _focused_line_range, _focused_snippet, _projection_limits, _query_terms,\n)\n'''
          replacement = '''from docmancer.docs.domain.context_windows import (\n    _focused_line_range, _focused_snippet, _is_complete_source_span,\n    _projection_limits, _query_terms,\n)\n'''
          assert text.count(needle) == 1, "context window import drifted"
          text = text.replace(needle, replacement, 1)
          needle = '''            if snippet and (qualified_query_ids((candidate,)) & query_ids or component_witnesses(candidate, obligations)):\n                variants.append(candidate)\n    return variants\n'''
          replacement = '''            if snippet and (qualified_query_ids((candidate,)) & query_ids or component_witnesses(candidate, obligations)):\n                variants.append(candidate)\n    # Variants of one evidence item compete before global source selection.\n    # Prefer a bounded, structurally complete contiguous span when coverage is\n    # otherwise equivalent, so a shorter mid-sentence prefix cannot consume the\n    # slot and later block a safe expansion under the same 800-token budget.\n    variants.sort(\n        key=lambda candidate: (\n            len(qualified_query_ids((candidate,)) & query_ids),\n            len(component_witnesses(candidate, obligations)),\n            len(candidate.get("_visible_assignment_hashes") or ()),\n            int(_is_complete_source_span(\n                raw_snippet, str(candidate.get("snippet") or ""),\n            )),\n            -len(str(candidate.get("snippet") or "")),\n        ),\n        reverse=True,\n    )\n    return variants\n'''
          assert text.count(needle) == 1, "qualified variant return point drifted"
          path.write_text(text.replace(needle, replacement, 1))
          PY
          python -m compileall -q docmancer/docs/domain/context_windows.py docmancer/docs/application/docs_context_projection.py
          git diff --check
      - name: Verify RED regressions and neighboring projection contracts
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/docs/test_context_projection_boundaries.py \
            tests/docs/test_docs_context_compound_projection.py \
            tests/docs/test_generic_context_workflows.py \
            tests/docs/test_context7_style_project_chat.py \
            tests/docs/test_model_visible_projection_part02.py
          python scripts/run_agent_developer_adversarial_gate.py
      - name: Verify full repository suite
        shell: bash
        run: |
          set -euo pipefail
          pytest -q
          python -m compileall -q docmancer tests scripts eval
          git diff --check
      - name: Publish only after full green
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr178-final-quality-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: prefer complete bounded evidence spans"
          git push origin HEAD:fix/context-first-project-reads
