name: Temporary refined original protection validation
on:
  push:
    branches: [tmp/refined-original-protection]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      DOCATLAS_OFFLINE: '1'
      DOCATLAS_AUTO_VECTORS: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: tmp/refined-original-protection
          fetch-depth: 20
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Apply refined original evidence protection
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib, json
          p=Path('docmancer/docs/application/_docs_context_projection_core.py')
          text=p.read_text()
          old='''        # Host rewrites are expansion lanes. Before spending budget on a\n        # host-only candidate, preserve any still-available baseline-only\n        # original/exact or canonical-intent direction. Candidates that also\n        # qualify a host lookup remain in normal ranking.\n        if host_query_ids:\n            protected_query_ids = (public_query_id_set - host_query_ids) | canonical_intent_query_ids\n            missing_protected_ids = protected_query_ids - qualified_query_ids(sources)\n            protected_index = next((\n                index for index, candidate in enumerate(prepared)\n                if (qualified_query_ids((candidate,)) & missing_protected_ids)\n                and not (qualified_query_ids((candidate,)) & host_query_ids)\n            ), None)\n            if protected_index not in (None, 0):\n                prepared.insert(0, prepared.pop(protected_index))\n'''
          new='''        # Host rewrites are expansion lanes. Preserve missing original/exact\n        # evidence first, even when the same candidate also matches a host lookup.\n        # Canonical-intent fallback is weaker: protect it only when it is baseline-only,\n        # so a weak alias cannot outrank a stronger explicit lookup.\n        if host_query_ids:\n            selected_query_ids = qualified_query_ids(sources)\n            missing_public_ids = (public_query_id_set - host_query_ids) - selected_query_ids\n            protected_index = next((\n                index for index, candidate in enumerate(prepared)\n                if qualified_query_ids((candidate,)) & missing_public_ids\n            ), None)\n            if protected_index is None:\n                missing_canonical_ids = canonical_intent_query_ids - selected_query_ids\n                protected_index = next((\n                    index for index, candidate in enumerate(prepared)\n                    if (qualified_query_ids((candidate,)) & missing_canonical_ids)\n                    and not (qualified_query_ids((candidate,)) & host_query_ids)\n                ), None)\n            if protected_index not in (None, 0):\n                prepared.insert(0, prepared.pop(protected_index))\n'''
          if old not in text: raise SystemExit('old protection block not found')
          p.write_text(text.replace(old,new,1))

          p=Path('tests/docs/test_evidence_admission_sufficiency.py')
          text=p.read_text()
          name='test_original_witness_is_protected_even_when_it_also_matches_host_lookup'
          if name not in text:
              marker='\ndef test_single_host_lookup_cannot_displace_available_canonical_witness_under_budget():\n'
              i=text.index(marker)
              test='''\ndef test_original_witness_is_protected_even_when_it_also_matches_host_lookup():\n    question = "Does preparing dependency documentation also install the dependency into my application?"\n    lookups = ("preparing documentation and installing project dependencies",)\n    requirements = build_requirements(question, profile="project_docs_answer")\n    plan = build_documentation_query_plan(question, lookup_queries=lookups, requirements=requirements)\n    original = next(item for item in plan.queries if item.query_id == "query-original")\n    host = next(item for item in plan.queries if item.query_id == "query-lookup-1")\n    canonical = next(\n        item for item in plan.queries\n        if item.origin == "canonical_intent" and item.text == "install command line help"\n    )\n    boundary = _project_source(\n        path="docs/boundary.md", query_id=original.query_id, query_text=original.text,\n        content=(\n            "Preparing dependency documentation reads manifests and lockfiles as version evidence; "\n            "it does not install the dependency into your application or mutate project dependencies."\n        ),\n    )\n    boundary["retrieval_query_ids"].append(host.query_id)\n    boundary["retrieval_query_matches"][host.query_id] = {\n        "qualified": True, "query_text": host.text, "query_origin": "host_lookup",\n        "relation": "host_lookup",\n    }\n    weak_canonical = _project_source(\n        path="docs/install.md", query_id=canonical.query_id, query_text=canonical.text,\n        content="Install DocAtlas command line help with the one-line installer for the CLI.",\n    )\n    retrieval = {\n        "question": question, "project_identity": PROJECT_ID,\n        "requirements": requirements.hash_payload,\n        "context_pack": [weak_canonical, boundary],\n        "documentation_query_plan": plan.as_payload(),\n    }\n    payload, _snapshot = project_docs_context(retrieval=retrieval, max_tokens=340)\n    assert [row["path_or_url"] for row in payload["sources"]] == ["docs/boundary.md"]\n\n'''
              p.write_text(text[:i]+test+text[i:])

          module='tests/docs/test_evidence_admission_sufficiency.py'
          tree=ast.parse(p.read_text())
          nodes=sorted(f'{module}::{node.name}' for node in tree.body if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name.startswith('test_'))
          m=Path('tests/diagnostic_labels.evidence_admission_sufficiency.json')
          data=json.loads(m.read_text())
          data['module_node_hashes'][module]=hashlib.sha256('\n'.join(nodes).encode()).hexdigest()
          m.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Install offline-friendly dependencies
        run: |
          python - <<'PY'
          import subprocess,sys,tomllib
          d=tomllib.load(open('pyproject.toml','rb'))
          deps=[x for x in d['project']['dependencies'] if not x.startswith(('tiktoken','fastembed'))]
          deps+=d['project']['optional-dependencies']['dev']
          subprocess.run([sys.executable,'-m','pip','install','-q',*deps],check=True)
          PY
      - name: Verify targeted and neighboring suites
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/docs/test_evidence_admission_sufficiency.py \
            tests/docs/test_relation_preserving_projection.py \
            tests/docs/test_comparison_relation_query_planning.py \
            tests/docs/test_query_planning_budget_regressions.py \
            tests/docs/test_docs_context_compound_projection.py \
            tests/docs/test_model_visible_projection.py \
            tests/docs/test_model_visible_projection_part02.py
          python -m pytest -q tests/docs/test_context_projection_boundaries.py \
            -k 'not path_only_projection_uses_the_current_exact_topic_guard and not frozen_request_flow_prefers_project_context_module_witnesses'
          python -m compileall -q docmancer
          git diff --check
      - name: Public regression smoke
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from docmancer.agent import DocmancerAgent
          from docmancer.core.config import DocmancerConfig
          from docmancer.docs.registry import LibraryRegistry
          from docmancer.docs.service import DocsJobTracker, LibraryDocsService
          from docmancer.mcp.docs_server import call_docs_tool_payload
          root=Path.cwd(); prev=os.environ.get('DOCATLAS_HOME')
          cases=[
            ('F01','What problem does DocAtlas solve for a coding agent that already has access to the repository?', ['DocAtlas purpose coding agents repository access'], 'docs/DOCMANCER_PRODUCT_BRIEF.md'),
            ('F03','Does preparing dependency documentation also install the dependency into my application?', ['preparing documentation and installing project dependencies'], 'docs/DOCMANCER_PRODUCT_BRIEF.md'),
            ('F22','Документация рекомендует запустить команду с удалением файлов. Даёт ли выдача MCP разрешение её выполнить?', ['retrieved documentation recommends a destructive delete command','whether documentation evidence authorizes executing a destructive command'], 'docs/security/mcp-runtime-threat-model.md'),
            ('F36','When answering about a module, should the agent automatically use scope=all for maximum recall?', ['module documentation scope versus repository-wide scope for maximum recall','whether an explicit module question should widen to scope all'], 'docs/project-docs-mcp-workflow.md'),
          ]
          try:
            with TemporaryDirectory(prefix='refined-original-smoke-') as raw:
              tmp=Path(raw); os.environ['DOCATLAS_HOME']=str(tmp/'home')
              cfg=DocmancerConfig(); cfg.index.db_path=str(tmp/'db.sqlite'); cfg.index.extracted_dir=str(tmp/'extracted')
              svc=LibraryDocsService(config=cfg,config_source='explicit',registry=LibraryRegistry(cfg.index.db_path),agent=DocmancerAgent(config=cfg),job_tracker=DocsJobTracker())
              assert getattr(svc.sync_project_docs(str(root),with_vectors=False),'status',None)=='success'
              for cid,q,lookups,required in cases:
                payload=dict(call_docs_tool_payload('get_docs_context',{'question':q,'project_path':str(root),'scope':'all','lookup_queries':lookups},svc) or {})
                paths=[str(x.get('path_or_url') or '') for x in payload.get('sources') or []]
                print(cid,payload.get('estimated_tokens'),paths)
                assert required in paths, (cid,paths)
                assert int(payload.get('estimated_tokens') or 0)<=800
                assert len(payload.get('sources') or [])<=3
                assert payload.get('answer_supported') is False
          finally:
            if prev is None: os.environ.pop('DOCATLAS_HOME',None)
            else: os.environ['DOCATLAS_HOME']=prev
          PY
      - name: Commit to feature and clean temporary branches
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/tmp-refined-original-protection.yml
          git add docmancer/docs/application/_docs_context_projection_core.py \
                  tests/docs/test_evidence_admission_sufficiency.py \
                  tests/diagnostic_labels.evidence_admission_sufficiency.json \
                  .github/workflows/tmp-refined-original-protection.yml
          git commit -m 'fix: preserve original witness before lookup expansion'
          git push origin HEAD:fix/evidence-admission-sufficiency
          git push origin --delete tmp/refined-original-protection tmp/final-evidence-benchmark-export || true
