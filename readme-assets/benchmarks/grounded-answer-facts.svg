<title id="title">Final-answer coverage under the historical rubric</title>
<desc id="description">A: Full 15, Partial 2, Missing 2; B: Full 15, Partial 2, Missing 2; C: Full 15, Partial 2, Missing 2; D: Full 16, Partial 0, Missing 3. All arms delivered 19/19 scored positions. These counts do not establish an overall winner. A later study questioned shared-scenario requirements; it did not regrade these four arms.</desc>
